<style>
/* Layout: barra fixa com abas; corpo largo de planilha com rolagem horizontal só dentro da tabela */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e9efed; --ink:#13211f; --muted:#5a6b67; --line:#d7e1de;
  --teal:#0d6b68; --teal-soft:#d6ecea; --amber:#c98a12; --amber-soft:#fbefd3;
  --good:#1f7a43; --warn:#a86a00; --bad:#b3261e; --paper:#ffffff;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1413; --surface:#141e1d; --sunk:#1a2625; --ink:#e4eeec; --muted:#93a5a1; --line:#2a3a38;
  --teal:#43b8b1; --teal-soft:#173634; --amber:#f0b94a; --amber-soft:#3a2e14;
  --good:#5fc58a; --warn:#f0b94a; --bad:#ff8a80; --paper:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1413; --surface:#141e1d; --sunk:#1a2625; --ink:#e4eeec; --muted:#93a5a1; --line:#2a3a38;
  --teal:#43b8b1; --teal-soft:#173634; --amber:#f0b94a; --amber-soft:#3a2e14;
  --good:#5fc58a; --warn:#f0b94a; --bad:#ff8a80; --paper:#ffffff; color-scheme:dark}
html,body{margin:0}
body{font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:7px 14px;border-radius:7px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.save{font-size:12px;color:var(--muted);min-width:90px;text-align:right}
main{padding-block:20px 60px}
h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.chip.add{border-style:dashed;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font:600 13px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;width:84px}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:14px 0 18px}
.param{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.param .in{display:flex;align-items:center;gap:6px}
.param input{width:100%}
.param .unit{color:var(--muted);font-size:12px;white-space:nowrap}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle;white-space:nowrap}
.grid thead th{background:var(--sunk);font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;position:sticky;top:0}
.grid .stick{position:sticky;left:0;background:var(--surface);z-index:1}
.grid thead .stick{background:var(--sunk);z-index:2}
.grid td.v{font-family:var(--f-mono);text-align:right;min-width:92px}
.grid tr.sec td{background:var(--bg);font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--teal);padding-top:10px}
.grid tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.grid tr.tot td.v{font-size:15px}
.grid tr.venda td{background:var(--amber-soft)}
.kh{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.kh input.lab{width:92px;text-align:right;font:600 12px var(--f-mono)}
.kh .dims{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0}
.kh .dims input{width:46px;padding:3px 4px;font:500 11px var(--f-mono);text-align:right}
.line{display:grid;grid-template-columns:44px 150px 112px 84px 86px 52px 24px;gap:6px;align-items:center}
.thumb{width:44px;height:36px;background:var(--paper);border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0}
.thumb img{max-width:40px;max-height:32px;object-fit:contain}
.thumb.none{color:var(--muted);font-size:10px}
.line input.f{width:100%}
.line input.code{width:100%;font-family:var(--f-mono);font-size:12px}
.line input.num{width:100%}
.line select{width:100%;padding:5px 2px}
.diff{display:block;width:100%;margin-top:2px;font-size:10px;color:var(--warn);background:var(--amber-soft);border:0;border-radius:4px;padding:1px 5px;cursor:pointer}
.margin{font-family:var(--f-mono);font-weight:600;padding:2px 7px;border-radius:5px;display:inline-block}
.margin.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.margin.low{color:var(--warn);background:var(--amber-soft)}
.margin.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);max-width:70ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* catálogo */
.catbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.catbar input{flex:1 1 220px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;color:var(--ink);font:inherit}
button.card{cursor:pointer}
button.card:hover{border-color:var(--teal)}
.card .img{background:var(--paper);height:130px;display:grid;place-items:center;padding:10px;border-bottom:1px solid var(--line)}
.card .img img{max-height:110px;object-fit:contain}
.card .meta{padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.card .code{font:600 14px var(--f-mono);color:var(--teal)}
.card .nm{font-weight:600}
.card .ln{font-size:11px;color:var(--muted)}
.card .kg{font:500 12px var(--f-mono)}
.csec{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.chead{display:flex;gap:10px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px}
.chead b{font-family:var(--f-display);font-size:17px}
.lock{font-size:12px;color:var(--muted);background:var(--sunk);padding:4px 10px;border-radius:999px}
.mono{font-family:var(--f-mono);font-size:12px}
.apply-head{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.apply-head .img{background:var(--paper);height:100px;border-radius:6px;display:grid;place-items:center}
.apply-head .img img{max-height:92px;object-fit:contain}
.apply-head .code{font-family:var(--f-mono);color:var(--teal);font-size:16px}
.aplist{display:flex;flex-direction:column;gap:6px}
.aplist .btn{justify-content:space-between}
/* modal */
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal .box{background:var(--bg);border-radius:14px;width:min(1100px,100%);padding:18px;display:flex;flex-direction:column;gap:8px}
/* relatório */
.rep{display:flex;flex-direction:column;gap:22px;margin-top:16px}
.rkit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rkit header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:8px}
.rkit h3{font-family:var(--f-display);margin:0;font-size:20px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ritem{display:grid;grid-template-columns:86px 1fr;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px;align-items:center}
.ritem .img{background:var(--paper);height:76px;border-radius:6px;display:grid;place-items:center}
.ritem .img img{max-height:70px;max-width:80px;object-fit:contain}
.ritem .code{font:600 13px var(--f-mono);color:var(--teal)}
.ritem small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sum div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.sum b{display:block;font:600 16px var(--f-mono)}
.sum div.hl{background:var(--teal-soft)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30}
@media (max-width:600px){.brand span{display:none} nav.tabs button{padding:7px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}

.login .err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
.sup{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;text-decoration:none;border:1px solid var(--line);color:var(--muted);background:var(--surface)}

.espbar{position:sticky;top:0;z-index:15;background:#7a4bc4;color:#fff;padding:9px 14px;border-radius:10px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.espbar .btn{background:#fff;color:#7a4bc4;border-color:#fff}
body.espelho main > section{pointer-events:none}
body.espelho main > section .espbar, body.espelho main > section .espbar *{pointer-events:auto}
.mon{display:grid;gap:16px}
.oncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.oncard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.hist{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hist th,.hist td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
.hist th{background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.btn.tut{background:#f0b94a;border-color:#e0a526;color:#2a1c00;font-weight:700;box-shadow:0 2px 8px rgb(224 165 38/.35)}

.who{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
</style>

/* ---------- cálculo ---------- */
function calcKit(m, g, k){
  const L=+k.L||0, H=+k.H||0, rows=[]; let perfis=0, insumos=0, peso=0;
  for (const l of g.linhas){
    const med = l.medida==="H" ? H : L, q = +l.qtd||0;
    if (l.tipo==="insumo"){
      const ins = (m.insumos||[]).find(i=>i.id===l.insumo); const val = ins ? +ins.valor||0 : 0;
      const v = val*med*q; insumos+=v; rows.push({l, med, q, metros:med*q, v});
    } else {
      const kg = (+l.peso||0)*med*q, v = kg*(+m.aluminio||0); perfis+=v; peso+=kg; rows.push({l, med, q, metros:med*q, kg, v});
    }
  }
  const acess = +g.acessorio||0;
  const ipi = (perfis+insumos+acess)*((+g.ipi||0)/100);
  const emb = (+m.embalagem||0)*Math.max(L,H);
  const custo = perfis+insumos+acess+ipi+emb;
  const venda = k.venda==null||k.venda==="" ? null : +k.venda;
  const margem = venda ? (venda-custo)/venda : null;
  const alvo = g.margemAlvo ? +g.margemAlvo/100 : null;
  const sugerida = alvo!=null && alvo<1 ? custo/(1-alvo) : null;
  return {rows, perfis, insumos, acess, ipi, emb, custo, venda, margem, peso, sugerida};
}

      : `<button class="thumb ${c?"":"none"}" data-pick="${l.id}" title="Escolher no catálogo">${c?`<img src="${imgOf(c.id)}" alt="${esc(c.c)}">`:"+ foto"}</button><input class="f" data-lf="${l.id}" value="${esc(l.funcao)}"><span><input class="code" data-lc="${l.id}" value="${esc(l.codigo)}"></span><span><input class="num" data-lp="${l.id}" value="${n2(l.peso,3)}">${diff?`<button class="diff" data-lfix="${l.id}" title="Usar o peso do catálogo">catálogo ${n2(c.p,3)}</button>`:""}</span>`;
    return `<tr><td class="stick"><div class="line">${first}<select data-lm="${l.id}"><option value="L" ${l.medida!=="H"?"selected":""}>Largura</option><option value="H" ${l.medida==="H"?"selected":""}>Altura</option></select><input class="num" data-lq="${l.id}" value="${n2(l.qtd,0)}"><button class="btn ghost danger" data-ldel="${l.id}" title="Remover linha">×</button></div></td>${cells}<td></td></tr>`;
  };
  h += `<tr class="sec"><td class="stick">Perfis de alumínio</td>${g.kits.map(()=>"<td></td>").join("")}<td></td></tr>`;
  h += perf.map(lineRow).join("");
  h += `<tr><td class="stick"><div class="row"><button class="btn" id="addPerfCat">+ Perfil do catálogo</button><button class="btn ghost" id="addPerfMan">+ Perfil manual</button></div></td>${g.kits.map(()=>"<td></td>").join("")}<td></td></tr>`;
  h += `<tr class="sec"><td class="stick">Insumos e custos fixos</td>${g.kits.map(()=>"<td></td>").join("")}<td></td></tr>`;
  h += insl.map(lineRow).join("");
  h += `<tr><td class="stick"><button class="btn ghost" id="addInsLine" ${ins.length?"":"disabled"}>+ Insumo na composição</button></td>${g.kits.map(()=>"<td></td>").join("")}<td></td></tr>`;
  h += `<tr><td class="stick"><div class="row"><span style="width:200px">Custo acessório (R$/kit)</span><input id="g-acess" class="num" value="${n2(g.acessorio)}"></div></td>${res.map(r=>`<td class="v">${n2(r.acess)}</td>`).join("")}<td></td></tr>`;
  h += `<tr><td class="stick"><div class="row"><span style="width:200px">IPI (%)</span><input id="g-ipi" class="num" value="${n2(g.ipi)}"></div></td>${res.map(r=>`<td class="v">${n2(r.ipi)}</td>`).join("")}<td></td></tr>`;
  h += `<tr><td class="stick">Embalagem <span class="muted">(R$/m × maior medida)</span></td>${res.map(r=>`<td class="v">${n2(r.emb)}</td>`).join("")}<td></td></tr>`;
  h += `<tr><td class="stick muted">Peso de alumínio do kit (kg)</td>${res.map(r=>`<td class="v muted">${n2(r.peso,3)}</td>`).join("")}<td></td></tr>`;
  h += `<tr class="tot"><td class="stick">Valor de custo</td>${res.map(r=>`<td class="v">${n2(r.custo)}</td>`).join("")}<td></td></tr>`;
  if (g.margemAlvo) h += `<tr><td class="stick muted">Venda sugerida (margem ${n2(+g.margemAlvo,1)}%)</td>${res.map(r=>`<td class="v muted">${n2(r.sugerida)}</td>`).join("")}<td></td></tr>`;
  h += `<tr class="venda"><td class="stick"><b>Valor de venda</b></td>${g.kits.map(k=>`<td class="v"><input class="num" data-kv="${k.id}" value="${k.venda==null?"":n2(k.venda)}" placeholder="—"></td>`).join("")}<td></td></tr>`;
  h += `<tr><td class="stick">Margem sobre a venda</td>${res.map(r=>`<td class="v"><span class="margin ${mClass(r.margem)}">${r.margem==null?"—":n2(r.margem*100,1)+"%"}</span></td>`).join("")}<td></td></tr>`;
  h += `</tbody></table></div>`;
  h += `<div class="bar"><p class="note">Custo do perfil = peso kg/m × custo kg × medida (m) × quantidade. Margem = (venda − custo) ÷ venda, sem impostos nem comissão. Pesos do catálogo são demonstrativos; confirme com o fornecedor.</p><div class="row"><button class="btn danger" id="delGroup">Excluir grupo</button><button class="btn danger" id="delModel">Excluir modelo</button></div></div>`;
  v.innerHTML=h; bindSheet(v,m,g);
}

function confirmBtn(btn, fn){ if(btn.dataset.armed){ fn(); return; } btn.dataset.armed="1"; const t=btn.textContent; btn.textContent="Clique de novo para confirmar"; setTimeout(()=>{ if(btn.isConnected){ btn.textContent=t; delete btn.dataset.armed; } },3000); }

function bindSheet(v,m,g){
  const id=ui.model, ch=()=>{ touch(id); renderSheet(); };
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ ui.model=b.dataset.m; ui.group=null; renderSheet(); });
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ ui.group=b.dataset.g; renderSheet(); });
  $("#newModel",v).onclick=addModel;
  const on=(sel,fn)=>{ const e=$(sel,v); if(e) e.onchange=()=>{ fn(e.value); ch(); }; };
  on("#p-nome", x=>m.nome=x.trim()||m.nome);
  on("#p-alu", x=>m.aluminio=pnum(x)??0);
  on("#p-emb", x=>m.embalagem=pnum(x)??0);
  v.querySelectorAll("[data-insn]").forEach(e=>e.onchange=()=>{ m.insumos.find(i=>i.id===e.dataset.insn).nome=e.value; ch(); });
  v.querySelectorAll("[data-insv]").forEach(e=>e.onchange=()=>{ m.insumos.find(i=>i.id===e.dataset.insv).valor=pnum(e.value)??0; ch(); });
  v.querySelectorAll("[data-insdel]").forEach(b=>b.onclick=()=>confirmBtn(b,()=>{ const iid=b.dataset.insdel; m.insumos=m.insumos.filter(i=>i.id!==iid); m.grupos.forEach(gg=>gg.linhas=gg.linhas.filter(l=>!(l.tipo==="insumo"&&l.insumo===iid))); ch(); }));
  $("#addIns",v).onclick=()=>{ (m.insumos ||= []).push({id:uid(), nome:"Novo insumo", valor:0}); ch(); };
  $("#addGroup",v).onclick=()=>{ const ng={id:uid(), nome:"Grupo "+(m.grupos.length+1), acessorio:0, ipi:0, linhas:[], kits:[{id:uid(), rotulo:"1000x1900", L:1, H:1.9, venda:null}]}; m.grupos.push(ng); ui.group=ng.id; ch(); };
  if (!g) return;
  on("#g-nome", x=>g.nome=x.trim()||g.nome);
  on("#g-alvo", x=>{ const p=pnum(x); g.margemAlvo = p==null?null:p; });
  on("#g-acess", x=>g.acessorio=pnum(x)??0);
  on("#g-ipi", x=>g.ipi=pnum(x)??0);
  const L = k => g.linhas.find(l=>l.id===k), K = k => g.kits.find(x=>x.id===k);
  const each=(attr,fn)=>v.querySelectorAll(`[data-${attr}]`).forEach(e=>e.onchange=()=>{ fn(e, e.dataset[attr]); ch(); });
  each("lf",(e,k)=>L(k).funcao=e.value);
  each("lc",(e,k)=>{ const l=L(k); l.codigo=e.value.trim(); const c=CAT_BY_CODE[norm(l.codigo)]; l.catId=c?c.id:null; if(c && !(+l.peso)) l.peso=c.p; });
  each("lp",(e,k)=>L(k).peso=pnum(e.value)??0);
  each("lm",(e,k)=>L(k).medida=e.value);
  each("lq",(e,k)=>L(k).qtd=pnum(e.value)??0);
  each("li",(e,k)=>L(k).insumo=e.value);
  each("kl",(e,k)=>K(k).rotulo=e.value);
  each("kw",(e,k)=>K(k).L=pnum(e.value)??0);
  each("kht",(e,k)=>K(k).H=pnum(e.value)??0);
  each("kv",(e,k)=>K(k).venda=pnum(e.value));
  v.querySelectorAll("[data-lfix]").forEach(b=>b.onclick=()=>{ const l=L(b.dataset.lfix), c=catFor(l); if(c){ l.peso=c.p; ch(); } });
  v.querySelectorAll("[data-ldel]").forEach(b=>b.onclick=()=>confirmBtn(b,()=>{ g.linhas=g.linhas.filter(l=>l.id!==b.dataset.ldel); ch(); }));
  v.querySelectorAll("[data-kdel]").forEach(b=>b.onclick=()=>confirmBtn(b,()=>{ g.kits=g.kits.filter(k=>k.id!==b.dataset.kdel); ch(); }));
  v.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>openPicker(c=>{ applyCat(L(b.dataset.pick), c); ch(); }));
  $("#addKit",v).onclick=()=>{ const last=g.kits[g.kits.length-1]; g.kits.push({id:uid(), rotulo:"Novo", L:last?.L||1, H:last?.H||1.9, venda:null}); ch(); };
  $("#addPerfCat",v).onclick=()=>openPicker(c=>{ const insAt=g.linhas.findIndex(l=>l.tipo==="insumo"); const nl={id:uid(), tipo:"perfil", funcao:c.n, codigo:c.c, catId:c.id, peso:c.p, medida:/Trilho|Capa|Guia|Click|Travessa/i.test(c.n)?"L":"H", qtd:1}; insAt<0?g.linhas.push(nl):g.linhas.splice(insAt,0,nl); ch(); });
  $("#addPerfMan",v).onclick=()=>{ const insAt=g.linhas.findIndex(l=>l.tipo==="insumo"); const nl={id:uid(), tipo:"perfil", funcao:"", codigo:"", peso:0, medida:"L", qtd:1}; insAt<0?g.linhas.push(nl):g.linhas.splice(insAt,0,nl); ch(); };
  const ai=$("#addInsLine",v); if(ai) ai.onclick=()=>{ if(!m.insumos?.length) return; g.linhas.push({id:uid(), tipo:"insumo", funcao:m.insumos[0].nome, insumo:m.insumos[0].id, medida:"H", qtd:1}); ch(); };
  $("#delGroup",v).onclick=e=>confirmBtn(e.currentTarget,()=>{ m.grupos=m.grupos.filter(x=>x.id!==g.id); ui.group=null; ch(); });
  $("#delModel",v).onclick=e=>confirmBtn(e.currentTarget, async ()=>{ const mid=ui.model; delete models[mid]; ui.model=null; ui.group=null; renderSheet(); try{ await rpc("precif_excluir",{p_token:sess.token, p_id:mid}); setSave("Salvo"); }catch(err){ toast("Não foi possível excluir o modelo."); } });
}
async function addModel(){
  const id=uid(); models[id]={nome:"Novo modelo", ordem:Date.now(), aluminio:0, embalagem:0, insumos:[], grupos:[{id:uid(), nome:"Grupo 1", acessorio:0, ipi:0, linhas:[], kits:[{id:uid(), rotulo:"1000x1900", L:1, H:1.9, venda:null}]}]};
  ui.model=id; ui.group=null; touch(id); renderSheet();
}

/* ---------- catálogo (somente leitura, conforme catálogo TEXA) ---------- */
const ocultas = () => (sess && Array.isArray(sess.ocultas)) ? sess.ocultas : [];
const catVis = () => CAT.filter(c=>!ocultas().includes(c.l));
const linhas = () => [...new Set(catVis().map(c=>c.l))];
const kgTxt = p => p==null ? "—" : p.toLocaleString("pt-BR",{minimumFractionDigits:3,maximumFractionDigits:3})+" Kg/m";
function catFilter(q, linha){ const nq=norm(q), lq=(q||"").toLowerCase(); if(linha && ocultas().includes(linha)) linha=""; return catVis().filter(c=>(!linha||c.l===linha) && (!q || norm(c.c).includes(nq) || c.n.toLowerCase().includes(lq))); }
function catCard(c){ return `<button class="card" data-cat="${c.id}" title="Selecionar ${esc(c.c)}"><div class="img"><img loading="lazy" src="${imgOf(c.id)}" alt="Desenho do perfil ${esc(c.c)}"></div><div class="meta"><span class="nm">${esc(c.n)||"&nbsp;"}</span><span class="code">${esc(c.c)}</span><span class="kg">${kgTxt(c.p)}</span></div></button>`; }
function catSections(list){
  if(!list.length) return `<p class="muted">Nenhum perfil encontrado.</p>`;
  const by={}; list.forEach(c=>(by[c.l] ||= []).push(c));
  return Object.entries(by).map(([l,cs])=>`<section class="csec"><div class="chead"><span class="lbl">Linha</span><b>${esc(l)}</b><span class="muted">pág. ${cs[0].pg} do catálogo</span></div><div class="cgrid">${cs.map(catCard).join("")}</div></section>`).join("");
}
function catBar(prefix){ return `<div class="catbar"><input id="${prefix}-q" type="search" placeholder="Buscar por código ou nome (ex.: 608, capa)" value="${esc(ui.q)}"><select id="${prefix}-l"><option value="">Todas as linhas</option>${linhas().map(l=>`<option ${l===ui.linha?"selected":""}>${esc(l)}</option>`).join("")}</select></div>`; }
function renderCatalog(){
  const v=$("#v-catalogo");
  v.innerHTML = `<div class="row" style="justify-content:space-between"><h2>Catálogo TEXA · Engenharia Digital</h2><span class="lock">Somente leitura · ${catVis().length} perfis conforme o catálogo do fornecedor</span></div>${catBar("c")}<p class="note">Clique em um perfil para selecionar e usar na planilha.</p><div id="c-grid"></div><p class="note" style="margin-top:14px">Desenhos, nomes, códigos e pesos transcritos do catálogo TEXA, sem alteração. São informações do fornecedor: confirme sempre com ele, pois matrizes diferentes mudam o peso.</p>`;
  const draw=()=>{ $("#c-grid",v).innerHTML = catSections(catFilter(ui.q, ui.linha)); v.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>openApply(CAT_BY_ID[b.dataset.cat])); };
  $("#c-q",v).oninput=e=>{ ui.q=e.target.value; draw(); };
  $("#c-l",v).onchange=e=>{ ui.linha=e.target.value; saveUi(); draw(); };
  draw();
}
function closeModal(){ const md=$("#modal"); md.hidden=true; md.innerHTML=""; }
function openPicker(onPick){
  const md=$("#modal");
  md.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Selecionar perfil"><div class="row" style="justify-content:space-between"><h2>Selecionar perfil do catálogo TEXA</h2><button class="btn" id="pk-x">Fechar</button></div>${catBar("pk")}<div id="pk-grid"></div></div>`;
  md.hidden=false;
  const draw=()=>{ $("#pk-grid",md).innerHTML = catSections(catFilter(ui.q, ui.linha));
    md.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{ closeModal(); onPick(CAT_BY_ID[b.dataset.cat]); }); };
  $("#pk-x",md).onclick=closeModal; md.onclick=e=>{ if(e.target===md) closeModal(); };
  $("#pk-q",md).oninput=e=>{ ui.q=e.target.value; draw(); };
  $("#pk-l",md).onchange=e=>{ ui.linha=e.target.value; draw(); };
  draw(); $("#pk-q",md).focus();
}
function applyCat(l,c){ l.catId=c.id; l.codigo=c.c; l.peso=c.p; if(!l.funcao) l.funcao=c.n; }
function openApply(c){
  const md=$("#modal"); if(!Object.keys(models).length){ toast("Cadastre um modelo na aba Planilha primeiro."); return; }
  let mid = models[ui.model] ? ui.model : sortedModels()[0][0], gid = null;
  const draw=()=>{
    const m=models[mid]; let g=m.grupos.find(x=>x.id===gid)||m.grupos[0]; gid=g?.id;
    const perf = g ? g.linhas.filter(l=>l.tipo!=="insumo") : [];
    md.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="Usar perfil na planilha" style="width:min(640px,100%)">
      <div class="row" style="justify-content:space-between"><h2>Usar ${esc(c.c)} na planilha</h2><button class="btn" id="ap-x">Fechar</button></div>
      <div class="apply-head"><div class="img"><img src="${imgOf(c.id)}" alt="${esc(c.c)}"></div><div><b class="code">${esc(c.c)}</b><div>${esc(c.n)}</div><div class="kg">${kgTxt(c.p)}</div><div class="muted">${esc(c.l)}</div></div></div>
      <div class="row"><label class="row"><span class="lbl">Modelo</span><select id="ap-m">${sortedModels().map(([id,x])=>`<option value="${id}" ${id===mid?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>
      <label class="row"><span class="lbl">Grupo</span><select id="ap-g">${m.grupos.map(x=>`<option value="${x.id}" ${x.id===gid?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label></div>
      <span class="lbl">Colocar na linha</span>
      <div class="aplist">${perf.map(l=>`<button class="btn" data-ap="${l.id}"><span>${esc(l.funcao)||"(sem função)"}</span><span class="muted mono">${esc(l.codigo)||"vazio"}</span></button>`).join("")}<button class="btn primary" id="ap-new">+ Adicionar como nova linha</button></div></div>`;
    $("#ap-x",md).onclick=closeModal;
    $("#ap-m",md).onchange=e=>{ mid=e.target.value; gid=null; draw(); };
    $("#ap-g",md).onchange=e=>{ gid=e.target.value; draw(); };
    const done=()=>{ touch(mid); closeModal(); ui.model=mid; ui.group=gid; ui.tab="planilha"; saveUi(); showTab(); toast(`${c.c} aplicado em ${m.nome} · ${g.nome}`); };
    md.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{ applyCat(g.linhas.find(l=>l.id===b.dataset.ap), c); done(); });
    $("#ap-new",md).onclick=()=>{ if(!g) return; const at=g.linhas.findIndex(l=>l.tipo==="insumo"); const nl={id:uid(), tipo:"perfil", funcao:c.n, codigo:c.c, catId:c.id, peso:c.p, medida:/Trilho|Capa|Guia|Click|Travessa/i.test(c.n)?"L":"H", qtd:1}; at<0?g.linhas.push(nl):g.linhas.splice(at,0,nl); done(); };
  };
  md.hidden=false; md.onclick=e=>{ if(e.target===md) closeModal(); }; draw();
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#modal").hidden){ $("#modal").hidden=true; $("#modal").innerHTML=""; } });

/* ---------- relatório ---------- */
function repSel(){
  if(!models[ui.rModel]) ui.rModel = ui.model && models[ui.model] ? ui.model : sortedModels()[0]?.[0];
  const m=models[ui.rModel]; if(!m) return {};
  let g=m.grupos.find(x=>x.id===ui.rGroup); if(!g){ g=m.grupos[0]; ui.rGroup=g?.id; }
  if (g && ui.rKit!=="all" && !g.kits.find(k=>k.id===ui.rKit)) ui.rKit="all";
  return {m,g};
}
function renderReport(){
  const v=$("#v-relatorio"); const {m,g}=repSel();
  if(!m||!g){ v.innerHTML=`<div class="empty"><h2>Sem kits para relatar</h2><p class="note">Cadastre um modelo e um grupo na aba Planilha.</p></div>`; return; }
  const kits = ui.rKit==="all" ? g.kits : g.kits.filter(k=>k.id===ui.rKit);
  let h = `<div class="row" style="justify-content:space-between;gap:14px"><div class="row">
    <label class="row"><span class="lbl">Modelo</span><select id="r-m">${sortedModels().map(([id,x])=>`<option value="${id}" ${id===ui.rModel?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>
    <label class="row"><span class="lbl">Grupo</span><select id="r-g">${m.grupos.map(x=>`<option value="${x.id}" ${x.id===g.id?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>
    <label class="row"><span class="lbl">Tamanho</span><select id="r-k"><option value="all">Todos os tamanhos</option>${g.kits.map(k=>`<option value="${k.id}" ${k.id===ui.rKit?"selected":""}>${esc(k.rotulo)}</option>`).join("")}</select></label>
  </div><button class="btn primary" id="r-pdf" hidden>Baixar PDF</button></div><div class="rep">`;
  for (const k of kits){
    const r=calcKit(m,g,k);
    h += `<article class="rkit"><header><div><span class="lbl">${esc(m.nome)} · ${esc(g.nome)}</span><h3>Kit ${esc(k.rotulo)}</h3></div><span class="muted">Largura ${n2(k.L)} m × Altura ${n2(k.H)} m</span></header><div class="rlist">`;
    h += r.rows.filter(x=>x.l.tipo!=="insumo").map(x=>{ const c=catFor(x.l); return `<div class="ritem"><div class="img">${c?`<img src="${imgOf(c.id)}" alt="${esc(c.c)}">`:`<span class="muted" style="font-size:11px">sem foto</span>`}</div><div><span class="code">${esc(x.l.codigo||"—")}</span><div>${esc(x.l.funcao)}</div><small>${n2(x.q,0)} × ${n2(x.med)} m (${x.l.medida==="H"?"altura":"largura"})</small><small>${n2(+x.l.peso,3)} kg/m · ${n2(x.kg,3)} kg</small><small>${brl(x.v)}</small></div></div>`; }).join("");
    h += `</div>`;
    const ins=r.rows.filter(x=>x.l.tipo==="insumo");
    if (ins.length) h += `<div class="note">${ins.map(x=>`${esc(x.l.funcao)}: ${n2(x.metros)} m · ${brl(x.v)}`).join(" &nbsp;·&nbsp; ")}</div>`;
    h += `<div class="sum"><div><span class="lbl">Perfis</span><b>${brl(r.perfis)}</b></div><div><span class="lbl">Insumos</span><b>${brl(r.insumos)}</b></div><div><span class="lbl">Acessório</span><b>${brl(r.acess)}</b></div><div><span class="lbl">Embalagem</span><b>${brl(r.emb)}</b></div>${r.ipi?`<div><span class="lbl">IPI</span><b>${brl(r.ipi)}</b></div>`:""}<div><span class="lbl">Peso alumínio</span><b>${n2(r.peso,3)} kg</b></div><div class="hl"><span class="lbl">Valor de custo</span><b>${brl(r.custo)}</b></div><div class="hl"><span class="lbl">Valor de venda</span><b>${brl(r.venda)}</b></div><div><span class="lbl">Margem</span><b class="margin ${mClass(r.margem)}">${r.margem==null?"—":n2(r.margem*100,1)+"%"}</b></div></div></article>`;
  }
  v.innerHTML = h + `</div>`;
  $("#r-m",v).onchange=e=>{ ui.rModel=e.target.value; ui.rGroup=null; ui.rKit="all"; saveUi(); renderReport(); };
  $("#r-g",v).onchange=e=>{ ui.rGroup=e.target.value; ui.rKit="all"; saveUi(); renderReport(); };
  $("#r-k",v).onchange=e=>{ ui.rKit=e.target.value; saveUi(); renderReport(); };
  const pdfBtn=$("#r-pdf",v);
  if (window.jspdf){ pdfBtn.hidden=false; pdfBtn.onclick=()=>makePdf(null,m,g,kits,pdfBtn); }
}
const imgCache={};
async function dataUrl(id){
  if (imgCache[id]) return imgCache[id];
  const b = await (await fetch(imgOf(id))).blob();
  const url = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
  const dim = await new Promise(r=>{ const im=new Image(); im.onload=()=>r([im.naturalWidth,im.naturalHeight]); im.src=url; });
  return imgCache[id]={url,w:dim[0],h:dim[1]};
}
async function makePdf(dl,m,g,kits,btn){
  btn.disabled=true; btn.textContent="Gerando…";
  try{
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"}); const W=210, M=14;
    const fmt=v=>n2(v), money=v=>"R$ "+n2(v);
    for (let i=0;i<kits.length;i++){
      const k=kits[i], r=calcKit(m,g,k); if(i) doc.addPage();
      doc.setFillColor(13,107,104); doc.rect(0,0,W,22,"F");
      doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.text(`Kit ${k.rotulo}`, M, 10);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(`${m.nome} · ${g.nome} · Largura ${fmt(k.L)} m × Altura ${fmt(k.H)} m`, M, 16);
      doc.text("FC Consultoria · "+(sess&&sess.nome||""), W-M, 16, {align:"right"});
      doc.setTextColor(20); let y=30;
      doc.setFontSize(8); doc.setTextColor(100); doc.text("Foto", M, y);
      doc.text("Código / Função", M+30, y); doc.text("Qtd × medida", 120, y); doc.text("Peso", 160, y, {align:"right"}); doc.text("Custo", W-M, y, {align:"right"});
      y+=2; doc.setDrawColor(200); doc.line(M,y,W-M,y); y+=2;
      for (const x of r.rows.filter(z=>z.l.tipo!=="insumo")){
        if (y>262){ doc.addPage(); y=20; }
        const c=catFor(x.l);
        if (c){ try{ const im=await dataUrl(c.id); const s=Math.min(26/im.w, 20/im.h); doc.addImage(im.url,"PNG",M+(26-im.w*s)/2,y+(20-im.h*s)/2,im.w*s,im.h*s); }catch(e){} }
        doc.setTextColor(13,107,104); doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text(x.l.codigo||"—", M+30, y+8);
        doc.setTextColor(20); doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(x.l.funcao||"", M+30, y+13);
        doc.text(`${n2(x.q,0)} × ${fmt(x.med)} m (${x.l.medida==="H"?"altura":"largura"})`, 120, y+10);
        doc.text(`${n2(+x.l.peso,3)} kg/m`, 160, y+8, {align:"right"}); doc.text(`${n2(x.kg,3)} kg`, 160, y+13, {align:"right"});
        doc.text(money(x.v), W-M, y+10, {align:"right"});
        y+=22; doc.setDrawColor(230); doc.line(M,y,W-M,y); y+=2;
      }
      for (const x of r.rows.filter(z=>z.l.tipo==="insumo")){ doc.text(`${x.l.funcao}: ${fmt(x.metros)} m`, M+30, y+5); doc.text(money(x.v), W-M, y+5, {align:"right"}); y+=7; }
      y+=4; const lines=[["Perfis",money(r.perfis)],["Insumos",money(r.insumos)],["Acessório",money(r.acess)],["IPI",money(r.ipi)],["Embalagem",money(r.emb)],["Peso alumínio",n2(r.peso,3)+" kg"],["Valor de custo",money(r.custo)],["Valor de venda",r.venda==null?"—":money(r.venda)],["Margem",r.margem==null?"—":n2(r.margem*100,1)+"%"]];
      if (y>230){ doc.addPage(); y=20; }
      for (const [a,b] of lines){ const big=/custo|venda/.test(a); doc.setFont("helvetica",big?"bold":"normal"); doc.setFontSize(big?11:9); doc.text(a, 120, y); doc.text(b, W-M, y, {align:"right"}); y+=big?6:5; }
      doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(120); doc.text("Pesos e desenhos do catálogo TEXA são demonstrativos; confirme com o fornecedor.", M, 288);
    }
    const name=`Kit_${g.nome}_${kits.length===1?kits[0].rotulo:"todos"}.pdf`.replace(/[^\w.\-]+/g,"_");
    doc.save(name); evento("pdf",{modelo:m.nome, grupo:g.nome, kit:kits.length===1?kits[0].rotulo:"todos"});
  }catch(e){ toast("Não foi possível gerar o PDF."); }
  btn.disabled=false; btn.textContent="Baixar PDF";
}

/* ---------- início ---------- */
let loaded=false;
function showLogin(msg){ $("#login").hidden=false; $("#lg-err").textContent=msg||""; setTimeout(()=>$("#lg-user").focus(),50); }
async function load(){
  try{
    const rows = await rpc("precif_listar",{p_token:sess.token});
    const fresh={}; for (const r of rows||[]) fresh[r.id]=r.dados;
    for (const id of pending.keys()) if(models[id]) fresh[id]=models[id];
    models=fresh; loaded=true; $("#who").textContent=""; $("#brandSub").textContent=(sess.nome||"")+" · FC Consultoria"; empresasFC(); $("#voltar").hidden = sess.login!=="fc"; $("#tab-acomp").hidden = sess.login!=="fc"; $("#sup").hidden = sess.login==="fc"; atualizarSuporte(); pingSoon(); setSave(pending.size?"Salvando…":"Salvo"); renderNow();
  }catch(e){ if(e.auth){ sess=null; try{localStorage.removeItem("cde-sessao");}catch(_){} showLogin(); } else { setSave("Sem conexão"); toast("Não foi possível carregar os dados: "+e.message); } }
}
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault(); const b=$("#lg-btn"); b.disabled=true; $("#lg-err").textContent="";
  try{
    const u=$("#lg-user").value.trim().toLowerCase(); let r;
    if (u==="matriz" || u===MATRIZ_EMAIL){
      if(!sbm) throw new Error("sem conexão");
      const {error}=await sbm.auth.signInWithPassword({email:MATRIZ_EMAIL,password:$("#lg-pass").value});
      if(error){ const er=new Error("login"); er.auth=true; throw er; }
      r = await viaMatriz(); if(!r){ const er=new Error("login"); er.auth=true; throw er; }
    } else r = await rpc("precif_login",{p_login:u, p_senha:$("#lg-pass").value});
    sess = r; try{ localStorage.setItem("cde-sessao", JSON.stringify(r)); sessionStorage.removeItem("precif-sem-auto"); }catch(_){}
    $("#login").hidden=true; $("#lg-pass").value=""; await load();
  }catch(err){ $("#lg-err").textContent = err.auth ? "Empresa ou senha incorretas." : "Sem conexão com o servidor. Tente de novo."; }
  b.disabled=false;
});
$("#logout").onclick=async()=>{ pararEspelho(true); try{ if(sess){ await evento("saiu"); await rpc("precif_sair",{p_token:sess.token}); } }catch(_){} sess=null; models={}; loaded=false; try{localStorage.removeItem("cde-sessao");}catch(_){} try{sessionStorage.setItem("precif-sem-auto","1");}catch(_){} $("#who").textContent=""; $("#brandSub").textContent="FC Consultoria"; $("#empSel").hidden=true; setSave(""); $("#voltar").hidden=true; renderNow(); showLogin(); };
$("#reload").onclick=()=>{ if(sess && !pending.size && !writing) load(); };
window.addEventListener("focus",()=>{ if(sess && loaded && !pending.size && !writing && !(document.activeElement && document.activeElement.matches("input,select"))) load(); });
function openTutorial(){
  const md=$("#modal"); md.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="Vídeo: como usar" style="width:min(1000px,100%)"><div class="row" style="justify-content:space-between"><h2>Como usar a Precificação de Kits</h2><button class="btn" id="tut-x" type="button">Fechar</button></div><video src="tutorial.mp4?v=3" controls autoplay playsinline style="width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;display:block"></video></div>`;
  md.hidden=false; $("#login").style.zIndex="10";
  const close=()=>{ const v=md.querySelector("video"); if(v) v.pause(); md.hidden=true; md.innerHTML=""; $("#login").style.zIndex=""; };
  $("#tut-x").onclick=close; md.onclick=e=>{ if(e.target===md) close(); };
}
$("#tutBtn").onclick=openTutorial; $("#lg-tut").onclick=openTutorial;
/* FC / Matriz: escolher qual empresa abrir */
async function empresasFC(){
  const sel=$("#empSel"); if(!sess || sess.login!=="fc"){ sel.hidden=true; return; }
  try{
    const lst=await rpc("precif_empresas",{p_token:sess.token});
    sel.innerHTML=(lst||[]).map(e=>`<option value="${esc(e.empresa)}" ${e.empresa===sess.empresa?"selected":""}>${esc(e.nome)}</option>`).join("");
    sel.hidden=!(lst&&lst.length);
    EMPRESAS=lst||[];
    sel.onchange=async()=>{ if(espelho){ sel.value=sess.empresa; return; } const ok=await trocarEmpresa(sel.value); if(!ok) sel.value=sess.empresa; };
  }catch(_){ sel.hidden=true; }
}
let EMPRESAS=[];
async function trocarEmpresa(emp, silencioso){
  if(emp===sess.empresa) return true;
  if(pending.size||writing){ toast("Aguarde salvar antes de trocar de empresa."); return false; }
  try{ const r=await rpc("precif_trocar_empresa",{p_token:sess.token,p_empresa:emp}); sess.empresa=r.empresa; sess.nome=r.nome; try{ localStorage.setItem("cde-sessao", JSON.stringify(sess)); }catch(_){}
    models={}; loaded=false; if(!espelho){ ui.model=null; ui.group=null; ui.rModel=null; ui.rGroup=null; } saveUi(); await load(); $("#empSel").value=emp; if(!silencioso) toast("Empresa aberta: "+r.nome); return true; }
  catch(e){ toast("Não foi possível trocar: "+e.message); return false; }
}

/* ---------- presença do cliente (para o espelho e o histórico) ---------- */
function estadoAtual(){ const m=models[ui.model]; return {tab:ui.tab, model:ui.model, modelo:m?m.nome:null, group:ui.group, grupo:m&&m.grupos? (m.grupos.find(g=>g.id===ui.group)||{}).nome||null : null, rModel:ui.rModel, rGroup:ui.rGroup, rKit:ui.rKit, q:ui.q, linha:ui.linha, rolagem:Math.round(window.scrollY||0), alt:Math.max(1,document.documentElement.scrollHeight-innerHeight)}; }
async function ping(){ if(!sess || sess.login==="fc" || !loaded || document.visibilityState!=="visible") return; try{ await rpc("precif_ping",{p_token:sess.token, p_estado:estadoAtual()}); }catch(_){} }
function pingSoon(){ clearTimeout(pingSoon.t); pingSoon.t=setTimeout(ping, 800); }
setInterval(ping, 15000);
window.addEventListener("scroll",()=>{ clearTimeout(pingSoon.s); pingSoon.s=setTimeout(pingSoon,1500); },{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pingSoon(); });
async function evento(tipo, detalhe){ if(!sess || sess.login==="fc") return; try{ await rpc("precif_evento",{p_token:sess.token, p_tipo:tipo, p_detalhe:detalhe||null}); }catch(_){} }

/* ---------- suporte online (o mesmo status do Painel da Matriz) ---------- */
async function atualizarSuporte(){
  const a=$("#sup"); if(!sess || sess.login==="fc"){ a.hidden=true; return; }
  let on=false; try{ on=!!(await rpc("fc_online",{})); }catch(_){}
  a.hidden=false; a.classList.toggle("on",on);
  $("#supTxt").textContent = on ? "Suporte FC online" : "Suporte offline · seg a sex 8h–11h e 13h–17h";
  a.title = on ? "Suporte online agora: clique para chamar no WhatsApp" : "Deixe sua mensagem no WhatsApp: respondemos no próximo horário";
}
setInterval(()=>{ if(document.visibilityState==="visible") atualizarSuporte(); }, 60000);
/* FC dentro da precificação conta como online no painel */
setInterval(async()=>{ try{ if(sess && sess.login==="fc" && sbm && document.visibilityState==="visible"){ const {data:{session}}=await sbm.auth.getSession(); if(session) await sbm.from("fc_status").update({visto:new Date().toISOString()}).eq("id",1); } }catch(_){} }, 60000);

/* ---------- Acompanhar (só FC): online agora, espelho e histórico ---------- */
const TZ="America/Cuiaba";
const quando = iso => { const d=new Date(iso); return d.toLocaleDateString("pt-BR",{timeZone:TZ,day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}); };
const ABA = {planilha:"Planilha", catalogo:"Catálogo TEXA", relatorio:"Relatório"};
const nomeEmp = e => (EMPRESAS.find(x=>x.empresa===e)||{}).nome || e;
const tela = st => !st ? "—" : (ABA[st.tab]||st.tab||"—") + (st.tab==="planilha" && st.modelo ? " › "+st.modelo+(st.grupo?" · "+st.grupo:"") : "") + (st.tab==="catalogo" && (st.q||st.linha) ? " › busca: "+[st.q,st.linha].filter(Boolean).join(" · ") : "");
function acao(e){ const d=e.detalhe||{};
  switch(e.tipo){ case "entrou": return "Entrou na precificação"; case "saiu": return "Saiu";
    case "aba": return "Abriu a aba "+(d.aba||""); case "modelo": return "Abriu o modelo "+(d.modelo||"");
    case "alterou": return "Alterou valores em "+(d.modelo||""); case "pdf": return "Baixou o PDF · "+[d.modelo,d.grupo,d.kit].filter(Boolean).join(" · ");
    default: return e.tipo; } }
let acompFiltro="", acompTimer=null;
async function renderAcomp(){
  const v=$("#v-acomp"); if(!sess || sess.login!=="fc"){ v.innerHTML=""; return; }
  if(!v.querySelector(".mon")) v.innerHTML=`<div class="mon"><div class="row" style="justify-content:space-between"><h2>Acompanhar clientes</h2><label class="row"><span class="lbl">Empresa</span><select id="ac-emp"><option value="">Todas</option>${EMPRESAS.map(e=>`<option value="${esc(e.empresa)}" ${e.empresa===acompFiltro?"selected":""}>${esc(e.nome)}</option>`).join("")}</select></label></div>
    <div><span class="lbl">🟢 Online agora</span><div class="oncards" id="ac-on" style="margin-top:8px"></div></div>
    <div><span class="lbl">Histórico de acesso</span><div style="overflow-x:auto;margin-top:8px"><table class="hist"><thead><tr><th>Quando (Sinop/MT)</th><th>Empresa</th><th>Login</th><th>O que fez</th></tr></thead><tbody id="ac-hist"></tbody></table></div></div></div>`;
  const se=$("#ac-emp"); se.onchange=()=>{ acompFiltro=se.value; atualizarAcomp(); };
  atualizarAcomp(); clearInterval(acompTimer); acompTimer=setInterval(()=>{ if(ui.tab==="acomp" && !espelho && document.visibilityState==="visible") atualizarAcomp(); }, 6000);
}
async function atualizarAcomp(){
  let r; try{ r=await rpc("precif_monitor",{p_token:sess.token, p_empresa:acompFiltro||null, p_limite:300}); }catch(e){ $("#ac-on") && ($("#ac-on").innerHTML=`<p class="muted">Não foi possível carregar: ${esc(e.message)}</p>`); return; }
  const on=$("#ac-on"), hi=$("#ac-hist"); if(!on||!hi) return;
  on.innerHTML = r.online.length ? r.online.map(o=>`<div class="oncard"><b>${esc(o.login)} · ${esc(nomeEmp(o.empresa))}</b><span class="muted">${esc(tela(o.estado))}</span><span class="muted" style="font-size:12px">visto às ${quando(o.visto).split(" ")[1]}</span><button class="btn primary" data-esp="${o.token}" style="align-self:flex-start;margin-top:4px">👁 Espelhar tela</button></div>`).join("") : `<p class="muted">Nenhum cliente com a precificação aberta agora.</p>`;
  on.querySelectorAll("[data-esp]").forEach(b=>b.onclick=()=>{ const o=r.online.find(x=>x.token===b.dataset.esp); iniciarEspelho(o); });
  hi.innerHTML = r.eventos.length ? r.eventos.map(e=>`<tr><td style="white-space:nowrap">${quando(e.em)}</td><td>${esc(nomeEmp(e.empresa))}</td><td>${esc(e.login)}</td><td>${esc(acao(e))}</td></tr>`).join("") : `<tr><td colspan="4" class="muted">Ainda não há acessos registrados.</td></tr>`;
}
let espelho=null, espTimer=null, espCarga=0;
async function iniciarEspelho(o){
  if(pending.size||writing){ toast("Aguarde salvar antes de espelhar."); return; }
  espelho={token:o.token, login:o.login, empresa:o.empresa, estado:o.estado, visto:o.visto};
  document.body.classList.add("espelho");
  const ok=await trocarEmpresa(o.empresa, true); if(!ok){ pararEspelho(); return; }
  aplicarEspelho(); clearInterval(espTimer); espTimer=setInterval(tickEspelho, 3000);
}
async function tickEspelho(){
  if(!espelho || document.visibilityState!=="visible") return;
  let r; try{ r=await rpc("precif_monitor",{p_token:sess.token, p_empresa:espelho.empresa, p_limite:1}); }catch(_){ return; }
  const o=r.online.find(x=>x.token===espelho.token);
  if(!o){ toast(espelho.login+" fechou a precificação. Espelho encerrado."); pararEspelho(); return; }
  espelho.estado=o.estado; espelho.visto=o.visto;
  if(++espCarga%2===0){ try{ const rows=await rpc("precif_listar",{p_token:sess.token}); const f={}; for(const x of rows||[]) f[x.id]=x.dados; models=f; }catch(_){} }
  aplicarEspelho();
}
function aplicarEspelho(){
  const st=espelho&&espelho.estado; if(!st) { renderNow(); return; }
  Object.assign(ui,{tab:st.tab||"planilha", model:st.model, group:st.group, rModel:st.rModel, rGroup:st.rGroup, rKit:st.rKit||"all", q:st.q||"", linha:st.linha||""});
  renderNow();
  if(st.alt) window.scrollTo({top:Math.round((st.rolagem||0)/st.alt*Math.max(1,document.documentElement.scrollHeight-innerHeight)), behavior:"smooth"});
}
function mostrarBarraEspelho(){
  const sec=$("#v-"+ui.tab); if(!sec||!espelho) return; let b=sec.querySelector(".espbar");
  if(!b){ b=document.createElement("div"); b.className="espbar"; sec.prepend(b); }
  b.innerHTML=`<span>👁 Espelhando <b>${esc(espelho.login)}</b> · ${esc(nomeEmp(espelho.empresa))} — ${esc(tela(espelho.estado))}</span><span style="opacity:.8;font-weight:500;font-size:12px">atualiza a cada 3 s · visto às ${espelho.visto?quando(espelho.visto).split(" ")[1]:"—"}</span><button class="btn" id="espStop" type="button">Parar espelho</button>`;
  b.querySelector("#espStop").onclick=()=>pararEspelho();
}
function pararEspelho(silencioso){
  if(!espelho) return; espelho=null; clearInterval(espTimer); document.body.classList.remove("espelho");
  if(!silencioso){ ui.tab="acomp"; saveUi(); renderNow(); }
}
function renderNow(){ if(!$("#modal").hidden) return; showTab(); }
showTab();
(async()=>{
  if (sess) { load(); return; }
  let semAuto=false; try{ semAuto=sessionStorage.getItem("precif-sem-auto")==="1"; }catch(_){}
  if (!semAuto){ try{ const r=await viaMatriz(); if(r){ sess=r; try{ localStorage.setItem("cde-sessao", JSON.stringify(r)); }catch(_){} load(); return; } }catch(_){} }
  showLogin();
})();
</script>
