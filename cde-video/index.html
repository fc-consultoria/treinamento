<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1e1612">
<title>CDE Vidros &amp; Esquadrias · Linha Family</title>
<style>
  html,body{margin:0;min-height:100%;background:#1e1612;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .top{position:sticky;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;
    border-bottom:3px solid #e8622a;background:#1e1612;z-index:2}
  .top b{font-size:26px;font-weight:900;letter-spacing:-.5px}
  .top small{font-size:10px;line-height:1.15;color:#c4b8ae;font-weight:600}
  .top span{margin-left:auto;font-weight:700;font-size:15px}
  #box{position:relative;background:#000}
  #box:fullscreen{display:flex;flex-direction:column;justify-content:center}
  #box:-webkit-full-screen{display:flex;flex-direction:column;justify-content:center;width:100%;height:100%}
  video{width:100%;max-height:calc(100vh - 190px);object-fit:contain;display:block;background:#000;pointer-events:none;margin:0 auto}
  @media (min-width:700px){.bar,.chap{max-width:1100px;margin:0 auto}.bar button{font-size:16px;padding:12px 16px}.chap button{font-size:16px}}
  #box:fullscreen video{max-height:calc(100% - 64px)}
  .bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1e1612}
  .bar button{flex:none;border:0;border-radius:10px;background:#3a2b23;color:#fff;font-weight:700;font-size:14px;padding:10px 12px;min-width:44px}
  .bar button:active{background:#e8622a}
  #seek{flex:1;accent-color:#e8622a;height:28px}
  .time{font-size:12px;color:#c4b8ae;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
  .chap{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px;-webkit-overflow-scrolling:touch}
  .chap button{flex:none;border:1px solid #4a382e;border-radius:999px;background:transparent;color:#fff;font-size:14px;padding:8px 14px}
  .chap button.on{background:#e8622a;border-color:#e8622a}
  .hint{font-size:13px;color:#c4b8ae;text-align:center;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
  #acu{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:3;display:none;align-items:center;gap:10px;
    background:rgba(30,22,18,.92);border:2px solid #e8622a;border-radius:14px;padding:10px 16px;font-weight:700;font-size:15px;max-width:92%;box-sizing:border-box}
  #acu.on{display:flex}
  #acu i{font-style:normal;font-size:22px}
  #tap{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:rgba(30,22,18,.9);text-align:center;padding:24px}
  #tap .play{width:84px;height:84px;border-radius:50%;background:#e8622a;display:flex;align-items:center;justify-content:center}
  #tap .play:after{content:"";border-left:28px solid #fff;border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:7px}
  #tap h1{margin:0;font-size:24px}
  #tap p{margin:0;color:#c4b8ae;font-size:15px}
</style>
</head>
<body oncontextmenu="return false">
<div class="top"><b>CDE</b><small>VIDROS &amp;<br>ESQUADRIAS</small><span>Linha Family</span></div>
<div id="box">
  <video id="v" src="cde-linha-family.mp4" playsinline webkit-playsinline autoplay muted loop preload="auto"
    disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback noplaybackrate"></video>
  <div id="acu"><i>🎧</i><span id="acuTx">Aumente o volume ou use fone: ouça a porta aberta × fechada</span></div>
  <div class="bar">
    <button id="back" aria-label="Voltar 10 segundos">−10s</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição do vídeo">
    <button id="fwd" aria-label="Avançar 10 segundos">+10s</button>
    <span class="time" id="tm">0:00 / 0:00</span>
    <button id="fs" aria-label="Tela cheia">⛶</button>
  </div>
</div>
<div class="chap" id="chap"></div>
<div class="hint">Gire o celular ou toque em ⛶ para ver em tela cheia · use dois dedos para aproximar</div>
<div id="tap"><div class="play"></div><h1>Linha Family · CDE</h1><p>Toque para assistir com som</p></div>
<script>
(function(){
  var v=document.getElementById('v'),box=document.getElementById('box'),seek=document.getElementById('seek'),tm=document.getElementById('tm');
  var CH=[['Início',0],['Três linhas',7],['Encaixes',16],['Ambientes 3D',52.5],['Acústica',110.2],['Drenagem',173.2],['Simulador na obra',204.1],['Final',252]];
  var chap=document.getElementById('chap');
  CH.forEach(function(c){var b=document.createElement('button');b.textContent=c[0];b.onclick=function(){to(c[1]+0.05)};chap.appendChild(b)});
  function go(){v.play().catch(function(){});}
  function to(t){v.currentTime=Math.max(0,Math.min((v.duration||0)-0.2,t));go();}
  function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
  var dragging=false;
  v.addEventListener('timeupdate',function(){
    if(!dragging&&v.duration)seek.value=Math.round(v.currentTime/v.duration*1000);
    tm.textContent=fmt(v.currentTime)+' / '+fmt(v.duration);
    var k=0;CH.forEach(function(c,i){if(v.currentTime>=c[1])k=i});
    [].forEach.call(chap.children,function(b,i){b.classList.toggle('on',i===k)});
  });
  seek.addEventListener('input',function(){dragging=true;if(v.duration){v.currentTime=seek.value/1000*v.duration;}});
  seek.addEventListener('change',function(){dragging=false;go();});
  document.getElementById('back').onclick=function(){to(v.currentTime-10)};
  document.getElementById('fwd').onclick=function(){to(v.currentTime+10)};
  document.getElementById('fs').onclick=function(){
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
    if(box.requestFullscreen){box.requestFullscreen().then(function(){try{screen.orientation.lock('landscape')}catch(e){}}).catch(function(){});}
    else if(box.webkitRequestFullscreen){box.webkitRequestFullscreen();}
    else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();}   // iPhone
  };
  var acu=document.getElementById('acu'),acuTx=document.getElementById('acuTx');
  v.addEventListener('timeupdate',function(){
    var on=v.currentTime>=110.2&&v.currentTime<173.2;acu.classList.toggle('on',on);
    acuTx.textContent=v.muted?'Toque aqui para ligar o som e ouvir a porta aberta × fechada':'Aumente o volume ou use fone: ouça a porta aberta × fechada';
  });
  acu.addEventListener('click',function(){v.muted=false;v.volume=1;go();var t=document.getElementById('tap');if(t)t.remove();});
  go();
  var tap=document.getElementById('tap');
  tap.addEventListener('click',function(){v.muted=false;v.volume=1;go();tap.remove();});
  // o vídeo nunca fica parado
  v.addEventListener('pause',function(){if(!dragging)setTimeout(go,200);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)go();});
  ['dragstart','selectstart'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},true)});
})();
</script>
</body>
</html>
