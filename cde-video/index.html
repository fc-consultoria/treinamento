<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1e1612">
<title>CDE Vidros &amp; Esquadrias · Linha Family</title>
<style>
  html,body{margin:0;height:100%;background:#1e1612;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;
    border-bottom:3px solid #e8622a;background:#1e1612;z-index:2}
  .top b{font-size:26px;font-weight:900;letter-spacing:-.5px}
  .top small{font-size:10px;line-height:1.15;color:#c4b8ae;font-weight:600}
  .top span{margin-left:auto;font-weight:700;font-size:15px}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:60px;box-sizing:border-box}
  video{width:100%;max-height:100%;display:block;pointer-events:none;background:#000}
  video::-webkit-media-controls{display:none!important}
  video::-webkit-media-controls-enclosure{display:none!important}
  .shield{position:fixed;inset:0;z-index:3}
  #tap{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:rgba(30,22,18,.88);text-align:center;padding:24px}
  #tap .play{width:84px;height:84px;border-radius:50%;background:#e8622a;display:flex;align-items:center;justify-content:center}
  #tap .play:after{content:"";border-left:28px solid #fff;border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:7px}
  #tap h1{margin:0;font-size:24px}
  #tap p{margin:0;color:#c4b8ae;font-size:15px}
  .rot{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:#c4b8ae;z-index:2}
  @media (orientation:landscape){.rot{display:none}}
</style>
</head>
<body oncontextmenu="return false">
<div class="top"><b>CDE</b><small>VIDROS &amp;<br>ESQUADRIAS</small><span>Linha Family</span></div>
<div class="stage">
  <video id="v" src="cde-linha-family.mp4" playsinline webkit-playsinline autoplay muted loop preload="auto"
    disablepictureinpicture disableremoteplayback controlslist="nodownload nofullscreen noremoteplayback noplaybackrate"></video>
</div>
<div class="shield"></div>
<div class="rot">Gire o celular para ver maior</div>
<div id="tap"><div class="play"></div><h1>Linha Family · CDE</h1><p>Toque para assistir com som</p></div>
<script>
(function(){
  var v=document.getElementById('v'),tap=document.getElementById('tap');
  function go(){v.play().catch(function(){});}
  // começa sozinho, sem som (regra dos celulares)
  go();
  // único toque permitido: liga o som. Depois disso nada responde.
  function unlock(e){e.preventDefault();v.muted=false;v.volume=1;go();tap.remove();
    document.removeEventListener('touchend',unlock,true);document.removeEventListener('click',unlock,true);}
  document.addEventListener('touchend',unlock,true);document.addEventListener('click',unlock,true);
  // não deixa pausar: se parar por qualquer motivo, volta a tocar
  v.addEventListener('pause',function(){if(!v.ended)setTimeout(go,150);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)go();});
  // bloqueia teclas, gestos e zoom
  ['keydown','gesturestart','dblclick','wheel','dragstart','selectstart'].forEach(function(n){
    document.addEventListener(n,function(e){e.preventDefault();},{passive:false,capture:true});});
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
})();
</script>
</body>
</html>
