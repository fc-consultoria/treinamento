const URL_BASE='https://fc-consultoria.github.io/treinamento/consultorias.html?k=';
function novaChave(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}
async function carregarPortais(){const {data}=await sb.from('cons_portal').select('*');PORT={};(data||[]).forEach(p=>PORT[p.empresa_id]=p);}
const dtBR=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
function msgLink(e,p){return ['Olá, equipe '+e.nome.split(' · ')[0]+'! Tudo bem?','','Por este link vocês acompanham o andamento da consultoria da FC:',URL_BASE+p.chave,'','*O que vocês encontram lá*','• O fluxo do processo, etapa por etapa, com datas e responsáveis.','• O plano de ação: cada ponto levantado, do diagnóstico até resolvido.','• As entregas e demandas em andamento.','','O link é da empresa, não repassem para fora. Dúvidas: (66) 9 9986-7984, de segunda a sexta, das 08:00 às 11:00 e das 13:00 às 17:00 (horário de Sinop/MT).','','FC Consultoria'].join('\n');}
function linkBox(e){const p=PORT[at];
  if(!p)return `<div class="box"><h3>🔗 Link do cliente</h3><p class="nota" style="margin:0 0 10px">${esc(e.nome)} ainda não tem link. Ao criar, o cliente passa a ver o fluxo, o plano de ação e as entregas (sem horas, arquivos e observações internas).</p><button class="btn pri" type="button" id="lkCriar">Criar link do cliente</button></div>`;

  return `<div class="box"><h3>🔗 Link do cliente ${p.ativo?'<span class="pill p-ok">Ativo</span>':'<span class="pill p-bad">Desativado</span>'}</h3>
   <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input readonly value="${u}" style="flex:1;min-width:220px;font:13px var(--f-m);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg)" id="lkUrl">
   <button class="btn" type="button" id="lkCopiar">Copiar link</button><a class="btn" href="${u}" target="_blank" rel="noopener" style="text-decoration:none">Abrir como o cliente</a></div>
   <p class="nota" style="margin:8px 0">${p.acessos?`Aberto ${p.acessos} vez${p.acessos>1?'es':''} pelo cliente · último acesso ${dtBR(p.ultimo_acesso)}`:'O cliente ainda não abriu o link.'}</p>
   <label class="nota" style="display:block;margin-bottom:4px;color:var(--fg);font-weight:600">Mensagem pronta para enviar</label><textarea id="lkMsg" rows="7" style="width:100%;font:13.5px var(--f-b);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)">${esc(msgLink(e,p))}</textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn pri" type="button" id="lkCopMsg">Copiar mensagem com o link</button><a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msgLink(e,p))}">Abrir no WhatsApp</a><button class="btn" type="button" id="lkAtivo" style="margin-left:auto;color:${p.ativo?'var(--bad)':'var(--ok)'}">${p.ativo?'Desativar link':'Reativar link'}</button></div></div>`;}
function copiar(t,b){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='✓ Copiado';setTimeout(()=>render(),1200)},()=>{});}
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COR=['var(--gb)','var(--cb)','var(--cde)','var(--accent)','var(--ok)','var(--warn)'];
function limpaSeed(e){e=JSON.parse(JSON.stringify(e));e.frentes.forEach(f=>f.p=f.p.filter(p=>p[2]!=='exemplo'&&p[3]!=='exemplo'));e.dem=(e.dem||[]).filter(d=>d[2]!=='exemplo');e.arq=(e.arq||[]).filter(a=>a[2]!=='exemplo');e.vis=e.vis||{tit:'Visita',prep:[],dur:[],dep:[]};e.vis.ok=e.vis.ok||{};if(e.acao)e.acao.st=e.acao.st||{};return e;}
async function salvar(k){const el=document.getElementById('sync');el.textContent='Salvando…';
  const {error}=await sb.from('rotina_docs').upsert({col:'consultoria',id:k,data:E[k],atualizado:new Date().toISOString()});
  el.textContent=error?'⚠ Não salvou: '+error.message:'✓ Salvo às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
async function carregar(){const {data,error}=await sb.from('rotina_docs').select('id,data').eq('col','consultoria');if(error){alert('Não consegui carregar: '+error.message);return;}
  if(!data.length){for(const [k,e] of Object.entries(SEED)){E[k]=limpaSeed(e);await salvar(k);}}else data.forEach(r=>E[r.id]=r.data);
  if(!E[at])at=Object.keys(E)[0];
  await carregarPortais();const h=await sb.from('rotina_docs').select('data').eq('col','horas');HORAS=(h.data||[]).map(x=>x.data);render();}
const nrm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/s\b/g,'').trim();
function horasDe(e){const k=nrm(e.nome.split('·')[0]),k2=nrm(e.apelido||'');const mes=new Date().toISOString().slice(0,7);
  return HORAS.filter(x=>{const c=nrm(x.cliente);return c&&(c.includes(k)||k.includes(c)||(k2&&c.includes(k2)))});}
const hm=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?h+'h'+(r?String(r).padStart(2,'0'):''):r+'min'};
const $=s=>document.querySelector(s);
function cards(){ $('#emps').innerHTML=Object.entries(E).map(([k,e])=>`<button class="emp" type="button" style="--c:${e.c}" data-k="${k}" aria-pressed="${k===at}">
  <div class="hd"><b>${e.nome}</b><span>${e.cid}</span></div><div class="mod">${e.mod}</div>
  <div><span class="pill ${e.st[0]}">${e.st[1]}</span></div>
  <div class="kv"><div><small>Próxima visita</small><b>${e.visita}</b></div><div><small>Demandas</small><b>${e.dem.length}</b></div><div><small>Horas no mês</small><b>${(l=>l.length?hm(l.reduce((s,x)=>s+(+x.minNormal||0)+(+x.minExtra||0),0)):'—')(horasDe(e).filter(x=>(x.data||'').slice(0,7)===new Date().toISOString().slice(0,7)))}</b></div></div>
  <div class="nx muted">Próximo passo: ${e.dem? e.dem[0][2]||e.dem[0][1] : '—'}</div></button>`).join('');
  document.querySelectorAll('.emp').forEach(b=>b.onclick=()=>{at=b.dataset.k;render()}); }
const ABAS=[['proc','Fluxo do processo'],['acao','Plano de ação'],['vis','Visitas'],['dem','Demandas e entregas'],['arq','Arquivos'],['hrs','Horas']];
function ficha(){const e=E[at];let h='';
 if(tab==='proc'&&e.objetivo)h=`<div class="box"><h3>Objetivo</h3><p style="margin:0">${e.objetivo}</p></div>`;
 if(tab==='proc'){const tot=e.frentes.reduce((n,f)=>n+f.p.length,0),ok=e.frentes.reduce((n,f)=>n+f.p.filter(p=>p[0]==='ok').length,0);
   h+=`<div class="leg"><span><i style="border-color:var(--ok);background:var(--ok-soft)"></i>Feito</span><span><i style="border-color:${e.c}"></i>Em andamento</span><span><i></i>Programado</span><span><i style="border-style:dashed"></i>Depende do cliente</span><span style="margin-left:auto" class="mono">${ok} de ${tot} etapas concluídas · ${(tot?Math.round(ok/tot*100):0)}%</span></div>
   <div class="flow">${e.frentes.map((f,fi)=>{const k=f.p.filter(p=>p[0]==='ok').length;return `<div class="lane"><div class="lh2"><b>${f.n}</b>${f.s?`<span style="font-family:var(--f-b);font-size:12.5px">${f.s}</span>`:''}<span>${k}/${f.p.length} feitas</span></div>${f.p.map((p,i)=>`${i?'<span class="arrow"></span>':''}<div class="node ${p[0]} ${p[4]==='Cliente'?'cli':''}" data-f="${fi}" data-i="${i}" ${cli?'':'title="Clique para mudar: programado → em andamento → feito"'}><div class="t">${p[1]}</div>${p[2]&&!(cli&&p[2]==='exemplo')?`<div class="nota">${p[2]}</div>`:''}<div class="m"><span>📅 ${p[3]||'a definir'}</span><span>· ${p[4]||'FC'}</span></div></div>`).join('')}${cli?'':`<button class="addn" type="button" data-add="${fi}">+ etapa</button>`}</div>`}).join('')}</div>${cli?'':'<div><button class="btn" type="button" id="addFrente">+ Nova frente</button></div>'}
   <p class="nota">${cli?'Este é o caminho combinado do trabalho. Cada etapa muda de cor quando avança; as datas são atualizadas pela FC.':'Cada empresa tem as suas frentes e etapas. Clique numa etapa para mudar a situação (programado → em andamento → feito). Use + etapa para incluir. O cliente vê este mesmo fluxo no link dele.'}</p>`;}
 if(tab==='acao'&&e.acao){const A=e.acao,ST=[['aguarda','Aguardando a visita','p-mut'],['diag','Diagnóstico feito','p-acc'],['acao','Ação combinada','p-acc'],['exec','Em execução','p-warn'],['ok','Resolvido','p-ok']];
   h=`<div class="box"><h3>Do diagnóstico à solução</h3><div class="leg">${ST.map((x,i)=>`${i?'→':''}<span class="pill ${x[2]}">${x[1]}</span>`).join(' ')}</div><p class="nota" style="margin:8px 0 0">Cada ponto levantado na visita vira uma linha. A FC atualiza a situação; quando chega em <b>Resolvido</b>, fica registrada a data e a evidência (print, planilha ou foto). É isso que o cliente acompanha no link.</p></div>
   <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:640px;font-size:14px"><thead><tr><th style="text-align:left;padding:8px;border-bottom:2px solid var(--line);font-family:var(--f-d);font-size:15px">Tema</th>${A.cols.map(c=>`<th style="text-align:left;padding:8px;border-bottom:2px solid var(--line);font-family:var(--f-d);font-size:15px">${c}</th>`).join('')}</tr></thead>
   <tbody>${A.temas.map(t=>`<tr><td style="padding:10px 8px;border-bottom:1px solid var(--line);font-weight:600;vertical-align:top;width:160px">${t[0]}</td>${t.slice(1).map((c,ci)=>{const key=t[0]+'|'+ci,x=(A.st||{})[key]||{s:'aguarda'},sd=ST.find(z=>z[0]===x.s)||ST[0];return `<td style="padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top"><div class="nota" style="color:var(--fg)">${esc(c)}</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${cli?`<span class="pill ${sd[2]}">${x.s==='ok'?'✓ ':''}${sd[1]}</span>`:`<select class="stsel" data-key="${esc(key)}">${ST.map(z=>`<option value="${z[0]}" ${z[0]===x.s?'selected':''}>${z[1]}</option>`).join('')}</select>`}${x.em?`<span class="nota">desde ${x.em.split('-').reverse().join('/')}</span>`:''}</div>${x.ev?`<div class="nota" style="margin-top:4px">📎 ${esc(x.ev)}</div>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;}
 if(tab==='vis'){const v=e.vis,ck=(l,g)=>l.map((t,i)=>`<label class="ck"><input type="checkbox" id="ck-${at}-${g}-${i}" data-ck="${g}${i}" ${(v.ok||{})[g+i]?'checked':''} ${cli?'disabled':''}><span>${esc(t)}</span></label>`).join('');
   h=`<div class="box"><h3>${v.tit}</h3><div class="g2"><div><b>Antes da visita</b>${ck(v.prep,'a')}</div><div><b>Durante</b>${ck(v.dur,'d')}</div></div><div style="margin-top:10px"><b>Depois</b>${ck(v.dep,'p')}</div></div>
   <div class="box"><h3>Relatório da visita</h3><p class="nota" style="margin:0">Ao fechar a visita, o relatório sai em tópicos curtos (o que foi feito, decisões, pendências do cliente e da FC) e vira o resumo do mês no link do cliente.</p></div>`}
 if(tab==='dem')h=`<div class="box">${e.dem.map(d=>`<div class="li"><span class="dt">${d[0]}</span><div style="flex:1;min-width:0"><div style="font-weight:600">${d[1]}</div>${d[2]?`<div class="nota">${d[2]}</div>`:''}</div><span class="pill ${d[3]}">${d[4]}</span></div>`).join('')}</div><p class="nota">As demandas são as mesmas da Rotina FC: criou aqui, aparece lá, e o contrário também.</p>`;
 if(tab==='arq')h=`<div class="box">${e.arq.map(a=>`<div class="arq"><span class="ext">${a[0].toUpperCase()}</span><span style="flex:1;min-width:0">${a[1]}</span><span class="mono muted" style="font-size:12.5px">${a[2]}</span></div>`).join('')}</div><p class="nota">Anexe PDF, planilha, print (Ctrl+V) ou link. Tudo fica separado por empresa.</p>`;
 if(tab==='hrs'){const L=horasDe(e).sort((a,b)=>(b.data+(b.ini||'')).localeCompare(a.data+(a.ini||''))),n=L.reduce((s,x)=>s+(+x.minNormal||0),0),x2=L.reduce((s,x)=>s+(+x.minExtra||0),0);
   h=`<div class="box"><div class="hrs"><div><span class="muted">Total</span><b>${hm(n+x2)}</b></div><div><span class="muted">Horário normal</span><b>${hm(n)}</b></div><div><span class="muted">Hora extra</span><b style="color:var(--bad)">${hm(x2)}</b></div></div></div>
   <div class="box">${L.length?L.map(x=>`<div class="li"><span class="dt">${(x.data||'').slice(8,10)}/${(x.data||'').slice(5,7)}</span><div style="flex:1;min-width:0"><div style="font-weight:600">${esc(x.titulo)}</div>${(x.itens||[]).length?`<div class="nota">${x.itens.map(esc).join(' · ')}</div>`:''}</div><span class="pill ${+x.minExtra?'p-bad':'p-mut'}">${hm((+x.minNormal||0)+(+x.minExtra||0))}${+x.minExtra?' extra':''}</span></div>`).join(''):'<p class="nota" style="margin:0">Ainda não há horas lançadas para esta empresa na Rotina FC.</p>'}</div>
   <p class="nota">Vem da Rotina FC: 07:00 às 18:00 é horário normal; 18:01 às 06:59 e fim de semana, hora extra.</p>`;}
 const abas=(cli?ABAS.filter(a=>['proc','acao','dem'].includes(a[0])):ABAS).filter(a=>a[0]!=='acao'||e.acao); if(cli&&!abas.some(a=>a[0]===tab))tab='proc';
 $('#ficha').style.setProperty('--c',e.c);
 $('#ficha').innerHTML=`<div class="fh"><span class="sw"></span><div style="min-width:0;flex:1"><h2>${e.nome}</h2><div class="muted" style="font-size:14px">${e.cid} · ${e.mod}</div></div><span class="pill ${e.st[0]}">${e.st[1]}</span>${cli?'':`<button class="btn" type="button" id="lkTog">🔗 Link do cliente${PORT[at]&&PORT[at].ativo?' ✓':''}</button>`}</div>
  ${PUB?`<div style="padding:12px 18px 0"><div class="cliente-bar">Acompanhamento atualizado pela FC Consultoria. Dúvidas: (66) 9 9986-7984, de segunda a sexta, das 08:00 às 11:00 e das 13:00 às 17:00 (horário de Sinop/MT).</div></div>`:cli?`<div style="padding:12px 18px 0"><div class="cliente-bar">🔗 <b>Link do cliente</b> · ${e.nome} vê o fluxo, o plano de ação e as entregas. Horas, arquivos, checklist de visita e observações da FC ficam ocultos.</div></div>`:linkAberto?`<div style="padding:12px 18px 0">${linkBox(e)}</div>`:''}<div class="tabs" role="tablist">${abas.map(([k,l])=>`<button class="tab" role="tab" type="button" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join('')}</div><div class="body">${h}</div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;ficha()});
 $('#ficha').classList.toggle('fc',!cli); if(cli)return;
 const g=id=>document.getElementById(id);
 if(g('lkTog'))g('lkTog').onclick=()=>{linkAberto=!linkAberto;ficha();};
 if(g('lkCriar'))g('lkCriar').onclick=async()=>{const r={empresa_id:at,chave:novaChave(),ativo:true};const {error}=await sb.from('cons_portal').insert(r);if(error){alert('Não foi possível criar: '+error.message);return;}PORT[at]=Object.assign({acessos:0},r);ficha();};
 if(g('lkCopiar'))g('lkCopiar').onclick=e2=>copiar(g('lkUrl').value,e2.target);
 if(g('lkCopMsg'))g('lkCopMsg').onclick=e2=>copiar(g('lkMsg').value,e2.target);
 if(g('lkAtivo'))g('lkAtivo').onclick=async()=>{const p=PORT[at];if(p.ativo&&!confirm('Desativar o link? O cliente deixa de ver o acompanhamento.'))return;const {error}=await sb.from('cons_portal').update({ativo:!p.ativo}).eq('empresa_id',at);if(error){alert(error.message);return;}p.ativo=!p.ativo;ficha();};
 document.querySelectorAll('.node[data-f]').forEach(n=>n.onclick=()=>{const p=e.frentes[+n.dataset.f].p[+n.dataset.i];p[0]=p[0]===''?'and':p[0]==='and'?'ok':'';ficha();cards();salvar(at);});
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const t=prompt('Nova etapa — o que será feito?');if(!t)return;const d=prompt('Data ou horário (ex.: 24/10 ou 08:00–09:30). Pode deixar em branco:')||'';const r=confirm('Esta etapa depende do cliente?\n\nOK = Cliente · Cancelar = FC')?'Cliente':'';e.frentes[+b.dataset.add].p.push(['',t,'',d,r]);ficha();salvar(at);});
 const af=document.getElementById('addFrente');if(af)af.onclick=()=>{const n=prompt('Nome da nova frente (ex.: Revenda, Fábrica, Pós-visita):');if(!n)return;e.frentes.push({n,p:[]});ficha();salvar(at);};
 document.querySelectorAll('.stsel').forEach(sel=>sel.onchange=()=>{e.acao.st=e.acao.st||{};const x={s:sel.value,em:new Date().toISOString().slice(0,10)};if(sel.value==='ok'){x.ev=prompt('Como foi resolvido? Descreva a evidência (planilha em uso, print, foto…):')||'';}else{const o=e.acao.st[sel.dataset.key];if(o&&o.ev&&sel.value!=='aguarda')x.ev=o.ev;}e.acao.st[sel.dataset.key]=x;ficha();salvar(at);});
 document.querySelectorAll('[data-ck]').forEach(c=>c.onchange=()=>{e.vis.ok=e.vis.ok||{};e.vis.ok[c.dataset.ck]=c.checked;salvar(at);}); }
function render(){cards();ficha()}
function setCli(v){cli=v;$('#vFC').setAttribute('aria-pressed',!v);$('#vCli').setAttribute('aria-pressed',v);$('#emps').hidden=v;$('#nova').hidden=v;render();}
$('#vFC').onclick=()=>setCli(false);$('#vCli').onclick=()=>setCli(true);
$('#cmp').onchange=e=>{$('#app').classList.toggle('compact',e.target.checked);try{localStorage.setItem('cons-cmp',e.target.checked?'1':'')}catch(_){}};
try{if(localStorage.getItem('cons-cmp')==='1'){$('#cmp').checked=true;$('#app').classList.add('compact')}}catch(_){}
$('#nova').onclick=()=>{const nome=prompt('Nome da empresa:');if(!nome)return;const cid=prompt('Cidade / estado:')||'';const k='e'+Date.now().toString(36);
  E[k]={nome,cid,c:COR[Object.keys(E).length%COR.length],mod:'Consultoria presencial',st:['p-mut','Novo'],visita:'a definir',frentes:[{n:'Antes da visita',p:[]}],dem:[],vis:{tit:'Próxima visita',prep:[],dur:[],dep:[],ok:{}},arq:[]};at=k;tab='proc';render();salvar(k);};
if(PUB){(async()=>{document.title='Acompanhamento da consultoria · FC Consultoria';
  document.querySelectorAll('#app > .top').forEach(t=>t.hidden=true);$('#emps').hidden=true;
  $('#app').insertAdjacentHTML('afterbegin','<div class="top" style="align-items:center;gap:12px"><img src="midia/logo-fc.png" alt="FC Consultoria e Representação" style="height:44px;border-radius:8px"><div><div class="eyebrow">FC Consultoria · acompanhamento da consultoria</div><h1 id="pubT">Carregando…</h1></div></div>');
  const {data,error}=await sb.rpc('cons_portal_ver',{p_chave:KEY});
  if(error||!data){$('#pubT').textContent='Link indisponível';$('#ficha').innerHTML='<div class="body"><p style="margin:0">Este link não está ativo. Fale com a FC Consultoria: (66) 9 9986-7984.</p></div>';return;}
  E={[data.id]:data};at=data.id;cli=true;$('#pubT').textContent='Acompanhamento da consultoria';ficha();})();}
else gateUI(()=>carregar(),{soMatriz:true});
</script>
