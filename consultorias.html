const tirarTag=t=>String(t||'').replace(/^(Revenda|F[áa]brica)\s*·\s*/i,'');
async function montarRel(e,k,dias,ate,comProx){

    F.push({d,ic:x.s==='ok'?'✅':'🛠',g:'Plano de ação',t:`${tn}${col?' · '+col:''}: ${L[x.s]}`,x:x.s==='ok'&&x.ev?x.ev:''});});}

      if(s.respondido_em&&inR(ldIso(s.respondido_em)))F.push({d:ldIso(s.respondido_em),ic:'✅',g:'Solicitações',t:'Pedido atendido · '+t});

    try{const {data}=await sb.from('cons_planilhas').select('nome,atualizado,cliente_ve').eq('empresa_id',k);(data||[]).filter(p=>p.cliente_ve!==false).forEach(p=>{const d=ldIso(p.atualizado);if(inR(d))F.push({d,ic:'📊',g:'Planilhas',t:'Planilha atualizada: '+p.nome});});}catch(_){}}

    (e.dem||[]).filter(d=>d[3]!=='p-ok').slice(0,5).forEach(d=>P.push({ic:'📦',g:'Entregas',t:d[1],x:d[0]&&d[0]!=='—'?'prazo '+d[0]:''}));}
  F.sort((a,b)=>b.d.localeCompare(a.d));P.sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999')||(a.h||'').localeCompare(b.h||''));
  const tot=e.frentes.reduce((n,f)=>n+f.p.length,0),ok=e.frentes.reduce((n,f)=>n+f.p.filter(p=>p[0]==='ok').length,0);
  const acT=e.acao?e.acao.temas.length*e.acao.cols.length:0,acO=e.acao?Object.values(e.acao.st||{}).filter(x=>x.s==='ok').length:0;
  return {id:uidc(),dias,de,ate,pAte:comProx?pAte:'',geradoEm:new Date().toISOString(),emp:(e.nome||'').split(' · ')[0],kp:{ok,tot,acO,acT},F,P,AND,C};}
