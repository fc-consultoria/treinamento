<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Porta Pivotante Ladore 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: faixa preta da marca com os 4 modos; a porta em 3D ocupa o palco; painel lateral muda conforme o modo (Apresentar / Montagem / Desenho técnico / Acabamentos). */
:root{
  --ink:#141416; --paper:#f2f1ee; --panel:#ffffff; --mute:#696b70; --line:#dedcd7; --soft:#ecebe7;
  --acc:#a8834d; --acc-ink:#1a140b; --hi:#d9b77c;
  --stage-a:#f7f6f3; --stage-b:#cfccc5;
  --tech-bg:#f6f5f0; --tech-line:#1d1e22; --tech-dim:#8a7552;
  --f-d:'Poppins',system-ui,-apple-system,sans-serif; --f-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#f0efec;--paper:#121315;--panel:#1a1b1e;--mute:#a2a4a8;--line:#2c2d31;--soft:#232428;--acc:#c9a66b;--acc-ink:#1a140b;--hi:#e3c48f;--stage-a:#2b2c30;--stage-b:#111214;--tech-bg:#14181d;--tech-line:#dfe6ee;--tech-dim:#d6b47a;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#f0efec;--paper:#121315;--panel:#1a1b1e;--mute:#a2a4a8;--line:#2c2d31;--soft:#232428;--acc:#c9a66b;--acc-ink:#1a140b;--hi:#e3c48f;--stage-a:#2b2c30;--stage-b:#111214;--tech-bg:#14181d;--tech-line:#dfe6ee;--tech-dim:#d6b47a;color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 14.5px/1.5 var(--f-d);overflow:hidden}
button{font-family:inherit}
.top{min-height:62px;background:#0d0d0e;color:#f4f3f1;display:flex;align-items:center;gap:16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.top img{height:36px;width:auto}
.brand{display:flex;flex-direction:column;line-height:1.15;border-left:1px solid #2c2c30;padding-left:14px}
.brand small{font:600 10px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:#c9a66b}
.brand b{font:600 14px var(--f-d)}
.sp{flex:1}
.modos{display:flex;gap:3px;background:#1d1d20;border-radius:99px;padding:4px;overflow-x:auto;max-width:100%}
.modos button{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;font:600 12.5px var(--f-d);color:#bdbbb6;white-space:nowrap}
.modos button.on{background:#f4f3f1;color:#0d0d0e}
.modos button:focus-visible{outline:2px solid #c9a66b;outline-offset:2px}
.fcm{font:500 10.5px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:#8d8b86;white-space:nowrap}
.app{height:calc(100% - 62px);display:grid;grid-template-columns:minmax(0,1fr) 384px}
.stage{position:relative;min-width:0;overflow:hidden;background:radial-gradient(120% 95% at 50% 8%,var(--stage-a),var(--stage-b))}
.stage.tech{background:var(--tech-bg)}
.stage.tech::before{content:"";position:absolute;inset:0;background-image:linear-gradient(color-mix(in srgb,var(--tech-line) 7%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--tech-line) 7%,transparent) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .35s}
#cv.fade{opacity:0}
.ov{position:absolute;pointer-events:none}.ov>*{pointer-events:auto}
.tl{left:16px;top:14px;background:rgba(14,14,16,.74);color:#f4f3f1;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);max-width:min(380px,calc(100% - 32px))}
.tl small{display:block;font:600 10.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:#d6b47a}
.tl b{display:block;font:700 18px/1.25 var(--f-d);letter-spacing:-.01em}
.tl span{font-size:12.5px;color:#cfcdc8}
.br{right:16px;bottom:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
.chip{all:unset;cursor:pointer;font:600 12.5px var(--f-d);padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.92);color:#141416;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chip.dk{background:#141416;color:#f4f3f1}
.chip.go{background:#c9a66b;color:#141416}
.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip[disabled]{opacity:.45;cursor:default}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hs{all:unset;position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;width:30px;height:30px;border-radius:50%;background:#141416;color:#f4f3f1;font:700 12px var(--f-m);display:grid;place-items:center;border:2px solid #f4f3f1;box-shadow:0 0 0 0 rgba(201,166,107,.6);animation:pulse 2.4s infinite}
.hs.on{background:#c9a66b;color:#141416;border-color:#141416}
.hs:focus-visible{outline:2px solid #c9a66b;outline-offset:3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,166,107,.55)}70%{box-shadow:0 0 0 12px rgba(201,166,107,0)}100%{box-shadow:0 0 0 0 rgba(201,166,107,0)}}
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 11px var(--f-m);letter-spacing:.04em;color:var(--tech-line);background:var(--tech-bg);border:1px solid var(--tech-line);padding:2px 7px;white-space:nowrap;pointer-events:none}
.lbl.d{border-color:var(--tech-dim);color:var(--tech-dim)}
.cap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:rgba(14,14,16,.82);color:#f4f3f1;border-left:3px solid #c9a66b;border-radius:0 12px 12px 0;padding:12px 16px;backdrop-filter:blur(6px);transition:opacity .4s}
.cap small{font:600 11px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:#d6b47a}
.cap>b{display:block;font:700 17px/1.25 var(--f-d)}
.cap p{margin:4px 0 0;font-size:13px;color:#d9d7d2}
.cap .pg{display:flex;gap:4px;margin-top:10px}.cap .pg i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}.cap .pg i.ok{background:#c9a66b}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0}
.pn{padding:18px 18px 28px;display:flex;flex-direction:column;gap:18px}
h2{margin:0;font:700 20px/1.2 var(--f-d);letter-spacing:-.01em;text-wrap:balance}
h3{margin:0 0 8px;font:600 10.5px var(--f-m);letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
p{margin:0}
.nt{color:var(--mute);font-size:13px;line-height:1.5}
.eb{font:600 10.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.ql{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.ql button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ql button i{font:700 12px var(--f-m);font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.ql button b{display:block;font:600 14px/1.3 var(--f-d)}
.ql button small{display:block;color:var(--mute);font-size:12.5px;line-height:1.45;margin-top:2px}
.ql button .cd{font:600 11px var(--f-m);color:var(--acc)}
.ql button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ql button.on i{background:var(--ink);color:var(--paper)}
.ql button.done i{background:var(--acc);color:var(--acc-ink)}
.ql button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font:600 13px var(--f-d);padding:11px 10px;border-radius:11px;border:1px solid var(--ink);color:var(--ink)}
.bt.pri{background:var(--ink);color:var(--paper)}
.bt.full{grid-column:1/-1}
.bt[disabled]{opacity:.45;cursor:default}
.bt:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{all:unset;cursor:pointer;width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background-size:cover;background-position:center}
.sw button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.sw button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.swl{font-size:12.5px;color:var(--mute);margin-top:7px}.swl b{color:var(--ink);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font:600 12px var(--f-d);color:var(--mute)}
label.f input{font:600 15px var(--f-m);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-variant-numeric:tabular-nums;min-width:0}
label.f input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font:600 10px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n{font:600 12px var(--f-m)}
td code{font:600 12px var(--f-m);white-space:nowrap}
td small{display:block;color:var(--mute);font-size:11.5px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{all:unset;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 4px;font:600 12px var(--f-d)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--acc)}
.foot{font:500 11px var(--f-m);letter-spacing:.04em;color:var(--mute);border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
.load{position:absolute;inset:0;display:grid;place-items:center;font:600 12px var(--f-m);letter-spacing:.1em;color:var(--mute);transition:opacity .5s;pointer-events:none}
.load.done{opacity:0}
.dp{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:78px;width:360px;max-height:calc(100% - 96px);overflow:auto;background:rgba(255,255,255,.97);color:#141416;border:1px solid #e2dfd8;border-radius:18px;box-shadow:0 18px 50px rgba(20,18,14,.18);backdrop-filter:blur(10px);display:flex;flex-direction:column;z-index:3}
.dp.in{animation:dpin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes dpin{from{transform:translateX(28px)}to{transform:none}}
.dph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 10px}
.dph small{display:block;font:600 10.5px var(--f-m);letter-spacing:.13em;text-transform:uppercase;color:#8a6a3c}
.dph b{display:block;font:700 18px/1.25 var(--f-d);letter-spacing:-.01em;text-wrap:balance}
.dpx{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#3b3c41;background:#f0eee9;flex:none}
.dpx:focus-visible,.dpt button:focus-visible,.dpn button:focus-visible{outline:2px solid #c9a66b;outline-offset:2px}
.dpt{display:flex;gap:4px;padding:0 16px 10px}
.dpt button{all:unset;cursor:pointer;font:600 12px var(--f-d);padding:7px 13px;border-radius:99px;color:#3b3c41;border:1px solid #dad7d0}
.dpt button.on{background:#141416;color:#f2f0eb;border-color:#141416}
.dpv{margin:0 16px;height:250px;border-radius:12px;background:#f1efeb;position:relative;overflow:hidden;flex:none;border:1px solid #e2dfd8}
.dcv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}.dcv:active{cursor:grabbing}
.dpg{position:absolute;left:10px;bottom:8px;font:600 10.5px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:#6b6c70;pointer-events:none;background:rgba(255,255,255,.8);padding:3px 7px;border-radius:6px}
.dpsec{position:relative;height:100%;background:#fbfaf7;display:flex;align-items:center;justify-content:center}
.dpsec svg{width:100%;height:100%}
.dpcod{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.dpcod button{all:unset;cursor:pointer;font:600 11px var(--f-m);padding:5px 9px;border-radius:7px;background:#e6e3dc;color:#2b2c30}
.dpcod button.on{background:#141416;color:#f2f0eb}
.dpkg{position:absolute;right:10px;top:10px;font:600 11px var(--f-m);color:#5f6066;background:#e6e3dc;padding:5px 8px;border-radius:7px}
.dpsec figure{margin:0;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center}
.dpsec svg{width:100%;flex:1;min-height:0}
.dpsec figcaption{font:600 11px var(--f-m);color:#8a6a3c}
.dpsec .sec{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dpimg{display:flex;gap:6px;height:100%;background:#fff}
.dpimg img{flex:1;min-width:0;height:100%;object-fit:contain;max-width:100%}
.dpd{margin:12px 16px 0;font-size:13px;line-height:1.5;color:#3b3c41}
.dps{margin:12px 16px 0;display:flex;flex-direction:column}
.dps div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #ebe8e2;font-size:12.5px}
.dps dt{color:#5f6066}.dps dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.dpn{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 16px;font:600 12px var(--f-m);color:#5f6066}
.dpn button{all:unset;cursor:pointer;width:44px;height:36px;border-radius:10px;background:#141416;color:#f2f0eb;display:grid;place-items:center}
.lead{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .3s;opacity:0;z-index:2}
@media (max-width:760px){.dp{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:52%}.dpv{height:160px}}
@media (prefers-reduced-motion:reduce){.dp.in,.dpsec .sec{animation:none;stroke-dashoffset:0}}
@media (max-width:900px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:64vh auto;height:auto}
  .stage{height:64vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  .top{flex-wrap:wrap;gap:10px}.top img{height:28px}.brand,.fcm{display:none}
  .modos{order:3;flex-basis:100%}
  .cap{bottom:66px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function shapeDe(code){
  const s=SEC[code],xs=s.o.map(p=>p[0]),ys=s.o.map(p=>p[1]);
  const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const sh=new THREE.Shape(s.o.map(p=>new THREE.Vector2(p[0]-cx,p[1]-cy)));
  s.h.forEach(h=>sh.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0]-cx,p[1]-cy)))));
  return sh;
}
function extr(code,len){
  const g=new THREE.ExtrudeGeometry(shapeDe(code),{depth:len,bevelEnabled:false,curveSegments:2});
  g.translate(0,0,-len/2);g.scale(MM,MM,MM);return g;
}
// vertical: seção x→x, seção y→-z, comprimento→y
function vert(code,len){const g=extr(code,len);g.rotateX(-Math.PI/2);return g}
// horizontal: seção x→-z, seção y→y, comprimento→x
function horiz(code,len){const g=extr(code,len);g.rotateY(Math.PI/2);return g}
function box(w,h,d){return new THREE.BoxGeometry(w*MM,h*MM,d*MM)}

// k=1 montado, k=0 explodido

function animaPara(lista,dur,delayFn){

const ghostCache=new Map();

function todosPara(k,dur){parts.forEach(p=>{p.k=k;setGhost(p,false)});animaPara(parts,dur)}
function irPasso(n){
  S.passo=n;
  destaca([]);
  parts.forEach(p=>{p.k=p.step<=n?1:0;setGhost(p,p.step>n)});
  animaPara(parts,1500);
  destaca(n>=0?parts.filter(p=>p.step===n).map(p=>p.m):[]);
  if(n>=0)focoPasso(n);

}

  S.aberta=false;
  let n=0;const tick=()=>{if(n>=PASSOS.length){montando=null;destaca([]);S.passo=PASSOS.length;renderPasso();return}irPasso(n);n++;montando=setTimeout(tick,RM?300:1650)};
  montando=setTimeout(tick,400);
}

  destacados.forEach(m=>m.traverse(o=>{if(o.isMesh&&o.userData.mat){o.material.dispose();o.material=o.userData.mat;o.userData.mat=null}}));

function focoPasso(n){
  const g=S.geo,h=g.H*MM,L=g.L*MM,k=PASSOS[n].k,V3=(a,b,c)=>new THREE.Vector3(a,b,c);
  const mapa={

function focoQual(k){
  const g=S.geo,h=g.H*MM,L=g.L*MM,V3=(a,b,c)=>new THREE.Vector3(a,b,c);
  // vistas da porta inteira, puxadas para o lado do detalhe (a ficha mostra o detalhe de perto)
  const m={
    pivo:[V3(-1.2,h+1.1,3.1),V3(g.px*MM*.6,h*.62,0)],
    batente:[V3(2.6,1.7,2.6),V3(L*.15,h*.5,0)],
    lateral:[V3(2.9,1.6,2.0),V3(L*.2,h*.48,0)],
    fech:[V3(2.9,1.4,2.2),V3(L*.2,h*.45,0)],
    veda:[V3(1.6,.75,3.0),V3(0,h*.3,0)],
    monta:[V3(2.2,.9,2.9),V3(0,h*.35,0)],
    acm:[V3(.8,1.5,3.6),V3(0,h*.5,0)]
  }[k];
  if(k==='veda'||k==='lateral'||k==='fech')abrir(true);
  if(k==='acm'||k==='pivo'||k==='batente')abrir(false);
  if(k==='monta'){todosPara(1,1);parts.filter(p=>p.step===9).forEach(p=>{p.k=.45});animaPara(parts,900)}
  else if(parts.some(p=>p.k!==1))todosPara(1,900);
  m[0].sub(m[1]).multiplyScalar(1.5).add(m[1]);
  voa(m[0],m[1],1200);
}

/* ================== DESENHO TÉCNICO ================== */
const pre={folha:null,pivo:null,fech:null};
function enquadraOrtho(cx,cz,w){
  const r=stage.clientWidth/stage.clientHeight;const hw=w/2,hh=hw/r;
  ocam.left=-hw;ocam.right=hw;ocam.top=hh;ocam.bottom=-hh;ocam.zoom=1;ocam.position.set(cx,6,cz);octl.target.set(cx,0,cz);ocam.updateProjectionMatrix();octl.update();
}
function modoTecnico(on){
  cv.classList.add('fade');
  setTimeout(()=>{
    stage.classList.toggle('tech',on);
    const lc=getComputedStyle(document.documentElement);
    lineMat.color.set(lc.getPropertyValue('--tech-line').trim()||'#1d1e22');
    lineMatDim.color.set(lc.getPropertyValue('--tech-dim').trim()||'#8a7552');
    hatchMat.color.set(lc.getPropertyValue('--tech-line').trim()||'#000');
    destaca([]);
    if(on){abrir(false);ang=0;leaf.rotation.y=0;todosPara(1,1);parts.forEach(p=>{p.cur=1;p.a=null});aplicaEstado(true);}
    parts.forEach(p=>{
      p.m.material.visible=!on;
      p.m.traverse(o=>{if(o.isMesh&&o!==p.m)o.visible=!on});
      p.e.visible=on&&p.plan;
    });
    walls.forEach(w=>w.material=on?hatchMat:wallMat);planX.forEach(o=>o.visible=on);
    floor.visible=!on;
    curCam=on?ocam:cam;ctl.enabled=!on;octl.enabled=on;
    if(on)enquadraOrtho(0,0,S.L*MM+.5);
    cv.classList.remove('fade');
  },RM?0:330);
}
function vistaTec(q){
  const g=S.geo,L=g.L*MM;
  if(q==='folha')enquadraOrtho(0,0,L+.5);
  if(q==='pivo')enquadraOrtho(-L/2+.08,0,.36);
  if(q==='fech')enquadraOrtho(L/2-.08,0,.36);
  S.vt=q;renderPainel();
}

const tmpV=new THREE.Vector3();
function posRotulos(){
  const w=stage.clientWidth,h=stage.clientHeight;
  tags.querySelectorAll('.hs').forEach(b=>{
    const q=QUAL[+b.dataset.i];const m=hot[q.k];if(!m)return;
    const off={pivo:[0,.05,.05],batente:[0,.15,.06],lateral:[0,.45,.05],fech:[0,0,.06],veda:[0,0,.06],monta:[-.3,.06,.06],acm:[-.15,.25,.04],pux:[0,.3,.06]}[q.k]||[0,0,0];

  <line x1="${x0}" y1="${y1+8}" x2="${x0}" y2="${y1+24}"/><line x1="${x1}" y1="${y1+8}" x2="${x1}" y2="${y1+24}"/>
  <line x1="${x0}" y1="${y1+18}" x2="${x1}" y2="${y1+18}" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="${(x0+x1)/2}" y="${y1+32}" text-anchor="middle" stroke="none">${f(wd)}</text>
  <line x1="${x1+8}" y1="${y0}" x2="${x1+26}" y2="${y0}"/><line x1="${x1+8}" y1="${y1}" x2="${x1+26}" y2="${y1}"/>
  <line x1="${x1+20}" y1="${y0}" x2="${x1+20}" y2="${y1}" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="${x1+26}" y="${(y0+y1)/2+4}" stroke="none">${f(hd)}</text></g>
  <defs><marker id="ar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L8 4L0 7z" fill="#2b2c30"/></marker></defs></svg>`;
}
function abreFicha(i){
  const q=QUAL[i],d=DET[q.k];if(!d){dp.hidden=true;return}
  const tabs=[['3d','3D']].concat(d.cods.length?[['corte','Corte']]:[]).concat([['cat','Catálogo']]);
  if(!tabs.some(t=>t[0]===dpTab))dpTab='3d';
  let vis='';
  if(!d.cods.includes(dpCod))dpCod=d.cods[0];
  if(dpTab==='corte')vis=`<div class="dpsec">${secSVG(dpCod)}<div class="dpcod">${d.cods.map(c=>`<button type="button" data-c="${c}" class="${c===dpCod?'on':''}">${c}</button>`).join('')}</div><span class="dpkg">${PERFIS[dpCod]?PERFIS[dpCod].kg.toFixed(3).replace('.',',')+' kg/m':'EPDM'}</span></div>`;
  else if(dpTab==='cat')vis=`<div class="dpimg">${[d.img,d.img2].filter(Boolean).map(k=>`<img src="${IMG[k]}" alt="Imagem do catálogo Ladore">`).join('')}</div>`;
  dp.innerHTML=`<div class="dph"><div><small>${q.cd}</small><b>${q.t}</b></div><button type="button" class="dpx" aria-label="Fechar ficha">×</button></div>
  <div class="dpt" role="tablist">${tabs.map(([k,l])=>`<button type="button" role="tab" data-t="${k}" class="${k===dpTab?'on':''}" aria-selected="${k===dpTab}">${l}</button>`).join('')}</div>
  <div class="dpv ${dpTab==='3d'?'hole':''}" id="dpv">${dpTab==='3d'?'<span class="dpg">Arraste para girar · role para aproximar</span>':vis}</div>
  <p class="dpd">${q.d}</p>
  <dl class="dps">${d.spec().map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>
  <div class="dpn"><button type="button" data-n="-1" aria-label="Qualidade anterior">◀</button><span>${i+1} / ${QUAL.length}</span><button type="button" data-n="1" aria-label="Próxima qualidade">▶</button></div>`;
  dp.hidden=false;dp.classList.remove('in');void dp.offsetWidth;dp.classList.add('in');
  dp.querySelector('.dpx').onclick=fechaFicha;
  dp.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{dpTab=b.dataset.t;abreFicha(S.q)});
  dp.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{dpCod=b.dataset.c;abreFicha(S.q)});
  dp.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>selQual((S.q+(+b.dataset.n)+QUAL.length)%QUAL.length));
  if(dpTab==='3d'){$('#dpv').prepend(dcv);setDetalhe(q.k);}
}
function fechaFicha(){dp.hidden=true;lead.style.opacity=0;S.q=-1;abrir(false);vistaGeral();renderPainel();rotulos()}
let offAtual=0;
function fichaLayout(){
  const w=stage.clientWidth,h=stage.clientHeight,larga=w>760;
  const alvo=(!dp.hidden&&S.modo==='apr')?(larga?dp.offsetWidth+32:Math.min(dp.offsetHeight,h*.5)):0;
  offAtual+=(alvo-offAtual)*(RM?1:.12);if(Math.abs(alvo-offAtual)<.5)offAtual=alvo;
  if(offAtual>0.5){if(larga){cam.aspect=(w+offAtual)/h;cam.setViewOffset(w+offAtual,h,offAtual,0,w,h);}else{cam.aspect=w/(h+offAtual);cam.setViewOffset(w,h+offAtual,0,0,w,h);}}
  else if(cam.view&&cam.view.enabled){cam.aspect=w/h;cam.clearViewOffset();}
  // linha ligando o ponto à ficha
  const b=tags.querySelector('.hs.on'),v=$('#dpv');
  if(b&&v&&!dp.hidden&&larga){
    const sr=stage.getBoundingClientRect(),vr=v.getBoundingClientRect();
    const x1=parseFloat(b.style.left),y1=parseFloat(b.style.top),x2=vr.left-sr.left,y2=vr.top-sr.top+vr.height/2;
    const L=lead.querySelector('path');L.setAttribute('d',`M${x1} ${y1} C ${x1+60} ${y1}, ${x2-60} ${y2}, ${x2} ${y2}`);
    lead.querySelector('circle').setAttribute('cx',x2);lead.querySelector('circle').setAttribute('cy',y2);lead.style.opacity=1;
  }else lead.style.opacity=0;
}
function renderDetalhe(){
  if(dp.hidden||dpTab!=='3d'||S.modo!=='apr'||!dGrp||!dcv.isConnected)return;
  if(!DS.environment){const c=cvs(512,256),g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#ffffff');gr.addColorStop(.5,'#c9c5bd');gr.addColorStop(1,'#6b6862');g.fillStyle=gr;g.fillRect(0,0,512,256);g.fillStyle='#fff';g.fillRect(60,30,90,70);g.fillRect(330,40,120,50);const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;DS.environment=pmD.fromEquirectangular(t).texture;}
  const w=dcv.clientWidth,h=dcv.clientHeight;if(w<10||h<10)return;
  if(dcv.width!==Math.round(w*DR.getPixelRatio()))DR.setSize(w,h,false);
  if(!RM&&!dMexendo&&performance.now()-dToque>3000){dRot+=.008;dGrp.rotation.y=dRot;}dctl.update();
  dcam.aspect=w/h;dcam.updateProjectionMatrix();DR.render(DS,dcam);
}

/* ================== LOOP ================== */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  if(S.modo==='tec')vistaTec(S.vt||'folha');
}
new ResizeObserver(resize).observe(stage);
function loop(t){
  requestAnimationFrame(loop);
  parts.forEach(p=>{if(p.a){const u=Math.min(1,Math.max(0,(t-p.a.t0)/p.a.dur));p.cur=p.a.from+(p.a.to-p.a.from)*u;posPart(p);if(u>=1)p.a=null}});
  if(leaf){ang+=(angAlvo-ang)*(RM?1:.06);leaf.rotation.y=ang}
  if(tw){const u=Math.min(1,(t-tw.s)/tw.d),e=ease(u);cam.position.lerpVectors(tw.p0,tw.p1,e);ctl.target.lerpVectors(tw.t0,tw.t1,e);if(u>=1)tw=null}
  if(curCam===cam)ctl.update();else octl.update();
  fichaLayout();
  R.render(SC,curCam);posRotulos();renderDetalhe();
}
['pointerdown','wheel'].forEach(ev=>cv.addEventListener(ev,()=>{tw=null},{passive:true}));

/* ================== INÍCIO ================== */
parts.forEach(p=>p.k=1);
construir();parts.forEach(p=>{p.k=1;p.cur=1});aplicaEstado(true);aplicaCores();
resize();vistaGeral();tw&&(cam.position.copy(tw.p1),ctl.target.copy(tw.t1),tw=null);
renderPainel();rotulos();
requestAnimationFrame(loop);
setTimeout(()=>$('#load').classList.add('done'),300);
window.__lad={S,parts,setModo,irPasso,montarTudo,selQual,vistaTec,R,SC};
})();
</script>
