<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Acompanhamento da implantação — FC Consultoria</title>
<link rel="icon" href="../midia/logo-fc.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Portal do cliente: cabeçalho escuro com a marca FC, resumo em 3 números, linhas com barra e códigos, área do site. */
:root{
  --bg:#eef2f3; --card:#ffffff; --line:#dbe3e5; --fg:#16252b; --muted:#5d6f75;
  --slate:#2b3740; --slate2:#36444f; --teal:#0e8a8c; --teal-d:#0a6d6f; --teal-soft:#dff2f1;
  --amber:#b86e00; --amber-soft:#fdf0d9; --silver:#c9d1d6;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.top{background:var(--slate);color:#fff}
.top-in{max-width:880px;margin:0 auto;padding:18px 16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.top .tt{flex:1;min-width:200px}
.top .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--silver)}
.top h1{font-size:24px;line-height:1.2;margin-top:2px}
.top .upd{font-size:13px;color:var(--silver);margin-top:4px}
.wrap{max-width:880px;margin:-10px auto 0;padding:0 16px 48px;position:relative}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;margin-top:4px}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi.hi{background:var(--teal);border-color:var(--teal);color:#fff}
.kpi.hi .l,.kpi.hi .v small{color:#d5f1f0}
@media (max-width:620px){.kpis{grid-template-columns:1fr 1fr}.kpi.hi{grid-column:1 / -1}}
.sec{margin-top:16px}
.sec h2{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ritmo{display:flex;gap:8px;flex-wrap:wrap}
.dia{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);min-width:92px}
.dia .d{font-size:12px;color:var(--muted)}
.dia .n{font-family:var(--display);font-weight:600;font-size:18px;color:var(--teal-d)}
.dia.ult{border-color:var(--teal);background:var(--teal-soft)}
.bases{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;margin:-2px 0 12px}
.base{background:var(--teal-soft);border-radius:8px;padding:3px 10px}
.base b{color:var(--teal-d);font-weight:600}
.linha{padding:14px 0;border-top:1px solid var(--line)}
.linha:first-child{border-top:0;padding-top:2px}
.lh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lh b{font-family:var(--display);font-size:16px;font-weight:600}
.lh .q{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.lh .q strong{color:var(--fg);font-weight:600}
.plus{background:var(--amber-soft);color:var(--amber);font-weight:600;font-size:12.5px;border-radius:99px;padding:2px 9px}
.ok{background:var(--teal-soft);color:var(--teal-d);font-weight:600;font-size:12.5px;border-radius:99px;padding:2px 9px}
.bar{height:10px;background:#e7eef0;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.cods{margin-top:10px;font-size:13px}
.cods .t{color:var(--muted);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:#f7fafa}
.chip.novo{border-color:#f3c77e;background:var(--amber-soft);color:#7a4a00}
details summary{cursor:pointer;color:var(--teal-d);font-weight:500;margin-top:8px;font-size:13px}
.site{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:620px){.site{grid-template-columns:1fr}}
.frame{position:relative;height:250px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f4f7f8}
.frame iframe{position:absolute;top:0;left:0;width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0;pointer-events:none}
.frame a{position:absolute;inset:0}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:10px 16px;font-size:14px}
.btn:hover{background:var(--teal-d)}
.muted{color:var(--muted)}
.foot{margin-top:22px;text-align:center;font-size:12.5px;color:var(--muted)}
.sit{display:flex;gap:14px;align-items:flex-start;border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:0;padding:14px 16px;margin-top:16px}
.sit .ic{font-size:22px;line-height:1}
.sit b{font-family:var(--display);font-size:16px;color:#5c3800}
.sit p{margin:3px 0 0;color:#5c3800;font-size:14px}
.sit .em{font-size:12px;color:#8a5a12;margin-top:6px}
.etapas{list-style:none;margin:0;padding:0}
.et{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.et:first-child{border-top:0}
.et .nb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px;background:#e7eef0;color:var(--muted)}
.et.feita .nb{background:var(--teal);color:#fff}
.et.atual .nb{background:var(--amber);color:#fff}
.et .ti{font-weight:500}
.et.feita .ti{color:var(--muted)}
.et .dd{font-size:12.5px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;white-space:nowrap}
.tag.cli{background:#e8eefc;color:#2a4a9a}
.st{font-size:12.5px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--teal-d)}.st.and{color:var(--amber)}.st.prev{color:var(--muted);font-weight:500}
.estado{max-width:520px;margin:60px auto;text-align:center}
.estado h2{font-size:20px;margin-bottom:8px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img src="../midia/logo-fc.png" alt="FC Consultoria e Representação">
  <div class="tt">
    <div class="eyebrow">Acompanhamento da implantação</div>
    <h1 id="cliente">Carregando…</h1>
    <div class="upd" id="upd"></div>
  </div>
</div></header>

<main class="wrap" id="app"></main>

<script>
const SUPABASE_URL='https://cpkjphodruyxfouirhpd.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwa2pwaG9kcnV5eGZvdWlyaHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Mzg3NTQsImV4cCI6MjEwMjMxNDc1NH0.5OAmhWSe_4STLaCo-NfAwxGDRCGe3ICk-j5IEAMStKQ';
const SITE_FC='https://fc-consultoria.github.io/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0).toLocaleString('pt-BR');
const dt=iso=>{const d=new Date(iso);return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'}).replace('.','');};
const hora=iso=>new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const SITUACOES={
  fornecedor:['📦','Aguardando retorno do fornecedor','Estamos aguardando a tabela de preços atualizada do fornecedor para seguir com a alimentação.'],
  cliente:['🤝','Aguardando retorno da sua equipe','Precisamos de uma informação da sua equipe para seguir. O pedido já foi enviado pelo WhatsApp.'],
  sistema:['🖥️','Aguardando o suporte do sistema','Estamos aguardando um retorno do suporte do sistema para concluir um ajuste.'],
  externo:['🚗','Equipe em atendimento externo','Hoje nossa equipe está em atendimento externo, sem alimentação no sistema. Retomamos no próximo dia útil.'],
  conferencia:['🔎','Conferência dos itens alimentados','Estamos conferindo os itens já alimentados. Essa etapa não aumenta a contagem, mas ajuda a evitar divergências no seu sistema.'],
  livre:['ℹ️','Recado da FC','']
};
function situacaoHtml(s){
  if(!s||!s.tipo||!SITUACOES[s.tipo]) return '';
  const [ic,tit,txt]=SITUACOES[s.tipo];
  const det=(s.detalhe||'').trim();
  const corpo=s.tipo==='livre'?det:(txt+(det?' '+det:''));
  if(!corpo) return '';
  return `<section class="sit" role="status"><span class="ic" aria-hidden="true">${ic}</span><div><b>${esc(tit)}</b><p>${esc(corpo)}</p>${s.em?`<div class="em">Informado em ${esc(dt(s.em))} às ${esc(hora(s.em))}</div>`:''}</div></section>`;
}
function baseHtml(f){
  if(!f) return '';
  const item=(rot,lista)=>(lista&&lista.length)?`<span class="base"><span class="muted">${rot}</span> <b>${esc(lista.join(', '))}</b></span>`:'';
  const partes=[item('Componentes ·',f.componentes),item('Perfis ·',f.perfis)].filter(Boolean);
  return partes.length?`<div class="bases"><span class="muted">Base de preços usada:</span>${partes.join('')}</div>`:'';
}
function etapasHtml(et){
  if(!et||!et.length) return '';
  const atual=et.findIndex(e=>!e.feita);
  const dcurta=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.',''):'';
  const feitas=et.filter(e=>e.feita).length;
  return `<section class="sec card"><h2>Etapas da implantação <span class="muted" style="font-family:var(--body);font-size:13px;font-weight:500;margin-left:auto">${feitas} de ${et.length} concluídas</span></h2><ol class="etapas">${et.map((e,i)=>{
    const cls=e.feita?'feita':(i===atual?'atual':'');
    const st=e.feita?'<span class="st ok">✓ Concluída</span>':(i===atual?(e.responsavel==='cliente'?'<span class="st and">Aguardando sua equipe</span>':'<span class="st and">Em andamento</span>'):'<span class="st prev">Prevista</span>');
    return `<li class="et ${cls}"><span class="nb">${e.feita?'✓':i+1}</span><div><div class="ti">${esc(e.titulo)} ${e.responsavel==='cliente'?'<span class="tag cli">Sua equipe</span>':''}</div>${e.data?`<div class="dd">${esc(dcurta(e.data))}</div>`:''}</div>${st}</li>`;}).join('')}</ol></section>`;
}
const normCod=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\s\-\.\/_]+/g,'');

function estado(titulo, texto){
  $('#cliente').textContent='FC Consultoria';
  $('#app').innerHTML=`<div class="card estado"><h2>${esc(titulo)}</h2><p class="muted">${esc(texto)}</p></div>`;
}

function linhasPorNome(foto){const m={};((foto&&foto.dados&&foto.dados.linhas)||[]).forEach(l=>m[l.nome]=l);return m;}

function render(r){
  const fotos=r.fotos||[];
  $('#cliente').textContent=r.cliente||'';
  document.title='Acompanhamento — '+(r.cliente||'FC Consultoria');
  if(!fotos.length){estado('Tudo pronto por aqui','O primeiro andamento da sua implantação aparece aqui a partir da próxima atualização, às 07:00 (horário de Brasília), de segunda a sexta.');$('#cliente').textContent=r.cliente||'';return;}
  const atual=fotos[0], ant=fotos[1]||null;
  const L=(atual.dados.linhas||[]), A=linhasPorNome(ant);
  $('#upd').textContent=(atual.previa?'Prévia gerada em ':'Atualizado em ')+dt(atual.em)+' às '+hora(atual.em)+' · atualizações de segunda a sexta, às 07:00';

  const total=L.reduce((s,l)=>s+Number(l.total||0),0);
  const alim=L.reduce((s,l)=>s+Number(l.alimentados||0),0);
  const deltaLinha=l=>ant?Math.max(0,Number(l.alimentados||0)-Number((A[l.nome]||{}).alimentados||0)):0;
  const deltaTotal=L.reduce((s,l)=>s+deltaLinha(l),0);

  // ritmo: diferença entre fotos consecutivas (mais recente primeiro), até 5
  const ritmo=[];
  for(let i=0;i<fotos.length-1&&ritmo.length<5;i++){
    const a=fotos[i],b=linhasPorNome(fotos[i+1]);
    const d=(a.dados.linhas||[]).reduce((s,l)=>s+Math.max(0,Number(l.alimentados||0)-Number((b[l.nome]||{}).alimentados||0)),0);
    ritmo.push({em:a.em,d});
  }

  const linhaHtml=l=>{
    const t=Number(l.total||0),a=Number(l.alimentados||0),pct=t?Math.round(a/t*100):0,d=deltaLinha(l);
    const antCods=new Set(((A[l.nome]||{}).codigos||[]).map(normCod));
    const cods=(l.codigos||[]).slice().sort((x,y)=>String(x).localeCompare(String(y),'pt-BR',{numeric:true}));
    const novos=ant?cods.filter(c=>!antCods.has(normCod(c))):[];
    const resto=cods.filter(c=>!novos.includes(c));
    return `<div class="linha">
      <div class="lh"><b>${esc(l.nome)}</b>${d>0?`<span class="plus">+${n(d)} nesta atualização</span>`:''}${t&&a>=t?'<span class="ok">Concluída</span>':''}
        <span class="q"><strong>${n(a)}</strong> de ${n(t)} itens</span></div>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(l.nome)}"><i style="width:${pct}%"></i></div>
      ${novos.length?`<div class="cods"><div class="t">Códigos alimentados nesta atualização (${novos.length})</div><div class="chips">${novos.map(c=>`<span class="chip novo">${esc(c)}</span>`).join('')}</div></div>`:''}
      ${resto.length?`<details><summary>${novos.length?'Ver os demais códigos já alimentados':'Ver códigos já alimentados'} (${resto.length})</summary><div class="cods"><div class="chips">${resto.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div></div></details>`:''}
    </div>`;
  };

  $('#app').innerHTML=`
    <div class="kpis">
      <div class="kpi hi"><div class="l">Nesta atualização</div><div class="v">${ant?'+'+n(deltaTotal):n(alim)} <small>itens</small></div></div>
      <div class="kpi"><div class="l">Itens alimentados</div><div class="v">${n(alim)}</div></div>
      <div class="kpi"><div class="l">Total contratado</div><div class="v">${n(total)}</div></div>
    </div>
    ${situacaoHtml(atual.dados.situacao)}
    ${etapasHtml(atual.dados.etapas)}
    ${ritmo.length>1?`<section class="sec"><h2>Ritmo das últimas atualizações</h2><div class="ritmo">${ritmo.map((x,i)=>`<div class="dia ${i===0?'ult':''}"><div class="d">${esc(dt(x.em))}</div><div class="n">+${n(x.d)}</div></div>`).join('')}</div></section>`:''}
    <section class="sec card"><h2>Andamento por linha</h2>${baseHtml(atual.dados.fornecedores)}${L.map(linhaHtml).join('')}</section>
    <section class="sec card site">
      <div class="frame"><iframe src="${SITE_FC}" title="Prévia do site da FC Consultoria" loading="lazy" tabindex="-1"></iframe><a href="${SITE_FC}" target="_blank" rel="noopener" aria-label="Abrir o site da FC Consultoria"></a></div>
      <div><h2 style="margin-bottom:6px">Conheça a FC Consultoria</h2>
        <p class="muted" style="margin:0 0 14px">Catálogo de perfis em 3D, representadas e novidades para o seu dia a dia.</p>
        <a class="btn" href="${SITE_FC}" target="_blank" rel="noopener">Abrir o site da FC</a></div>
    </section>
    <div class="foot">FC Consultoria e Representação · Atendimento de segunda a sexta, das 08:00 às 11:00 e das 13:00 às 17:00</div>`;
}

(async()=>{
  const qs=new URLSearchParams(location.search), chave=qs.get('k')||'', previa=qs.get('previa')==='1';
  if(chave.length<24){estado('Link incompleto','Confira se o link foi copiado inteiro ou peça um novo link para a FC Consultoria.');return;}
  try{
    // Prévia: usa o login do Painel da Matriz (mesmo endereço) para mostrar a próxima publicação sem gravar nada
    const sb=previa
      ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,storageKey:'trein-fc-auth'}})
      : window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false}});
    if(previa){const {data:{session}}=await sb.auth.getSession();if(!session){estado('Prévia só para a FC','Entre no Painel da Matriz neste navegador e abra a prévia de novo.');return;}}
    const {data,error}=await sb.rpc(previa?'impl_portal_previa':'impl_portal_ver',{p_chave:chave});
    if(error) throw error;
    if(previa) document.body.insertAdjacentHTML('afterbegin','<div style="background:#b86e00;color:#fff;text-align:center;font:600 14px var(--body);padding:8px 12px">PRÉVIA da próxima publicação · o cliente ainda não vê isto</div>');
    if(!data){estado('Link desativado','Este link não está mais ativo. Peça um novo link para a FC Consultoria.');return;}
    render(data);
  }catch(e){console.error(e);estado('Não foi possível carregar','Verifique sua internet e recarregue a página.');}
})();
</script>
</body>
</html>
