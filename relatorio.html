<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório de desempenho · FC Mostruário 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--fg:#1b232a;--muted:#5d6b76;--line:#d5dce1;--accent:#1f6f9a;--ok:#1f8a4c;--ok-soft:#e2f4ea;--bad:#b4372f;--bad-soft:#f9e5e3;--gold:#b8860b}
*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:var(--fg);font:400 15px/1.45 'Barlow Semi Condensed',system-ui,sans-serif}
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#e9edf0;padding:16px}.gate[hidden]{display:none}
.gcard{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.gcard h1{margin:0;font:700 24px 'Barlow',sans-serif}.gcard label{display:flex;flex-direction:column;gap:6px;font:500 14px 'Barlow',sans-serif}
input{font:400 15px 'IBM Plex Mono',monospace;padding:9px 10px;border:1px solid #c4ccd2;border-radius:8px}
button{font:600 14px 'Barlow',sans-serif;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.gmsg{min-height:18px;color:var(--bad);margin:0}
.pg{max-width:960px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.top .id{display:flex;gap:14px;align-items:center}.top img{width:64px;height:64px;border-radius:12px}
.eb{font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 28px/1.1 'Barlow',sans-serif}h2{font:700 20px 'Barlow',sans-serif;margin:0}
h3{font:600 13px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kp b{display:block;font:600 26px 'Barlow',sans-serif}.kp span{font-size:13px;color:var(--muted)}
.cb{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;break-inside:avoid}
.ch{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.mini{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:14px}.mini b{font:600 18px 'Barlow',sans-serif;display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px;list-style:none;margin:0;padding:0}.chips li{font:500 12px 'IBM Plex Mono',monospace;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:#9aa6ae}
.chips li.on{background:var(--ok-soft);border-color:#b9dfc8;color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font:500 11px 'IBM Plex Mono',monospace;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #eef1f3}td.n{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap}.st{color:var(--gold);letter-spacing:1px}.st i{color:#d9dee2;font-style:normal}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.two ul{margin:0;padding-left:18px}.fo li::marker{color:var(--ok)}.me li::marker{color:var(--bad)}
.note{color:var(--muted);font-size:13px}
.ft{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:700px){.kp{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
table.et th,table.et td{white-space:nowrap}tr.er{cursor:pointer}tr.er:hover td{background:#f5f8fa}tr.ed td{background:#fafbfc;white-space:normal}.tag{font:500 12px 'IBM Plex Mono',monospace;padding:2px 7px;border-radius:5px}.tg{background:var(--ok-soft);color:var(--ok)}.tr{background:var(--bad-soft);color:var(--bad)}.tn{background:#eef1f3;color:var(--muted)}.lvb{display:inline-flex;gap:3px;vertical-align:middle}.lvb i{width:16px;height:6px;border-radius:3px;background:#dfe5ea}.lvb i.on{background:var(--ok)}
@media print{body{background:#fff}.np{display:none!important}.pg{padding:0}.cb,.kp div{border-color:#ccd}@page{margin:14mm}}
</style>
</head>

  const EV=[];for(let i=0;;i+=1000){const r=await sb.from('trein_eventos').select('tipo,tipologia,detalhe,criado_em').eq('user_id',emp).order('criado_em').range(i,i+999);if(r.error||!r.data.length)break;EV.push(...r.data);if(r.data.length<1000)break;}
  {const pr=await sb.from('trein_eventos').select('tipo,detalhe,criado_em').eq('tipo','pausa');window.PZ=pzL(pr.data||[],emp);window.PZE=pr.data||[];}
  {const zr=await sb.from('trein_eventos').select('tipo,detalhe,criado_em').eq('tipo','zerar');const zz=(zr.data||[]).filter(e=>(e.detalhe||{}).para===emp);const t=Math.max(0,...zz.map(e=>Date.parse(e.criado_em)));if(t){const keep=EV.filter(e=>ZCFG.has(e.tipo)||Date.parse(e.criado_em)>t);EV.length=0;EV.push(...keep);}}
  let LD={};{const lb=await sb.from('trein_eventos').select('detalhe').eq('tipo','liberacao').order('criado_em',{ascending:false}).limit(30);LD=((lb.data||[]).find(r=>(r.detalhe||{}).para===emp)||{}).detalhe||{};}
  const HJ=new Date(Date.now()-4*3600e3).toISOString().slice(0,10),SEMP=!!(LD.contrato&&LD.ate&&LD.ate>=HJ),ATEBR=LD.ate?LD.ate.split('-').reverse().join('/'):'';
  const E=ra.data||{};document.getElementById('emp').textContent=E.nome||E.login||'Empresa';
  const C={};(rc.data||[]).forEach(r=>{const d=r.detalhe||{};if(d.para!==emp)return;C[d.id]=Object.assign({},C[d.id]||{},d);});
  const L=Object.values(C).filter(x=>x.nome);let SZ={wv:true,cem:true};{const r=(rs.data||[]).filter(r=>(r.detalhe||{}).para===emp).pop();if(r)SZ=r.detalhe;}const byNome=n=>L.find(x=>x.nome.trim().toLowerCase()===String(n||'').trim().toLowerCase());
  const G={};L.forEach(x=>G[x.id]={x,ev:[]});
  EV.forEach(e=>{const d=e.detalhe||{};let k=d.cid&&G[d.cid]?d.cid:(byNome(d.quem)||{}).id;if(!k)return;G[k].ev.push(e);});
  let H=0,ND=0,SP=0,SN=0;const out=[],R=[];
  const per=EV.length?`Período: ${fD(EV[0].criado_em)} a ${fD(EV[EV.length-1].criado_em)}`:'Sem atividades registradas ainda.';
  Object.values(G).filter(g=>!(g.x.removido&&!g.ev.length)).forEach(({x,ev})=>{
    let seg=0;const dias=new Set(),tip=new Set(),per=new Set(),cor=new Set(),mont={},wv=[],cm=[],errW={},errC={};let ini=null;
    ev.forEach(e=>{const d=e.detalhe||{};if(e.tipo==='tempo'){seg+=d.s||60;dias.add(new Date(Date.parse(e.criado_em)-4*3600e3).toISOString().slice(0,10));}
      if(e.tipo==='colab_inicio'&&!ini)ini=e.criado_em;if(e.tipologia&&TIPOS[e.tipologia]&&e.tipo!=='login')tip.add(e.tipologia);
      if(e.tipo==='perfil')per.add(d.c);if(e.tipo==='corte')cor.add((d.t||'')+d.k);
      if(e.tipo==='teste'){const pct=d.pct!=null?d.pct:Math.round((d.tot||0)/(((d.tot||0)+(d.err||0))||1)*100),st=d.stars!=null?d.stars:(pct>=90?3:pct>=70?2:1);
        const m=mont[d.t]||(mont[d.t]={n:0,best:null,err:0,lv:0});m.n++;{const r={mont:1,desm:2,esp:3}[d.nivel]||1;if(r>m.lv&&(r===1?pct>=70:st>=1))m.lv=r;}m.err+=d.err||0;if(!m.best||st>m.best.st||(st===m.best.st&&pct>m.best.pct)||(st===m.best.st&&pct===m.best.pct&&d.ms<m.best.ms))m.best={st,pct,ms:d.ms,nivel:d.nivel};}
      if(e.tipo==='wvetro'){wv.push(d);(d.erros||[]).forEach(k=>errW[k]=(errW[k]||0)+1);}if(e.tipo==='cem'){cm.push(d);(d.erros||[]).forEach(k=>errC[k]=(errC[k]||0)+1);}});
    const best=a=>a.slice().sort((p,q)=>(q.stars||0)-(p.stars||0)||q.pct-p.pct||(p.ms||0)-(q.ms||0))[0];
    const bW=best(wv),bC=best(cm),allP=[...Object.values(mont).map(m=>m.best.pct),...wv.map(d=>d.pct),...cm.map(d=>d.pct)];
    H+=seg;ND+=Object.values(mont).reduce((s,m)=>s+m.n,0)+wv.length+cm.length;allP.forEach(p=>{SP+=p;SN++;});
    const fortes=[],melhorar=[];
    Object.entries(mont).forEach(([t,m])=>{if(m.lv===3)fortes.push(`Nível 3 (Especialista) na ${TIPOS[t]||t}`);if(m.best.st===3)fortes.push(`Montagem ${TIPOS[t]||t}: 3 estrelas (${m.best.pct}%)`);else if(m.best.pct<70)melhorar.push(`Montagem ${TIPOS[t]||t}: melhor resultado ${m.best.pct}%`);});
    if(bW&&SZ.wv){if(bW.pct>=85)fortes.push(`Lançamento no WVetro: ${bW.pct}%`);else melhorar.push(`Lançamento no WVetro: melhor resultado ${bW.pct}%`);}
    if(bC&&SZ.cem){if(bC.pct>=85)fortes.push(`Lançamento no CEM: ${bC.pct}%`);else melhorar.push(`Lançamento no CEM: melhor resultado ${bC.pct}%`);}
    const top=(o,p)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,4).forEach(([k,n])=>melhorar.push(`${p}: errou “${k}” ${n}×`));if(SZ.wv)top(errW,'WVetro');if(SZ.cem)top(errC,'CEM');
    {const fl=ev.filter(e=>e.tipo==='falta');if(fl.length){if(fl.some(e=>(e.detalhe||{}).ok))fortes.push('Percebeu a peça que faltava na maxim-ar Gold (pingadeira LG-091)');else melhorar.push('Não percebeu que faltava a pingadeira LG-091 na maxim-ar Gold');}}
    if(tip.size>=NT)fortes.push('Estudou todas as tipologias');else if(tip.size)melhorar.push(`Ainda não abriu ${NT-tip.size} tipologia${NT-tip.size>1?'s':''}`);
    if(!Object.keys(mont).length)melhorar.push('Ainda não fez o desafio Monte a esquadria');if(SZ.wv&&!wv.length)melhorar.push('Ainda não fez o desafio WVetro');if(SZ.cem&&!cm.length)melhorar.push('Ainda não fez o desafio CEM');
    const fim=ini?Date.parse(ini)+(x.horas||72)*3600e3+pzMs(window.PZ||[],Date.parse(ini),pzL(window.PZE||[],emp,x.id)):null;
    const sit=SEMP?(!ini?'ainda não começou':(LD.impl?'implantação':'contrato')+' até '+ATEBR):!ini?'ainda não começou':fim<Date.now()?`acesso suspenso em ${fDH(fim)}`:`em andamento · acesso até ${fDH(fim)}`;
    const rows=Object.entries(mont).map(([t,m])=>`<tr><td>Monte a esquadria · ${esc(TIPOS[t]||t)}${m.lv?` <span class="note">· chegou ao Nível ${m.lv}</span>`:''}</td><td>${stars(m.best.st)}</td><td class="n">${m.best.pct}%</td><td class="n">${fT(m.best.ms)}</td><td class="n">${m.n}</td></tr>`)
      .concat(bW&&SZ.wv?[`<tr><td>Lançamento no WVetro</td><td>${stars(bW.stars)}</td><td class="n">${bW.pct}%</td><td class="n">${fT(bW.ms)}</td><td class="n">${wv.length}</td></tr>`]:[])
      .concat(bC&&SZ.cem?[`<tr><td>Lançamento no CEM</td><td>${stars(bC.stars)}</td><td class="n">${bC.pct}%</td><td class="n">${fT(bC.ms)}</td><td class="n">${cm.length}</td></tr>`]:[]).join('');
    {const ult=ev.length?ev[ev.length-1].criado_em:null,lvM=Math.max(0,...Object.values(mont).map(m=>m.lv||0)),stM=Math.max(0,...Object.values(mont).map(m=>m.best.st));
     R.push({x,tag:SEMP?(!ini?['ainda não começou','tn']:['em andamento','tg']):!ini?['ainda não começou','tn']:fim<Date.now()?['prazo encerrado','tr']:['restam '+Math.max(1,Math.round((fim-Date.now())/3600e3))+' h','tg'],seg,tip:tip.size,lv:lvM,st:stM,
       wv:bW&&SZ.wv?bW.pct+'%':'—',cem:bC&&SZ.cem?bC.pct+'%':'—',ult,fortes,melhorar});}
    out.push(`<section class="cb"><div class="ch"><h2>${esc(x.nome)}${x.removido?' <span class="note">(removido)</span>':''}</h2><span class="note">${sit}</span></div>
      <div class="mini"><span><b>${dias.size}</b>dia${dias.size===1?'':'s'} de estudo</span><span><b>${fH(seg)}</b>tempo de estudo</span><span><b>${tip.size}/${NT}</b>tipologias</span><span><b>${per.size}</b>perfis estudados</span><span><b>${cor.size}</b>cortes vistos</span></div>
      <h3>Tipologias vistas</h3><ul class="chips">${Object.entries(TIPOS).map(([k,n])=>`<li class="${tip.has(k)?'on':''}">${n}</li>`).join('')}</ul>
      <h3>Desafios · melhor resultado</h3>${rows?`<table><tr><th>Desafio</th><th>Estrelas</th><th style="text-align:right">Acertos</th><th style="text-align:right">Tempo</th><th style="text-align:right">Tentativas</th></tr>${rows}</table>`:'<p class="note">Nenhum desafio concluído.</p>'}
      <div class="two"><div><h3>Pontos fortes</h3>${fortes.length?`<ul class="fo">${fortes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="note">—</p>'}</div><div><h3>Pontos a melhorar</h3>${melhorar.length?`<ul class="me">${melhorar.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="note">Nada pendente. 👏</p>'}</div></div></section>`);});
  if(!EMPV)document.getElementById('per').textContent=per;
  document.getElementById('k1').textContent=L.filter(x=>!x.removido).length;document.getElementById('k2').textContent=(H/3600).toFixed(1).replace('.',',');
  document.getElementById('k3').textContent=ND;document.getElementById('k4').textContent=SN?Math.round(SP/SN)+'%':'—';
  if(EMPV){document.getElementById('lst').innerHTML=R.length?`<div class="cb" style="padding:0;overflow:auto"><table class="et"><tr><th>Colaborador</th><th>${SEMP?(LD.impl?'Acesso (implantação)':'Acesso (contrato)'):'Acesso de 3 dias'}</th><th>Horas</th><th>Tipologias</th><th>Monte a esquadria</th>${SZ.wv?'<th>WVetro</th>':''}${SZ.cem?'<th>CEM</th>':''}<th>Último acesso</th></tr>${R.map((r,i)=>`<tr class="er" data-i="${i}"><td><b>${esc(r.x.nome)}</b></td><td><span class="tag ${r.tag[1]}">${r.tag[0]}</span></td><td class="n">${fH(r.seg)}</td><td class="n">${r.tip}/${NT}</td><td><span class="lvb">${[1,2,3].map(k=>`<i class="${k<=r.lv?'on':''}"></i>`).join('')}</span> ${r.lv?'Nível '+r.lv:'—'} ${stars(r.st)}</td>${SZ.wv?`<td class="n">${r.wv}</td>`:''}${SZ.cem?`<td class="n">${r.cem}</td>`:''}<td class="note">${r.ult?fDH(r.ult):'—'}</td></tr><tr class="ed" hidden><td colspan="8"><div class="two"><div><h3>Pontos fortes</h3>${r.fortes.length?`<ul class="fo">${r.fortes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="note">—</p>'}</div><div><h3>Pontos a melhorar</h3>${r.melhorar.length?`<ul class="me">${r.melhorar.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="note">Nada pendente. 👏</p>'}</div></div></td></tr>`).join('')}</table></div><p class="note">Clique no nome para ver pontos fortes e a melhorar. Para mais tempo, o colaborador usa “Solicitar mais tempo” ou fale com a FC.</p>`:'<p class="note">Nenhum colaborador cadastrado.</p>';
    document.querySelectorAll('.er').forEach(tr=>tr.onclick=()=>{const d=tr.nextElementSibling;d.hidden=!d.hidden;});
    const lb=(rs.data||[]).length,lib=await sb.from('trein_eventos').select('detalhe').eq('tipo','liberacao').order('criado_em',{ascending:false}).limit(20);
    const la=((lib.data||[]).map(r=>r.detalhe||{}).find(d=>d.para===emp)||{}).ate;const hoje=new Date(Date.now()-4*3600e3).toISOString().slice(0,10);

    document.getElementById('bPdf').onclick=()=>window.open('relatorio.html'+(perfil.papel==='admin'?'?e='+emp:''),'_blank');}
  else document.getElementById('lst').innerHTML=out.join('')||'<p class="note">Nenhum colaborador cadastrado.</p>';
  document.getElementById('ger').textContent=new Date().toLocaleString('pt-BR');
  document.getElementById('bLink').onclick=async e=>{const u=location.origin+location.pathname;try{await navigator.clipboard.writeText(u);e.target.textContent='Link copiado';}catch(_){prompt('Link do relatório:',u);}};
