function tPesq(){
  const g=S.g;
  let h=`<section class="box"><h2>Pesquisar perfil</h2><p class="sub">Digite o código de qualquer fornecedor, o código de mercado (Alcoa)${DIST()?'':' ou o código '+esc(EXTS[S.ext].n)}. Acabamento: natural.</p>
  <form class="search" id="fq"><input id="q" value="${esc(S.q||(g?g.k:''))}" placeholder="SU-001, EX-0747, FASU-0001" aria-label="Código do perfil" autocomplete="off"><button class="btn">Comparar</button></form>
  <div class="chips"><span class="chip fix">Natural</span>${['SU-001','SU-002','SU-039','SU-040','LG-007'].map(c=>`<button class="chip" data-q="${c}">${c}</button>`).join('')}</div><div id="sugs"></div></section>`;
  if(!g)return h+`<section class="box empty">Nenhum perfil encontrado para esse código. Confira a digitação ou tente o código de mercado.</section>`;
  const mine=own(g),r=ref(g),base=(mine[0]||r||g.m[0]).p;
  const pr=ultPrecos(g,S.pcli);
  const vb=m=>{const p=pr[m.f+'|'+norm(m.c)];return p?p.rk*m.p*6:null};
  const forn=g.m.filter(m=>m.f!=='alcoa');
  const bestP=forn.filter(m=>vb(m)!=null).sort((a,b)=>vb(a)-vb(b))[0];
  const leve=forn.slice().sort((a,b)=>a.p-b.p)[0];
  const ORD=S.ord==='peso'?'peso':'preco';
  const best=ORD==='peso'?leve:(bestP||leve);
  const bestT=ORD==='peso'?'Ferramenta mais leve':bestP?'Melhor preço da barra':'Ferramenta mais leve · sem preço lançado';
  const bestC=(ORD==='peso'||!bestP)?'leve':'best';
  const semP=forn.filter(m=>vb(m)==null).length;
  h+=`<section class="box"><div class="hero">${img(mine[0]||r)}<div><div class="row"><span class="mine">${DIST()?'Código de mercado':mine.length?'Sua linha · '+esc(EXTS[S.ext].n):'Sem código '+esc(EXTS[S.ext].n)}</span>${abcTag(g.cl)}</div>
   <h3 style="margin-top:10px">${esc(mine.map(m=>m.c).join(' · ')||g.k)}</h3><div class="nm">${esc(g.n)}</div>
   <div class="kv"><span>Linha <b>${LIN[g.l]}</b></span><span>Mercado <b>${esc(g.k)}</b></span>${mine[0]?`<span><b class="num">${n3(mine[0].p)}</b> kg/m</span><span>Barra 6 m <b class="num">${n3(mine[0].p*6)} kg</b></span>`:''}<span><b>${g.m.filter(m=>m.f!=='alcoa').length}</b> equivalentes</span></div>
   <div class="kv"><button class="btn sm" data-goprec>＄ Lançar preços dos fornecedores</button></div></div></div></section>
  <section class="box"><div class="row"><h2>Equivalentes no mercado</h2><span class="sub" style="margin:0">Desenho de cada catálogo · diferença de peso em relação ${DIST()?'à referência de mercado':'à sua linha'}</span></div><div class="ordbar"><span class="sub" style="margin:0">Melhor opção por:</span><div class="seg2" role="group" aria-label="Melhor opção por"><button data-ord="preco" class="${ORD==='preco'?'on':''}">1 · Melhor preço da barra <small>R$/kg × peso</small></button><button data-ord="peso" class="${ORD==='peso'?'on':''}">2 · Ferramenta mais leve <small>sem preço do kg</small></button></div></div>
  ${best?`<div class="note ${bestC==='leve'?'nl':''}" style="margin-top:10px">${ico('prec')}<span>${ORD==='peso'?`Ferramenta mais leve: <b>${esc(FN(best.f))} · ${esc(best.c)}</b> · ${n3(best.p)} kg/m (barra ${n3(best.p*6)} kg)${vb(best)!=null?' · '+rs(vb(best))+' a barra':''}. Se esse fornecedor tiver um bom preço por kg, ele tende a ganhar este item.`:bestP?`Melhor preço da barra: <b>${esc(FN(best.f))} · ${esc(best.c)}</b> · ${rs(vb(best))} (${n3(best.p*6)} kg × ${rs(pr[best.f+'|'+norm(best.c)].rk)}/kg).${semP?` ${semP} ${semP===1?'fornecedor está':'fornecedores estão'} sem preço e ${semP===1?'fica':'ficam'} no fim da lista.`:''}`:`Nenhum preço lançado para este perfil, então a referência é a ferramenta mais leve: <b>${esc(FN(best.f))} · ${esc(best.c)}</b> · barra ${n3(best.p*6)} kg. Se esse fornecedor tiver um bom preço por kg, ele tende a ganhar este item.`}</span></div>`:''}
  <div class="grid" style="margin-top:14px">${g.m.slice().sort((a,b)=>(a.f===S.ext?-1:b.f===S.ext?1:0)||(a.f==='alcoa')-(b.f==='alcoa')||(ORD==='peso'?a.p-b.p:(((vb(a)??1e9)-(vb(b)??1e9))||a.p-b.p))).map(m=>{
    const d=base?((m.p-base)/base*100):0,cls=Math.abs(d)<1?'eq':d>0?'up':'dn',p=pr[m.f+'|'+norm(m.c)];
    return `<article class="pc ${m.f===S.ext?'me':''} ${m===best?bestC:''} ${m===leve&&m!==best?'leve2':''}">${img(m)}<div class="bd">${m===best?`<span class="ref" style="color:${bestC==='best'?'var(--A)':'var(--B)'}">${bestT}</span>`:''}${m===leve&&m!==best?'<span class="ref" style="color:var(--B)">Ferramenta mais leve</span>':''}${m.f==='alcoa'?'<span class="ref">Referência de mercado</span>':''}<span class="f">${esc(FN(m.f))}${m.f===S.ext?' · sua':''}</span><span class="c">${esc(m.c)}</span><span class="w num">${n3(m.p)} kg/m · barra ${n3(m.p*6)} kg</span>${m.f!==S.ext&&m.f!=='alcoa'?`<span class="dif ${cls} num">${cls==='eq'?'mesmo peso':(d>0?'+':'')+n2(d)+'% peso'}</span>`:''}${m.f!=='alcoa'?`<div class="price">${p?`<b class="num">${rs(p.rk*m.p*6)}</b> barra · ${rs(p.rk)}/kg<br>lançado ${esc(p.d)} <button type="button" class="lk" data-lanca="${m.f}">editar</button>`:`Sem preço lançado <button type="button" class="lk" data-lanca="${m.f}">lançar</button>`}</div>`:''}</div></article>`}).join('')}</div></section>`;
