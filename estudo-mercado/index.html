<style>
/* Layout: abertura com cards por extrusora → plataforma com barra lateral de abas, conteúdo em grade de cards de perfil com o desenho do catálogo em destaque */
:root{
  --tl:#0f6b70;--tl2:#0b5357;--tlc:#e3f1f1;--am:#f2a51e;--amc:#fff3da;
  --ink:#13232e;--tm:#5a6b75;--ln:#dbe4e7;--bg:#eef3f4;--card:#ffffff;--paper:#ffffff;

  --f-d:'Barlow Condensed',system-ui,sans-serif;--f-b:'Barlow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --tl:#3fb3b8;--tl2:#5cc7cb;--tlc:#12383a;--am:#f5b443;--amc:#3a2c10;--ink:#e6eef0;--tm:#9aaeb6;--ln:#2a3a41;--bg:#0f1a1e;--card:#16252b;--paper:#f7fafa;
  --A:#4ade80;--Ac:#123422;--B:#fbbf24;--Bc:#3a2a0e;--C:#a3b3bf;--Cc:#22313a;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{
  --tl:#3fb3b8;--tl2:#5cc7cb;--tlc:#12383a;--am:#f5b443;--amc:#3a2c10;--ink:#e6eef0;--tm:#9aaeb6;--ln:#2a3a41;--bg:#0f1a1e;--card:#16252b;--paper:#f7fafa;
  --A:#4ade80;--Ac:#123422;--B:#fbbf24;--Bc:#3a2a0e;--C:#a3b3bf;--Cc:#22313a;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-b);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1440px;margin:0 auto}
h1,h2,h3{font-family:var(--f-d);font-weight:700;letter-spacing:.2px;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.eyebrow{font:600 12px var(--f-b);letter-spacing:1.6px;text-transform:uppercase;color:var(--tm)}
.num{font-variant-numeric:tabular-nums}
/* abertura */
.hub-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hub-top h1{font-size:clamp(30px,5vw,44px);line-height:1}
.hub-top p{margin:6px 0 0;color:var(--tm);max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.ecard{position:relative;text-align:left;border:1px solid var(--ln);background:var(--card);border-radius:18px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.ecard:hover{transform:translateY(-2px);border-color:var(--tl)}
.ecard .band{background:var(--tl);color:#fff;padding:18px 20px 16px}
.ecard .band small{font:600 11px var(--f-b);letter-spacing:1.6px;opacity:.85}
.ecard .band b{display:block;font:700 30px/1 var(--f-d);margin-top:4px}
.ecard .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px 4px}
.ecard .thumbs div{background:var(--paper);border:1px solid var(--ln);border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden}
.ecard .thumbs img{max-width:90%;max-height:90%;object-fit:contain}
.ecard .meta{padding:10px 18px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--tm);font-size:13px}

.lic b{color:var(--ink);font:700 22px var(--f-d)}
/* plataforma */
.top{background:var(--tl);color:#fff;border-radius:18px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

.ghost{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.ghost:hover{background:rgba(255,255,255,.12)}
.seg{display:inline-flex;background:rgba(0,0,0,.18);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:5px 12px;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:#fff;color:var(--tl2)}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.nav{position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px}

.btn{border:0;background:var(--tl);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700}

.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:center}

.draw .cap{position:absolute;left:8px;bottom:5px;right:30px;font:600 11px var(--f-b);color:#5a6b75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}

:root[data-theme="dark"] .abc i{color:#0f1a1e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .abc i{color:#0f1a1e}}
.mine{display:inline-block;background:var(--amc);color:var(--B);font:700 11px var(--f-b);letter-spacing:1px;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pc{border:1px solid var(--ln);border-radius:14px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.note.nl{background:var(--Bc);color:var(--B)}
.ordbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.seg2{display:inline-flex;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}

.pl{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.plm{min-width:0;display:flex;flex-direction:column;gap:16px}
.pls{position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto;border-radius:16px}
.box.side{padding:16px}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pfull .rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pfull .fl{max-width:360px}

.prow{border:1px solid var(--ln);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--card)}

.pr2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;align-items:stretch}
.pr2 .inp input{font-size:16px;padding:7px 8px}.pr2 .inp i{padding:0 7px;font-size:12px}
.pr3 small{color:var(--tm);font-size:12px}
.prow .err{min-height:0;margin:0}.prow .err:empty{display:none}
.plm .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.sel{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:8px 10px;font:600 14px var(--f-b);color:var(--ink)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border:0;background:var(--tl);color:#fff;font:700 15px var(--f-b);padding:11px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.cwrap{display:flex;flex-direction:column;gap:8px;min-width:0}

.cfgc{display:flex;flex-wrap:wrap;gap:6px}
.ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:999px;padding:4px 10px;font:600 13px var(--f-b);color:var(--tm);cursor:pointer}
.ck.on{border-color:var(--tl);color:var(--tl2);background:var(--tlc)}.ck.fix{cursor:default;opacity:.8}
.cfgf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cfgm{font-size:12.5px;color:var(--tm)}.cfgm.err{color:var(--bad)}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.fcard{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px}
.fcard.me{border-color:var(--am);box-shadow:0 0 0 1px var(--am) inset}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px}.fh h3{font-size:26px;line-height:1}
.st{font:700 12px var(--f-b);border-radius:999px;padding:3px 9px;white-space:nowrap}.st.A{background:var(--Ac);color:var(--A)}.st.B{background:var(--Bc);color:var(--B)}.st.N{background:var(--bg);color:var(--tm)}
.fl{display:flex;flex-direction:column;gap:4px;font:600 13px var(--f-b);color:var(--tm)}

.inp input{flex:1;min-width:0;border:0;background:transparent;padding:10px;font:600 18px var(--f-b);color:var(--ink);outline:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.fl{min-width:0}.inp input{width:100%}
.ff{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--ln);padding-top:10px}.ff small{color:var(--tm)}

.pc.best{border-color:var(--A);box-shadow:0 0 0 1px var(--A) inset}.pc.best .bd{background:var(--Ac)}

.pc .f{font:700 12px var(--f-b);letter-spacing:1.2px;text-transform:uppercase;color:var(--tm)}
.pc .c{font:700 22px/1 var(--f-d)}
.pc .w{font-size:13px;color:var(--tm)}
.dif{font:700 12px var(--f-b);border-radius:6px;padding:1px 6px;align-self:flex-start}

.price{margin-top:4px;border-top:1px dashed var(--ln);padding-top:6px;font-size:13px;color:var(--tm)}

.ref{font:600 11px var(--f-b);color:var(--tl);letter-spacing:1px;text-transform:uppercase}

td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:middle}

.tw{overflow-x:auto}

function unirIguais(){const pai=G.map((_,i)=>i),raiz=i=>{while(pai[i]!==i){pai[i]=pai[pai[i]];i=pai[i]}return i};

function stPreco(p){if(!p)return ['N','sem preço'];const d=dias(p.d);return d>60?['B','há '+d+' dias']:['A','em dia']}

function dias(d){const [dd,mm]=String(d).split(' ')[0].split('/').map(Number);if(!dd||!mm)return 0;const n=new Date();let y=n.getFullYear();let dt=new Date(y,mm-1,dd);if(dt>n)dt=new Date(y-1,mm-1,dd);return Math.round((n-dt)/864e5)}

function rkSt(){const d={modo:'preco',f:null,lin:null,q:'',lim:40};const s=ls.get('fcext_rk_'+S.ext,null)||{};S.rk=S.rk||{...d,...s,q:'',lim:40};S.rk.modo=S.tab==='rankp'?'peso':'preco';return S.rk}

function rkCalc(){const r=rkSt(),F=precoForn(S.pcli),sel=r.lin?new Set(r.lin):null;
  const vb=m=>F[m.f]?F[m.f].rk*m.p*6:null;
  const out=[],sem=[];let semP=0,tot=0,exc=0;
  const vu={};G.forEach(g=>{if(sel&&!sel.has(g.l))return;if(vu[g.u])return;vu[g.u]=1;
    const fo=g.m.filter(m=>m.f!=='alcoa');if(!fo.length)return;const excl=new Set(fo.map(m=>m.f)).size<2;if(excl)exc++;tot++;
    const val=r.modo==='peso'?(m=>m.p):vb;
    const cand=fo.filter(m=>val(m)!=null);
    if(!cand.length){semP++;const lv=fo.slice().sort((a,b)=>(a.p||1e9)-(b.p||1e9))[0];sem.push({g,w:lv,seg:null,emp:false,mine:fo.find(m=>m.f===S.ext)||null,vw:null,vs:null,vm:null,np:0,nf:new Set(fo.map(m=>m.f)).size,F,excl,semp:true});return}
    cand.sort((a,b)=>(val(a)-val(b))||((a.f===S.ext)?-1:(b.f===S.ext)?1:0)||(a.p-b.p));
    const w=cand[0],seg=cand.find(m=>m.f!==w.f)||null,emp=seg&&Math.abs(val(seg)-val(w))<1e-9;
    const mine=fo.filter(m=>m.f===S.ext).sort((a,b)=>(val(a)??1e9)-(val(b)??1e9))[0]||null;
    out.push({g,w,seg,emp,mine,vw:val(w),vs:seg?val(seg):null,vm:mine?val(mine):null,np:new Set(cand.map(m=>m.f)).size,nf:new Set(fo.map(m=>m.f)).size,F,excl});
  });
  return {out,sem,semP,tot,exc,vb}}
function tRank(){const r=rkSt(),L=rkLinhas(),sel=r.lin?new Set(r.lin):null,PESO=r.modo==='peso';

  const cl=DIST()?[]:db.clientes().filter(c=>S.role==='gest'||c.vend===USERS[S.role].n);
  if(S.pcli&&!cl.some(c=>c.id===S.pcli))S.pcli=null;

  const row=x=>{const w=x.w,p=x.F[w.f];

      ${dif(x)}${meu(x)}<span class="rkn">${x.excl?'1 fornecedor no cadastro':PESO?x.nf+' fornecedores comparados':x.np+' de '+x.nf+' fornecedores com preço'} · ver ${x.excl?'o desenho':'todos os desenhos'} →</span></div></article>`};
  const csvBtn=lst.length&&r.f!=='__sem'?`<button type="button" class="btn sm line" id="rkcsv">Baixar lista (Excel/CSV)</button>`:'';
  return `<section class="box"><h2>${PESO?'Melhor peso':'Melhor preço'}</h2><p class="sub">${PESO?'Quem tem a ferramenta mais leve em cada perfil. Compara só o kg/m, sem considerar valor; funciona mesmo sem preço lançado.':'Quem ganha no preço em cada perfil: menor valor da barra de 6 m (R$/kg do natural × peso).'}</p>

  </section>

    <div class="rkf" role="tablist" aria-label="Fornecedor">${FL.map(f=>`<button role="tab" aria-selected="${f===r.f}" data-rkf="${f}" class="${f===r.f?'on':''} ${f===S.ext?'me':''}"><b>${esc(FN(f))}</b><span class="num">${cnt[f]||0}</span><small>${(cnt[f]||0)===1?'item':'itens'}</small></button>`).join('')}${!PESO&&sem.length?`<button role="tab" aria-selected="${r.f==='__sem'}" data-rkf="__sem" class="${r.f==='__sem'?'on':''} semp"><b>Sem preço</b><span class="num">${sem.length}</span><small>${sem.length===1?'item':'itens'}</small></button>`:''}</div>

function ligaRank(){const r=rkSt();const re=()=>{const y=window.scrollY;draw();window.scrollTo(0,y)};

  const mm=$('#rkmais');if(mm)mm.onclick=()=>{r.lim+=40;re()};
  const cs=$('#rkcli');if(cs)cs.onchange=()=>{S.pcli=+cs.value||null;re()};
  const gp=$('[data-goprec2]');if(gp)gp.onclick=()=>irForn();
  document.querySelectorAll('[data-rkg]').forEach(a=>a.onclick=()=>{const g=BY[norm(a.dataset.rkg)];if(!g)return;S.g=g;S.q=g.k;S.ord=r.modo==='peso'?'peso':'preco';ls.set('fcext_ord',S.ord);S.tab='pesq';logar('Abriu pelo ranking',g.k);draw();window.scrollTo(0,0)});

   ${T.length?`<section class="box"><h2>Mais pesquisados</h2><div class="abcgrid" style="margin-top:12px">${T.map(([k,n])=>{const g=BY[norm(k)];const m=g&&(own(g)[0]||ref(g));return `<article class="pc">${g?foto(g,m,'g'):img(null)}<div class="bd"><span class="c">${esc(m?m.c:k)}</span><span class="w">${n} ${n===1?'vez':'vezes'}</span></div></article>`}).join('')}</div></section>`:''}
   <section class="box"><div class="tw"><table><thead><tr><th>Desenho</th><th>Usuário</th><th>Quando</th><th>Ação</th><th>Perfil</th></tr></thead><tbody>${L.map(r=>{const g=r.gk&&BY[norm(r.gk)];const m=g&&(own(g)[0]||ref(g));return `<tr><td>${g?foto(g,m,'mini'):''}</td><td><b>${esc(r.u)}</b></td><td>${esc(r.d)}</td><td>${esc(r.a)}</td><td>${esc(m?m.c:r.gk||'—')}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Nada registrado ainda.</td></tr>'}</tbody></table></div></section>`;

/* Tutorial */
function passos(){const E=EXTS[S.ext].n;const v=[
  ['pesq','Pesquise qualquer código','Digite o código de qualquer fornecedor, o código de mercado (Alcoa)'+(DIST()?'':' ou o código '+E)+'. A plataforma encontra o perfil e todos os equivalentes.',['Ex.: SU-001, EX-0747, FASU-0001','Acabamento sempre natural']],
  ['pesq','Compare os desenhos','Cada fornecedor aparece com o desenho do próprio catálogo, o peso por metro e o peso da barra de 6 m. O selo verde mostra o melhor preço da barra (R$/kg × peso) e o laranja, a ferramenta mais leve',[DIST()?'O card verde é o menor preço lançado; sem preço, o de menor peso':'Borda amarela = perfil da '+E+'; borda verde = menor preço (ou menor peso, se não houver preço)','A Alcoa aparece só como referência de mercado']],
  ['forn','Lance os preços dos fornecedores','Em Preço de fornecedor, cada fornecedor tem um card: digite o R$/kg do natural, o pedido mínimo e clique em Salvar. O botão lançar em cada desenho da Pesquisa leva direto ao card do fornecedor.'+(DIST()?'':' Escolha um cliente no topo para lançar o preço daquele cliente.'),['O valor da barra de 6 m de cada perfil é calculado automaticamente','Só a sua empresa vê esses preços']],
  ['rank','Veja o que cada fornecedor ganha','Em Melhor preço aparece o que cada fornecedor ganha pelo valor da barra; em Melhor peso, quem tem a ferramenta mais leve, sem considerar valor. Marque as linhas e clique no fornecedor para ver a lista com o desenho.',['Clique em um perfil para abrir todos os equivalentes','Baixe a lista em CSV para abrir no Excel']],
  ...(DIST()?[]:[['cli','Monte a carteira de clientes especiais','Cadastre os clientes VIP e acompanhe o preço da concorrência em cada um.',['Estrela = cliente VIP','Preço com mais de 60 dias aparece em destaque']]]),
  ['abc','Use a Curva ABC para priorizar',DIST()?'A classe mostra o giro de cada perfil. Priorize compra e estoque dos perfis da classe A.':'A classe mostra o giro de cada perfil na compra de uma distribuidora. Ofereça primeiro os perfis da classe A.',[]],
  ['rel',S.role==='gest'?'Acompanhe a equipe':'Consulte o seu histórico',S.role==='gest'?'No Relatório por usuário, veja o que cada pessoa pesquisou e lançou.':'Em Meu histórico ficam todas as suas pesquisas e lançamentos.',[]]];
  if(S.role==='gest')v.push(['aces','Gerencie acessos e contrato','Em Acessos e licença você controla os até '+NAC()+' acessos. Em Contrato fica o contrato da plataforma após a contratação.',[]]);
  return v}
function tutorial(){const P=passos(),i=Math.min(S.tut,P.length-1),p=P[i];
  return `<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Como usar a plataforma"><div class="tut"><div class="hd"><div class="logo"><img src="${LOGO}" alt=""></div><div><small>Como usar · ${S.role==='gest'?'Painel gestor':'Painel vendedor'}</small><b>FC &amp; ${esc(EXTS[S.ext].n)}</b></div></div>

function novaPesq(){window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{const q=$('#q');if(q){q.focus({preventScroll:true});q.select()}},400)}
function fabUpd(){const f=$('#fab');if(!f)return;f.hidden=!(S.ext&&!S.cover&&S.tab==='pesq'&&S.tut==null&&window.scrollY>500)}
window.addEventListener('scroll',fabUpd,{passive:true});
function ligar(){
  if(S.tab==='rank'||S.tab==='rankp')ligaRank();
  if(S.tab==='revd')ligaRevd();
  if(S.tab==='eqs')ligaEqs();
  if(S.tab==='txf')ligaTxf();
  const fb=$('#fab');if(fb){fb.onclick=novaPesq;fabUpd()}
  const tb=$('[data-tutorial]');if(tb)tb.onclick=()=>{S.tut=0;draw()};
  if($('#ov')){const P=passos();$('#tsair').onclick=()=>{S.tut=null;draw()};const tv=$('#tvolta');if(tv)tv.onclick=()=>{S.tut--;draw()};
    $('#tnext').onclick=()=>{if(S.tut>=P.length-1){S.tut=null;draw();return}S.tut++;S.tab=P[S.tut][0];draw()};
    $('#ov').onclick=e=>{if(e.target.id==='ov'){S.tut=null;draw()}};}
  const fq=$('#fq');if(fq)fq.onsubmit=e=>{e.preventDefault();buscar($('#q').value)};
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>buscar(b.dataset.q));
  document.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{S.ord=b.dataset.ord;ls.set('fcext_ord',S.ord);const y=window.scrollY;draw();window.scrollTo(0,y)});
  const gp=$('[data-goprec]');if(gp)gp.onclick=()=>irForn();
  document.querySelectorAll('[data-lanca]').forEach(b=>b.onclick=()=>irForn(b.dataset.lanca));
  const fq2=$('#fq2');if(fq2)fq2.onsubmit=e=>{e.preventDefault();const v2=norm($('#q2').value),g=BY[v2]||FAM[fam('alcoa',v2)]||FAM[fam('texa',v2)];if(g){S.g=g;logar('Pesquisou',g.k);draw()}else toast('Código não encontrado')};
  document.querySelectorAll('form[data-forn]').forEach(fm=>{fm.oninput=()=>fm.querySelector('.err').textContent='';fm.onsubmit=e=>{e.preventDefault();const f=fm.dataset.forn,rk=pn(fm.rk.value);if(!rk){const P0=db.precos();P0.push({id:Date.now(),f,rk:null,mp:pn(fm.mp.value)||'',cli:S.pcli||null,d:hoje(),u:USERS[S.role].n});db.save('precos',P0);logar('Sem preço da '+FN(f),'');toast(FN(f)+' salvo sem preço (R$ 0)');const y0=window.scrollY;draw();window.scrollTo(0,y0);return}
    const P=db.precos();P.push({id:Date.now(),f,rk,mp:pn(fm.mp.value)||'',cli:S.pcli||null,d:hoje(),u:USERS[S.role].n});db.save('precos',P);logar('Lançou preço '+FN(f),'');reg('preco',f);toast('Preço da '+FN(f)+' salvo');const y=window.scrollY;draw();window.scrollTo(0,y)}});
  const ps=$('#pcliSel');if(ps)ps.onchange=()=>{S.pcli=+ps.value||null;const y=window.scrollY;draw();window.scrollTo(0,y)};
  document.querySelectorAll('[data-gopcli]').forEach(b=>b.onclick=()=>{S.pcli=+b.dataset.gopcli;irForn()});
  document.querySelectorAll('[data-cli]').forEach(b=>b.onclick=()=>{S.cliSel=+b.dataset.cli||null;draw()});
  const fc=$('#fc');if(fc){$('#cn').oninput=()=>$('#cerr').textContent='';fc.onsubmit=e=>{e.preventDefault();const n=$('#cn').value.trim();if(!n){$('#cerr').textContent='Digite a razão social do cliente.';return}const C=db.clientes();C.push({id:Date.now(),nome:n,cid:$('#cc').value.trim(),vend:USERS[S.role].n,vip:!!$('#cv').value});db.save('clientes',C);toast('Cliente cadastrado');draw()}}
  document.querySelectorAll('[data-abcl]').forEach(b=>b.onclick=()=>{S.abcL=b.dataset.abcl;draw()});
  document.querySelectorAll('[data-relu]').forEach(b=>b.onclick=()=>{S.relU=b.dataset.relu;draw()});
}

Promise.all([fetch(EQ+'indice.json?v=12',{cache:'no-cache'}).then(r=>r.json()),carregaCfg(),fetch('aprovadas.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[])]).then(([idx,,apr])=>{(apr||[]).forEach(a=>{const g=idx.g.find(x=>x.l===a.l&&x.k===a.k);if(g&&!g.m.some(m=>m[0]===a.m[0]&&norm(m[1])===norm(a.m[1])))g.m.push(a.m)});montar(idx);const e=QP.get('e');if(e&&EXTS[e]){setExt(e);setTimeout(sincDados,600);S.g=BY[norm('SU-001')];S.cover=true;try{if(ls.get('fcext_reg_'+e,null)&&!sessionStorage.getItem('fcext_ses_'+e)){sessionStorage.setItem('fcext_ses_'+e,'1');reg('acesso')}}catch(_){}}else if(!FCM){$('#app').innerHTML=`<section class="cover"><div class="in"><div class="lg"><img src="${LOGO}" alt="FC Consultoria em Esquadria"></div><div class="rule"></div><h1>Link de demonstrativo incompleto</h1><p>Use o link enviado pela FC Consultoria para a sua empresa.</p><p style="font-size:14px">WhatsApp (66) 9 9986-7984</p></div></section>`;return}draw();if(S.ext&&!FCM&&ls.get('fcext_lib_'+S.ext,0)){rpc('em_status',{p_ext:S.ext,p_dev:devId()}).then(st=>{if(st==='bloqueado'){ls.set('fcext_bloq_'+S.ext,1);draw()}}).catch(()=>{})}}).catch(()=>{$('#app').innerHTML='<p class="empty">Não foi possível carregar o banco de perfis. Atualize a página.</p>'});
