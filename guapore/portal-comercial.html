<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}.thn{display:block;font-size:10px;font-weight:500;line-height:1.2;white-space:normal;min-width:64px;max-width:84px;margin:2px auto 0;text-transform:none;letter-spacing:0}
</style>
<title>Portal Comercial Guaporé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra de perfil fixa no topo; cada perfil (Gestor / Vendedor / Cliente) é uma tela própria em grade de cartões; tutorial guiado sobreposto com legenda e voz */
:root{
  --bg:#eef3f3; --surface:#ffffff; --surface-2:#f5f8f8; --line:#d6e1e0;
  --fg:#11292b; --muted:#5b7174; --brand:#0d6e66; --brand-ink:#ffffff; --brand-soft:#d9efec;
  --amber:#c27a12; --amber-soft:#fbefd9; --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#b5490f; --warn-soft:#fbe4d6;
  --shade:rgba(8,28,30,.62);
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1718; --surface:#132324; --surface-2:#182b2c; --line:#27403f;
  --fg:#e3eeed; --muted:#93abab; --brand:#2fb3a5; --brand-ink:#04211e; --brand-soft:#173a37;
  --amber:#e5a443; --amber-soft:#3a2c14; --ok:#4cc480; --ok-soft:#173523; --warn:#f08a52; --warn-soft:#3d2418; --shade:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1718; --surface:#132324; --surface-2:#182b2c; --line:#27403f;
  --fg:#e3eeed; --muted:#93abab; --brand:#2fb3a5; --brand-ink:#04211e; --brand-soft:#173a37;
  --amber:#e5a443; --amber-soft:#3a2c14; --ok:#4cc480; --ok-soft:#173523; --warn:#f08a52; --warn-soft:#3d2418; --shade:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:15px;display:block}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.bell{position:relative}
.bell .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-mono)}
main{padding-block:22px 40px}
.demo-note{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:14px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
.mods{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mod{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px;color:var(--fg)}
.mod:hover{border-color:var(--brand);transform:translateY(-1px)}
.mod .ic{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.mod h3{font-size:15px}
.mod p{margin:0;color:var(--muted);font-size:12.5px}
.mod.locked{opacity:.55}
.mod .tag{position:absolute;top:12px;right:12px;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.mod .tag.new{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-size:16px;display:flex;align-items:center;gap:8px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi b{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--warn);background:var(--warn-soft)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);flex-wrap:wrap}
.row .who{flex:1;min-width:160px}
.row .who b{display:block;font-size:13.5px}
.row .who span{color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.novo{background:var(--warn-soft);color:var(--warn)}
.pill.and{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.br{background:var(--brand-soft);color:var(--brand)}
.hidden-id{font-family:var(--f-mono);letter-spacing:2px;color:var(--muted)}
.meter{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
.meter .bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line);display:flex}
.meter .bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c .b{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.chart .c small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.days{display:flex;gap:10px}
.days span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.c,th.c{text-align:center}
.sw{position:relative;width:38px;height:22px;border-radius:12px;background:var(--line);border:0;padding:0;vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{left:19px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);text-align:left;color:var(--fg)}
.slot b{display:block;font-family:var(--f-mono);font-size:13px}
.slot span{font-size:12px;color:var(--muted)}
.slot.mine{border-color:var(--brand);background:var(--brand-soft)}
.slot.full{opacity:.5}
.prods{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.prod{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.prod canvas{width:100%;height:140px;display:block;background:var(--surface-2)}
.prod .in{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h3{font-size:14px}
.prod p{margin:0;font-size:12px;color:var(--muted)}
.vend{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vend button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;text-align:left;color:var(--fg)}
.vend button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.cart{position:sticky;top:76px}
.cartline{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.msg{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word}
.modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:86vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;max-width:90vw}
.tour-hole{position:fixed;z-index:70;border-radius:12px;box-shadow:0 0 0 9999px var(--shade);border:2px solid var(--amber);pointer-events:none;transition:all .35s}
.tour-cap{position:fixed;z-index:71;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100vw - 32px));background:var(--surface);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.tour-cap .step{font-family:var(--f-mono);font-size:11px;color:var(--amber)}
.tour-cap p{margin:4px 0 10px;font-size:14.5px}
.tour-cap .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.banner{border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.banner b{font-family:var(--f-display);font-size:20px;line-height:1.25}
.banner span{opacity:.9;font-size:13px}
.prevbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.prevbox .banner{padding:14px}.prevbox .banner b{font-size:16px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.chip em{font-style:normal;color:var(--amber);font-weight:600}
.prod.dest{border-color:var(--brand)}
.ptag{position:absolute;top:10px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.ptag.d{left:10px;background:var(--brand);color:var(--brand-ink)}
.ptag.p{right:10px;background:var(--amber);color:#fff}
.postcv{border-radius:12px;max-width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px}
.cald{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:130px}
.cald>b{font-size:11px;text-transform:capitalize;color:var(--muted)}
.cald .none{color:var(--muted);font-size:12px}
.post{border:0;border-left:3px solid var(--line);background:var(--surface);color:var(--fg);text-align:left;font-size:12px;padding:6px 7px;border-radius:6px;line-height:1.3}
.post span{display:block;font-size:10px;color:var(--muted)}
.post.rascunho{border-left-color:var(--warn)}.post.agendado{border-left-color:var(--amber)}.post.publicado{border-left-color:var(--ok);opacity:.7}
.funnel{display:flex;flex-direction:column;gap:3px}
.funnel i{display:block;height:6px;border-radius:3px;background:var(--line)}
.funnel i:nth-child(2){background:var(--brand)}.funnel i:nth-child(3){background:var(--amber)}
.chatg{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;min-height:300px}
.clist{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.cbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:8px 10px;text-align:left}
.cbtn b{display:block;font-size:13px}.cbtn span{font-size:11.5px;color:var(--muted)}
.cbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.cbox{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.cmsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:300px;background:var(--surface-2)}
.msgb{align-self:flex-start;max-width:80%;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:7px 10px;font-size:13px}
.msgb.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand);border-radius:12px 12px 4px 12px}
.msgb small{display:block;font-size:10px;opacity:.7;margin-top:2px;font-family:var(--f-mono)}
.csend{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:640px){.chatg{grid-template-columns:1fr}.clist{flex-direction:row;overflow-x:auto}.cbtn{min-width:150px}}
.d3row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.d3slot{position:relative;border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:150px;background:var(--surface-2)}
.d3slot.on{border:1.5px solid var(--amber);background:var(--surface)}
.d3slot b{font-family:var(--f-mono);font-size:16px}
.d3slot span{font-size:12.5px}
.d3slot small{font-size:11.5px;color:var(--muted)}
.d3slot .btn{margin-top:auto;align-self:flex-start}
.d3n{position:absolute;top:10px;right:12px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.d3cube{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--amber),var(--amber-soft));animation:d3spin 5s linear infinite;margin-bottom:4px}
@keyframes d3spin{to{transform:rotate(360deg)}}
@media (max-width:640px){.d3row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.d3cube{animation:none}}
:root[data-accent="azul"]{--brand:#1d5fa8;--brand-soft:#dce8f6;--brand-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="azul"]{--brand:#6aa6e8;--brand-soft:#16304d;--brand-ink:#061526}}
:root[data-theme="dark"][data-accent="azul"]{--brand:#6aa6e8;--brand-soft:#16304d;--brand-ink:#061526}
:root[data-accent="grafite"]{--brand:#3a4654;--brand-soft:#e2e6ea;--brand-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="grafite"]{--brand:#a9b4c0;--brand-soft:#232c35;--brand-ink:#0d1217}}
:root[data-theme="dark"][data-accent="grafite"]{--brand:#a9b4c0;--brand-soft:#232c35;--brand-ink:#0d1217}
:root[data-accent="vinho"]{--brand:#8a2c3b;--brand-soft:#f4dfe2;--brand-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="vinho"]{--brand:#e4899a;--brand-soft:#3d1a21;--brand-ink:#1f070c}}
:root[data-theme="dark"][data-accent="vinho"]{--brand:#e4899a;--brand-soft:#3d1a21;--brand-ink:#1f070c}
:root[data-accent="laranja"]{--brand:#b8560f;--brand-soft:#fbe6d4;--brand-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-accent="laranja"]{--brand:#f0a05e;--brand-soft:#3d2513;--brand-ink:#1f0f03}}
:root[data-theme="dark"][data-accent="laranja"]{--brand:#f0a05e;--brand-soft:#3d2513;--brand-ink:#1f0f03}
.temaop{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.temaop button{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.temaop button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.temaop i{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid var(--line)}
.foot{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
@media (max-width:720px){.cart{position:static}.meter{grid-template-columns:80px 1fr 32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><div class="mark">G</div><div><b>Guaporé Vidros</b><span>Portal Comercial</span></div></div>
    <div class="seg" role="group" aria-label="Perfil" id="roleSeg">
      <button data-role="gestor" aria-pressed="true">Gestor</button>
      <button data-role="vendedor" aria-pressed="false">Vendedor</button>
      <button data-role="compras" aria-pressed="false">Compras</button>
      <button data-role="marketing" aria-pressed="false">Marketing</button>
    </div>
    <button class="btn bell" id="bellBtn" title="Avisos de cadastro">🔔 Avisos<span class="dot" id="bellDot" hidden>0</span></button>
    <div class="seg" role="group" aria-label="Fundo da tela" id="modoSeg"><button data-modo="light" aria-pressed="true">☀️ Claro</button><button data-modo="dark" aria-pressed="false">🌙 Escuro</button></div>
    <button class="btn" id="corBtn" title="Mudar a cor principal">🎨 Cor</button>
    <button class="btn primary" id="tourBtn">▶ Tutorial</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<!-- CAPA DE APRESENTAÇÃO (remover depois: apagar deste comentário até FIM CAPA) -->
<div id="capa" role="dialog" aria-label="Abertura">
 <div class="capa-in">
  <div class="capa-g">G</div>
  <h1>Guaporé Vidros</h1>
  <p class="capa-t">Plataforma Comercial · Catálogo 3D</p>
  <p class="capa-s">Vendas · Compras · Estoque · Central do Gestor · Marketing</p>
  <button class="capa-btn" id="capaBtn">Entrar ▶</button>
  <div class="capa-foot"><img src="../midia/logo-fc.png" alt="FC Consultoria" class="capa-fc" onerror="this.remove()"><span>Desenvolvido por FC Consultoria em Esquadria</span></div>
 </div>
</div>
<style>
#capa{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 20%,#2a7fd4 0%,#123f7a 45%,#06172e 100%);color:#fff;transition:opacity .6s}
#capa.sai{opacity:0;pointer-events:none}
.capa-in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:640px}
.capa-g{width:110px;height:110px;border-radius:28px;background:#fff;color:#1d5fa8;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:64px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:capaIn .9s ease both}
#capa h1{font-size:clamp(34px,7vw,64px);color:#fff;animation:capaIn .9s .15s ease both}
.capa-t{margin:0;font-family:var(--f-display);font-size:clamp(16px,2.6vw,22px);color:#f2c27a;animation:capaIn .9s .3s ease both}
.capa-s{margin:0;opacity:.8;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px;animation:capaIn .9s .45s ease both}
.capa-btn{margin-top:22px;border:0;background:#f2b75a;color:#06172e;font-family:var(--f-display);font-weight:700;font-size:18px;padding:14px 34px;border-radius:14px;animation:capaIn .9s .6s ease both}
.capa-btn:hover{background:#ffd08a}
.capa-foot{margin-top:36px;display:flex;align-items:center;gap:10px;opacity:.85;font-size:12.5px;animation:capaIn .9s .75s ease both}
.capa-fc{height:38px;width:auto;background:#fff;border-radius:8px;padding:4px 8px}
@keyframes capaIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#capa *{animation:none!important}}

function cmdTabela(s){
 const [papel,nome,,base]=s;const L=pessoas(papel);

 </tbody></table></div>`:`<div class="empty">Ninguém no setor ${esc(nome)} ainda. Use "+ Cadastrar pessoa".</div>`}`;

async function carregaProds(){
 if(PRODS)return PRODS;
 try{
  const t=await (await fetch('/catalogo/index.html',{cache:'no-cache'})).text();
  const i=t.indexOf('const LN=');let LN=JSON.parse(t.slice(i+9,t.indexOf('\n',i)).trim().replace(/;$/,''));
  if(!window.LN_GUA)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='/catalogo/linhas-guapore.js?v='+Date.now();s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  if(window.LN_GUA)window.LN_GUA(LN);
  const lib=D.linhas||[],oc=new Set(D.ocultos||[]);
  PRODS=[];LN.filter(l=>!lib.length||lib.includes(l.id)).forEach(l=>{const gn=Object.fromEntries((l.g||[]).map(g=>[g[0],g[1]]));(l.p||[]).forEach(q=>{if(q.ac||oc.has(q.c))return;PRODS.push({c:q.c,n:q.n,l:l.n,g:gn[q.g]||'',kg:q.p||''})})});
 }catch(e){PRODS=[]}
 return PRODS;
}

  <div class="kpi"><small>Perfil mais visto</small><b style="font-size:20px">${rank[0]?esc(rank[0].p.c):'—'}</b><em> ${rank[0]?rank[0].v+' visualizações':'sem visitas ainda'}</em></div>

  ${lista.map(p=>`<tr><td><b style="font-family:var(--f-mono)">${esc(p.c)}</b><br><span style="font-size:12px;color:var(--muted);white-space:normal">${esc(p.n)}</span></td><td style="font-size:12px">${esc(p.l)}<br><span style="color:var(--muted)">${esc(p.g)}</span></td><td class="c" style="font-family:var(--f-mono)">${vis[p.c]||0}</td><td class="c"><button class="sw" role="switch" aria-checked="${dest.includes(p.c)}" aria-label="Destaque 3D ${esc(p.c)}" data-act="mdest" data-id="${esc(p.c)}"></button></td></tr>`).join('')}

  <div class="legend"><span><i style="background:var(--amber)"></i>Em destaque</span><span><i style="background:var(--brand)"></i>Demais perfis</span></div></section>`;

let tour=null;
function speak(txt,cb){
 try{if(!tour||!tour.voz||!window.speechSynthesis){throw 0}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=1.02;
  const L=speechSynthesis.getVoices().filter(v=>/pt(-|_)BR/i.test(v.lang)),FEM=/francisca|maria|luciana|fernanda|thalita|leila|manuela|brenda|elza|giovanna|let[ií]cia|yara|camila|vit[oó]ria|raquel|joana|female|feminina|google portugu[eê]s do brasil/i,MASC=/ant[oô]nio|daniel|felipe|donato|f[aá]bio|j[uú]lio|nicolau|val[eé]rio|humberto|\bmale\b|masculin/i,v=L.find(x=>FEM.test(x.name)&&!MASC.test(x.name))||L.find(x=>!MASC.test(x.name))||L[0];if(v){u.voice=v;if(MASC.test(v.name))u.pitch=1.25;}
  u.onend=cb;u.onerror=()=>{tour&&(tour.timer=setTimeout(cb,6500))};speechSynthesis.speak(u);
 }catch(e){if(tour&&tour.auto)tour.timer=setTimeout(cb,Math.max(5000,txt.length*55))}
}
function tourStep(){
 const L=$('#layer');clearTimeout(tour.timer);
 const steps=TOURS[tour.role];if(tour.i>=steps.length){endTour();toast('Tutorial concluído.');return}
 const [sel,txt]=steps[tour.i];const el=$(sel);
 if(el){el.scrollIntoView({block:'center',behavior:'smooth'})}
 setTimeout(()=>{
  const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  L.innerHTML=`<div class="tour-hole" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>
  <div class="tour-cap" role="dialog" aria-live="polite"><div class="step">TUTORIAL ${tour.role.toUpperCase()} · ${tour.i+1}/${steps.length}</div><p>${txt}</p>
  <div class="act"><button class="btn sm" id="tVoz">${tour.voz?'🔊 Voz ligada':'🔈 Voz desligada'}</button><button class="btn sm" id="tAuto">${tour.auto?'⏸ Pausar':'⏵ Automático'}</button><span style="flex:1"></span><button class="btn sm" id="tPrev" ${tour.i?'':'disabled'}>Voltar</button><button class="btn sm" id="tEnd">Sair</button><button class="btn sm primary" id="tNext">${tour.i===steps.length-1?'Concluir':'Próximo'}</button></div></div>`;
  $('#tNext').onclick=()=>{tour.i++;tourStep()};
  $('#tPrev').onclick=()=>{tour.i--;tourStep()};
  $('#tEnd').onclick=endTour;
  $('#tVoz').onclick=()=>{tour.voz=!tour.voz;if(!tour.voz)try{speechSynthesis.cancel()}catch(e){};tourStep()};
  $('#tAuto').onclick=()=>{tour.auto=!tour.auto;tourStep()};
  if(tour.voz||tour.auto)speak(txt,()=>{if(tour&&tour.auto){tour.i++;tourStep()}});
 },380);
}
function endTour(){if(tour)clearTimeout(tour.timer);tour=null;try{speechSynthesis.cancel()}catch(e){}closeModal()}
$('#tourBtn').onclick=()=>{
 const NOMES={gestor:['Tutorial do Gestor','comandos, medidores, cadastros e pedidos'],vendas:['Tutorial do Vendedor','ferramentas, pedidos e agenda'],compras:['Tutorial do Compras','ferramentas de compra e agenda'],estoque:['Tutorial do Estoque','ferramentas do estoque e agenda'],marketing:['Tutorial do Marketing','Destaques 3D e perfis mais vistos']};
 const r=TOURS[role]?role:null;
 modal(`<h2>▶ Tutorial guiado</h2><p class="sub">Passo a passo desta tela, com legenda e narração em voz.</p>
 <div class="list">${r?`<button class="row" data-tour="${r}" style="text-align:left;cursor:pointer;color:var(--fg)"><div class="who"><b>${NOMES[r][0]}</b><span>${TOURS[r].length} passos · ${NOMES[r][1]}</span></div><span class="pill br">Começar</span></button>`:'<div class="empty">Sem tutorial para esta tela.</div>'}</div>

const TKEY='guapore-tema-v2';
let tema={modo:'light',cor:'azul'};
try{tema=Object.assign(tema,JSON.parse(localStorage.getItem(TKEY))||{})}catch(e){}
function aplicaTema(){const r=document.documentElement;
 if(tema.modo==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',tema.modo);
 if(tema.cor==='verde')r.removeAttribute('data-accent');else r.setAttribute('data-accent',tema.cor);
 document.querySelectorAll('#modoSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.modo===(tema.modo==='auto'?'light':tema.modo)));
 try{localStorage.setItem(TKEY,JSON.stringify(tema))}catch(e){}}
aplicaTema();
const CORES=[['azul','Azul Guaporé','#1d5fa8'],['verde','Verde','#0d6e66'],['grafite','Grafite','#3a4654'],['vinho','Vinho','#8a2c3b'],['laranja','Laranja','#b8560f']];
function temaModal(){modal(`<h2>🎨 Cores da tela</h2><p class="sub">A escolha fica salva neste aparelho.</p>
 <h3 style="font-size:13px;margin:4px 0 8px">Fundo</h3><div class="temaop">${[['light','☀️ Claro'],['dark','🌙 Escuro']].map(([k,n])=>`<button data-tema-modo="${k}" aria-pressed="${tema.modo===k}">${n}</button>`).join('')}</div>
 <h3 style="font-size:13px;margin:14px 0 8px">Cor principal</h3><div class="temaop">${CORES.map(([k,n,c])=>`<button data-tema-cor="${k}" aria-pressed="${tema.cor===k}"><i style="background:${c}"></i>${n}</button>`).join('')}</div>
 <div class="toolbar" style="margin-top:14px;justify-content:flex-end"><button class="btn primary" data-act="close">Pronto</button></div>`)}
$('#corBtn').onclick=temaModal;
document.querySelectorAll('#modoSeg button').forEach(b=>b.onclick=()=>{tema.modo=b.dataset.modo;aplicaTema()});
document.addEventListener('click',e=>{const m=e.target.closest('[data-tema-modo]'),c=e.target.closest('[data-tema-cor]');if(!m&&!c)return;if(m)tema.modo=m.dataset.temaModo;if(c)tema.cor=c.dataset.temaCor;aplicaTema();temaModal()});
addEventListener('resize',()=>{if(tour)tourStep()});
try{speechSynthesis.getVoices()}catch(e){}
render();carregar();
})();
