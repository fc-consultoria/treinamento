<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Portal Comercial Guaporé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra de perfil fixa no topo; cada perfil (Gestor / Vendedor / Cliente) é uma tela própria em grade de cartões; tutorial guiado sobreposto com legenda e voz */
:root{
  --bg:#eef3f3; --surface:#ffffff; --surface-2:#f5f8f8; --line:#d6e1e0;
  --fg:#11292b; --muted:#5b7174; --brand:#0d6e66; --brand-ink:#ffffff; --brand-soft:#d9efec;
  --amber:#c27a12; --amber-soft:#fbefd9; --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#b5490f; --warn-soft:#fbe4d6;
  --shade:rgba(8,28,30,.62);
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1718; --surface:#132324; --surface-2:#182b2c; --line:#27403f;
  --fg:#e3eeed; --muted:#93abab; --brand:#2fb3a5; --brand-ink:#04211e; --brand-soft:#173a37;
  --amber:#e5a443; --amber-soft:#3a2c14; --ok:#4cc480; --ok-soft:#173523; --warn:#f08a52; --warn-soft:#3d2418; --shade:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1718; --surface:#132324; --surface-2:#182b2c; --line:#27403f;
  --fg:#e3eeed; --muted:#93abab; --brand:#2fb3a5; --brand-ink:#04211e; --brand-soft:#173a37;
  --amber:#e5a443; --amber-soft:#3a2c14; --ok:#4cc480; --ok-soft:#173523; --warn:#f08a52; --warn-soft:#3d2418; --shade:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-size:15px;display:block}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.bell{position:relative}
.bell .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-mono)}
main{padding-block:22px 40px}
.demo-note{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:14px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:24px}
.hello p{margin:2px 0 0;color:var(--muted)}
.grid{display:grid;gap:14px}
.mods{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.mod{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px;color:var(--fg)}
.mod:hover{border-color:var(--brand);transform:translateY(-1px)}
.mod .ic{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.mod h3{font-size:15px}
.mod p{margin:0;color:var(--muted);font-size:12.5px}
.mod.locked{opacity:.55}
.mod .tag{position:absolute;top:12px;right:12px;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.mod .tag.new{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-size:16px;display:flex;align-items:center;gap:8px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi b{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi.alert{border-color:var(--warn);background:var(--warn-soft)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);flex-wrap:wrap}
.row .who{flex:1;min-width:160px}
.row .who b{display:block;font-size:13.5px}
.row .who span{color:var(--muted);font-size:12px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.novo{background:var(--warn-soft);color:var(--warn)}
.pill.and{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.br{background:var(--brand-soft);color:var(--brand)}
.hidden-id{font-family:var(--f-mono);letter-spacing:2px;color:var(--muted)}
.meter{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;font-size:12.5px}
.meter .bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line);display:flex}
.meter .bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c .b{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.chart .c small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.days{display:flex;gap:10px}
.days span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.c,th.c{text-align:center}
.sw{position:relative;width:38px;height:22px;border-radius:12px;background:var(--line);border:0;padding:0;vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{left:19px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);text-align:left;color:var(--fg)}
.slot b{display:block;font-family:var(--f-mono);font-size:13px}
.slot span{font-size:12px;color:var(--muted)}
.slot.mine{border-color:var(--brand);background:var(--brand-soft)}
.slot.full{opacity:.5}
.prods{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.prod{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.prod canvas{width:100%;height:140px;display:block;background:var(--surface-2)}
.prod .in{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod h3{font-size:14px}
.prod p{margin:0;font-size:12px;color:var(--muted)}
.vend{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.vend button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;text-align:left;color:var(--fg)}
.vend button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.cart{position:sticky;top:76px}
.cartline{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.msg{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word}
.modal{position:fixed;inset:0;background:var(--shade);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;max-height:86vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;max-width:90vw}
.tour-hole{position:fixed;z-index:70;border-radius:12px;box-shadow:0 0 0 9999px var(--shade);border:2px solid var(--amber);pointer-events:none;transition:all .35s}
.tour-cap{position:fixed;z-index:71;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100vw - 32px));background:var(--surface);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.tour-cap .step{font-family:var(--f-mono);font-size:11px;color:var(--amber)}
.tour-cap p{margin:4px 0 10px;font-size:14.5px}
.tour-cap .act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.banner{border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.banner b{font-family:var(--f-display);font-size:20px;line-height:1.25}
.banner span{opacity:.9;font-size:13px}
.prevbox{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.prevbox .banner{padding:14px}.prevbox .banner b{font-size:16px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.chip em{font-style:normal;color:var(--amber);font-weight:600}
.prod.dest{border-color:var(--brand)}
.ptag{position:absolute;top:10px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.ptag.d{left:10px;background:var(--brand);color:var(--brand-ink)}
.ptag.p{right:10px;background:var(--amber);color:#fff}
.postcv{border-radius:12px;max-width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px}
.cald{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:130px}
.cald>b{font-size:11px;text-transform:capitalize;color:var(--muted)}
.cald .none{color:var(--muted);font-size:12px}
.post{border:0;border-left:3px solid var(--line);background:var(--surface);color:var(--fg);text-align:left;font-size:12px;padding:6px 7px;border-radius:6px;line-height:1.3}
.post span{display:block;font-size:10px;color:var(--muted)}
.post.rascunho{border-left-color:var(--warn)}.post.agendado{border-left-color:var(--amber)}.post.publicado{border-left-color:var(--ok);opacity:.7}
.funnel{display:flex;flex-direction:column;gap:3px}
.funnel i{display:block;height:6px;border-radius:3px;background:var(--line)}
.funnel i:nth-child(2){background:var(--brand)}.funnel i:nth-child(3){background:var(--amber)}
.chatg{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;min-height:300px}
.clist{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.cbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;padding:8px 10px;text-align:left}
.cbtn b{display:block;font-size:13px}.cbtn span{font-size:11.5px;color:var(--muted)}
.cbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.cbox{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.cmsgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:300px;background:var(--surface-2)}
.msgb{align-self:flex-start;max-width:80%;background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:7px 10px;font-size:13px}
.msgb.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand);border-radius:12px 12px 4px 12px}
.msgb small{display:block;font-size:10px;opacity:.7;margin-top:2px;font-family:var(--f-mono)}
.csend{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:640px){.chatg{grid-template-columns:1fr}.clist{flex-direction:row;overflow-x:auto}.cbtn{min-width:150px}}
.foot{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center}
.empty{color:var(--muted);font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:10px;text-align:center}
@media (max-width:720px){.cart{position:static}.meter{grid-template-columns:80px 1fr 32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>


<header class="top">
  <div class="wrap">
    <div class="brand"><div class="mark">G</div><div><b>Guaporé Vidros</b><span>Portal Comercial</span></div></div>
    <div class="seg" role="group" aria-label="Perfil" id="roleSeg">
      <button data-role="gestor" aria-pressed="true">Gestor</button>
      <button data-role="vendedor" aria-pressed="false">Vendedor</button>
      <button data-role="marketing" aria-pressed="false">Marketing</button>
    </div>
    <button class="btn bell" id="bellBtn" title="Avisos de cadastro">🔔 Avisos<span class="dot" id="bellDot" hidden>0</span></button>
    <button class="btn primary" id="tourBtn">▶ Tutorial</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
(function(){
const KEY='guapore-portal-v1';
const MODS=[
 {k:'cat',n:'Catálogo 3D',d:'Perfis das linhas Suprema e Gold em 3D para mostrar ao cliente.',i:'▦'},
 {k:'trein',n:'Treinamento 3D',d:'Montagem e conceitos em 3D + treinamento on-line com agenda.',i:'◈'},

 {k:'fc',n:'Solicitação com a FC',d:'Dúvidas e pedidos de suporte direto com a FC.',i:'✉'}
];
const COLORS={cat:'var(--brand)',trein:'var(--amber)',casa:'#6b7fd6',vento:'#3aa0c9',fc:'#b0627e'};
const PRODS=[
 {id:'p1',n:'Janela de correr 2 folhas',l:'Linha Suprema',t:'janela'},
 {id:'p2',n:'Janela de correr 4 folhas',l:'Linha Suprema',t:'janela4'},
 {id:'p3',n:'Porta de correr 2 folhas',l:'Linha Gold',t:'porta'},
 {id:'p4',n:'Maxim-ar',l:'Linha Suprema',t:'maxim'},
 {id:'p5',n:'Porta de giro',l:'Linha Gold',t:'giro'},
 {id:'p6',n:'Box de banheiro',l:'Vidro temperado 8 mm',t:'box'}
];

function seed(){
 const v=(id,nome,ac)=>({id,nome,ativo:true,mods:{cat:true,trein:true,casa:true,vento:true,fc:true},ac,ult:day(Math.floor(Math.random()*3))});
 return {

   {id:'c3',nome:'Eduardo Prado',empresa:'Prado Engenharia',cidade:'Várzea Grande',tel:'(65) 9 0000-0003',email:'eduardo@exemplo.com',data:day(0),visto:false}
  ],

   {id:'O-1032',cli:'c2',vend:'v1',canal:'E-mail',data:day(0),status:'novo',itens:[{p:'p4',l:600,a:600,q:3,cor:'Branco'}],obs:''},
   {id:'O-1033',cli:'c3',vend:'v4',canal:'WhatsApp',data:day(0),status:'novo',itens:[{p:'p2',l:2400,a:1200,q:2,cor:'Bronze'},{p:'p6',l:1200,a:1900,q:2,cor:'Incolor'}],obs:'Precisa de visita técnica.'}
  ],
  slots:[
   {id:'s1',d:'Qui 29/10',h:'14:00',tema:'Catálogo 3D na venda',cap:6,ins:['v2']},
   {id:'s2',d:'Ter 03/11',h:'09:00',tema:'Monte sua Casa 3D',cap:6,ins:[]},
   {id:'s3',d:'Qui 05/11',h:'14:00',tema:'Pressão de vento na prática',cap:6,ins:['v1','v4']}
  ],
  sol:[],
  me:'v1', cliSessao:null
 };
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.vend)S=seed();
function isoDay(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function seedMkt(){return {
 banner:{tit:'Esquadrias que valorizam sua obra',sub:'Veja em 3D e peça seu orçamento direto ao vendedor',cor:'brand'},
 destaques:['p1','p3'],ocultos:[],promo:{p2:'Pronta entrega'},sobConsulta:['p6'],
 views:{p1:132,p2:88,p3:104,p4:57,p5:41,p6:73},

function wrapText(g,txt,max){const w=txt.split(' '),out=[];let l='';w.forEach(x=>{const t=l?l+' '+x:x;if(g.measureText(t).width>max&&l){out.push(l);l=x}else l=t});if(l)out.push(l);return out.slice(0,3)}
function drawPost(){
 const cv=$('#postCv');if(!cv)return;const p=prod(postSel.p),story=postSel.f==='story';
 cv.width=540;cv.height=story?960:540;cv.style.width=story?'200px':'260px';
 const g=cv.getContext('2d'),W=cv.width,H=cv.height;
 const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#0d6e66');gr.addColorStop(1,'#072e2b');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<W;i+=40)g.fillRect(i,0,1,H);
 g.fillStyle='#ffffff';g.font='700 20px Sora, sans-serif';g.fillText('GUAPORÉ VIDROS',40,60);
 g.fillStyle='#f2b75a';g.font='600 16px Inter, sans-serif';g.fillText(p.l.toUpperCase(),40,88);
 g.fillStyle='#ffffff';const fs=story?44:36;g.font=`700 ${fs}px Sora, sans-serif`;
 wrapText(g,postSel.t||p.n,W-80).forEach((ln,i)=>g.fillText(ln,40,(story?170:140)+i*(fs+8)));
 drawWin(g,W/2,story?H*.6:H*.63,p.t,story?1.45:.95,'#f4f8f7','rgba(170,225,218,.45)','#f2b75a');
 g.fillStyle='#f2b75a';g.fillRect(40,H-90,W-80,52);
 g.fillStyle='#072e2b';g.font='700 19px Inter, sans-serif';g.fillText('Veja em 3D e peça seu orçamento',62,H-57);
 if(S.mkt.promo[p.id]){g.fillStyle='#ffffff';g.font='700 15px Inter, sans-serif';const t=S.mkt.promo[p.id].toUpperCase(),tw=g.measureText(t).width;g.fillRect(W-tw-64,40,tw+24,32);g.fillStyle='#0d6e66';g.fillText(t,W-tw-52,62)}
}
function drawWin(g,cx,cy,t,s,frame,glass,acc){
  const isDoor=/porta|giro|box/.test(t);
  const fw=(isDoor?150:t==='janela4'?300:t==='maxim'?150:240)*s, fh=(isDoor?230:t==='maxim'?150:160)*s;
  const x=cx-fw/2,y=cy-fh/2;
  g.fillStyle='rgba(0,0,0,.15)';g.fillRect(x+10*s,y+10*s,fw,fh);
  g.fillStyle=frame;g.fillRect(x,y,fw,fh);
  const n=t==='janela4'?4:/janela|porta/.test(t)?2:1, b=9*s;
  const pw=(fw-2*b)/n;
  for(let i=0;i<n;i++){
   const px=x+b+i*pw;
   g.fillStyle=glass;g.fillRect(px+3*s,y+b+3*s,pw-6*s,fh-2*b-6*s);
   g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3*s;g.beginPath();g.moveTo(px+14*s,y+b+40*s);g.lineTo(px+34*s,y+b+16*s);g.stroke();
  }
  g.strokeStyle=acc;g.fillStyle=acc;g.lineWidth=2*s;g.setLineDash([6*s,4*s]);
  if(/janela|porta/.test(t)){g.beginPath();g.moveTo(cx-30*s,cy);g.lineTo(cx+30*s,cy);g.stroke();g.setLineDash([]);g.beginPath();g.moveTo(cx+30*s,cy);g.lineTo(cx+22*s,cy-6*s);g.lineTo(cx+22*s,cy+6*s);g.fill()}
  if(t==='maxim'){g.beginPath();g.moveTo(x+b,y+b);g.lineTo(cx,y+fh-b);g.lineTo(x+fw-b,y+b);g.stroke()}
  if(t==='giro'){g.beginPath();g.moveTo(x+fw-b,y+b);g.lineTo(x+b,cy);g.lineTo(x+fw-b,y+fh-b);g.stroke()}
  if(t==='box'){g.beginPath();g.moveTo(cx,y+b);g.lineTo(cx,y+fh-b);g.stroke()}
  g.setLineDash([]);
}
function drawCanvases(){
 document.querySelectorAll('canvas[data-t]').forEach(cv=>{
  const g=cv.getContext('2d'),W=cv.width,H=cv.height,t=cv.dataset.t;
  const cs=getComputedStyle(document.documentElement);
  g.clearRect(0,0,W,H);
  drawWin(g,W/2,H/2,t,1,cs.getPropertyValue('--fg').trim(),cs.getPropertyValue('--brand-soft').trim(),cs.getPropertyValue('--brand').trim());
 });
}
function drawCanvasesOld(){
 document.querySelectorAll('canvas[data-old]').forEach(cv=>{
  const g=cv.getContext('2d'),W=cv.width,H=cv.height,t=cv.dataset.t;
  const cs=getComputedStyle(document.documentElement);
  const frame=cs.getPropertyValue('--fg').trim(),glass=cs.getPropertyValue('--brand-soft').trim(),acc=cs.getPropertyValue('--brand').trim();
  g.clearRect(0,0,W,H);
  const isDoor=/porta|giro|box/.test(t);
  const fw=isDoor?150:t==='janela4'?300:t==='maxim'?150:240, fh=isDoor?230:t==='maxim'?150:160;
  const x=(W-fw)/2,y=(H-fh)/2;
  // sombra 3D simples
  g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x+10,y+10,fw,fh);
  g.fillStyle=frame;g.fillRect(x,y,fw,fh);
  const n=t==='janela4'?4:/janela|porta/.test(t)?2:1, b=9;
  const pw=(fw-2*b)/n;
  for(let i=0;i<n;i++){
   const px=x+b+i*pw;
   g.fillStyle=glass;g.fillRect(px+3,y+b+3,pw-6,fh-2*b-6);
   g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=3;g.beginPath();g.moveTo(px+14,y+b+40);g.lineTo(px+34,y+b+16);g.stroke();
  }
  g.strokeStyle=acc;g.lineWidth=2;g.setLineDash([6,4]);
  if(/janela|porta/.test(t)){g.beginPath();g.moveTo(x+fw/2-30,y+fh/2);g.lineTo(x+fw/2+30,y+fh/2);g.stroke();g.setLineDash([]);g.beginPath();g.moveTo(x+fw/2+30,y+fh/2);g.lineTo(x+fw/2+22,y+fh/2-6);g.lineTo(x+fw/2+22,y+fh/2+6);g.fillStyle=acc;g.fill()}
  if(t==='maxim'){g.beginPath();g.moveTo(x+b,y+b);g.lineTo(x+fw/2,y+fh-b);g.lineTo(x+fw-b,y+b);g.stroke()}
  if(t==='giro'){g.beginPath();g.moveTo(x+fw-b,y+b);g.lineTo(x+b,y+fh/2);g.lineTo(x+fw-b,y+fh-b);g.stroke()}
  if(t==='box'){g.beginPath();g.moveTo(x+fw/2,y+b);g.lineTo(x+fw/2,y+fh-b);g.stroke()}
  g.setLineDash([]);
 });
}

 }
 if(a==='cadok'){const n=$('#cN').value.trim();if(!n||(!$('#cT').value.trim()&&!$('#cM').value.trim())){toast('Informe nome e WhatsApp ou e-mail.');return}
  const c={id:'c'+Date.now(),nome:n,empresa:$('#cE').value.trim()||'—',cidade:$('#cC').value.trim()||'—',tel:$('#cT').value.trim()||'—',email:$('#cM').value.trim()||'—',data:new Date().toISOString(),visto:false};
  S.clientes.push(c);S.cliSessao=c.id;S.cadDia[6]++;save();toast(S.autoCadastro?'Cadastro aprovado automaticamente.':'Cadastro enviado para aprovação.');finishSend(t.dataset.c,t.dataset.obs)}
 if(a==='chatw'){chatWith=id;render();setTimeout(()=>{const i=$('#ctxt');if(i)i.focus({preventScroll:true})},0);return}
 if(a==='verhist'){const [x,y]=id.split('|');modal(`<h2>${esc(cName(x))} ↔ ${esc(cName(y))}</h2><p class="sub">Histórico · só leitura</p><div class="cmsgs" style="max-height:50vh">${convo(x,y).map(m=>`<div class="msgb ${m.de===x?'me':''}"><span><b style="font-size:11px;display:block">${esc(cName(m.de))}</b>${esc(m.t)}</span><small>${fmtD(m.h)}</small></div>`).join('')}</div><div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" data-act="close">Fechar</button></div>`)}
 /* marketing */
 const M=S.mkt;
 if(a==='bcor'){M.banner.cor=id;save();render()}
 if(a==='mvis'){const i=M.ocultos.indexOf(id);i>=0?M.ocultos.splice(i,1):M.ocultos.push(id);save();render()}
 if(a==='mdest'){const i=M.destaques.indexOf(id);i>=0?M.destaques.splice(i,1):M.destaques.push(id);save();render()}
 if(a==='msob'){const i=M.sobConsulta.indexOf(id);i>=0?M.sobConsulta.splice(i,1):M.sobConsulta.push(id);save();render()}
 if(a==='sugpost'){postSel.p=id;postSel.t=M.promo[id]?`${prod(id).n}: ${M.promo[id]}`:prod(id).n;postSel.f=M.promo[id]?'story':'feed';render();setTimeout(()=>$('#t-studio').scrollIntoView({block:'start',behavior:'smooth'}),50)}
 if(a==='copycap'){const el=$('#psCap');(navigator.clipboard?navigator.clipboard.writeText(el.textContent):Promise.reject()).then(()=>toast('Legenda copiada.'),()=>{const r=document.createRange();r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r);toast('Texto selecionado. Use Ctrl+C.')})}
 if(a==='schedpost'){modal(`<h2>Agendar post</h2><p class="sub">${esc(postSel.t||prod(postSel.p).n)}</p><div class="form"><label>Dia<select id="spD">${[...Array(7)].map((_,i)=>`<option value="${isoDay(i)}">${fmtDay(isoDay(i))}</option>`).join('')}</select></label><label>Canal<select id="spC"><option>Instagram · ${postSel.f==='story'?'stories':'feed'}</option><option>Facebook</option><option>WhatsApp · status</option></select></label></div><div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="spok">Agendar</button></div>`)}
 if(a==='spok'){M.posts.push({id:'P'+Date.now(),d:$('#spD').value,canal:$('#spC').value,p:postSel.p,tit:postSel.t||prod(postSel.p).n,status:'agendado'});save();closeModal();render();toast('Post agendado no calendário.')}
 if(a==='verpost'){const p=M.posts.find(x=>x.id===id);modal(`<h2>${esc(p.tit)}</h2><p class="sub">${fmtDay(p.d)} · ${esc(p.canal)} · ${prod(p.p).n}</p><span class="pill ${PST[p.status][1]}">${PST[p.status][0]}</span><div class="toolbar" style="margin-top:14px;justify-content:flex-end"><button class="btn" data-act="delpost" data-id="${p.id}">Excluir</button><button class="btn" data-act="editpost" data-id="${p.id}">Abrir no estúdio</button>${p.status!=='publicado'?`<button class="btn primary" data-act="pubpost" data-id="${p.id}">Marcar como publicado</button>`:''}</div>`)}
 if(a==='pubpost'){M.posts.find(x=>x.id===id).status='publicado';save();closeModal();render();toast('Post marcado como publicado.')}
 if(a==='delpost'){M.posts=M.posts.filter(x=>x.id!==id);save();closeModal();render();toast('Post excluído.')}
 if(a==='editpost'){const p=M.posts.find(x=>x.id===id);postSel={p:p.p,f:/stories/.test(p.canal)?'story':'feed',t:p.tit};closeModal();render();setTimeout(()=>$('#t-studio').scrollIntoView({block:'start',behavior:'smooth'}),50)}
 if(a==='addlink'){modal(`<h2>Novo link de campanha</h2><p class="sub">Use um link diferente em cada canal para saber de onde vem o cliente.</p><div class="form"><label>Canal ou campanha<input id="nlC" placeholder="Ex.: Panfleto feira Sinop"></label></div><div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="nlok">Criar link</button></div>`)}
 if(a==='nlok'){const c=$('#nlC').value.trim();if(!c){toast('Dê um nome ao canal.');return}const cod=c.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24);M.links.push({id:'l'+Date.now(),canal:c,cod,cliques:0,cad:0,orc:0});save();closeModal();render();toast('Link criado.')}
 if(a==='newcli'){S.cliSessao=null;save();closeModal();render()}
});

function finishSend(canal,obs){
 const n=1000+S.orc.length+31;const o={id:'O-'+n,cli:S.cliSessao,vend:selVend,canal,data:new Date().toISOString(),status:'novo',itens:cart.slice(),obs};
 S.orc.push(o);S.visitas[6]++;save();
 const c=cli(o.cli);
 const txt=`Olá, ${vName(o.vend)}! Sou ${c.nome} e gostaria de um orçamento (${o.id}):\n${o.itens.map(i=>`• ${prod(i.p).n} – ${i.l}×${i.a} mm – ${i.q} un – ${i.cor}`).join('\n')}${obs?`\nObs.: ${obs}`:''}`;
 cart=[];selVend=null;render();
 modal(`<h2>Pedido enviado ✓</h2><p class="sub">${o.id} chegou no painel de ${esc(vName(o.vend))} e na Central do Gestor.</p><div class="msg" id="orcTxt">${esc(txt)}</div>
 <p style="font-size:12px;color:var(--muted)">${canal==='WhatsApp'?'Na versão publicada este texto abre direto no WhatsApp do vendedor.':'Na versão publicada este texto vai para o e-mail do vendedor, com cópia para o cliente.'}</p>
 <div class="toolbar" style="justify-content:flex-end"><button class="btn" data-act="copy">Copiar mensagem</button><button class="btn" data-act="newcli">Simular outro cliente</button><button class="btn primary" data-act="close">Ok</button></div>`);
}

$('#bellBtn').onclick=()=>{const nv=S.clientes.filter(c=>!c.visto);modal(`<h2>🔔 Avisos de cadastro</h2><p class="sub">${nv.length?nv.length+' cliente(s) se cadastraram e já estão liberados.':'Nenhum cadastro novo.'}</p><div class="list">${nv.map(c=>`<div class="row"><div class="who"><b>Novo cliente · ${esc(c.cidade)}</b><span>${fmtD(c.data)}</span></div><button class="btn sm" data-act="vercad" data-id="${c.id}">Ver quem cadastrou</button></div>`).join('')}</div><div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="btn primary" data-act="close">Fechar</button></div>`)};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act="vercad"]');if(t&&t.closest('.modal'))closeModal()},true);

document.addEventListener('input',e=>{
 const t=e.target;if(role!=='marketing')return;const M=S.mkt;
 if(t.id==='mkTit'||t.id==='mkSub'){M.banner[t.id==='mkTit'?'tit':'sub']=t.value;save();$('#mkPrev').innerHTML=prevHTML()}
 if(t.dataset.selo){const v=t.value.trim();if(v)M.promo[t.dataset.selo]=v;else delete M.promo[t.dataset.selo];save();$('#mkPrev').innerHTML=prevHTML();drawPost()}
 if(t.id==='psT'){postSel.t=t.value;drawPost();$('#psCap').textContent=capText()}
});
document.addEventListener('change',e=>{
 const t=e.target;if(role!=='marketing')return;
 if(t.id==='psP'){postSel.p=t.value;postSel.t=prod(t.value).n;$('#psT').value=postSel.t;drawPost();$('#psCap').textContent=capText()}
 if(t.id==='psF'){postSel.f=t.value;drawPost()}
});
/* ---------- TUTORIAL GUIADO (legenda + voz) ---------- */
const TOURS={
 marketing:[
  ['#t-mkpis','Este é o painel do Marketing da Guaporé, focado no Catálogo 3D. No topo: visualizações dos perfis, perfis visíveis, em destaque e com selo.'],
  ['#t-rank','Aqui você vê o que os clientes mais olham no Catálogo 3D. Use isso para decidir o que colocar em destaque.'],
  ['#t-vitrine','Na vitrine você controla o catálogo: o banner, os perfis em destaque, os selos como Pronta entrega, o que fica sob consulta e o que aparece ou não para o cliente. A prévia ao lado mostra como o cliente vai ver.']
 ],
 gestor:[
  ['#t-kpis','Esta é a Central do Gestor da Guaporé. No topo ficam os números do dia: cadastros novos, orçamentos em aberto, acessos da equipe e visitas ao Catálogo 3D.'],
  ['#t-cad','Quando um cliente se cadastra no catálogo, ele é aprovado na hora. Aqui chega o aviso, com os dados ocultos. Toque em Ver quem cadastrou para abrir o nome, a empresa e o contato.'],
  ['#bellBtn','O sino mostra quantos cadastros novos você ainda não viu.'],
  ['#t-cat','Este gráfico mede o acesso ao Catálogo 3D: visitas por dia, novos cadastros e quanto disso virou pedido de orçamento.'],

  ['#t-orc','Aqui estão todos os orçamentos que os clientes pediram, com o vendedor escolhido. Filtre por vendedor ou situação, abra um pedido e, se precisar, transfira para outro vendedor.'],
  ['#t-agg','A agenda do treinamento on-line: crie turmas e acompanhe quem se inscreveu.'],
  ['#t-hist','Por fim, o histórico das conversas da equipe. As conversas são individuais, e você acompanha todas aqui, só para leitura.']
 ],
 vendedor:[
  ['#t-mods','Este é o painel do vendedor. São cinco ferramentas: Catálogo 3D, Treinamento 3D, Monte sua Casa 3D, Diagrama de pressão de vento e Solicitação com a FC. Toque no cartão e depois em Abrir para entrar no módulo. Cada acesso conta no medidor do gestor.'],
  ['#mod-cat','Use o Catálogo 3D para mostrar ao cliente os perfis das linhas Suprema e Gold em 3D durante o atendimento.'],
  ['#mod-casa','No Monte sua Casa 3D você coloca as esquadrias na planta e apresenta o projeto ao cliente.'],
  ['#mod-fc','Ficou com dúvida? Abra Solicitação com a FC e envie sua pergunta direto para o suporte.'],
  ['#t-meus','Quando o cliente se cadastra no Catálogo 3D, monta o pedido e escolhe você, o pedido cai aqui. Abra, copie o resumo e responda pelo WhatsApp ou e-mail que ele pediu. Depois marque a situação.'],
  ['#t-agv','Na agenda de treinamento on-line, toque em uma turma para se inscrever.'],
  ['#t-chat','Na conversa da equipe você fala individualmente com um colega, com o gestor ou com o suporte da FC. Escolha a pessoa na lista e escreva a mensagem.']
 ],
 cliente:[
  ['#t-prods','Esta é a visão do cliente no Catálogo 3D. Ele escolhe a esquadria e informa largura, altura, quantidade e cor.'],
  ['#t-cart','Os itens vão para o orçamento ao lado.'],
  ['#t-vend','O cliente escolhe para qual vendedor quer enviar.'],
  ['#t-cart','E envia por WhatsApp ou e-mail. Se for a primeira vez, faz um cadastro rápido, aprovado na hora. O gestor recebe o aviso e o vendedor recebe o pedido.']
 ]
};
let tour=null;
function speak(txt,cb){
 try{if(!tour||!tour.voz||!window.speechSynthesis){throw 0}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=1.02;
  const v=speechSynthesis.getVoices().find(v=>/pt(-|_)BR/i.test(v.lang));if(v)u.voice=v;
  u.onend=cb;u.onerror=()=>{tour&&(tour.timer=setTimeout(cb,6500))};speechSynthesis.speak(u);
 }catch(e){if(tour&&tour.auto)tour.timer=setTimeout(cb,Math.max(5000,txt.length*55))}
}
function tourStep(){
 const L=$('#layer');clearTimeout(tour.timer);
 const steps=TOURS[tour.role];if(tour.i>=steps.length){endTour();toast('Tutorial concluído.');return}
 const [sel,txt]=steps[tour.i];const el=$(sel);
 if(el){el.scrollIntoView({block:'center',behavior:'smooth'})}
 setTimeout(()=>{
  const r=el?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  L.innerHTML=`<div class="tour-hole" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>
  <div class="tour-cap" role="dialog" aria-live="polite"><div class="step">TUTORIAL ${tour.role.toUpperCase()} · ${tour.i+1}/${steps.length}</div><p>${txt}</p>
  <div class="act"><button class="btn sm" id="tVoz">${tour.voz?'🔊 Voz ligada':'🔈 Voz desligada'}</button><button class="btn sm" id="tAuto">${tour.auto?'⏸ Pausar':'⏵ Automático'}</button><span style="flex:1"></span><button class="btn sm" id="tPrev" ${tour.i?'':'disabled'}>Voltar</button><button class="btn sm" id="tEnd">Sair</button><button class="btn sm primary" id="tNext">${tour.i===steps.length-1?'Concluir':'Próximo'}</button></div></div>`;
  $('#tNext').onclick=()=>{tour.i++;tourStep()};
  $('#tPrev').onclick=()=>{tour.i--;tourStep()};
  $('#tEnd').onclick=endTour;
  $('#tVoz').onclick=()=>{tour.voz=!tour.voz;if(!tour.voz)try{speechSynthesis.cancel()}catch(e){};tourStep()};
  $('#tAuto').onclick=()=>{tour.auto=!tour.auto;tourStep()};
  if(tour.voz||tour.auto)speak(txt,()=>{if(tour&&tour.auto){tour.i++;tourStep()}});
 },380);
}
function endTour(){if(tour)clearTimeout(tour.timer);tour=null;try{speechSynthesis.cancel()}catch(e){}closeModal()}
$('#tourBtn').onclick=()=>{
 modal(`<h2>▶ Tutorial guiado</h2><p class="sub">Passo a passo com legenda e narração em voz. Use no telão da apresentação ou envie para a equipe.</p>
 <div class="list">
  <button class="row" data-tour="gestor" style="text-align:left;cursor:pointer;color:var(--fg)"><div class="who"><b>Tutorial do Gestor</b><span>${TOURS.gestor.length} passos · comandos, medidores, cadastros e orçamentos</span></div><span class="pill br">Começar</span></button>
  <button class="row" data-tour="vendedor" style="text-align:left;cursor:pointer;color:var(--fg)"><div class="who"><b>Tutorial do Vendedor</b><span>${TOURS.vendedor.length} passos · ferramentas, orçamentos recebidos e agenda</span></div><span class="pill br">Começar</span></button>
  <button class="row" data-tour="marketing" style="text-align:left;cursor:pointer;color:var(--fg)"><div class="who"><b>Tutorial do Marketing</b><span>${TOURS.marketing.length} passos · banner, destaques, selos e o que aparece no Catálogo 3D</span></div><span class="pill br">Começar</span></button>
 </div>
 <label style="flex-direction:row;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--fg)"><input type="checkbox" id="tvAuto" checked style="width:auto"> Modo vídeo: avança sozinho com voz</label>
 <div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="close">Fechar</button></div>`);
 document.querySelectorAll('[data-tour]').forEach(b=>b.onclick=()=>{const auto=$('#tvAuto').checked;role=b.dataset.tour;render();tour={role,i:0,voz:auto,auto};closeModal();tourStep()});
};
addEventListener('resize',()=>{if(tour)tourStep()});
try{speechSynthesis.getVoices()}catch(e){}
render();
})();
</script>
