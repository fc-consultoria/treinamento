     Mesmo login do Painel da Matriz (fica salvo no aparelho). © FC Consultoria em Esquadria · uso exclusivo -->
<style>
:root{--pt:#0e4d5c;--pt2:#0a3a46;--pr:#c7d0d4;--bg:#f2f4f5;--card:#fff;--fg:#14232a;--mu:#5f6b70;--ln:#dde3e6;--ok:#1f8a4c;--bad:#a32d2d;--sel:#e3f0f2}
@media (prefers-color-scheme:dark){:root{--bg:#0d1417;--card:#162126;--fg:#e8eef0;--mu:#9aabb2;--ln:#26353b;--sel:#12343c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior-y:contain}
header{position:sticky;top:0;z-index:5;background:var(--pt);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.lg{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--pr);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
header .t{flex:1;min-width:0}header .t b{display:block;font-size:16px}header .t small{color:var(--pr);font-size:12.5px}
header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;padding:6px 10px;font:600 13px inherit}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 84px)}
.sec{display:none}.sec.on{display:block}
.hd{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px;color:var(--mu);font-size:13px}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.cd .top{display:flex;justify-content:space-between;gap:8px}.cd .top b{font-size:15.5px}.cd .top span{color:var(--mu);font-size:12.5px;white-space:nowrap}
.cd .sub{color:var(--mu);font-size:13px}.cd p{margin:6px 0 0;font-size:14px;overflow-wrap:anywhere}
.emp{display:inline-block;background:var(--sel);color:var(--pt);border-radius:6px;padding:0 6px;font-size:12px;font-weight:600;margin-right:6px}
@media (prefers-color-scheme:dark){.emp{color:#8fd3df}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chips button{border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:99px;padding:7px 12px;font:500 13.5px inherit}
.chips button.on{background:var(--pt);border-color:var(--pt);color:#fff}
.bts{display:flex;gap:8px;margin-top:10px}
.bt{flex:1;border:0;border-radius:10px;padding:11px 0;font:600 14.5px inherit;text-align:center;text-decoration:none;display:block}
.bt.p{background:var(--pt);color:#fff}.bt.r{background:transparent;color:var(--bad);border:1px solid #e9b9b9}.bt.w{background:#25d366;color:#fff}.bt.n{background:var(--sel);color:var(--fg)}
.bt:disabled{opacity:.55}
.st{font-size:13px;margin-top:6px;color:var(--mu)}.st.er{color:var(--bad)}
.vazio{text-align:center;color:var(--mu);padding:40px 16px}.vazio b{display:block;color:var(--fg);font-size:16px;margin:8px 0 4px}.vazio i{font-style:normal;font-size:34px}
.gr{font:700 12px inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:16px 2px 8px}
.gr i{font-style:normal;background:var(--sel);color:var(--pt);border-radius:99px;padding:0 7px;margin-left:4px;letter-spacing:0}
.urg{border-color:#e9a3ad}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;background:none;border:0;color:var(--mu);font:500 12px inherit;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;padding:4px 0}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--pt)}@media (prefers-color-scheme:dark){nav button.on{color:#8fd3df}}
nav .n{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#e11d48;color:#fff;font-size:11px;font-weight:700;display:none;place-items:center;padding:0 5px}
nav .n.on{display:grid}
.big{display:block;background:var(--card);border:1px solid #e8b04a;border-radius:16px;padding:16px;text-decoration:none;color:var(--fg);margin-bottom:10px}
.big b{display:block;font-size:17px;margin:6px 0 4px}.big span{color:var(--mu);font-size:13.5px}.big em{display:block;font-style:normal;color:#8a5a08;font-weight:600;margin-top:10px}
.gate{position:fixed;inset:0;z-index:20;background:var(--pt2);display:flex;align-items:center;justify-content:center;padding:20px}
.gate[hidden]{display:none}
.gate form{width:min(360px,100%);background:var(--card);border-radius:18px;padding:22px}
.gate .lg{margin:0 auto 10px;width:52px;height:52px;font-size:20px;background:var(--pt);color:#fff}
.gate h1{font-size:18px;text-align:center;margin:0 0 4px}.gate p{text-align:center;color:var(--mu);font-size:13px;margin:0 0 16px}
.gate input{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--fg);border-radius:10px;padding:12px;font:16px inherit;margin-bottom:10px}
.gate button{width:100%;border:0;border-radius:10px;padding:13px;background:var(--pt);color:#fff;font:600 16px inherit}
#gateMsg{color:var(--bad);font-size:13.5px;text-align:center;margin-top:10px}
.dica{background:var(--sel);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.dica button{margin-top:8px}
.ag-f label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 3px}
.ag-f input,.ag-f select,.ag-f textarea{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px;font:16px inherit;box-sizing:border-box}
.ag-f .dois{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.tg-a{background:#fdf0d5;color:#8a5a08}.tg-c{background:#e3f0f2;color:#0e4d5c}.tg-r{background:#e2f3e8;color:#1f6b3c}.tg-x{background:#f3e1e1;color:#a32d2d}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.mt div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px}.mt small{color:var(--mu);font-size:12.5px}.mt b{display:block;font-size:19px}
</style>

 <form id="gateForm" autocomplete="on">

<header>

</header>

<main>
 <div id="dicaInst" class="dica" hidden>Para usar como app: no Safari, toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.</div>

 <section class="sec on" id="s-ac">
  <div class="hd"><span id="acInfo">Carregando…</span></div>

 </section>

 <section class="sec" id="s-rp">
  <div class="hd"><span id="rpInfo">Carregando…</span></div>

 </section>

 <section class="sec" id="s-on">
  <div class="hd"><span id="onInfo">Carregando…</span></div>
  <div id="onL"></div>
 </section>

<section class="sec" id="s-dm">
  <div class="hd"><span id="dmInfo">Carregando…</span></div>
  <div id="dmL"></div>
 </section>
<section class="sec" id="s-ag">
  <div class="hd"><span id="agInfo">Carregando…</span><button type="button" class="bt p" id="agNovo" style="flex:none;padding:7px 14px">+ Novo</button></div>
  <div class="chips" id="agF"><button type="button" data-f="pro" class="on">Próximos</button><button type="button" data-f="rea">Realizados</button><button type="button" data-f="mes">Gastos do mês</button></div>
  <div id="agAv"></div>
  <div id="agForm"></div>
  <div id="agL"></div>
 </section>
</main>

<nav>
 <button type="button" data-s="ac" class="on"><span class="ic">🔑</span>Acessos<span class="n" id="nAc"></span></button>
 <button type="button" data-s="rp"><span class="ic">📥</span>Responder<span class="n" id="nRp"></span></button>
 <button type="button" data-s="on"><span class="ic">🟢</span>On-line<span class="n" id="nOn" style="background:#1f8a4c"></span></button>
 <button type="button" data-s="dm"><span class="ic">🧪</span>Teste 24 h<span class="n" id="nDm" style="background:#02717d"></span></button>
 <button type="button" data-s="ag"><span class="ic">📅</span>Agenda<span class="n" id="nAg" style="background:#c26a00"></span></button>
</nav>

<script src="conversas.js?v=8"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const h=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quando=t=>{if(!t)return '';const m=Math.round((Date.now()-new Date(t))/60000);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';const hr=Math.round(m/60);if(hr<24)return 'há '+hr+' h';const d=Math.round(hr/24);return d===1?'ontem':'há '+d+' dias';};
const app=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(!app&&/iPhone|iPad/.test(navigator.userAgent))$('dicaInst').hidden=false;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});

/* ===== abas ===== */
const TIT={ac:'Liberar acessos',rp:'Para responder',on:'Quem está on-line',dm:'Demonstrativos de 24 h',ag:'Agenda · visitas e viagens'};
let ABA='ac';
function aba(s){ABA=s;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x.id==='s-'+s));$('tit').textContent=TIT[s];
  try{localStorage.setItem('fc-cel-aba',s);}catch(_){}scrollTo(0,0);if(s==='on'&&LOGADO)onCarregar();if(s==='dm'&&LOGADO)dmCarregar();if(s==='ag'&&LOGADO)agCarregar();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>aba(b.dataset.s));

/* ===== 🔑 Liberar acessos (cadastros pelo link de primeiro acesso) ===== */
const PAPEIS=[['compras','Compras'],['vendas','Vendas'],['estoque','Estoque'],['gestor','Gestor geral'],['gerente','Gerente comercial'],['marketing','Marketing'],['fabrica','Fábrica']];
const PN=Object.fromEntries(PAPEIS);
const PLAT_URL='https://fc-consultoria.github.io/fc3d/clientes/',PLAT_EMP=['gs'];
const LINK=e=>PLAT_EMP.includes(e)?PLAT_URL:'https://fc-consultoria.github.io/treinamento/consultorias.html?e='+encodeURIComponent(e);
const PLAT={cb:'Plataforma Casa Bandeirante & FC 3D',gb:'Plataforma Guaporé Vidros & FC 3D',gs:'Plataforma FC 3D'};
const textoLib=(p,emp,empNome)=>{const tel=p.telefone||p.login;
  return `Olá, ${String(p.nome||'').split(' ')[0]}! Seu acesso à ${PLAT[emp]||('área da '+empNome+' na FC Consultoria')} foi liberado ✅\nSetor: ${PN[p.papel]||p.papel}\n\nEntre por aqui: ${['gs','gb','cb'].includes(emp)&&['vendas','compras','estoque'].includes(p.papel)?PLAT_URL:LINK(emp)}\nLogin: seu telefone ${tel}\nSenha: a que você criou no cadastro\n\nNo primeiro acesso, o tutorial mostra como usar. Dúvidas: (66) 9 9986-7984`;};
let AC=[],FEITOS={};
async function acCarregar(){const r=await sb.rpc('emp_pendentes_todos');
  if(r.error){$('acInfo').textContent='Não carregou: '+r.error.message;return;}AC=r.data||[];acPinta();badges();}
function acPinta(){const ks=Object.keys(FEITOS);
  $('acInfo').textContent=AC.length?AC.length+' cadastro'+(AC.length>1?'s':'')+' esperando liberação':'Nada esperando liberação';
  let b=ks.map(k=>{const f=FEITOS[k];return `<div class="cd" style="border-color:#9fd4b4"><div class="top"><b>✅ ${h(f.nome)}</b><span>${h(PN[f.papel]||f.papel)}</span></div>
    <div class="sub"><span class="emp">${h(f.empNome)}</span>Acesso liberado</div>
    <div class="bts"><a class="bt w" href="${'https://wa.me/'+(f.tel?'55'+f.tel:'')+'?text='+encodeURIComponent(f.msg)}" target="_blank" rel="noopener">Avisar no WhatsApp</a><button class="bt n" type="button" data-ok="${h(k)}">Fechar</button></div></div>`;}).join('');
  b+=AC.map((x,i)=>`<div class="cd" data-i="${i}"><div class="top"><b>${h(x.nome)}</b><span>${quando(x.em)}</span></div>
    <div class="sub"><span class="emp">${h(x.emp_nome||x.emp)}</span>${h(x.telefone||'')}</div>
    <div class="chips">${PAPEIS.map(p=>`<button type="button" data-p="${p[0]}">${p[1]}</button>`).join('')}</div>
    <div class="bts"><button class="bt p" type="button" data-lib>Liberar</button><button class="bt r" type="button" data-rec>Recusar</button></div><div class="st"></div></div>`).join('');
  if(!b)b='<div class="vazio"><i>👍</i><b>Ninguém esperando liberação</b>Quando alguém se cadastrar pelo link de primeiro acesso, aparece aqui.</div>';
  $('acL').innerHTML=b;}
$('acL').addEventListener('click',async e=>{const ok=e.target.closest('[data-ok]');if(ok){delete FEITOS[ok.dataset.ok];acPinta();return;}
  const c=e.target.closest('.cd[data-i]');if(!c)return;const x=AC[+c.dataset.i],st=c.querySelector('.st');
  const ch=e.target.closest('[data-p]');if(ch){c.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b===ch));st.textContent='';st.className='st';return;}
  const lib=e.target.closest('[data-lib]'),rec=e.target.closest('[data-rec]');if(!lib&&!rec)return;
  const btn=lib||rec;
  try{
    if(lib&&!c.querySelector('[data-p].on')){st.textContent='Escolha o setor antes de liberar.';st.className='st er';return;}
    btn.disabled=true;st.className='st';st.textContent=lib?'Liberando…':'Recusando…';
    const L=await sb.rpc('emp_pessoas_lista',{p_emp:x.emp});if(L.error)throw L.error;
    const p=(L.data||[]).find(q=>q.pendente&&q.nome===x.nome&&String(q.telefone||'')===String(x.telefone||''))||(L.data||[]).find(q=>q.pendente&&q.nome===x.nome);
    if(!p)throw new Error('Cadastro não encontrado. Toque em ↻ para atualizar.');
    if(rec){if(!confirm('Recusar o cadastro de '+x.nome+'? O pedido será apagado.')){btn.disabled=false;st.textContent='';return;}
      const r=await sb.rpc('emp_pessoa_recusar',{p_id:p.id});if(r.error)throw r.error;await acCarregar();return;}
    const papel=c.querySelector('[data-p].on').dataset.p;
    const r=await sb.rpc('emp_pessoa_salvar',{p_id:p.id,p_emp:x.emp,p_nome:p.nome,p_login:p.login,p_papel:papel,p_abas:null,p_ativo:true,p_senha:null});if(r.error)throw r.error;
    const tel=String(p.telefone||p.login||'').replace(/\D/g,''),empNome=x.emp_nome||x.emp;
    FEITOS[p.id]={nome:p.nome,papel,empNome,tel,msg:textoLib({nome:p.nome,papel,telefone:p.telefone,login:p.login},x.emp,empNome)};
    await acCarregar();
  }catch(err){btn.disabled=false;st.className='st er';st.textContent='⚠ '+(err.message||err);}});

/* ===== 📥 Para responder (mesma lista do botão no Painel da Matriz) ===== */
const TIPO={conv:['💬','Conversas das equipes','Responder'],sup:['🛟','Suporte dos vendedores','Abrir'],sol:['📨','Solicitações dos clientes','Abrir'],fila:['🛒','Pedidos do site sem vendedor','Ver fila']};
const PAPEL={gestor:'Gestor',compras:'Compras',vendas:'Vendas',gerente:'Gerente comercial',marketing:'Marketing',fabrica:'Fábrica',estoque:'Estoque'};
let RP={itens:[],empresas:{}};
async function rpCarregar(){const r=await sb.rpc('fc_caixa');if(r.error||!r.data){$('rpInfo').textContent='Não carregou'+(r.error?': '+r.error.message:'');return;}RP=r.data;rpPinta();badges();}
function rpPinta(){const D=RP,emp=k=>((D.empresas||{})[k]||k||'').split(' · ')[0];const it=D.itens||[];
  $('rpInfo').textContent=it.length?it.length+' esperando a FC':'Tudo respondido';
  let b='';Object.keys(TIPO).forEach(k=>{const L=it.filter(i=>i.tipo===k);if(!L.length)return;const [ic,t,ac]=TIPO[k];
    b+=`<div class="gr">${ic} ${t}<i>${L.length}</i></div>`+L.map(i=>{const urg=k==='fila'||(Date.now()-new Date(i.em))>4*36e5;
      const quem=k==='conv'?`${h(i.quem)} <span class="sub">· ${h(PAPEL[i.papel]||i.papel||'')}</span>`:h(i.quem||'Sem nome');
      const sub=k==='sol'?(i.status==='aceita'?'Em andamento':'Nova')+(i.sub?' · '+h(i.sub):''):'';
      return `<div class="cd ${urg?'urg':''}"><div class="top"><b>${quem}</b><span>${quando(i.em)}${i.n>1?' · '+i.n:''}</span></div>
        <div class="sub"><span class="emp">${h(emp(i.emp))}</span>${sub}</div>${i.texto?`<p>${h(i.texto)}</p>`:''}
        <div class="bts"><button class="bt p" type="button" data-k="${k}" data-id="${h(i.id)}" data-emp="${h(i.emp)}">${ac} →</button></div></div>`;}).join('');});
  if(!b)b='<div class="vazio"><i>👍</i><b>Tudo respondido</b>Quando chegar mensagem, solicitação ou pedido parado, aparece aqui.</div>';
  $('rpL').innerHTML=b;}
$('rpL').addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(!g)return;const k=g.dataset.k,id=g.dataset.id,emp=g.dataset.emp;
  if(k==='conv'&&window.FCConversas&&FCConversas.abrirMatriz){FCConversas.abrirMatriz(id).then(()=>rpCarregar());return;}
  if(k==='conv'||k==='sup'){location.href='painel.html';return;}
  if(k==='sol'){window.open('consultorias.html#'+encodeURIComponent(emp)+'/t=sol','_blank','noopener');return;}
  if(k==='fila'){window.open('orcamento/?e='+encodeURIComponent(emp)+'&aba=atd','_blank','noopener');}});


/* ===== 🟢 Quem está on-line (equipe FC, equipes dos clientes e Plataforma FC 3D) ===== */
const PL_URL='https://pawwncmfadzxfahfvhry.supabase.co/rest/v1/rpc/',PL_KEY='sb_publishable_b0kGoqo85joo3Vb8Xllxhw_VemwaLMs';
const APPS={implantacao:'Painel de Implantação',matriz:'Painel da Matriz'};
let PLE=null,ON=[];
async function plRpc(f,b){const r=await fetch(PL_URL+f,{method:'POST',headers:{apikey:PL_KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);return r.json();}
async function pl3d(){let t=null;try{t=localStorage.getItem('pfc-token')||localStorage.getItem('pfc-token-painel');}catch(_){}if(!t)return null;
  try{if(!PLE){try{PLE=await plRpc('pfc_matriz_empresas',{p_token:t})||[];}catch(_){PLE=[];}}
    const d=await plRpc('fc_online_clientes',{p_token:t,janela_min:10}),nm=id=>((PLE.find(x=>x.id===id)||{}).nome)||id||'Sem empresa';
    return (d||[]).map(p=>({grupo:'Plataforma FC 3D · '+nm(p.empresa_id),nome:p.nome||'Sem nome',sub:(PAPEL[p.papel]||(p.papel==='vendedor'?'Colaborador':p.papel)||'')+(p.tela?' · '+p.tela:''),visto:p.visto}));}catch(_){return [];}}
async function onCarregar(){const [r,p3]=await Promise.all([sb.rpc('fc_online_lista'),pl3d()]);const l=[];
  if(r.data){(r.data.equipe||[]).forEach(p=>l.push({grupo:'Equipe FC',nome:p.nome,sub:(APPS[p.app]||p.app||'')+(p.onde?' · '+p.onde:'')}));

/* ===== 🧪 Demonstrativos de 24 h (link fc3d/clientes/demo/) · 16/11/2026 ===== */
const DM_KT='pfc-token-painel';let DM=null,DMTOK=null,DMU=null;
const DMODS=[['Visita de Obra','#c26a00'],['Fábrica 3D','#02717d'],['Catálogo 3D','#5b4bc4'],['Início e outras telas','#8a9a9c']];
const dmMod=t=>{t=String(t||'');if(/^Visita de Obra/.test(t))return 'Visita de Obra';if(/^(Fábrica 3D|Orientativo 3D|Simulador Fábrica|Montagens|Tipologias|Desenho técnico)/.test(t))return 'Fábrica 3D';if(/^Catálogo 3D/.test(t))return 'Catálogo 3D';return 'Início e outras telas';};
const dmTmp=sg=>{sg=Math.round(sg||0);if(sg<60)return sg?sg+' s':'0 min';const m=Math.round(sg/60);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60?m%60+' min':'');};
const dmPor=L=>{const o={};(L||[]).forEach(x=>{const k=dmMod(x.tela);o[k]=(o[k]||0)+(x.seg||0);});return o;};
function dmGraf(){if(!DMU||!DMU.geral||!DMU.geral.length)return '';const m=dmPor(DMU.geral),tot=Object.values(m).reduce((a,b)=>a+b,0)||1;
  const bars=DMODS.filter(([k])=>m[k]).sort((a,b)=>m[b[0]]-m[a[0]]).map(([k,c])=>{const pc=Math.round(m[k]*100/tot);
    return `<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${k}</b><span><b>${pc}%</b> · ${dmTmp(m[k])}</span></div>
      <div style="background:#eef2f4;border-radius:6px;height:12px;overflow:hidden;margin-top:3px"><div style="width:${Math.max(pc,2)}%;height:100%;background:${c}"></div></div></div>`;}).join('');
  const tips=DMU.geral.filter(x=>/^Fábrica 3D · /.test(x.tela)).slice(0,3).map(x=>h(x.tela.replace('Fábrica 3D · ',''))+' ('+dmTmp(x.seg)+')').join(' · ');
  const H=(DMU.horas||[]).slice(6),mx=Math.max(1,...H);
  const hs=H.map((v,i)=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center"><div style="width:100%;height:${Math.round(v*36/mx)}px;background:${v?'#02717d':'transparent'};border-radius:2px 2px 0 0"></div><span style="font-size:8.5px;color:#8a9a9c">${(i+6)%6?'':i+6}</span></div>`).join('');
  return `<div class="cd"><b>📊 Onde mais usaram</b><div class="sub">todos os demonstrativos · ${dmTmp(tot)} no total</div>${bars}
    ${tips?`<div class="sub" style="margin-top:6px">Tipologias mais vistas: ${tips}</div>`:''}
    <div class="sub" style="margin-top:8px">Horários de uso (06h às 24h)</div><div style="display:flex;gap:1px;height:48px;align-items:flex-end">${hs}</div></div>`;}
const zapDm=w=>{let n=String(w||'').replace(/\D/g,'');if(n.length<=11)n='55'+n;return 'https://wa.me/'+n;};
const resta=d=>{const ms=new Date(d.expira)-Date.now();if(ms<=0)return 'terminou';const hs=Math.floor(ms/36e5),mi=Math.floor(ms/6e4)%60;return 'faltam '+(hs?hs+' h ':'')+mi+' min';};
async function dmToken(){for(const t of [DMTOK,localStorage.getItem(DM_KT),localStorage.getItem('pfc-token')]){if(!t)continue;try{await plRpc('pfc_adm_demo_lista',{p_token:t});DMTOK=t;return t;}catch(_){}}DMTOK=null;return null;}
async function dmCarregar(){if(!DMTOK&&!(await dmToken())){DM=null;dmPinta();return;}
  try{DM=await plRpc('pfc_adm_demo_lista',{p_token:DMTOK})||[];}catch(_){DMTOK=null;DM=null;}
  try{DMU=DMTOK?await plRpc('pfc_adm_demo_uso',{p_token:DMTOK}):null;}catch(_){DMU=null;}dmPinta();badges();}

    L.innerHTML=`<div class="cd"><div class="sub" style="margin-bottom:8px">Informe uma vez a senha do <b>Acesso FC</b> da Plataforma FC 3D. Fica guardada neste celular.</div>
     <input id="dmS" type="password" autocomplete="current-password" placeholder="Senha do Acesso FC" style="width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;font:16px inherit;box-sizing:border-box">
     <div class="bts"><button class="bt p" type="button" id="dmE">Entrar</button></div><div class="sub" id="dmM" style="color:var(--bad);margin-top:6px"></div></div>`;
    $('dmE').onclick=async()=>{$('dmM').textContent='';try{const r=await plRpc('pfc_login_matriz',{p_senha:$('dmS').value});if(!r||r.erro){$('dmM').textContent=(r&&r.erro)||'Não conectou.';return;}
      DMTOK=r.token;localStorage.setItem(DM_KT,r.token);dmCarregar();}catch(_){$('dmM').textContent='Não conectou. Confira a internet.';}};return;}
  const pend=DM.filter(d=>d.status==='pendente'),at=DM.filter(d=>d.status!=='pendente'&&d.ativo&&new Date(d.expira)>Date.now());
  $('dmInfo').textContent=DM.length?`${at.length} usando agora · ${pend.length} aguardando · ${DM.length} no total`:'Ninguém se cadastrou ainda';

    return `<div class="cd"><div class="top"><b>${d.status==='pendente'?'⏳':vivo?'🟢':'⚪'} ${h(d.nome)}</b><span>${quando(d.criado)}</span></div>
    <div class="sub">${h(d.whats||'')}${d.status==='pendente'?' · aguardando liberação':' · '+(d.ativo?resta(d):'pausado')}${d.tela?' · '+h(d.tela):''}${d.entradas?' · '+d.entradas+' entrada'+(d.entradas>1?'s':''):''}</div>

    <div class="bts">${d.status==='pendente'?`<button class="bt p" type="button" data-dl="${d.id}" data-v="1">Liberar agora</button><button class="bt r" type="button" data-dl="${d.id}" data-v="0">Recusar</button>`
      :`<button class="bt n" type="button" data-dmais="${d.id}">+24 h</button><button class="bt ${d.ativo?'r':'p'}" type="button" data-da="${d.id}" data-v="${d.ativo?0:1}">${d.ativo?'Pausar':'Reativar'}</button>`}
      <a class="bt w" href="${zapDm(d.whats)}" target="_blank" rel="noopener">WhatsApp</a></div>
    <div class="bts"><button class="bt r" type="button" data-dx="${d.id}">🗑 Excluir cadastro</button></div></div>`;};
  L.innerHTML=DM.length?dmGraf()+DM.map(card).join('')+'<div class="dica">Link para enviar: https://fc-consultoria.github.io/fc3d/clientes/demo/ · vale 24 h a partir do primeiro acesso (00h às 06h não conta).</div>'
    :'<div class="vazio"><i>🧪</i><b>Ninguém se cadastrou ainda</b>Quando alguém abrir o link do demonstrativo, aparece aqui.</div>';}
$('dmL').addEventListener('click',async e=>{const b=e.target.closest('[data-dl],[data-dmais],[data-da],[data-dx]');if(!b)return;
  if(b.dataset.dx){const d=(DM||[]).find(x=>String(x.id)===b.dataset.dx);if(!confirm('Excluir o cadastro de '+(d?d.nome:'')+'? O acesso termina na hora. Não dá para desfazer.'))return;

  if(b.dataset.dl&&b.dataset.v==='0'&&!confirm('Recusar este pedido? A pessoa não vai conseguir entrar.'))return;b.disabled=true;

  dmCarregar();});

/* ===== 📅 Agenda · visitas, viagens e treinamentos (21/11/2026) ===== */
const AGT={visita:['📍','Visita presencial'],viagem:['✈️','Viagem'],treinamento:['🎓','Treinamento']};
const AGTR={carro:'Carro próprio',onibus:'Ônibus',aviao:'Avião',outro:'Outro'};
const AGS={a_confirmar:['A confirmar','tg-a'],confirmado:['Confirmado','tg-c'],realizado:['Realizado','tg-r'],cancelado:['Cancelado','tg-x']};
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dBR=d=>d?d.split('-').reverse().slice(0,2).join('/'):'';
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const maisDias=(n)=>{const d=new Date();d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];const dSem=d=>SEM[new Date(d+'T12:00').getDay()];
let AG=[],AGF='pro',AGMES=hoje().slice(0,7);
/* Datas que o Fernando não pode viajar (aniversários) · MM-DD · 21/11/2026 */
const AGBLOQ=['01-11','04-16','11-28','11-03'];
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),di=((hh+l-7*m+114)%31)+1;return new Date(y,mo-1,di,12);}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function feriados(y){const F={[y+'-01-01']:'Confraternização Universal',[y+'-04-21']:'Tiradentes',[y+'-05-01']:'Dia do Trabalho',[y+'-09-07']:'Independência',[y+'-10-12']:'Nossa Senhora Aparecida',[y+'-11-02']:'Finados',[y+'-11-15']:'Proclamação da República',[y+'-11-20']:'Consciência Negra',[y+'-12-25']:'Natal'};
  const p=pascoa(y),add=(n,t)=>{const d=new Date(p);d.setDate(d.getDate()+n);F[iso(d)]=t;};add(-48,'Carnaval (ponto facultativo)');add(-47,'Carnaval (ponto facultativo)');add(-2,'Sexta-feira Santa');add(60,'Corpus Christi');return F;}
function marca(dt){const y=+dt.slice(0,4),F=feriados(y);const r=[];if(AGBLOQ.includes(dt.slice(5)))r.push({b:true,t:'Aniversário · não viajar'});if(F[dt])r.push({b:false,t:F[dt]});return r;}
function diasEntre(a,b){const L=[];let d=new Date(a+'T12:00');const f=new Date((b||a)+'T12:00');while(d<=f&&L.length<60){L.push(iso(d));d.setDate(d.getDate()+1);}return L;}
const conflitos=x=>diasEntre(x.data_ida,x.data_volta).flatMap(d=>marca(d).map(m=>({d,...m})));
function agDatas(){const L=[];for(let i=0;i<=60;i++){const d=maisDias(i);marca(d).forEach(m=>L.push({d,...m}));}
  return L.length?`<div class="gr">Datas importantes · próximos 60 dias</div><div class="cd" style="padding:8px 12px">${L.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13.5px"><span>${dSem(x.d)} ${dBR(x.d)}</span><span class="tag ${x.b?'tg-x':'tg-c'}">${x.b?'🎂 ':'🗓 '}${h(x.t)}</span></div>`).join('')}</div>`:'';}

      <div class="bts">${x.status==='a_confirmar'?`<button class="bt p" type="button" data-st="confirmado">Confirmar</button>`:''}${x.status==='confirmado'?`<button class="bt p" type="button" data-st="realizado">Realizado</button>`:''}${x.status==='realizado'||x.status==='cancelado'?`<button class="bt n" type="button" data-st="confirmado">Reabrir</button>`:''}<button class="bt n" type="button" data-ed>Editar</button></div></div>`;}).join('')

function agForm(x){x=x||{tipo:'visita',quem_paga:'fc',status:'a_confirmar'};const o=(m,v)=>Object.entries(m).map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${Array.isArray(t)?t[1]:t}</option>`).join('');

   <label>Tipo</label><select id="fTipo">${o(AGT,x.tipo)}</select>
   <div class="dois"><div><label>Cliente *</label><input id="fCli" value="${h(x.cliente||'')}" placeholder="CDE Vidros"></div><div><label>Cidade</label><input id="fCid" value="${h(x.cidade||'')}" placeholder="Manaus"></div></div>
   <div class="dois"><div><label>Data (ida) *</label><input id="fDi" type="date" value="${x.data_ida||''}"></div><div><label>Horário</label><input id="fHi" type="time" value="${h(x.hora_ida||'')}"></div></div>
   <div class="dois"><div><label>Volta</label><input id="fDv" type="date" value="${x.data_volta||''}"></div><div><label>Horário volta</label><input id="fHv" type="time" value="${h(x.hora_volta||'')}"></div></div>
   <div class="dois"><div><label>Transporte</label><select id="fTr"><option value="">—</option>${o(AGTR,x.transporte)}</select></div><div><label>Companhia</label><input id="fCo" value="${h(x.companhia||'')}" placeholder="Azul"></div></div>
   <div class="dois"><div><label>Localizador</label><input id="fLo" value="${h(x.localizador||'')}" autocapitalize="characters"></div><div><label>Valor passagem R$</label><input id="fVp" type="number" inputmode="decimal" step="0.01" min="0" value="${x.valor_passagem??''}"></div></div>
   <div class="dois"><div><label>Hospedagem</label><input id="fHo" value="${h(x.hospedagem||'')}" placeholder="Hotel"></div><div><label>Valor hospedagem R$</label><input id="fVh" type="number" inputmode="decimal" step="0.01" min="0" value="${x.valor_hospedagem??''}"></div></div>
   <div class="dois"><div><label>Quem paga</label><select id="fPg">${o({fc:'FC',cliente:'Cliente reembolsa'},x.quem_paga)}</select></div><div><label>Status</label><select id="fSt">${o(Object.fromEntries(Object.entries(AGS).map(([k,v])=>[k,v[0]])),x.status)}</select></div></div>
   <label>Observação</label><textarea id="fOb" rows="2">${h(x.obs||'')}</textarea>
   <div class="st" id="fMsg"></div>
   <div class="bts"><button class="bt p" type="button" id="fSalva">Salvar</button><button class="bt n" type="button" id="fCanc">Cancelar</button></div>
   ${x.id?`<div class="bts"><button class="bt r" type="button" id="fDel">🗑 Excluir</button></div>`:''}</div>`;
  ['fCli','fDi'].forEach(i=>$(i).oninput=()=>{$('fMsg').textContent='';});
  $('fCanc').onclick=()=>{$('agForm').innerHTML='';};
  if(x.id)$('fDel').onclick=async()=>{if(!confirm('Excluir este compromisso? Não dá para desfazer.'))return;const r=await sb.from('fc_agenda').delete().eq('id',x.id);if(r.error){$('fMsg').className='st er';$('fMsg').textContent='⚠ '+r.error.message;return;}$('agForm').innerHTML='';agCarregar();};
  $('fSalva').onclick=async()=>{const v=i=>$(i).value.trim(),n=i=>v(i)===''?null:Math.round(+v(i)*100)/100;
    if(!v('fCli')||!v('fDi')){$('fMsg').className='st er';$('fMsg').textContent='Preencha cliente e data de ida.';return;}
    if(v('fDv')&&v('fDv')<v('fDi')){$('fMsg').className='st er';$('fMsg').textContent='A volta não pode ser antes da ida.';return;}
    const d={tipo:v('fTipo'),cliente:v('fCli'),cidade:v('fCid')||null,data_ida:v('fDi'),hora_ida:v('fHi')||null,data_volta:v('fDv')||null,hora_volta:v('fHv')||null,transporte:v('fTr')||null,companhia:v('fCo')||null,localizador:v('fLo').toUpperCase()||null,valor_passagem:n('fVp'),hospedagem:v('fHo')||null,valor_hospedagem:n('fVh'),quem_paga:v('fPg'),status:v('fSt'),obs:v('fOb')||null,atualizado:new Date().toISOString()};
    {const c=conflitos({data_ida:v('fDi'),data_volta:v('fDv')||null});const b=c.filter(k=>k.b),f=c.filter(k=>!k.b);
     if(b.length&&!confirm('Atenção: '+b.map(k=>dBR(k.d)).join(', ')+' é aniversário (dia sem viagem). Salvar mesmo assim?'))return;
     if(f.length&&!b.length&&!confirm('Este compromisso cai em feriado: '+f.map(k=>dBR(k.d)+' '+k.t).join(', ')+'. Salvar mesmo assim?'))return;}
    $('fSalva').disabled=true;$('fMsg').className='st';$('fMsg').textContent='Salvando…';
    const r=x.id?await sb.from('fc_agenda').update(d).eq('id',x.id):await sb.from('fc_agenda').insert(d);
    if(r.error){$('fSalva').disabled=false;$('fMsg').className='st er';$('fMsg').textContent='⚠ '+r.error.message;return;}
    $('agForm').innerHTML='';AGF='pro';agCarregar();};
  $('agForm').scrollIntoView({behavior:'smooth',block:'start'});}
$('agNovo').onclick=()=>agForm();
$('agF').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;AGF=b.dataset.f;agPinta();});
$('agL').addEventListener('click',async e=>{const m=e.target.closest('[data-mes]');if(m){const [y,mo]=AGMES.split('-').map(Number);const d=new Date(y,mo-1+(+m.dataset.mes),1);AGMES=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');agPinta();return;}
  const rb=e.target.closest('[data-rb]');if(rb){rb.disabled=true;const r=await sb.from('fc_agenda').update({reembolsado:true,atualizado:new Date().toISOString()}).eq('id',rb.dataset.rb);if(r.error)alert('Não foi possível: '+r.error.message);agCarregar();return;}
  const c=e.target.closest('[data-ag]');if(!c)return;const x=AG.find(i=>i.id===c.dataset.ag);
  if(e.target.closest('[data-ed]')){agForm(x);return;}
  const s=e.target.closest('[data-st]');if(s){s.disabled=true;const r=await sb.from('fc_agenda').update({status:s.dataset.st,atualizado:new Date().toISOString()}).eq('id',x.id);if(r.error)alert('Não foi possível: '+r.error.message);agCarregar();}});

/* ===== números nas abas e no ícone do app ===== */
function badges(){const a=AC.length,r=(RP.itens||[]).length;
  [[$('nAc'),a],[$('nRp'),r]].forEach(([el,n])=>{el.textContent=n>99?'99+':n;el.classList.toggle('on',n>0);});
  {const o=ON.length,el=$('nOn');el.textContent=o>99?'99+':o;el.classList.toggle('on',o>0);}
  {const p=(DM||[]).filter(d=>d.status==='pendente').length,el=$('nDm');el.textContent=p;el.classList.toggle('on',p>0);}
  {const H=hoje(),A=maisDias(1),g=AG.filter(x=>x.status!=='realizado'&&x.status!=='cancelado'&&(x.data_ida===H||x.data_ida===A)).length,el=$('nAg');el.textContent=g;el.classList.toggle('on',g>0);}
  document.title=(a+r?'('+(a+r)+') ':'')+'Matriz FC';
  try{if(navigator.setAppBadge){a+r?navigator.setAppBadge(a+r):navigator.clearAppBadge();}}catch(_){}}

function tudo(){return Promise.all([acCarregar(),rpCarregar(),onCarregar(),dmCarregar(),agCarregar()]);}
$('bAt').onclick=()=>{$('bAt').textContent='…';tudo().finally(()=>{$('bAt').textContent='↻';});};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('gate').hidden&&LOGADO)tudo();});

let LOGADO=false;
gateUI(()=>{LOGADO=true;
  try{const s=localStorage.getItem('fc-cel-aba');if(TIT[s])aba(s);}catch(_){}
  const q=new URLSearchParams(location.search).get('aba');if(TIT[q])aba(q);
  try{window.FCConversas&&FCConversas.matriz&&FCConversas.matriz({semBotao:true});}catch(_){}
  tudo();setInterval(()=>{if(!document.hidden)tudo();},60000);setInterval(()=>{if(!document.hidden&&ABA==='on')onCarregar();},20000);
},{soMatriz:true});
})();
</script>
</body>
</html>
