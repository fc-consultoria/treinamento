<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Orçamentos · FC Consultoria</title>
<link rel="icon" href="/img/logo-fc-160.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--tl:#0f6b70;--tl2:#13878d;--tlc:#e5f2f2;--or:#f2a51e;--orc:#fff4dc;--ink:#13232e;--tm:#5a6b75;--ln:#d8e2e6;--bg:#f2f6f7;--ok:#15803d;--okc:#e7f6ec;--bx:#b42318;--bxc:#fdecea;--f-d:'Barlow Condensed',system-ui,sans-serif;--f-b:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b)}
button,input,select,textarea{font-family:inherit;font-size:15px}
.rgate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#e9f0f0;padding:16px}.rgate[hidden]{display:none}
.rgate form{width:min(360px,100%);background:#fff;border:1px solid #d6e1e1;border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.rgate h1{margin:0;font:800 28px var(--f-d)}.rgate small{color:#5a6e72;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rgate label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}.rgate input{padding:9px 10px;border:1px solid #c4ccd2;border-radius:8px}
.rgate button{background:var(--tl);color:#fff;border:0;border-radius:9px;padding:11px;font-weight:700;cursor:pointer}
.top{background:var(--tl);color:#fff;box-shadow:0 2px 0 var(--or)}
.top .w{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:40px;height:40px;border-radius:9px;object-fit:cover;background:#fff}.top b{font:800 22px/1 var(--f-d)}.top small{display:block;font:600 11.5px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:#ffd58a}
.top .sp{flex:1}.top select,.top a.vt{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:7px 10px;font-weight:700;text-decoration:none;font-size:14px}
.top select option{color:var(--ink)}
main{max-width:1240px;margin:0 auto;padding:16px 16px 80px}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.abas button{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;color:var(--ink)}
.abas button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.box{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:14px}
h2.t{margin:0 0 10px;font:800 24px/1.1 var(--f-d);color:#0f4f53}h3{margin:0 0 8px;font:800 19px var(--f-d);color:#0f4f53}
.nota{color:var(--tm);font-size:14px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--tm)}
label.f input,label.f select,label.f textarea,.inp{padding:9px 10px;border:1px solid #c4ccd2;border-radius:9px;background:#fff;color:var(--ink);font-weight:500;width:100%}
textarea{resize:vertical;min-height:60px}
.btn{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--tl);border-color:var(--tl);color:#fff}.btn.or{background:var(--or);border-color:var(--or)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.mini{padding:4px 9px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.busca{position:relative}.busca input{font:600 18px var(--f-b);padding:11px 14px;border:2px solid var(--tl);border-radius:12px;width:100%}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--ln);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);max-height:420px;overflow:auto;z-index:20}
.sug button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid #eef2f4;background:#fff;padding:7px 10px;cursor:pointer}
.sug button:hover,.sug button.on{background:var(--tlc)}
.th{width:58px;height:42px;flex:none;border:1px solid #e3e9ec;border-radius:7px;background:#fff center/contain no-repeat;display:grid;place-items:center;color:#b6c1c7;font-size:18px}
.sug .d{flex:1;min-width:0}.sug .d b{font-size:14px}.sug .d small{display:block;color:var(--tm);font-size:12.5px}.sug .p{font-weight:800;white-space:nowrap}
table.it{width:100%;border-collapse:collapse;font-size:14px}table.it th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--tm);text-align:left;padding:6px;border-bottom:2px solid var(--ln)}
table.it td{padding:6px;border-bottom:1px solid #eef2f4;vertical-align:middle}table.it td.n,table.it th.n{text-align:right;white-space:nowrap}
table.it input.q{width:72px;padding:6px;border:1px solid #c4ccd2;border-radius:8px;text-align:right}
table.it input.pz{width:92px;padding:6px;border:1px solid #f2a51e;border-radius:8px;text-align:right}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 18px;max-width:460px;align-items:center;margin-left:auto;font-size:15px}.tot b{text-align:right}.tot .g{font:800 24px var(--f-d);color:#0f4f53}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:#eef2f4}
.s-aberto{background:#e8f0ff;color:#1d4ed8}.s-enviado{background:var(--orc);color:#92400e}.s-aprovado{background:var(--okc);color:var(--ok)}.s-perdido,.s-cancelado{background:var(--bxc);color:var(--bx)}
.est{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.12)}
.vazio{color:var(--tm);text-align:center;padding:30px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#13232e;color:#fff;padding:10px 18px;border-radius:12px;z-index:9000;font-weight:600}
.parc{background:var(--tlc);border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
/* impressão */
#imp{display:none}
@media print{body{background:#fff}.top,main,.toast,#impOv{display:none!important}#imp{display:block!important}@page{size:A4;margin:10mm}}
#impOv{position:fixed;inset:0;background:rgba(10,20,28,.6);z-index:5000;overflow:auto;padding:20px 10px}
#impOv .bar{max-width:820px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.folha{max-width:820px;margin:0 auto;background:#fff;color:#111;padding:26px 28px;font:13px/1.35 Arial,Helvetica,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.folha .cab{display:flex;gap:16px;align-items:center;border-bottom:2px solid #0f6b70;padding-bottom:10px}
.folha .cab img{max-width:150px;max-height:70px;object-fit:contain}.folha .cab .e{flex:1;text-align:center}.folha .cab .e b{font-size:17px;display:block}
.folha .tt{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 6px}.folha .tt b{font-size:20px;color:#0f6b70}
.folha .cli{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;border:1px solid #cfd8dc;border-radius:6px;padding:8px 10px;font-size:12.5px}
.folha table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.folha th{background:#eef4f5;text-align:left;padding:5px;border-bottom:1px solid #9fb3b8;font-size:11px}
.folha td{padding:5px;border-bottom:1px solid #e3e9ec;vertical-align:middle}.folha td.n,.folha th.n{text-align:right;white-space:nowrap}
.folha td.ft img{width:78px;height:52px;object-fit:contain;display:block}
.folha .rod{display:flex;gap:20px;justify-content:space-between;margin-top:12px;align-items:flex-start}
.folha .rod .tt2{min-width:260px}.folha .rod .tt2 div{display:flex;justify-content:space-between;padding:2px 0}.folha .rod .tt2 .g{gap:14px;font-size:16px;font-weight:800;border-top:2px solid #0f6b70;margin-top:4px;padding-top:4px}
.folha .ob{font-size:11.5px;color:#333;white-space:pre-wrap}
@media print{.folha{box-shadow:none;padding:0;max-width:none}.folha tr{break-inside:avoid}}
@media(max-width:700px){.folha .cli{grid-template-columns:1fr}table.it .hm{display:none}}
</style>
</head>
<body>
<div class="rgate" id="gate" hidden><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>🧾 Orçamentos</h1>
<label>Login<input name="login" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>
<header class="top"><div class="w"><img id="hdLogo" src="/img/logo-fc-160.jpg" alt=""><div><small id="hdSub">Painel de orçamentos</small><b id="hd">Orçamentos</b></div><span class="sp"></span><select id="selEmp" hidden aria-label="Cliente"></select></div></header>
<main id="app"><p class="vazio">Carregando…</p></main>
<div id="imp"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../auth.js"></script>
<script src="../planilha.js?v=2"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=new URLSearchParams(location.search),VKEY=Q.get('v')||Q.get('k')||'',GESTOR=!Q.get('v')&&!!Q.get('k');
const BASE='https://fc-consultoria.github.io/treinamento/';
const nk=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const sem=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const n2=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rs=v=>'R$ '+n2(v);
const num=s=>{s=String(s??'').trim().replace(/\s/g,'').replace(/^R\$/,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=+s;return isNaN(v)?0:v;};
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const maisDias=n=>{const d=new Date();d.setDate(d.getDate()+(+n||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dBR=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const fotoUrl=f=>!f?'':/^https?:/.test(f)?f:'../'+f;
/* ---------- estoque (importado do sistema da empresa) ---------- */
const FX=()=>Object.assign({verm:0,lar:6,verde:8,dias:15},(D&&D.cab&&D.cab.estFx)||{});
function estDe(id){const i=D&&D.itens.find(x=>x.id===id);return i&&i.est!=null?i.est:null;}
function estB(q){if(q==null||q==='')return '';const f=FX(),v=+q;const [bg,fc,t]=v<f.verm?['','#dc2626','sem estoque']:v<f.lar?['','#f97316','estoque baixo']:v>f.verde?['','#16a34a','estoque bom']:['','#eab308','estoque no limite'];
  return `<span class="est" title="${t[0].toUpperCase()+t.slice(1)}${ADM?' ('+String(v).replace('.',',')+' barras)':''}" style="background:${fc}"></span>`;}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}
const ST={aberto:'Em aberto',enviado:'Enviado ao cliente',aprovado:'Aprovado',perdido:'Perdido',cancelado:'Cancelado'};
const PAG_PADRAO=['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Boleto','Transferência','Cheque'];

let FC=false,ADM=false,EMP='',EMPS=[],D=null,ABA='novo',O=null,BQ='',SUGI=0;
const novoOrc=()=>({id:null,cliente:{},itens:[],pagamento:{forma:'',cond:'avista',parcelas:1,prazos:'',entrada:0,obs:''},desconto:0,descTipo:'rs',frete:0,validade:maisDias(D&&D.validade_dias||7),obs:D&&D.obs||'',status:'aberto'});

async function rpcDados(){const r=await sb.rpc('orc_dados',{p_chave:FC?null:VKEY,p_emp:FC?EMP:null});
  if(r.error){if(/function|does not exist|schema cache/i.test(r.error.message||''))return 'sql';return null;}return r.data;}
async function carregar(){const d=await rpcDados();
  if(d==='sql'){$('#app').innerHTML='<div class="box"><h2 class="t">Falta rodar o SQL</h2><p class="nota">Rode o arquivo orcamentos.sql no Supabase para ativar o painel de orçamentos.</p></div>';return false;}
  if(!d){$('#app').innerHTML='<p class="vazio">Link inválido ou desativado. Fale com o gestor da empresa ou com a FC Consultoria.</p>';return false;}
  D=d;EMP=d.emp;if(!FC)ADM=!!d.adm;const c=d.cab||{};$('#hd').textContent='Orçamentos · '+(c.nome||d.nome||'');$('#hdSub').textContent=FC?'FC Consultoria · painel da matriz':GESTOR?'Gestor da empresa':'Vendedor: '+((d.vend&&d.vend.nome)||'');
  if(c.logo)$('#hdLogo').src=fotoUrl(c.logo);
  if(!O)O=novoOrc();return true;}

/* ================= TELA ================= */
function tela(){if(!D)return;const ab=[['novo',O&&O.id?'✏️ Orçamento nº '+(O.numero||''):'🧾 Novo orçamento'],['lista','📂 Orçamentos ('+D.orcs.length+')']];if(ADM)ab.push(['cfg','⚙️ Configurar']);
  let h=`<div class="abas">${ab.map(([k,t])=>`<button type="button" data-ab="${k}" class="${ABA===k?'on':''}">${esc(t)}</button>`).join('')}</div>`;
  if(!D.itens.length&&ABA!=='cfg')h+=`<div class="box" style="border-color:var(--or);background:var(--orc)"><b>Ainda não há itens liberados para orçamento.</b><p class="nota" style="margin:2px 0 0">${ADM?'Vá em ⚙️ Configurar e clique em "Atualizar itens da precificação".':'A FC Consultoria está preparando a lista de itens. Volte mais tarde.'}</p></div>`;
  if(ABA==='novo')h+=telaNovo();else if(ABA==='lista')h+=telaLista();else h+=telaCfg();
  $('#app').innerHTML=h;$$('[data-ab]').forEach(b=>b.onclick=()=>{ABA=b.dataset.ab;tela();});
  if(ABA==='novo')wireNovo();else if(ABA==='lista')wireLista();else wireCfg();}

/* ---------- novo / editar ---------- */
function calc(){const sub=O.itens.reduce((a,i)=>a+Math.round(num(i.preco)*num(i.qtd)*100)/100,0);let dsc=O.descTipo==='pc'?Math.round(sub*num(O.descPc)/100*100)/100:num(O.desconto);
  const max=Math.round(sub*(+D.desc_max||0)/100*100)/100;const pf=sub>0?Math.min(1,Math.max(0,dsc)/sub):0;const acima=!ADM&&dsc>max+0.001;const fr=num(O.frete);return {sub,dsc,max,acima,fr,pf,tot:Math.max(0,sub-Math.min(dsc,sub)+fr)};}
function parcelasTxt(t){const p=O.pagamento;if(p.cond!=='parcelado')return '';const ent=num(p.entrada),n=Math.max(1,parseInt(p.parcelas)||1),rest=Math.max(0,t-ent),v=Math.round(rest/n*100)/100;
  const pz=String(p.prazos||'').split(/[\/;, ]+/).filter(Boolean);return (ent>0?`Entrada ${rs(ent)} + `:'')+`${n}x de ${rs(v)}`+(pz.length?` (${pz.join('/')} dias)`:'');}
function telaNovo(){const c=O.cliente,p=O.pagamento,k=calc(),pag=(D.pag&&D.pag.length?D.pag:PAG_PADRAO);
  return `<div class="box"><h3>👤 Cliente</h3><div class="grid">
   <label class="f">Nome / Razão social *<input data-c="nome" value="${esc(c.nome)}" maxlength="120"></label>
   <label class="f">CPF / CNPJ<input data-c="doc" value="${esc(c.doc)}" maxlength="30"></label>
   <label class="f">Telefone / WhatsApp<input data-c="fone" value="${esc(c.fone)}" maxlength="30" inputmode="tel"></label>
   <label class="f">E-mail<input data-c="email" value="${esc(c.email)}" maxlength="80"></label>
   <label class="f">Endereço<input data-c="end" value="${esc(c.end)}" maxlength="150"></label>
   <label class="f">Cidade / UF<input data-c="cidade" value="${esc(c.cidade)}" maxlength="60"></label></div></div>
  <div class="box"><h3>📦 Itens do orçamento</h3>
   <div class="busca"><input id="bq" placeholder="Digite o código ou o nome do item (ex.: trilho, SU-001, TBX028)" autocomplete="off" value="${esc(BQ)}"><div class="sug" id="sug" hidden></div></div>
   <p class="nota">Os preços vêm da tabela de precificação da empresa. ${ADM?'Na FC você pode ajustar o preço de uma linha (campo laranja) e incluir item avulso.':''}</p>
   ${ADM?`<details style="margin:6px 0"><summary class="nota" style="cursor:pointer">＋ Item avulso (só FC)</summary><div class="row" style="margin-top:6px"><input class="inp" id="avC" placeholder="Código" style="max-width:130px"><input class="inp" id="avD" placeholder="Descrição" style="flex:1;min-width:200px"><input class="inp" id="avU" placeholder="Un" value="UN" style="max-width:70px"><input class="inp" id="avP" placeholder="Preço R$" style="max-width:110px"><button class="btn" type="button" id="avAdd">Incluir</button></div></details>`:''}
   ${O.itens.length?`<div style="overflow-x:auto"><table class="it"><thead><tr><th></th><th>Código</th><th>Produto</th><th class="hm">Un</th><th class="n">Qtde</th><th class="n">Vlr unit.</th>${k.pf>0?'<th class="n">Vlr c/ desconto</th>':''}<th class="n">Total</th><th></th></tr></thead><tbody>
    ${O.itens.map((i,x)=>`<tr><td><div class="th" style="${i.foto?`background-image:url('${esc(fotoUrl(i.foto))}')`:''}">${i.foto?'':'▭'}</div></td><td style="white-space:nowrap">${estB(estDe(i.id))}<b>${esc(i.cod)}</b></td><td>${esc(i.desc)}${i.cor?` <span class="pill">${esc(i.cor)}</span>`:''}</td><td class="hm">${esc(i.un||'BR')}</td>
     <td class="n"><input class="q" data-q="${x}" value="${esc(String(i.qtd).replace('.',','))}" inputmode="decimal"></td>
     <td class="n">${ADM?`<input class="pz" data-pz="${x}" value="${n2(i.preco)}" inputmode="decimal">`:rs(i.preco)}</td>${k.pf>0?`<td class="n" style="color:var(--ok);font-weight:700">${rs(num(i.preco)*(1-k.pf))}</td>`:''}<td class="n"><b>${rs(num(i.preco)*(1-k.pf)*num(i.qtd))}</b></td><td><button class="btn mini" type="button" data-rm="${x}" title="Tirar">✕</button></td></tr>`).join('')}
   </tbody></table></div>`:'<p class="vazio" style="padding:14px">Nenhum item ainda. Pesquise acima e toque no item para incluir.</p>'}
   <div class="tot" style="margin-top:12px"><span>Subtotal (sem desconto)</span><b>${rs(k.sub)}</b>
    <span>Desconto <select id="dTp" class="inp" style="width:auto;padding:3px 6px;display:inline-block"><option value="rs" ${O.descTipo!=='pc'?'selected':''}>R$</option><option value="pc" ${O.descTipo==='pc'?'selected':''}>%</option></select>
     <input id="dV" class="inp" style="width:100px;padding:4px 8px;display:inline-block" value="${O.descTipo==='pc'?esc(O.descPc||''):(O.desconto?n2(O.desconto):'')}" inputmode="decimal"></span><b>- ${rs(Math.min(k.dsc,k.sub))}</b>
    <span>Frete <input id="fV" class="inp" style="width:100px;padding:4px 8px;display:inline-block" value="${O.frete?n2(O.frete):''}" inputmode="decimal"></span><b>${rs(k.fr)}</b>
    <span class="g">Total</span><b class="g">${rs(k.tot)}</b></div>
   ${!ADM?`<p class="nota" style="text-align:right">Desconto máximo permitido: ${n2(D.desc_max)}% (${rs(k.max)})</p>`:''}
   ${k.acima?`<p style="color:var(--bx);font-weight:700;text-align:right">⚠ Desconto acima do limite. Fale com o gestor.</p>`:''}</div>
  <div class="box"><h3>💳 Forma de pagamento</h3><div class="grid">
   <label class="f">Forma<select data-p="forma"><option value="">— escolher —</option>${pag.map(f=>`<option ${p.forma===f?'selected':''}>${esc(f)}</option>`).join('')}</select></label>
   <label class="f">Condição<select data-p="cond"><option value="avista" ${p.cond!=='parcelado'?'selected':''}>À vista</option><option value="parcelado" ${p.cond==='parcelado'?'selected':''}>Parcelado</option></select></label>
   ${p.cond==='parcelado'?`<label class="f">Nº de parcelas<input data-p="parcelas" value="${esc(p.parcelas)}" inputmode="numeric"></label>
   <label class="f">Prazos (dias)<input data-p="prazos" value="${esc(p.prazos)}" placeholder="ex.: 30/60/90"></label>

const corDe=t=>{const u=sem(t).toUpperCase();const k=COR_RX.find(x=>u.includes(x[0]));return k?k[1]:'';};
function lerAba(sh,mt){const keys=Object.keys(sh.c),rows={};keys.forEach(a=>{const mm=a.match(/^([A-Z]+)(\d+)$/);if(mm)(rows[+mm[2]]=rows[+mm[2]]||[]).push(mm[1]);});
  const R=Object.keys(rows).map(Number).sort((a,b)=>a-b),txt=(c,r)=>{const v=mt.val(sh,c+r);return v==null?'':String(v).trim();};
  const PRC=h=>h==='preco de venda barra'||h.startsWith('valor da vara')||h==='preco de venda';
  let col=null,linha='',cor='',forn='',lastH=-9;const out=[];
  for(const r of R){const cs=rows[r];const H={};cs.forEach(c=>{const v=mt.val(sh,c+r);if(typeof v==='string')H[c]=sem(v).replace(/\s+/g,' ').trim();});
    const fm=Object.values(H).map(h=>h.match(/fornecedor\s*:\s*([a-z0-9-]+)/)).find(Boolean);if(fm)forn=fm[1].toUpperCase();
    const pcs=Object.keys(H).filter(c=>PRC(H[c])).sort((a,b)=>(H[b]==='preco de venda barra')-(H[a]==='preco de venda barra')||a.length-b.length||a.localeCompare(b)),pc=pcs[0];
    if(pc&&lastH===r-1&&col){const t=col.d?String(mt.val(sh,col.d+r)??'').trim():'';if(t&&!PRC(sem(t))){cor=corDe(t)||t;}lastH=r;continue;}
    if(pc){lastH=r;const f=(t)=>Object.keys(H).filter(c=>t(H[c])).sort((a,b)=>a.length-b.length||a.localeCompare(b))[0];
      const cod=f(h=>h==='codigo revenda'||h==='codigo'),des=f(h=>h==='codigo fornecedor'||h.startsWith('descricao'));
      let dc=des;if(!dc&&cod){const nx=String.fromCharCode(cod.charCodeAt(cod.length-1)+1);dc=cod.slice(0,-1)+nx;}
      col={p:pc,cod,d:dc,cor:f(h=>h==='cor'),forn:f(h=>h==='nome fornecedor'),peso:f(h=>h==='peso barra'||h.startsWith('peso (p')),ref:f(h=>h.includes('sistema')||h==='cod. cem'||h==='cem')};
      linha=(!des&&dc&&mt.val(sh,dc+r))?String(mt.val(sh,dc+r)).replace(/\s{2,}.*$/,'').trim():'';cor='';continue;}
    if(!col)continue;const g=c=>c?mt.val(sh,c+r):null;const desc=String(g(col.d)??'').replace(/\s+/g,' ').trim(),pr=g(col.p),codv=String(g(col.cod)??'').trim();
    if(!(typeof pr==='number'&&pr>0&&isFinite(pr))){if(desc&&!codv&&desc.length<40){const c2=corDe(desc);cor=c2||desc;}continue;}
    if(!desc)continue;let cod=codv;if(!cod||cod==='*'){const t=desc.toUpperCase().match(/\b[A-Z]{1,5}[- ]?\d{2,6}[A-Z]?\b/);cod=t?t[0]:'—';}

async function sincronizar(){const pid=$('#plSel').value,m=$('#plMsg');if(!pid){m.textContent='Escolha a planilha.';return;}m.textContent='Lendo a planilha…';

    for(const it of L){const id=(nk(it.cod)+'_'+nk(it.desc).slice(0,48)+'_'+nk(it.cor)).slice(0,90);if(vistos.has(id)){dup++;continue;}vistos.add(id);it.id=id;

  if(ok){m.textContent=`✓ ${out.length} itens das abas: ${abas.join(', ')}${dup?` · ${dup} repetidos ignorados`:''} · ${out.filter(i=>i.foto).length} com foto`;tela();}}

function reduz(file,max=900){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>ok(b),'image/jpeg',.85);};im.src=URL.createObjectURL(file);});}

async function suporte(){const t=prompt('Descreva o que você precisa no painel de orçamentos (a FC recebe na hora):');if(!t||!t.trim())return;
  let nm='';try{nm=localStorage.getItem('cons-nome')||'';}catch(_){}if(!nm){nm=prompt('Seu nome:')||'';try{localStorage.setItem('cons-nome',nm);}catch(_){}}
  const r=await sb.rpc('cons_portal_solicitar',{p_chave:VKEY,p_nome:nm,p_tipo:'outro',p_texto:'[Painel de orçamentos] '+t.trim()});toast(r.error||!r.data?'Não foi possível enviar. Tente de novo.':'✓ Pedido enviado para a FC');}
/* ---------- início ---------- */
async function trocaEmp(id){EMP=id;try{localStorage.setItem('fc_orc_emp',id);}catch(_){}D=null;O=null;CF=null;if(await carregar())tela();}
(async()=>{if(VKEY){if(GESTOR&&Q.get('aba'))ABA=Q.get('aba');if(await carregar())tela();return;}
  gateUI(async()=>{try{const r=await sb.rpc('trein_is_admin');ADM=!!r.data;}catch(_){}
    if(!ADM){$('#app').innerHTML='<p class="vazio">Esta área é da FC Consultoria. O vendedor entra pelo link que recebeu.</p>';return;}FC=true;
    const a=document.createElement('a');a.className='vt';a.href='/treinamento/painel.html';a.textContent='← Painel matriz';$('header.top .w').appendChild(a);
    const r=await sb.from('rotina_docs').select('id,data').eq('col','consultoria');EMPS=(r.data||[]).map(x=>({id:x.id,nome:(x.data&&x.data.nome)||x.id})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
    const s=$('#selEmp');s.hidden=false;s.innerHTML=EMPS.map(e=>`<option value="${esc(e.id)}">${esc(e.nome)}</option>`).join('');
    let e0=Q.get('e')||(()=>{try{return localStorage.getItem('fc_orc_emp');}catch(_){return '';}})()||'cb';if(!EMPS.some(e=>e.id===e0))e0=(EMPS.find(e=>e.id==='cb')||EMPS[0]||{}).id;s.value=e0;s.onchange=()=>trocaEmp(s.value);
    if(Q.get('aba'))ABA=Q.get('aba');await trocaEmp(e0);});})();
</script>
