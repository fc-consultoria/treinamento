<style>

.folha .cab img{max-width:150px;max-height:70px;object-fit:contain}.folha .cab .e{flex:1;text-align:center}.folha .cab .e b{font-size:17px;display:block}

<body>
<div class="rgate" id="gate" hidden><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>🧾 Orçamentos</h1>

<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>
<header class="top"><div class="w"><img id="hdLogo" src="/img/logo-fc-160.jpg" alt=""><div><small id="hdSub">Painel de orçamentos</small><b id="hd">Orçamentos</b></div><span class="sp"></span><select id="selEmp" hidden aria-label="Cliente"></select></div></header>
<main id="app"><p class="vazio">Carregando…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=new URLSearchParams(location.search),VKEY=Q.get('v')||Q.get('k')||'',GESTOR=!Q.get('v')&&!!Q.get('k');
(function(){const tk=Q.get('et');if(!tk)return;const ping=()=>{try{if(!document.hidden&&typeof sb!=='undefined')sb.rpc('emp_ping',{p_token:tk}).then(()=>{},()=>{});}catch(_){}};setTimeout(ping,1500);setInterval(ping,45000);document.addEventListener('visibilitychange',ping);})();
const BASE='https://fc-consultoria.github.io/treinamento/';
const nk=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const sem=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const n2=v=>(+v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const rs=v=>'R$ '+n2(v);
const num=s=>{s=String(s??'').trim().replace(/\s/g,'').replace(/^R\$/,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=+s;return isNaN(v)?0:v;};
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const maisDias=n=>{const d=new Date();d.setDate(d.getDate()+(+n||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dBR=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const fotoUrl=f=>!f?'':/^https?:/.test(f)?f:'../'+f;
/* ---------- estoque (importado do sistema da empresa) ---------- */
const FX=()=>Object.assign({verm:0,lar:6,verde:8,dias:7},(D&&D.cab&&D.cab.estFx)||{});
const COR_EST={v:['#dc2626','sem estoque'],l:['#f97316','estoque baixo'],a:['#eab308','estoque no limite'],g:['#16a34a','estoque bom']};
function estDe(id){const i=D&&D.itens.find(x=>x.id===id);return i||null;}
function estNv(i){if(!i)return null;if(i.estCor&&COR_EST[i.estCor])return i.estCor;if(i.est==null||i.est==='')return null;const f=FX(),v=+i.est;return (v<=0||v<f.verm)?'v':v<f.lar?'l':v>f.verde?'g':'a';}
function estTag(i){if(i&&i.estConf&&!i.estCor)return '<span title="Unidade do estoque em conferência pela Compras" style="display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12.5px;color:#64748b;background:#fff;border:1.5px dashed #94a3b8;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap"><span style="width:9px;height:9px;border-radius:2px;background:#94a3b8;display:inline-block"></span>A confirmar</span>';const n=estNv(i);if(!n)return (i&&D&&D.cab&&D.cab.estEm)?'<span title="Este item não veio na planilha de estoque" style="display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12.5px;color:#64748b;background:#fff;border:1.5px solid #94a3b8;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap"><span style="width:9px;height:9px;border-radius:2px;background:#94a3b8;display:inline-block"></span>Sem informação</span>':'';const [c]=COR_EST[n],t={v:'Sem estoque',l:'Estoque baixo',a:'No limite',g:'Em estoque'}[n];
  return `<span title="Situação do estoque${i.estCor?' (definida manualmente)':''}" style="display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:12.5px;color:${c};background:#fff;border:1.5px solid ${c};border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap"><span style="width:9px;height:9px;border-radius:2px;background:${c};display:inline-block"></span>${t}</span>`;}
function estI(i){return i?estB(i.est,i.estCor):'';}
function estB(q,man){if(man&&COR_EST[man]){const [c,t]=COR_EST[man];return `<span class="est" title="${t[0].toUpperCase()+t.slice(1)} (definido manualmente)${ADM&&q!=null?' · saldo '+String(q).replace('.',','):''}" style="background:${c}"></span>`;}if(q==null||q==='')return '';const f=FX(),v=+q;const [bg,fc,t]=(v<=0||v<f.verm)?['','#dc2626','sem estoque']:v<f.lar?['','#f97316','estoque baixo']:v>f.verde?['','#16a34a','estoque bom']:['','#eab308','estoque no limite'];
  return `<span class="est" title="${t[0].toUpperCase()+t.slice(1)}${ADM?' (saldo '+String(v).replace('.',',')+')':''}" style="background:${fc}"></span>`;}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800);}
const ST={aberto:'Em aberto',enviado:'Enviado ao cliente',negociando:'Em negociação',aguardando:'Fechado · aguardando financeiro',aprovado:'Pedido aprovado',perdido:'Perdido',cancelado:'Cancelado',inativo:'🚫 Inativado (teste)'};
const TRAVA=st=>st==='aguardando'||st==='aprovado'||st==='inativo',MOTIVOS=['Preço','Prazo de entrega','Fechou com concorrente','Cliente desistiu','Sem retorno do cliente','Outro'];
const PAG_PADRAO=['PIX','Dinheiro','Cartão de débito','Cartão de crédito','Boleto','Transferência','Cheque'];

function pede(tit,txt,campos){return new Promise(res=>{const m=document.createElement('div');m.id='mdl';
  m.innerHTML=`<div class="c"><h3>${tit}</h3>${txt?`<p class="nota">${txt}</p>`:''}${campos.map(c=>`<label class="f" style="margin-top:8px">${c.l}${c.op?`<select class="inp" data-k="${c.k}">${c.op.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:c.area?`<textarea data-k="${c.k}" rows="3"></textarea>`:`<input data-k="${c.k}" type="${c.t||'text'}" ${c.im?'inputmode="decimal"':''} placeholder="${esc(c.ph||'')}">`}</label>`).join('')}
  <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" type="button" data-x>Cancelar</button><button class="btn pri" type="button" data-ok>Confirmar</button></div></div>`;
  document.body.appendChild(m);const fim=v=>{m.remove();res(v);};m.querySelector('[data-x]').onclick=()=>fim(null);
  m.querySelector('[data-ok]').onclick=()=>{const o={};m.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value.trim());for(const c of campos)if(c.req&&!o[c.k]){alert('Preencha: '+c.l);return;}fim(o);};});}
async function mudaSt(id,novo){if(DEMO){toast('Demonstração: na tela do vendedor a situação muda aqui. Nada foi salvo.');return false;}const o=D.orcs.find(x=>x.id===id);if(!o)return false;let info={};
  if(novo==='aguardando'){const r=await pede('✅ Fechar pedido nº '+o.numero,'O pedido vai para a aprovação do financeiro. Depois de enviado, o vendedor não consegue mais alterar.',[{k:'entrega',l:'Data de entrega combinada',t:'date'},{k:'sinal',l:'Sinal / entrada recebida (R$)',im:1,ph:'0,00'},{k:'obs',l:'Observação para o financeiro',area:1}]);if(!r)return false;info={entrega:r.entrega||null,sinal:num(r.sinal),obs:r.obs,fechado_em:new Date().toISOString()};}
  else if(novo==='perdido'){const r=await pede('❌ Orçamento nº '+o.numero+' perdido','Por que o cliente não fechou? Isso ajuda o gestor a entender as vendas perdidas.',[{k:'motivo',l:'Motivo',op:MOTIVOS},{k:'obs',l:'Detalhe (opcional)',area:1}]);if(!r)return false;info={motivo:r.motivo,obs:r.obs};}
  else if(novo==='negociando'&&o.status==='aguardando'&&ADM){const r=await pede('↩ Devolver pedido nº '+o.numero+' ao vendedor','O pedido volta para "Em negociação" e o vendedor pode corrigir.',[{k:'obs',l:'O que precisa corrigir',area:1,req:1}]);if(!r)return false;info={devolvido:r.obs,obs:r.obs};}
  else if(novo==='inativo'){const fe=TRAVA(o.status)&&o.status!=='inativo';if(!confirm('Inativar o nº '+o.numero+'?\n\nUse para orçamentos e pedidos de teste: ele sai das listas e dos relatórios (fica em "Inativados").'+(fe?'\n\nComo é um pedido fechado, o estoque volta, se a importação de estoque ainda não tiver sido feita depois do fechamento.':'')))return false;info={inativado_em:new Date().toISOString()};}
  else if(novo==='aprovado'){const r=await pede('✔ Aprovar pedido nº '+o.numero,`Cliente: ${esc((o.cliente||{}).nome||'')} · Total ${rs(o.total)}`,[{k:'obs',l:'Observação do financeiro (opcional)',area:1}]);if(!r)return false;info={obs:r.obs};}
  const r=await sb.rpc('orc_status',{p_chave:FC?null:VKEY,p_id:id,p_status:novo,p_emp:FC?EMP:null,p_info:info});
  if(r.error||!r.data){toast(/function|p_info/i.test((r.error&&r.error.message)||'')?'Falta rodar o SQL do Painel do Comercial.':'Não foi possível mudar.');return false;}
  await carregar();toast(ST[novo]);return true;}

const nk0=x=>{const k=nk(x);return /^\d+$/.test(k)?k.replace(/^0+(?=\d)/,''):k;};
/* Comparativo da importação: estoque da plataforma (última importação − pedidos fechados depois dela) x estoque do sistema da empresa */
async function estComparar(S,kDe){let P={},semSql=false;
  try{const r=await sb.rpc('orc_est_pend',{p_chave:FC?null:VKEY,p_emp:FC?EMP:null});if(r.error)semSql=true;else P=r.data||{};}catch(_){semSql=true;}
  const n3=v=>Math.round(v*1000)/1000,fm=v=>v==null?'—':String(n3(v)).replace('.',',');
  const L=CF.itens.map(i=>{const k=kDe(i),ant=(i.est==null||i.est==='')?null:+i.est,sai=+(P[i.id]||0),nos=ant==null?null:n3(ant-sai),sis=k!=null?n3(+S[k]):null;
    return {cod:i.cod,desc:i.desc,cor:i.cor||'',ant,sai,nos,sis,dif:(nos==null||sis==null)?null:n3(sis-nos)};});
  const D=L.filter(x=>x.dif!==0&&!(x.nos==null&&x.sis==null)).sort((a,b)=>Math.abs(b.dif??1e9)-Math.abs(a.dif??1e9));
  const tSai=L.reduce((t,x)=>t+x.sai,0),nPed=L.filter(x=>x.sai>0).length;
  const msg=D.length?`${D.length} ${D.length===1?'diferença':'diferenças'} entre a plataforma e o sistema`:'plataforma e sistema conferem';
  return await new Promise(res=>{const md=document.createElement('div');md.id='mdl';
    md.innerHTML=`<div class="c" style="max-width:980px;max-height:92vh;overflow:auto"><h3 style="margin:0 0 4px">📊 Nosso estoque x sistema da empresa</h3>
    <p class="nota" style="margin:0 0 10px">Nosso saldo = última importação${CF.cab&&CF.cab.estEm?' ('+new Date(CF.cab.estEm).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+')':''} − pedidos fechados depois dela. Ao gravar, vale o saldo do sistema, sem somar os pedidos.</p>
    ${semSql?'<p class="nota" style="color:var(--bx)">⚠ A baixa automática por pedido ainda não está ativa no banco (falta rodar o SQL). O comparativo considera só a última importação.</p>':''}
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px"><span class="pill">${L.length} itens na tabela</span><span class="pill">${nPed} itens com saída em pedidos · ${fm(tSai)} un.</span><span class="pill" style="${D.length?'background:var(--bxc);color:var(--bx)':'background:var(--okc);color:var(--ok)'}">${D.length?D.length+' com diferença':'✓ Tudo confere'}</span></div>
    ${D.length?`<div style="overflow:auto;max-height:52vh;border:1px solid #e3e8ec;border-radius:10px"><table style="width:100%;border-collapse:collapse;font-size:13.5px"><thead><tr style="position:sticky;top:0;background:#f4f7f8">${['Código','Descrição','Cor','Última importação','Saiu em pedidos','Nosso saldo','Sistema','Diferença'].map((h,j)=>`<th style="padding:6px 8px;text-align:${j>2?'right':'left'}">${h}</th>`).join('')}</tr></thead><tbody>
      ${D.slice(0,400).map(x=>`<tr style="border-top:1px solid #eef1f3"><td style="padding:5px 8px"><b>${esc(x.cod)}</b></td><td style="padding:5px 8px">${esc(x.desc)}</td><td style="padding:5px 8px">${esc(x.cor)}</td><td style="padding:5px 8px;text-align:right">${fm(x.ant)}</td><td style="padding:5px 8px;text-align:right">${x.sai?fm(x.sai):'—'}</td><td style="padding:5px 8px;text-align:right"><b>${fm(x.nos)}</b></td><td style="padding:5px 8px;text-align:right"><b>${fm(x.sis)}</b></td><td style="padding:5px 8px;text-align:right;font-weight:700;color:${x.dif==null?'#5b6670':x.dif<0?'var(--bx)':'#1d4ed8'}">${x.dif==null?(x.sis==null?'sem saldo no sistema':'novo no sistema'):(x.dif>0?'+':'')+fm(x.dif)}</td></tr>`).join('')}</tbody></table></div>${D.length>400?`<p class="nota">Mostrando 400 de ${D.length}. O relatório completo está no CSV.</p>`:''}`:''}
    <div class="row" style="margin-top:14px;justify-content:flex-end;gap:8px;flex-wrap:wrap"><button class="btn" type="button" data-csv>📄 Baixar relatório (CSV)</button><button class="btn" type="button" data-x>Cancelar</button><button class="btn pri" type="button" data-ok>✅ Gravar estoque do sistema</button></div></div>`;
    document.body.appendChild(md);const fim=v=>{md.remove();res(v);};
    md.querySelector('[data-x]').onclick=()=>fim(null);md.querySelector('[data-ok]').onclick=()=>fim({msg});
    md.querySelector('[data-csv]').onclick=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const nb=v=>v==null?'':String(n3(v)).replace('.',',');
      const csv='﻿'+['Código;Descrição;Cor;Última importação;Saiu em pedidos;Nosso saldo;Sistema;Diferença'].concat(L.map(x=>[q(x.cod),q(x.desc),q(x.cor),nb(x.ant),nb(x.sai),nb(x.nos),nb(x.sis),nb(x.dif)].join(';'))).join('\r\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='comparativo-estoque-'+(EMP||'empresa')+'-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();};});}
function wireEstImp(q){if(q('estImp'))q('estImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;const m=q('estMsg');m.textContent='Lendo '+f.name+'…';
    try{let rows=[];
      if(/\.csv$/i.test(f.name)){const t=await f.text();const sep=(t.split('\n')[0].match(/;/g)||[]).length>=(t.split('\n')[0].match(/,/g)||[]).length?';':',';rows=t.split(/\r?\n/).map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,'').trim()));}
      else{const md=await Planilha.importar(await f.arrayBuffer()),mt=new Planilha.Motor(md),sh=md.sheets[0];const mr=Math.max(...Object.keys(sh.c).map(a=>+(a.match(/\d+$/)||[0])[0]));const mc=Math.max(...Object.keys(sh.c).map(a=>{const x=a.match(/^[A-Z]+/)[0];let n=0;for(const ch of x)n=n*26+ch.charCodeAt(0)-64;return n;}));
        const CL=n=>{let s='';while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;};
        for(let r=1;r<=mr;r++){const row=[];for(let c=1;c<=mc;c++){const v=mt.val(sh,CL(c)+r);row.push(v==null?'':v);}rows.push(row);}}
      const lay=layoutPlan(rows);
      if(lay.t==='preco'){if(!FC){m.textContent='A tabela de preços de componentes é importada pela FC.';return;}await impPreco(rows,f.name,m);return;}
      if(lay.t==='comp'){await impCompEst(rows,lay,m);return;}
      if(lay.t!=='perfis'){m.textContent='Não achei as colunas de código e quantidade/saldo no cabeçalho.';return;}
      const {hi,cc,qc}=lay;
      const S={};let rep=0;rows.slice(hi+1).forEach(r=>{const k=nk0(r[cc]);if(!k)return;const v=typeof r[qc]==='number'?r[qc]:num(r[qc]);if(k in S){rep++;return;}S[k]=v;});
      const kDe=i=>[nk0(i.cod),...String(i.cod).split(/[|\/]/).map(nk0)].filter(Boolean).find(x=>x in S);
      {const nOk=CF.itens.filter(i=>kDe(i)!=null).length;if(!nOk){m.textContent='Nenhum código desta planilha bate com os perfis. Nada foi alterado. Se for o estoque de componentes, a planilha precisa ter as colunas Material e Unidade.';e.target.value='';return;}
       if(nOk<CF.itens.length*0.3&&!confirm(`Só ${nOk} de ${CF.itens.length} perfis aparecem nesta planilha. Os outros ficarão sem informação de estoque. Continuar?`)){m.textContent='Importação cancelada. Nada foi alterado.';e.target.value='';return;}}
      m.textContent='Comparando com o estoque da plataforma…';const cmp=await estComparar(S,kDe);if(!cmp){m.textContent='Importação cancelada. Nada foi gravado.';e.target.value='';return;}
      let ok=0;CF.itens.forEach(i=>{const k=kDe(i);if(k!=null){i.est=S[k];ok++;}else delete i.est;});
      CF.cab=CF.cab||{};CF.cab.estEm=new Date().toISOString();if(await salvaCfg()){const usados=new Set();CF.itens.forEach(i=>[nk0(i.cod),...String(i.cod).split(/[|\/]/).map(nk0)].forEach(k=>usados.add(k)));const fora=Object.keys(S).filter(k=>!usados.has(k)).length;const tx=`✓ ${ok} de ${CF.itens.length} itens da tabela de preços com saldo`+(cmp.msg?' · '+cmp.msg:'')+(fora?` · ${fora} códigos fora da tabela de preços foram ignorados`:'')+(rep?` · ${rep} códigos repetidos na planilha de estoque (valeu a 1ª linha de cada um, sem somar)`:'');CF.cab.estMsg=tx;toast(tx);}tela();}
    catch(err){m.textContent='Não foi possível ler: '+(err.message||err);}};}

/* ---------- 🔩 Componentes: tabela de preços + estoque ---------- */
function layoutPlan(rows){for(let r=0;r<Math.min(rows.length,15);r++){const h=rows[r].map(x=>sem(String(x)).trim());
    if(/^codigo/.test(h[0]||'')&&h.some(x=>/preco de compra/.test(x)))return {t:'preco'};
    const a=h.findIndex(x=>/^cod|codigo|referencia|^ref/.test(x)),b=h.findIndex(x=>/saldo|quant|qtd|qtde|estoque|disponivel/.test(x));
    if(a>=0&&b>=0){const mt=h.findIndex(x=>/^material|^descri/.test(x)),un=h.findIndex(x=>/^unidade$|^un$|^und$/.test(x));

    <p class="nota" style="margin:2px 0">${em?'Última importação: <b>'+em.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'</b>':'O estoque ainda não foi importado.'}${c.estMsg?' · '+esc(c.estMsg):''}</p>
    <p class="nota" style="margin:2px 0">O Painel do Comercial mostra ao vendedor só a situação de cada item (Em estoque, No limite, Estoque baixo, Sem estoque). O saldo não aparece para ele.</p></div>
   <div><label class="btn pri" style="cursor:pointer;font-size:16px;padding:12px 18px">📥 Importar planilha de estoque<input type="file" accept=".xlsx,.csv" id="estImp" hidden></label><p class="nota" id="estMsg" style="max-width:320px">Arquivo .xlsx ou .csv do sistema, com as colunas de <b>código</b> e <b>quantidade/saldo</b>. Serve para perfis e componentes: o painel reconhece qual é.</p></div></div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
   <div class="box"><h3>🗓 Rotina de importação</h3>
    <div class="grid"><label class="f">Importar a cada<select class="inp" id="fxD">${[[7,'7 dias (toda semana)'],[15,'15 dias'],[30,'30 dias (todo mês)']].map(([v,t])=>`<option value="${v}" ${+f.dias===v?'selected':''}>${t}</option>`).join('')}</select></label>
     <label class="f">Data do 1º prazo (início da rotina)<input type="date" class="inp" id="fxI" value="${esc(f.ini||'')}"></label></div>
    <p class="nota">Próximos prazos: <b>${prox.join(' · ')}</b>${f.ini?'':' (sem data definida, o prazo é toda segunda-feira)'}</p>
    <p class="nota">Até a planilha ser importada, aparece um aviso todo dia às 10:00 no link do cliente e no painel da matriz.</p></div>
   <div class="box"><h3>🎨 Regras das cores</h3><div class="row" style="gap:12px">
    <label class="f">🔴 Sem estoque até<input id="fxV" value="${f.verm}" inputmode="decimal" style="width:90px"></label>
    <label class="f">🟠 Baixo abaixo de<input id="fxL" value="${f.lar}" inputmode="decimal" style="width:90px"></label>
    <label class="f">🟢 Em estoque acima de<input id="fxG" value="${f.verde}" inputmode="decimal" style="width:90px"></label></div>
    <p class="nota">Saldo zero ou negativo é sempre <b>Sem estoque</b>. Entre o laranja e o verde fica 🟡 <b>No limite</b>. Na lista abaixo dá para trocar a situação de um item à mão.</p></div></div>
  <div class="row" style="margin:-4px 0 14px"><button class="btn pri" type="button" id="fxSalva">💾 Salvar rotina e regras</button><span class="nota" id="fxMsg"></span></div>
  <div class="box"><h3>📋 Situação dos itens (${L.length})</h3>
   <div class="chips"><button type="button" data-ef="" class="${!EF?'on':''}">Todos (${L.length})</button>${'vlagx'.split('').map(k=>`<button type="button" data-ef="${k}" class="${EF===k?'on':''}"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${LB[k][0]};margin-right:5px"></span>${LB[k][1]} (${cnt[k]})</button>`).join('')}</div>
   ${F.length?`<div style="max-height:560px;overflow:auto"><table class="it"><thead><tr><th>Código</th><th>Descrição</th><th>Cor</th><th class="n">Saldo</th><th>Situação</th></tr></thead><tbody>
   ${F.slice(0,600).map(i=>`<tr><td><b>${esc(i.cod)}</b></td><td>${esc(i.desc)}</td><td>${corTag(i.cor)}</td><td class="n">${i.est!=null?String(i.est).replace('.',','):'—'}</td>
    <td>${estTag(i)||'<span class="nota">—</span>'} <select class="inp" data-ec2="${esc(i.id)}" title="Trocar a situação à mão" style="padding:2px 4px;font-size:12px;width:auto;margin-left:4px"><option value="">Automático</option>${Object.entries(COR_EST).map(([k,[,t]])=>`<option value="${k}" ${i.estCor===k?'selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`:'<p class="vazio">Nenhum item nesta situação.</p>'}</div>`+telaComp();}
function wireEst(){if(!CF)return;const q=s=>document.getElementById(s);wireEstImp(q);wireComp();
  $$('[data-ef]').forEach(b=>b.onclick=()=>{EF=b.dataset.ef;tela();});
  $$('[data-ec2]').forEach(s=>s.onchange=async()=>{const i=CF.itens.find(x=>x.id===s.dataset.ec2);if(!i)return;if(s.value)i.estCor=s.value;else delete i.estCor;if(await salvaCfg('Situação atualizada'))tela();});
  q('fxSalva').onclick=async()=>{CF.cab=CF.cab||{};CF.cab.estFx={verm:num(q('fxV').value),lar:num(q('fxL').value),verde:num(q('fxG').value),dias:parseInt(q('fxD').value)||7,ini:q('fxI').value||''};if(await salvaCfg('Rotina e regras salvas'))tela();};}
function reduz(file,max=900){return new Promise(ok=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>ok(b),'image/jpeg',.85);};im.src=URL.createObjectURL(file);});}

async function suporte(){const t=prompt('Descreva o que você precisa no painel de orçamentos (a FC recebe na hora):');if(!t||!t.trim())return;
  let nm='';try{nm=localStorage.getItem('cons-nome')||'';}catch(_){}if(!nm){nm=prompt('Seu nome:')||'';try{localStorage.setItem('cons-nome',nm);}catch(_){}}
  const r=await sb.rpc('cons_portal_solicitar',{p_chave:VKEY,p_nome:nm,p_tipo:'outro',p_texto:'[Painel de orçamentos] '+t.trim()});toast(r.error||!r.data?'Não foi possível enviar. Tente de novo.':'✓ Pedido enviado para a FC');}
/* ---------- início ---------- */
async function trocaEmp(id){EMP=id;try{localStorage.setItem('fc_orc_emp',id);}catch(_){}D=null;O=null;CF=null;if(await carregar())tela();autoSync();}
const ABA0=Q.get('est')?'est':Q.get('aba');
/* Vendedor: montar orçamento só no computador (20/10) */
const MOVEL=/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1)||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<900);
if(VKEY&&!GESTOR&&MOVEL){const L=location.href;document.body.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#0f1a22;font:400 16px/1.5 system-ui,sans-serif"><div style="max-width:420px;background:#fff;border-radius:16px;padding:24px;text-align:center;color:#1d2a33"><div style="font-size:46px">💻</div><h2 style="margin:6px 0 8px">Abra no computador</h2><p style="margin:0 0 14px;color:#4b5b66">O painel de orçamentos funciona só no computador. Abra este mesmo link no computador da loja para montar os orçamentos.</p><button type="button" id="mvCp" style="background:#0f6b70;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%">📋 Copiar o link</button><p id="mvMsg" style="margin:10px 0 0;font-size:13px;color:#1f8a4c;min-height:18px"></p><p style="margin:8px 0 0;font-size:12px;color:#7a8a95">FC Consultoria · (66) 9 9986-7984</p></div></div>`;document.getElementById('mvCp').onclick=async()=>{try{await navigator.clipboard.writeText(L);document.getElementById('mvMsg').textContent='Link copiado. Cole no navegador do computador.';}catch(_){prompt('Copie o link:',L);}};throw new Error('vendedor no celular');}
/* Conversas ao lado de "Novo orçamento" (27/10): usa o mesmo botão da Central de Conversas */
function convAba(){const nv=document.querySelector('.abas [data-ab="novo"]'),fb=document.getElementById('fcvBtn');if(!nv||!fb||document.getElementById('abConv'))return;
  const b=document.createElement('button');b.type='button';b.id='abConv';b.className='ab-conv';b.title='Conversar com a equipe e com a FC';
  b.innerHTML='💬 Conversas <span class="fcv-n" id="abConvN"></span>';b.onclick=()=>fb.click();nv.after(b);
  document.documentElement.classList.add('fcv-dock');const n=document.getElementById('fcvN');document.getElementById('abConvN').textContent=n?n.textContent:'';}
new MutationObserver(()=>{if(!document.getElementById('abConv'))convAba();const n=document.getElementById('fcvN'),m=document.getElementById('abConvN');if(n&&m&&m.textContent!==n.textContent)m.textContent=n.textContent;})
  .observe(document.documentElement,{childList:true,subtree:true,characterData:true});
/* Botão Sair + selo On-line/Off-line (27/10) */
function sairBarra(nome){if(DEMO||SO||document.documentElement.classList.contains('emb')||window.top!==window||!window.FCSessao)return;
  if(nome)FCSessao.nome(nome);const w=$('header.top .w');if(!w||w.querySelector('[data-fcs-sair]'))return;
  if(FC){FCSessao.botaoSair(w,async()=>{await sb.auth.signOut();location.replace('/treinamento/painel.html');});return;}
  const e=EMP||Q.get('e')||'';
  FCSessao.botaoSair(w,async()=>{if(!confirm('Sair do Painel de Vendas neste computador?\n\nPara voltar, entre de novo com o seu login e senha.'))throw 0;
    let tk=Q.get('et')||'';try{if(!tk&&e)tk=localStorage.getItem('emp-tok-'+e)||'';}catch(_){}
    if(tk){try{await sb.rpc('emp_sair',{p_token:tk});}catch(_){}}
    try{if(e)localStorage.removeItem('emp-tok-'+e);localStorage.removeItem('cons-nome');}catch(_){}
    location.replace('../consultorias.html'+(e?'?e='+encodeURIComponent(e):''));});}
(async()=>{if(VKEY){if(GESTOR)ABA=ABA0||'com';if(await carregar()){tela();if(window.VX)VX.iniciar();autoSync();}return;}
  gateUI(async()=>{try{const r=await sb.rpc('trein_is_admin');ADM=!!r.data;}catch(_){}
    if(!ADM){$('#app').innerHTML='<p class="vazio">Esta área é da FC Consultoria. O vendedor entra pelo link que recebeu.</p>';return;}FC=true;
    const a=document.createElement('a');a.className='vt';a.href='/treinamento/painel.html';a.textContent='← Painel matriz';$('header.top .w').appendChild(a);
    const r=await sb.from('rotina_docs').select('id,data').eq('col','consultoria');EMPS=(r.data||[]).map(x=>({id:x.id,nome:(x.data&&x.data.nome)||x.id})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
    const s=$('#selEmp');s.hidden=false;s.innerHTML=EMPS.map(e=>`<option value="${esc(e.id)}">${esc(e.nome)}</option>`).join('');
    let e0=Q.get('e')||(()=>{try{return localStorage.getItem('fc_orc_emp');}catch(_){return '';}})()||'cb';if(!EMPS.some(e=>e.id===e0))e0=(EMPS.find(e=>e.id==='cb')||EMPS[0]||{}).id;s.value=e0;s.onchange=()=>trocaEmp(s.value);
    if(ABA0)ABA=ABA0;await trocaEmp(e0);});})();
