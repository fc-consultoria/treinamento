<body>
<div class="rgate" id="gate" hidden><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>🎓 Treinamento em Esquadrias</h1>

<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>

<header class="top"><div class="w"><img src="/img/logo-fc-160.jpg" alt=""><div><small>FC Consultoria · Gold x Suprema</small><b>Treinamento em Esquadrias 3D</b></div><span class="sp"></span>
 <div class="prog" title="Módulos estudados"><i><s id="pgB" style="width:0"></s></i><span id="pgT">0/9</span></div><button type="button" id="bGrav" title="Gravar a aula (tela + sua voz) para virar conteúdo gravado" hidden>⏺ Gravar aula</button><button type="button" id="bAtu" title="Baixar a versão mais nova">🔄</button><button type="button" id="bHome">☰ Início</button></div></header>
<div class="lay"><nav class="nav" id="nav"></nav><main id="main"><p style="padding:30px">Carregando…</p></main></div>
<div class="md" id="md" hidden><div><div class="mt"><b id="mdC"></b><span id="mdN"></span><button class="btn" type="button" id="mdFs" style="margin-left:auto;padding:6px 12px">⛶ Tela cheia</button><button class="mx" type="button" id="mdX" aria-label="Fechar">✕</button></div><div id="mdB" style="flex:1;display:flex"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../auth.js"></script>
<script src="cm3d.js?v=9"></script>
<script>
/* Treinamento em Esquadrias 3D · FC Consultoria em Esquadria · Sinop-MT · todos os direitos reservados */
const IMG='/perfis/img/',PERFIS='/perfis/';
let CMPO=null;let P={},IDX={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?null:n;};
const kg=n=>n==null?'':n.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const mm=n=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1});
/* perfil pelo código (aceita códigos com alternativa "LG-047 / LG-159") */
function F(c){return IDX[c]||null;}
function pfInfo(c){const p=F(c);if(!p)return {c,ok:false};return {c,ok:true,k:p.k,n:p.n,peso:num(p.p),d:p.d,d3:p.d3,i:p.i,l:p.l,img:IMG+(p.d3?p.i:'c'+p.i)+'.webp'};}
/* cartão grande */
function card(c,fn,lin){const x=pfInfo(c),cl=lin||(c.startsWith('LG')||c.startsWith('BG')||c==='US-622'?'g':'s');
 if(!x.ok)return `<div class="pc nx ${cl}"><div class="im"><div style="position:absolute;inset:0;display:grid;place-items:center;color:#9aa8b0;font:700 13px var(--f-b);text-align:center;padding:10px">Perfil fora do<br>catálogo 3D</div></div><div class="tx">${fn?`<span class="fn">${esc(fn)}</span>`:''}<b>${esc(c)}</b><span>Medidas e peso: confira no catálogo do fabricante</span></div></div>`;
 return `<button type="button" class="pc ${cl}" data-pf="${esc(c)}"><div class="im"><img loading="lazy" src="${x.img}" alt="${esc(c)}">${x.d3?'<span class="b3">↻ 3D</span>':''}</div><div class="tx">${fn?`<span class="fn">${esc(fn)}</span>`:''}<b>${esc(c)}</b><span>${esc(x.n)}</span><div class="kv">${x.peso!=null?`<em>⚖ ${kg(x.peso)} kg/m</em>`:''}${x.d?`<em>📐 ${mm(x.d[0])} × ${mm(x.d[1])} mm</em>`:''}</div></div></button>`;}
/* linha de lista (função + código) */
function row(fn,c){const alt=c.split(' ou ').map(s=>s.trim());const x=pfInfo(alt[0]);const cods=alt.join(' ou ');
 if(!x.ok)return `<div class="row nx"><div class="ph">fora do<br>catálogo 3D</div><div><small>${esc(fn)}</small><b>${esc(cods)}</b></div><div class="w"><small>peso: catálogo<br>do fabricante</small></div></div>`;
 return `<button type="button" class="row" data-pf="${esc(alt[0])}"><img loading="lazy" src="${x.img}" alt=""><div><small>${esc(fn)}</small><b>${esc(cods)}</b>${x.d?`<small>📐 ${mm(x.d[0])} × ${mm(x.d[1])} mm</small>`:''}</div><div class="w">${x.peso!=null?kg(x.peso)+'<small> kg/m</small>':''}${x.d3?'<br><small>↻ 3D</small>':''}</div></button>`;}
function lista(arr){return `<div class="rows">${arr.map(([f,c])=>row(f,c)).join('')}</div>`;}
function soma(arr){let s=0,n=0,f=0;arr.forEach(([_,c])=>{const x=pfInfo(c.split(' ou ')[0].trim());if(x.ok&&x.peso!=null){s+=x.peso;n++;}else f++;});return {s,n,f};}
function sumLine(arr){const r=soma(arr);return `<div class="sum">⚖ Soma dos pesos por metro: <b>${kg(r.s)} kg/m</b> <span style="color:var(--tm);font-weight:500">(${r.n} perfis${r.f?`; ${r.f} fora do catálogo não entram na soma`:''})</span></div>`;}
function comp(arr){return `<div class="comp">${arr.map(([ic,c,n])=>{const f=gfile(String(c).split(/\s*\/\s*|\s+ou\s+/)[0]);return `<div class="cp"><i${f?' style="width:64px;height:44px;background:#fff;border:1px solid var(--ln)"':''}>${f?`<img src="${f}" alt="" style="max-width:58px;max-height:38px;object-fit:contain">`:ic}</i><div><b>${esc(c)}</b><small>${esc(n)}</small></div></div>`;}).join('')}</div>`;}
function cmpGS(g,s,extra){return `<div class="cmp"><div class="G"><h3>GOLD <span class="tag tg">Linha Gold</span></h3>${lista(g)}${sumLine(g)}</div><div class="S"><h3>SUPREMA <span class="tag ts">Linha Suprema</span></h3>${lista(s)}${sumLine(s)}</div></div>${extra||''}`;}

/* ---------- desenhos (SVG gerado) ---------- */
function seta(x,y,d,s){s=s||9;const p=d>0?`${x-s},${y-s*.55} ${x+s*.15},${y-s*.55} ${x+s*.15},${y-s} ${x+s},${y} ${x+s*.15},${y+s} ${x+s*.15},${y+s*.55} ${x-s},${y+s*.55}`:`${x+s},${y-s*.55} ${x-s*.15},${y-s*.55} ${x-s*.15},${y-s} ${x-s},${y} ${x-s*.15},${y+s} ${x-s*.15},${y+s*.55} ${x+s},${y+s*.55}`;return `<polygon points="${p}" fill="#fff" stroke="#37474f" stroke-width="1.2"/>`;}
function vene(x,y,w,h){let s='';for(let k=y+5;k<y+h-2;k+=5)s+=`<line x1="${x+2}" y1="${k}" x2="${x+w-2}" y2="${k}" stroke="#7b8b93" stroke-width=".9"/>`;return s;}
function lamb(x,y,w,h){let s='';for(let k=y+8;k<y+h-2;k+=8)s+=`<line x1="${x+2}" y1="${k}" x2="${x+w-2}" y2="${k}" stroke="#7b8b93" stroke-width="1.4"/>`;return s;}
function tela(x,y,w,h){let s='';for(let k=x+4;k<x+w;k+=4)s+=`<line x1="${k}" y1="${y}" x2="${k}" y2="${y+h}" stroke="#b9c6cc" stroke-width=".5"/>`;for(let k=y+4;k<y+h;k+=4)s+=`<line x1="${x}" y1="${k}" x2="${x+w}" y2="${k}" stroke="#b9c6cc" stroke-width=".5"/>`;return s;}
function vidro(x,y,w,h){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#e3f1f7" stroke="#455a64" stroke-width="1.3"/>`;}
function fixo(x,y,w,h){return vidro(x,y,w,h)+`<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#37474f" font-family="system-ui">F</text>`;}
function maximFolha(x,y,w,h){return vidro(x,y,w,h)+`<polyline points="${x+3},${y+3} ${x+w/2},${y+h-3} ${x+w-3},${y+3}" fill="none" stroke="#607d8b" stroke-dasharray="4 3" stroke-width="1"/>`;}
function giroFolha(x,y,w,h,lado,mio){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#dfe6e9" stroke="#455a64" stroke-width="1.3"/>`;const m=mio||'vidro';const ix=x+5,iw=w-10;
 if(m==='vidro')s+=vidro(ix,y+5,iw,h-10);else if(m==='veneziana')s+=`<rect x="${ix}" y="${y+5}" width="${iw}" height="${h-10}" fill="#eef2f3"/>`+vene(ix,y+5,iw,h-10);else if(m==='lambri')s+=`<rect x="${ix}" y="${y+5}" width="${iw}" height="${h-10}" fill="#eef2f3"/>`+lamb(ix,y+5,iw,h-10);
 else{const hs=(h-14)*.45;s+=vidro(ix,y+5,iw,hs);const yb=y+9+hs,hb=h-14-hs;s+=`<rect x="${ix}" y="${yb}" width="${iw}" height="${hb}" fill="#eef2f3"/>`+(m==='vid-ven'?vene(ix,yb,iw,hb):lamb(ix,yb,iw,hb));}
 const hx=lado==='e'?x+w-2:x+2;s+=`<polyline points="${hx},${y+3} ${lado==='e'?x+3:x+w-3},${y+h/2} ${hx},${y+h-3}" fill="none" stroke="#607d8b" stroke-dasharray="4 3" stroke-width="1"/>`;return s;}
function desenho(t){/* t: {k:'correr'|'maxim'|'giro', n, porta, set:[], band, parap, tela, ven, mio} */
 const porta=t.porta,W=t.k==='giro'?(t.n>1?120:66):Math.min(230,(porta?52:60)*Math.max(t.n,2)),H=t.k==='giro'?150:porta?150:t.k==='maxim'&&t.n>1&&t.v?150:100;
 let s=`<svg viewBox="-6 -6 ${W+12} ${H+12}" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="${W}" height="${H}" fill="#cfd8dc" stroke="#37474f" stroke-width="1.6"/>`;
 let y0=4,h0=H-8;
 if(t.band){const bh=porta?22:20;for(let k=0;k<Math.max(t.n,1);k++){const bw=(W-8)/Math.max(t.n,1);if(t.bmax)s+=maximFolha(4+k*bw+1,4,bw-2,bh);else s+=fixo(4+k*bw+1,4,bw-2,bh);}y0+=bh+3;h0-=bh+3;}
 if(t.parap){const ph=20;for(let k=0;k<Math.max(t.n,1);k++){const bw=(W-8)/Math.max(t.n,1);s+=fixo(4+k*bw+1,H-4-ph,bw-2,ph);}h0-=ph+3;}
 if(t.k==='correr'){const n=t.n,fw=(W-8)/n;for(let k=0;k<n;k++){const x=4+k*fw+1;s+=vidro(x,y0,fw-2,h0);if(t.ven&&(n<4?k!==Math.floor(n/2):k%2===0)){s+=`<rect x="${x+1}" y="${y0+1}" width="${fw-4}" height="${h0-2}" fill="#eef2f3"/>`+vene(x+1,y0+1,fw-4,h0-2);}
   if(t.tela&&k===(t.telaK??n-1))s+=tela(x+1,y0+1,fw-4,h0-2);const d=(t.set||[])[k];if(d)s+=d===2?seta(x+fw/2-8,y0+h0/2,-1,8)+seta(x+fw/2+8,y0+h0/2,1,8):seta(x+fw/2,y0+h0/2,d);}}
 else if(t.k==='maxim'){if(t.v&&t.n>1){const fh=h0/t.n;for(let k=0;k<t.n;k++)s+=maximFolha(5,y0+k*fh+1,W-10,fh-2);}else{const fw=(W-8)/t.n;for(let k=0;k<t.n;k++)s+=maximFolha(4+k*fw+1,y0,fw-2,h0);}}
 else if(t.k==='giro'){if(t.n>1){const fw=(W-8)/2;s+=giroFolha(4,y0,fw-1,h0,'d',t.mio)+giroFolha(4+fw+1,y0,fw-1,h0,'e',t.mio);}else s+=giroFolha(4,y0,W-8,h0,'d',t.mio);}
 return s+'</svg>';}
/* interpreta o nome do modelo */
function parseModelo(nm){const L=nm.toLowerCase(),n=+(L.match(/(\d)\s*folhas/)||[0,1])[1],porta=/porta/.test(L);
 if(/maxim/.test(L)&&!/correr/.test(L))return {k:'maxim',n:n||1,band:/bandeira/.test(L),parap:/parapeito/.test(L)};
 if(/giro/.test(L))return {k:'giro',n:/2 folhas/.test(L)?2:1,porta:true,mio:'vidro'};
 let set=[];if(/central/.test(L)){for(let k=0;k<n;k++)set.push(k<n/2?(k===Math.floor(n/2)-1?1:0):(k===Math.ceil(n/2)?-1:0));}
 else if(/sequenc/.test(L)){for(let k=0;k<n;k++)set.push(k===n-1?-1:1);}
 else if(n===2)set=[1,-1];else if(n===3)set=[1,2,-1];else if(n===4)set=[0,-1,1,0];else if(n===6)set=[0,1,2,2,-1,0];else for(let k=0;k<n;k++)set.push(0);
 return {k:'correr',n,porta,set,band:/bandeira|maxim/.test(L),bmax:/maxim/.test(L),parap:/parapeito/.test(L),tela:/tela/.test(L),ven:/veneziana/.test(L)};}

/* ---------- módulos ---------- */
const MOD=[
 {id:'cat',n:'Catálogo de Perfis',d:'Todos os perfis da Suprema e da Gold em 3D, com peso e medidas'},
 {id:'tip',n:'Tipologias',d:'Os modelos de janelas e portas e os desenhos de referência'},
 {id:'cm',n:'Contramarco',d:'O que é, os componentes e a instalação passo a passo'},
 {id:'gua',n:'Guarnições',d:'Qual guarnição usar em cada perfil e espessura de vidro'},
 {id:'max',n:'Janela Maxim-Ar',d:'Perfis, componentes e o braço certo para cada folha'},
 {id:'cor',n:'Janelas de Correr',d:'2, 3 e 4 folhas lado a lado: Gold x Suprema'},
 {id:'pad',n:'Perfis e Componentes Padrão',d:'O que se repete em janela e porta, e o trilho macarrão'},
 {id:'giro',n:'Porta de Giro',d:'Modelos, perfis e componentes'},
 {id:'div',n:'Perfis Diversos',d:'Lambris e venezianas'}];
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let FEITO=new Set(LS.g('fc_esq_feito',[])),AT=null;
const $=s=>document.querySelector(s);
function navUI(){$('#nav').innerHTML='<div class="nh">Sequência do treinamento</div>'+MOD.map((m,k)=>`<a data-go="${m.id}" class="${AT===m.id?'on':''}"><span class="n">${String(k+1).padStart(2,'0')}</span>${esc(m.n)}${FEITO.has(m.id)?'<span class="ck">✓</span>':''}</a>`).join('')+`<a data-go="quiz" class="${AT==='quiz'?'on':''}"><span class="n" style="background:var(--tl)">✓</span>Prova final</a>`;
 $('#pgB').style.width=(FEITO.size/9*100)+'%';$('#pgT').textContent=FEITO.size+'/9';}
function head(k,sub,tags){const m=MOD[k];return `<div class="mh"><div class="ey">Módulo ${String(k+1).padStart(2,'0')} · ${esc(m.n)}</div><h1>${esc(sub||m.n)}</h1><p>${esc(m.d)}</p>${tags?`<div style="margin-top:8px">${tags}</div>`:''}</div>`;}
function foot(k){const a=MOD[k-1],b=MOD[k+1];return `<div class="foot">${a?`<button class="btn" data-go="${a.id}">← ${esc(a.n)}</button>`:'<span></span>'}<button class="btn ${FEITO.has(MOD[k].id)?'':'o'}" data-feito="${MOD[k].id}">${FEITO.has(MOD[k].id)?'✓ Módulo estudado':'✔ Marcar como estudado'}</button>${b?`<button class="btn p" data-go="${b.id}">${esc(b.n)} →</button>`:`<button class="btn p" data-go="quiz">Prova final →</button>`}</div>`;}
function quiz(qs){qs=qs.map((q,i)=>{const o=q[1].map((t,j)=>[t,j]);for(let k=o.length-1;k>0;k--){const r=(i*7+k*3+q[0].length)%(k+1);[o[k],o[r]]=[o[r],o[k]];}return [q[0],o.map(x=>x[0]),o.findIndex(x=>x[1]===q[2]),q[3]];});return `<div class="sec"><h2>✍️ Teste rápido</h2><p class="nt">Toque na resposta. Errou? A explicação aparece logo abaixo.</p><div class="qz">${qs.map((q,i)=>`<div class="q" data-q="${i}" data-r="${q[2]}"><p>${esc(q[0])}</p><div class="op">${q[1].map((o,j)=>`<button type="button" data-o="${j}">${esc(o)}</button>`).join('')}</div><div class="ex" hidden>${esc(q[3]||'')}</div></div>`).join('')}</div></div>`;}

/* --- 01 catálogo --- */
let CATL='gold',CATG='',CATQ='';
function mCat(){const G={trs:'Trilhos superiores',tri:'Trilhos inferiores',mon:'Montantes da folha',tra:'Travessas da folha',arr:'Arremates e complementos'};
 const lst=Object.entries(P).filter(([c,p])=>p.l===(CATL==='gold'?'gold':'sup')&&(!CATG||p.g===CATG)&&(!CATQ||(c+' '+p.n).toLowerCase().includes(CATQ.toLowerCase())));
 /* comparação média por grupo */
 const av=(l,g)=>{const v=Object.values(P).filter(p=>p.l===l&&p.g===g).map(p=>num(p.p)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;};
 const mx=Math.max(...Object.keys(G).flatMap(g=>[av('gold',g),av('sup',g)]));
 return head(0,'Catálogo de Perfis em 3D')+`<div class="sec"><h2>⚖ Diferença de linha em um olhar</h2><p class="nt">Peso médio por metro de cada grupo de perfis, com os dados do catálogo. Mais peso significa, em geral, perfil mais robusto e esquadria mais pesada e cara.</p>
 <div class="bars">${Object.entries(G).map(([g,n])=>{const a=av('gold',g),b=av('sup',g);return `<div class="br"><b>${n}</b><div class="bb"><div class="g" style="width:${a/mx*100}%">Gold ${kg(a)} kg/m</div><div class="s" style="width:${b/mx*100}%">Suprema ${kg(b)} kg/m</div></div></div>`;}).join('')}</div>
 <div class="call t">💡 <b>Para o vendedor:</b> a <b>Gold</b> é a linha mais robusta (perfis mais largos e pesados, vidros maiores e mais opções de vidro duplo). A <b>Suprema</b> é a linha mais leve, para janelas e portas do dia a dia.</div></div>
 <div class="sec"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><div class="seg"><button class="g ${CATL==='gold'?'on':''}" data-catl="gold">Linha Gold</button><button class="s ${CATL==='sup'?'on':''}" data-catl="sup">Linha Suprema</button></div>
  <input id="catQ" value="${esc(CATQ)}" placeholder="Buscar código ou nome (ex.: trilho, SU-053)" style="flex:1;min-width:200px;font:500 15px var(--f-b);padding:8px 12px;border:1px solid var(--ln);border-radius:99px"></div>
  <div class="chips">${[['','Todos'],...Object.entries(G)].map(([g,n])=>`<button class="${CATG===g?'on':''}" data-catg="${g}">${n}</button>`).join('')}</div>
  <div class="pg">${lst.map(([c])=>card(c,null,CATL==='gold'?'g':'s')).join('')||'<p>Nenhum perfil.</p>'}</div><p class="nt" style="margin-top:10px">${lst.length} perfis · toque no perfil para girar em 3D e ver medidas e usinagens. Medidas e pesos são demonstrativos e seguem os catálogos dos fabricantes.</p></div>`+
 quiz([['Qual linha tem perfis, em geral, mais pesados por metro?',['Gold','Suprema','São iguais'],0,'A Gold tem perfis mais robustos: veja as barras do peso médio por grupo.'],['Onde ficam as folhas de uma janela de correr penduradas ou guiadas?',['No trilho superior','No montante','No baguete'],0,'O trilho superior fica no marco de cima e guia as folhas.']])+foot(0);}

/* --- 02 tipologias --- */

 if(AT==='tip'&&TIPS)t+=` · modelo: ${TIPS}`;if(MD)t+=` · abriu 3D: ${String(MD).replace(/^[A-Z]:/,'')}`;return t;}

async function gravar(){if(GRV.on)return grvParar();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.MediaRecorder){alert('Este navegador não grava a tela. Use o Google Chrome no computador.');return;}
 let tela,voz;try{tela=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:20},audio:true,preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude'});}catch(e){return;}
 try{voz=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){if(!confirm('Não consegui ligar o microfone. Gravar só a tela, sem a sua voz?')){tela.getTracks().forEach(t=>t.stop());return;}}
 const ac=new AudioContext(),dst=ac.createMediaStreamDestination();[tela,voz].forEach(s=>{if(s&&s.getAudioTracks().length)ac.createMediaStreamSource(s).connect(dst);});
 const st=new MediaStream([...tela.getVideoTracks(),...dst.stream.getAudioTracks()]);
 const tipo=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'';
 const rec=new MediaRecorder(st,tipo?{mimeType:tipo,videoBitsPerSecond:2500000}:{});const parts=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data);};
 Object.assign(GRV,{on:true,rec,parts,tela,voz,ac,t0:Date.now(),rot:[],ult:'',chat:[]});
 rec.onstop=grvSalvar;tela.getVideoTracks()[0].addEventListener('ended',()=>grvParar());rec.start(2000);
 GRV.tm=setInterval(()=>{const r=grvRotulo();if(r!==GRV.ult){GRV.ult=r;GRV.rot.push({s:Math.round((Date.now()-GRV.t0)/1000),r});}const b=$('#grvB');if(b)b.querySelector('span').textContent=mmss((Date.now()-GRV.t0)/1000);},1000);
 let b=$('#grvB');if(!b){b=document.createElement('div');b.id='grvB';b.style.cssText='position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:970;display:flex;gap:10px;align-items:center;background:#b42318;color:#fff;border-radius:99px;padding:7px 8px 7px 14px;font:700 15px var(--f-b);box-shadow:0 8px 20px rgba(0,0,0,.35)';document.body.appendChild(b);}
 b.innerHTML='<i style="width:10px;height:10px;border-radius:50%;background:#fff;animation:grvP 1s infinite"></i>Gravando <span>00:00</span><button type="button" id="grvS" style="border:0;border-radius:99px;padding:5px 12px;font:700 14px var(--f-b);cursor:pointer;background:#fff;color:#b42318">■ Parar</button>';
 $('#grvS').onclick=grvParar;$('#bGrav').textContent='■ Parar gravação';}
function grvParar(){if(!GRV.on)return;GRV.on=false;clearInterval(GRV.tm);try{GRV.rec.state!=='inactive'&&GRV.rec.stop();}catch(_){}[GRV.tela,GRV.voz].forEach(s=>s&&s.getTracks().forEach(t=>t.stop()));try{GRV.ac.close();}catch(_){}const b=$('#grvB');if(b)b.remove();$('#bGrav').textContent='⏺ Gravar aula';}
function grvSalvar(){const dur=Math.round((Date.now()-GRV.t0)/1000),d=new Date(GRV.t0),p2=n=>String(n).padStart(2,'0'),nm=`aula-esquadrias-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}`;
 const baixa=(blob,f)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);};

 try{sb.from('trein_eventos').insert({tipo:'aula_gravada',detalhe:{arquivo:nm,dur,sala:LIVE.on?(APRES||null):null,rot:GRV.rot.slice(0,400)}}).then(()=>{});}catch(_){}
 const m=document.createElement('div');m.style.cssText='position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:970;background:#13232e;color:#fff;border-radius:14px;padding:12px 16px;font:600 15px var(--f-b);box-shadow:0 8px 20px rgba(0,0,0,.35);max-width:92vw';m.innerHTML=`<div style="margin-bottom:8px">✅ Aula gravada (${mmss(dur)}). O vídeo <b>${nm}.webm</b> foi para a pasta Downloads.</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="grvR" style="border:0;border-radius:9px;padding:8px 12px;font:700 14px var(--f-b);cursor:pointer;background:#f2a51e;color:#2a1b00">📄 Baixar o roteiro da aula</button><button type="button" id="grvF" style="border:1px solid rgba(255,255,255,.4);border-radius:9px;padding:8px 12px;font:700 14px var(--f-b);cursor:pointer;background:transparent;color:#fff">Fechar</button></div>`;document.body.appendChild(m);

function apresentar(c){/* FC conduzindo: tela, microfone, chat e mãos levantadas */

  <div class="ps">${S.ps.map(p=>`<span class="${S.maos[p.key]?'up':''}" ${S.maos[p.key]?`data-lv="baixa" data-k="${p.key}" title="Toque para baixar a mão"`:''}>${S.maos[p.key]?'✋ ':''}${esc(p.n)}${p.e?' · '+esc(p.e):''}</span>`).join('')||'<small>Ninguém entrou ainda</small>'}</div>

  <small>${esc(u)}</small></div>`;const cm=box.querySelector('#lvCm');cm.scrollTop=cm.scrollHeight;
  box.querySelector('#lvFm').onsubmit=ev=>{ev.preventDefault();const t=ev.target.t.value.trim();if(!t)return;const m={n:'Fernando',fc:1,t:t.slice(0,300),ts:Date.now()};S.chat.push(m);ch.send({type:'broadcast',event:'chat',payload:m});draw();box.querySelector('#lvFm input').focus();};};
 box.onclick=async ev=>{const b=ev.target.closest('[data-lv]');if(!b)return;const a=b.dataset.lv;

  if(a==='mic'){if(S.mic){S.mic.getTracks().forEach(t=>t.stop());S.mic=null;Object.values(S.pcs).forEach(p=>p.close());S.pcs={};ch.send({type:'broadcast',event:'mic',payload:{on:false}});draw();return;}
   try{S.mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){alert('Não foi possível ligar o microfone. Permita o microfone no navegador e tente de novo.');return;}
   S.ps.forEach(p=>ligar(p.key));ch.send({type:'broadcast',event:'mic',payload:{on:true}});draw();}
  if(a==='fim'){if(!confirm('Encerrar o treinamento ao vivo para todos?'))return;try{await ch.send({type:'broadcast',event:'fim',payload:{}});if(S.mic)S.mic.getTracks().forEach(t=>t.stop());Object.values(S.pcs).forEach(p=>p.close());await ch.untrack();sb.removeChannel(ch);}catch(_){}LIVE.on=false;box.remove();try{localStorage.removeItem('fc_esq_sala')}catch(_){}history.replaceState(null,'',location.pathname+(AT?'#'+AT:''));}};
 async function ligar(k){if(!S.mic)return;if(S.pcs[k])S.pcs[k].close();const pc=new RTCPeerConnection(ICE);S.pcs[k]=pc;S.mic.getTracks().forEach(t=>pc.addTrack(t,S.mic));
  pc.onicecandidate=e=>{if(e.candidate)ch.send({type:'broadcast',event:'rtc',payload:{to:k,ice:e.candidate.toJSON()}});};
  const of=await pc.createOffer();await pc.setLocalDescription(of);ch.send({type:'broadcast',event:'rtc',payload:{to:k,sdp:pc.localDescription.toJSON()}});}
 const lista=()=>Object.entries(ch.presenceState()).filter(([k])=>k!=='fc').map(([k,v])=>Object.assign({key:k},v[0]||{})).sort((a,b)=>(a.t||0)-(b.t||0)).slice(0,MAXAL);
 ch.on('presence',{event:'sync'},()=>{const antes=new Set(S.ps.map(p=>p.key));S.ps=lista();const agora=new Set(S.ps.map(p=>p.key));
   S.ps.forEach(p=>{if(!antes.has(p.key)&&S.mic)ligar(p.key);});Object.keys(S.pcs).forEach(k=>{if(!agora.has(k)){S.pcs[k].close();delete S.pcs[k];}});draw();LIVE.push();})
  .on('broadcast',{event:'oi'},({payload})=>{LIVE.push();if(S.mic)ch.send({type:'broadcast',event:'mic',payload:{on:true}});})

 addEventListener('scroll',()=>LIVE.push(),{passive:true});let u3='';setInterval(()=>{if(LIVE.on&&AT==='cm'&&CMS){const v=JSON.stringify(CM3D.camGet(CMS));if(v!==LIVE.ucm){LIVE.ucm=v;LIVE.push();}}const H=$('#e3host');if(!LIVE.on||!H||H.style.display==='none')return;try{const f=$('#d3f'),v=f&&f.contentWindow.ESQ_SNAP?JSON.stringify(f.contentWindow.ESQ_SNAP()):'';if(v&&v!==u3){u3=v;LIVE.push();}}catch(_){}},400);draw();}
function participar(){/* cliente / funcionário acompanhando: ouve o Fernando, chat e mão levantada */
 lvStyle();document.body.classList.add('aluno');const st=document.createElement('style');st.textContent='.aluno .nav,.aluno #bHome,.aluno .foot,.aluno [data-feito]{display:none!important}.aluno .lay{grid-template-columns:1fr}.aluno .top .prog{display:none}';document.head.appendChild(st);const sm=document.querySelector('.top small');if(sm)sm.textContent='🔴 Ao vivo com a FC Consultoria';

 if(nome){$('#main').innerHTML=`<div class="hero" style="text-align:center"><div class="ey">FC Consultoria · ao vivo</div><h1 style="font-size:36px">Olá, ${esc(nome)}!</h1><div class="bar" style="margin:12px auto"></div><p style="margin:0 auto 14px">Toque para entrar e ouvir o Fernando.</p><button class="btn o" id="alGo" style="font-size:17px">🔊 Entrar no treinamento</button> <button class="btn" id="alTr" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">Não sou ${esc(nome)}</button></div>`;
  $('#alGo').onclick=entrar;$('#alTr').onclick=()=>{try{localStorage.removeItem('fc_esq_aluno')}catch(_){}participar();};return;}
