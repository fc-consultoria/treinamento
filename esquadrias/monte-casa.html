<title>Monte sua Casa 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Monte sua Casa · Orientativo FC 3D — casa em 3D com esquadrias de perfis reais Suprema e Gold */
:root{--ink:#14181c;--paper:#f3f4f2;--panel:#ffffff;--mute:#66707a;--line:#dfe2e0;--soft:#eef0ee;--acc:#1f6f9a;--acc2:#e3a33b;--ok:#2f7d4f;
  --f-d:'Poppins',system-ui,sans-serif;--f-m:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#eef1f3;--paper:#101316;--panel:#171b1f;--mute:#9aa4ad;--line:#2a3036;--soft:#1e2328;--acc:#4aa3d4;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#eef1f3;--paper:#101316;--panel:#171b1f;--mute:#9aa4ad;--line:#2a3036;--soft:#1e2328;--acc:#4aa3d4;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--f-d);overflow:hidden}
.app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:58px 1fr;height:100%}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-left,0px));background:#0f1418;color:#f3f4f2}
.top .lg{display:flex;flex-direction:column;line-height:1.15}.top .lg b{font:800 16px var(--f-d);letter-spacing:.01em}.top .lg small{font:500 11px var(--f-m);color:#9fb3c0;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.top button{font:600 12.5px var(--f-d);padding:8px 14px;border-radius:99px;border:1px solid #2f3a42;background:#1a2228;color:#f3f4f2;cursor:pointer;white-space:nowrap}
.top button.pri{background:var(--acc2);border-color:var(--acc2);color:#1b1205}
.stage{position:relative;min-height:0;overflow:hidden;background:#cfdbe6}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fl{position:absolute;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.fl.tr{top:12px;right:12px;justify-content:flex-end}
.fl.bl{left:12px;bottom:12px}
.tb{font:600 12.5px var(--f-d);padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--ink);cursor:pointer;backdrop-filter:blur(6px)}
.tb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ent{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;background:var(--acc2);border-color:var(--acc2);color:#1b1205;font-size:14px;padding:11px 18px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.joy{position:absolute;left:18px;bottom:54px;width:118px;height:118px;border-radius:50%;background:rgba(15,20,24,.35);border:2px solid rgba(255,255,255,.55);z-index:4;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.aj{position:absolute;right:12px;bottom:12px;z-index:3;font:600 11.5px var(--f-m);background:rgba(15,20,24,.75);color:#fff;padding:6px 10px;border-radius:8px}
.selo{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,14,18,.55);color:#fff;text-align:center;padding:20px}
.selo[hidden]{display:none}.selo b{font:800 26px var(--f-d)}.selo span{font:500 15px var(--f-d);max-width:420px}.selo .cta{background:var(--acc2);color:#1b1205}
.lt{display:flex;flex-direction:column;gap:8px}.lt .mod small b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--acc2)}
@media (max-width:860px){.joy{left:12px;bottom:46px;width:104px;height:104px}.aj{display:none}}
.chip{font:600 12px var(--f-m);padding:6px 11px;border-radius:9px;background:#0f1418;color:#f3f4f2}
.tip{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;background:#0f1418;color:#fff;font:600 13px var(--f-d);padding:9px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;transition:opacity .3s}
.tip[hidden]{display:none}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;gap:2px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{all:unset;cursor:pointer;padding:13px 11px 11px;font:600 13px var(--f-d);color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--acc2)}
.pn{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:18px;flex:1;min-height:0}
h3{margin:0 0 8px;font:600 11px var(--f-m);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
h2{margin:0;font:700 18px var(--f-d)}
p{margin:0}.nt{color:var(--mute);font-size:12.5px}
.mods{display:grid;gap:10px}
.mod{all:unset;cursor:pointer;display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--panel)}
.mod.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.mod canvas{width:92px;height:72px;border-radius:9px;background:#f7f8f6;display:block}
.mod b{display:block;font:700 14px var(--f-d)}.mod small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.seg{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 6px;border-radius:9px;font:600 12.5px var(--f-d);color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);position:relative}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.swl{font-size:12px;color:var(--mute);margin-top:6px}
.vl{display:flex;flex-direction:column;gap:6px}
.vi{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.vi.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent)}
.vi i{font-style:normal;width:30px;height:30px;border-radius:8px;background:var(--soft);display:grid;place-items:center;flex:none}
.vi b{display:block;font:600 13px var(--f-d)}.vi small{display:block;color:var(--mute);font:500 11.5px var(--f-m)}
.tps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font:600 12px var(--f-d)}
.tp.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.tp svg{width:46px;height:38px}
.tp svg *{fill:none;stroke:currentColor;stroke-width:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:4px;font:600 12px var(--f-d);color:var(--mute)}
label.f select{font:600 14px var(--f-m);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font:600 10.5px var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font:600 12px var(--f-m);white-space:nowrap;text-align:right}
td.c{font:600 12px var(--f-m);white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cmp div{border:1px solid var(--line);border-radius:12px;padding:10px}
.cmp span{display:block;font:600 10.5px var(--f-m);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}.cmp b{font:700 17px var(--f-d)}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.cta{all:unset;cursor:pointer;text-align:center;background:var(--ink);color:var(--paper);font:700 14px var(--f-d);padding:12px 14px;border-radius:12px}
.cta.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
/* opinião */
.md{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.55);display:grid;place-items:center;padding:16px}
.md[hidden]{display:none}
.mdc{background:var(--panel);color:var(--ink);border-radius:20px;max-width:440px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mdc h2{font-size:20px}
.stars{display:flex;gap:6px}
.stars button{all:unset;cursor:pointer;font-size:32px;line-height:1;color:#c9ced3}
.stars button.on{color:var(--acc2)}
.mdc textarea{font:500 14px var(--f-d);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:90px;resize:vertical;background:var(--panel);color:var(--ink)}
.mdc .bt{display:flex;gap:8px}.mdc .bt .cta{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;font:600 12px var(--f-d);padding:6px 11px;border-radius:99px;border:1px solid var(--line)}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto 56vh auto;height:auto}
  .top{padding-block:8px;flex-wrap:wrap}.top .lg small{display:none}
  .stage{height:56vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pn{overflow:visible}
  .fl.tr{top:8px;right:8px;left:8px}
  .tb{padding:7px 11px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="lg"><b>Monte sua Casa 3D</b><small>Orientativo FC 3D · esquadrias Suprema e Gold</small></div>
    <span class="sp"></span>
    <button type="button" id="bBairro">🏙 Bairro</button>
    <button type="button" id="bOp" class="pri">💬 Sua opinião</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Casa em 3D com as esquadrias"></canvas>
    <div class="fl tr">
      <button type="button" class="tb" id="bAndar">🚶 Passear</button>
      <button type="button" class="tb" id="bAbrir">Abrir esquadrias</button>
      <button type="button" class="tb" id="bNoite">🌙 Noite</button>
      <button type="button" class="tb" data-vista="rua">Rua</button>
      <button type="button" class="tb" data-vista="quintal">Quintal</button>
      <button type="button" class="tb" data-vista="cima">De cima</button>
    </div>
    <div class="fl bl"><span class="chip" id="chip"></span></div>
    <div class="tip" id="tip" hidden></div>
    <button type="button" class="tb ent" id="bEntrar" hidden></button>
    <div class="joy" id="joy" hidden aria-label="Controle para andar"><i id="joyK"></i></div>
    <div class="aj" id="aj" hidden>Setas ou W A S D para andar · no celular, use o controle</div>
    <div class="selo" id="selo" hidden role="status"><b id="seloT"></b><span id="seloS"></span><button type="button" class="cta" id="seloOk">Continuar</button></div>
  </div>
  <aside>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pn" id="pn"></div>
  </aside>
</div>

<div class="md" id="md" hidden role="dialog" aria-modal="true" aria-labelledby="mdT">
  <div class="mdc">
    <h2 id="mdT">Gostou de montar a sua casa?</h2>
    <p class="nt">Sua opinião ajuda a deixar o treinamento melhor. Leva 20 segundos.</p>
    <div><h3>Sua nota</h3><div class="stars" id="stars"></div></div>
    <div><h3>O que mais gostou</h3><div class="chips" id="chips"></div></div>
    <textarea id="opTx" placeholder="Conte o que achou ou o que podemos melhorar…"></textarea>
    <div class="bt"><button type="button" class="cta alt" id="opDepois">Depois</button><button type="button" class="cta" id="opEnviar">Enviar opinião</button></div>
    <p class="nt" id="opMsg" hidden></p>
  </div>
</div>

/* ---------- preencher vários vãos em câmera lenta ---------- */
let FILA=[],FILA_T=null;
function preencher(cm,tipo){const L=ST.vaos.map((v,k)=>({v,k})).filter(({v})=>v.t!=='passagem'&&(cm==='vazios'?!v.t:(cm==='todos'||v.cm===cm)));
  if(!L.length){dica('Nenhum vão para preencher com essa escolha.');return;}
  L.sort((a,b)=>(a.v.andar||0)-(b.v.andar||0)||String(a.v.apto||'').localeCompare(String(b.v.apto||''))||a.k-b.k);const novos=L.map(x=>x.k).filter(k=>!FILA.some(q=>q[0]===k));FILA=FILA.filter(q=>!novos.includes(q[0])).concat(novos.map(k=>[k,tipo]));if(FILA_T)return dica(`Na fila: mais ${novos.length} vão(s) com ${TIPOS[tipo].n}.`);
  dica(`Preenchendo ${L.length} vão(s) com ${TIPOS[tipo].n}…`);
  FILA_T=setInterval(()=>{const it=FILA.shift();if(!it){clearInterval(FILA_T);FILA_T=null;salvar();painel();chip();dica('Pronto! Veja a conta da obra na aba “Perfis da obra”.');return;}
    const [k,tp]=it;ST.vaos[k].t=tp;poeEsq(k,true);if(!FILA.length)setTimeout(checaConclusao,700);chip();const pg=$('#pgBar');if(pg)atualizaProg();},260);}
function checaConclusao(){const M=MODELOS[ST.m],T=ST.vaos.filter(v=>v.t!=='passagem');if(!T.length||T.some(v=>!v.t)||ST.selos.includes(M.k))return;ST.selos.push(M.k);salvar();
  const prox=ORDEM[ORDEM.indexOf(M.k)+1],pm=prox&&MODELOS.find(m=>m.k===prox);
  $('#seloT').textContent='🏅 Obra concluída: '+M.n.split(' · ')[0];
  $('#seloS').textContent=(ST.carreira&&pm?'Você liberou a próxima obra: '+pm.n.split(' · ')[0]+'. ':'')+`Selos: ${ST.selos.length} de ${ORDEM.length}. Veja a conta da obra em “Perfis da obra”.`+(ST.selos.length===ORDEM.length?' Parabéns: você fechou o bairro inteiro!':'');$('#selo').hidden=false;conta();}
function atualizaProg(){const T=ST.vaos.filter(v=>v.t!=='passagem'),F=T.filter(v=>v.t).length,el=$('#pgBar');if(!el)return;el.style.width=(T.length?F/T.length*100:0)+'%';$('#pgTx').textContent=`${F} de ${T.length} vãos com esquadria`;}

/* ---------- câmera ---------- */
/* voo da câmera em arco (por fora da casa), por tempo: funciona igual em qualquer aparelho */
let ALVO=null;function voar(p,t){const P=p.clone?p.clone():new THREE.Vector3(...p),Tt=t.clone?t.clone():new THREE.Vector3(...t);
  const s0=new THREE.Spherical().setFromVector3(cam.position.clone().sub(ctl.target)),s1=new THREE.Spherical().setFromVector3(P.clone().sub(Tt));
  let dth=s1.theta-s0.theta;while(dth>Math.PI)dth-=2*Math.PI;while(dth<-Math.PI)dth+=2*Math.PI;
  ALVO={t0:performance.now(),dur:1300,s0,s1,dth,a:ctl.target.clone(),b:Tt};}
function passoVoo(){if(!ALVO)return;const k=Math.min(1,(performance.now()-ALVO.t0)/ALVO.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const {s0,s1}=ALVO,lift=Math.sin(Math.PI*e)*Math.min(.35,Math.abs(ALVO.dth)*.18);
  const sp=new THREE.Spherical(s0.radius+(s1.radius-s0.radius)*e+Math.sin(Math.PI*e)*Math.abs(ALVO.dth)*2.5,Math.max(.05,s0.phi+(s1.phi-s0.phi)*e-lift),s0.theta+ALVO.dth*e);
  ctl.target.lerpVectors(ALVO.a,ALVO.b,e);cam.position.copy(ctl.target).add(new THREE.Vector3().setFromSpherical(sp));if(k>=1)ALVO=null;}
function vista(v){if(ST.vista==='bairro'){andarOff();if(v==='rua')voar([-30,7,4],[-14,3,-14]);if(v==='quintal')vistaBairro();if(v==='cima')voar([-8,120,8],[-8,0,0]);document.querySelectorAll('[data-vista]').forEach(b=>b.classList.toggle('on',b.dataset.vista===v));return;}const M=MODELOS[ST.m],[LW,LD]=M.lote;if(M.predio){if(v==='rua')voar([-LW*.42,14,LD/2+16],[0,6,0]);if(v==='quintal')voar([LW*.15,9,LD*.34],[ -2,1.5,LD*.12]);if(v==='cima')voar([.01,LD*1.6,6],[0,0,0]);document.querySelectorAll('[data-vista]').forEach(b=>b.classList.toggle('on',b.dataset.vista===v));return;}if(v==='rua')voar([-LW*.35,4.2,LD/2+9],[0,1.6,LD*.12]);if(v==='quintal')voar([LW*.45,7.5,-LD/2-5],[0,1.2,-LD*.18]);if(v==='cima')voar([0.01,Math.max(LW,LD)*1.25,4],[0,0,0]);

/* ---------- contas de perfis (para aprender) ---------- */
function cortesDe(v,linha){const r=construir({x:0,s:v.s,w:v.w,h:v.h,t:v.t,g:null},linha,true,'conv','nao');return r.cuts;}
function agrupa(cuts){const o={};cuts.forEach(([c,len,nm])=>{if(c==='CM-200')return;const k=c+'|'+nm;(o[k]=o[k]||{c,nm,qt:0,m:0,len}).qt++;o[k].m+=len;});return Object.values(o).sort((a,b)=>a.c.localeCompare(b.c));}
function kgObra(linha){let kg=0;ST.vaos.forEach(v=>{if(v.t==='passagem'||!v.t)return;cortesDe(v,linha).forEach(([c,len])=>{if(c==='CM-200')return;kg+=(PE[c]?PE[c].p:0)*len;});});return kg;}

    <div><h3>Muro, platibanda e garagem</h3>${sw('det',ST.corDet,'corDet')}</div>

  if(ST.tab==='esq'){const T=ST.vaos.filter(v=>v.t!=='passagem'),CM=['Quarto','Sala','Cozinha','Banheiro','Entrada'].filter(c2=>T.some(v=>v.cm===c2));const s=ST.sel!=null?ST.vaos[ST.sel]:null;
    h+=`<div><h2>${M.predio?'Feche o prédio':'Feche a casa'}</h2><p class="nt">Os vãos laranja estão sem esquadria. Escolha a esquadria e onde ela vai, ou toque em um vão para fazer um a um.</p></div>
    <div><div style="height:10px;border-radius:99px;background:var(--soft);overflow:hidden"><div id="pgBar" style="height:100%;width:0;background:var(--acc2);transition:width .25s"></div></div><p class="nt" id="pgTx" style="margin-top:4px"></p></div>
    <div class="box"><h3>1 · Escolha a esquadria</h3><div class="tps">${Object.entries(TIPOS).map(([k,t])=>`<button type="button" class="tp ${ST.ptipo===k?'on':''}" data-ptipo="${k}">${ICO[k]}${t.n}</button>`).join('')}</div>
      <h3 style="margin-top:12px">2 · Onde vai</h3><div class="chips">${CM.map(c2=>{const tot=T.filter(v=>v.cm===c2).length;return `<button type="button" class="${ST.pcm===c2?'on':''}" data-pcm="${c2}">${c2} <small>(${tot})</small></button>`;}).join('')}<button type="button" class="${ST.pcm==='vazios'?'on':''}" data-pcm="vazios">Todos os vazios</button></div>
      <button type="button" class="cta" id="bPreencher" style="margin-top:12px;display:block">▶ Preencher em câmera lenta</button></div>
    <div class="box"><h3>Um a um</h3><p class="nt">Toque em um vão do prédio (laranja ou já com esquadria) para escolher a esquadria só dele.</p>
      ${s?`<p style="margin-top:8px"><b>${esc(s.nome)}</b> · ${s.t?TIPOS[s.t].n:'vão vazio'} · ${fmt(s.w)} × ${fmt(s.h)} m</p><div class="tps" style="margin-top:8px">${Object.entries(TIPOS).map(([k,t])=>`<button type="button" class="tp ${s.t===k?'on':''}" data-tipo1="${k}">${ICO[k]}${t.n}</button>`).join('')}</div>
        ${!M.predio&&s.t?(()=>{const ws=[.6,.8,1.0,1.2,1.5,1.8,2.0,2.4,3.0,3.2],hs=s.t==='maximar'?[.4,.6,.8,1.0]:s.t==='correr2'?[.8,1.0,1.2,1.5]:[2.1,2.2,2.4];return `<div class="row2" style="margin-top:8px"><label class="f">Largura<select id="sW">${ws.map(w=>`<option value="${w}" ${Math.abs(s.w-w)<.01?'selected':''}>${fmt(w)} m</option>`).join('')}</select></label><label class="f">Altura<select id="sH">${hs.map(x=>`<option value="${x}" ${Math.abs(s.h-x)<.01?'selected':''}>${fmt(x)} m</option>`).join('')}</select></label></div>`;})():''}
        <div class="row2" style="margin-top:8px"><button type="button" class="cta alt" id="bPerto">Ver de perto</button><button type="button" class="cta alt" id="bTirar">Tirar a esquadria</button></div>`:''}</div>
    <div class="row2"><button type="button" class="cta alt" id="bVazio">${M.predio?'Esvaziar o prédio':'Esvaziar a casa'}</button><button type="button" class="cta alt" data-tab="perfis">Conta da obra</button></div>`;}
  else if(ST.tab==='esq'){const lista=ST.vaos.map((v,k)=>({...v,k})).filter(v=>v.t!=='passagem');const s=ST.sel!=null?ST.vaos[ST.sel]:null;
    h+=`<div><h2>Esquadrias da casa</h2><p class="nt">Toque numa esquadria na casa ou na lista para trocar a tipologia e a medida.</p></div>`;
    if(s){const ws=[.6,.8,1.0,1.2,1.5,1.8,2.0,2.4,3.0,3.2],hs=s.t==='maximar'?[.4,.6,.8,1.0]:s.t==='correr2'?[.8,1.0,1.2,1.5]:[2.1,2.2,2.4];
      h+=`<div class="box"><h3>${esc(s.nome)}</h3><div class="tps">${Object.entries(TIPOS).map(([k,t])=>`<button type="button" class="tp ${s.t===k?'on':''}" data-tipo="${k}">${ICO[k]}${t.n}</button>`).join('')}</div>
      <div class="row2" style="margin-top:10px"><label class="f">Largura<select id="sW">${ws.map(w=>`<option value="${w}" ${Math.abs(s.w-w)<.01?'selected':''}>${fmt(w)} m</option>`).join('')}</select></label>
      <label class="f">Altura<select id="sH">${hs.map(x=>`<option value="${x}" ${Math.abs(s.h-x)<.01?'selected':''}>${fmt(x)} m</option>`).join('')}</select></label></div>
      <div class="row2" style="margin-top:10px"><button type="button" class="cta alt" id="bPerto">Ver de perto</button><button type="button" class="cta alt" data-tab="perfis">Ver os perfis</button></div></div>`;}
    h+=`<div class="vl">${lista.map(v=>`<button type="button" class="vi ${ST.sel===v.k?'on':''}" data-vi="${v.k}"><i>${ICO[v.t].replace('<svg','<svg width="22" height="18"')}</i><span><b>${esc(v.nome)}</b><small>${TIPOS[v.t].n} · ${fmt(v.w)} × ${fmt(v.h)} m</small></span></button>`).join('')}</div>`;}
  if(ST.tab==='perfis'){const kS=kgObra('sup'),kG=kgObra('gold');
    h+=`<div><h2>Perfis da obra</h2><p class="nt">Peso de alumínio das esquadrias desta obra (sem contramarco).</p></div>
    <div class="cmp"><div><span>Suprema</span><b>${fmt(kS,1)} kg</b></div><div><span>Gold</span><b>${fmt(kG,1)} kg</b></div><div><span>Diferença</span><b>${kS?'+'+Math.round((kG/kS-1)*100)+'%':'—'}</b></div></div>`;
    if(M.predio){const Q={};ST.vaos.forEach(v=>{if(v.t&&v.t!=='passagem'){const k=v.t+'|'+v.w+'|'+v.h;(Q[k]=Q[k]||{t:v.t,w:v.w,h:v.h,n:0,cm:new Set()}).n++;Q[k].cm.add(v.cm);}});const L=Object.values(Q).sort((a,b)=>b.n-a.n),tot=L.reduce((a,b)=>a+b.n,0);
      h+=`<div><h3>Quantitativo da obra · ${tot} esquadrias</h3>${L.length?`<table><thead><tr><th>Tipologia</th><th>Onde</th><th style="text-align:right">Medida</th><th style="text-align:right">Qt</th></tr></thead><tbody>${L.map(x=>`<tr><td>${TIPOS[x.t].n}</td><td>${[...x.cm].join(', ')}</td><td class="n">${Math.round(x.w*1000)} × ${Math.round(x.h*1000)}</td><td class="n">${x.n}</td></tr>`).join('')}</tbody></table>`:'<p class="nt">Ainda não há esquadrias no prédio.</p>'}</div>`;}
    const s=ST.sel!=null?ST.vaos[ST.sel]:null;
    if(!s)h+=`<div class="box"><p>Escolha uma esquadria (na casa ou na aba <b>Esquadrias</b>) para ver os perfis, a quantidade e o comprimento de cada peça.</p></div>`;
    else{const g=agrupa(cortesDe(s,ST.linha));h+=`<div><h3>${esc(s.nome)} · ${TIPOS[s.t].n} · ${LIN[ST.linha].nome}</h3><table><thead><tr><th>Perfil</th><th>Peça</th><th style="text-align:right">Qt</th><th style="text-align:right">Corte</th></tr></thead><tbody>${g.map(x=>`<tr><td class="c">${x.c}</td><td>${esc(x.nm)}<br><span class="nt">${esc(PE[x.c]?PE[x.c].n:'')}</span></td><td class="n">${x.qt}</td><td class="n">${Math.round(x.len*1000)} mm</td></tr>`).join('')}</tbody></table>
      <p class="nt" style="margin-top:8px">Cortes aproximados para estudo. A medida final de fabricação vem do sistema (WVetro/CEM).</p></div>`;}}
  $('#pn').innerHTML=h;atualizaProg();document.querySelectorAll('[data-mini]').forEach(c=>miniPlanta(c,MODELOS[+c.dataset.mini]));}

/* ================= EVENTOS ================= */
let INTER=0,T0=Date.now();const conta=()=>{INTER++;checaOpiniao();};
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;ST.tab=b.dataset.tab;painel();});
$('#pn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){ST.tab=d.tab;painel();return;}
  if(d.mod!=null){const k=MODELOS[+d.mod].k;if(bloqueada(k)){dica('🔒 Termine a obra anterior para liberar esta.');return;}clearInterval(FILA_T);FILA_T=null;FILA=[];DETALHE.clear();ST.m=+d.mod;ST.vaos=ST.obras[k];ST.sel=null;montar();painel();vista('rua');conta();salvar();return;}
  if(d.linha){ST.linha=d.linha;montar();painel();conta();salvar();return;}
  if(d.tel){ST.tel=d.tel;montar();painel();conta();salvar();return;}
  if(d.cor){ST[d.cor]=d.v;aplicaCores();if(d.cor==='corTel'&&ST.tel==='plat')montar();painel();conta();salvar();return;}
  if(d.entrar){entrarObra(d.entrar);return;}
  if(d.irlote){const l=LOTES.find(q=>q.k===d.irlote);if(l){if(AV.on){AV.p.set(l.porta.x,0,l.porta.z+(l.porta.z<0?2.5:-2.5));AV.yaw=l.porta.z<0?Math.PI:0;}else voar([l.centro.x+10,22,l.centro.z+(l.centro.z<0?30:-30)],[l.centro.x,2,l.centro.z]);}return;}
  if(d.modo){const c2=d.modo==='carreira';if(c2&&!ST.carreira){if(!confirm('Começar a carreira? As obras começam vazias e você vai liberando uma por vez.'))return;ORDEM.forEach(k=>{const m=MODELOS.find(x=>x.k===k);ST.obras[k]=novoVaos(m,true);});ST.selos=[];}
    ST.carreira=c2;ST.vaos=ST.obras[MODELOS[ST.m].k];salvar();montar();painel();return;}
  if(b.id==='bRecomecar'){if(!confirm('Recomeçar a carreira do zero?'))return;ORDEM.forEach(k=>{const m=MODELOS.find(x=>x.k===k);ST.obras[k]=novoVaos(m,true);});ST.selos=[];ST.vaos=ST.obras[MODELOS[ST.m].k];salvar();montar();painel();return;}
  if(d.ptipo){ST.ptipo=d.ptipo;painel();return;}
  if(d.pcm){ST.pcm=d.pcm;painel();return;}
  if(b.id==='bPreencher'){if(!ST.ptipo){dica('Escolha primeiro a esquadria (passo 1).');return;}if(!ST.pcm){dica('Escolha onde ela vai (passo 2).');return;}preencher(ST.pcm,ST.ptipo);conta();return;}
  if(d.tipo1&&ST.sel!=null){ST.vaos[ST.sel].t=d.tipo1;DETALHE.delete(ST.sel);poeEsq(ST.sel,true);selVisual();painel();chip();conta();salvar();checaConclusao();return;}
  if(b.id==='bTirar'&&ST.sel!=null){ST.vaos[ST.sel].t=null;DETALHE.delete(ST.sel);poeEsq(ST.sel,false);selVisual();painel();chip();salvar();return;}
  if(b.id==='bVazio'){if(!confirm('Tirar todas as esquadrias desta obra?'))return;clearInterval(FILA_T);FILA_T=null;FILA=[];ST.selos=ST.selos.filter(x=>x!==MODELOS[ST.m].k);ST.vaos.forEach(v=>{if(v.t!=='passagem')v.t=null;});DETALHE.clear();ST.sel=null;montar();painel();salvar();return;}
  if(d.vi!=null){ST.sel=+d.vi;selVisual();painel();verDePerto(ST.sel);conta();return;}
  if(d.tipo&&ST.sel!=null){const v=ST.vaos[ST.sel],t=TIPOS[d.tipo];v.t=d.tipo;v.w=t.w;v.h=t.h;v.s=t.s;montar();painel();verDePerto(ST.sel);conta();salvar();return;}
  if(b.id==='bPerto'&&ST.sel!=null){verDePerto(ST.sel);return;}});
$('#pn').addEventListener('change',e=>{if(ST.sel==null)return;const v=ST.vaos[ST.sel];if(e.target.id==='sW')v.w=+e.target.value;if(e.target.id==='sH'){v.h=+e.target.value;if(v.s>0&&v.s+v.h>2.5)v.s=Math.max(.3,2.4-v.h);}montar();painel();conta();salvar();});
function aplicaCores(){mPar.color.set(ST.corPar);mArg.color.set(ST.corPar);mDet.color.set(ST.corDet);mTel.color.set(ST.corTel);
  mAlu.color.set(ST.corPerf);const esc_=new THREE.Color(ST.corPerf).getHSL({}).l<.4;mAlu.emissive.set(esc_?0x000000:0x1c2226);mAlu.metalness=ST.corPerf==='#b9bec3'?.55:.3;mAlu.needsUpdate=true;}
$('#bAbrir').onclick=()=>{ST.aberto=!ST.aberto;aplicaAbertura();$('#bAbrir').textContent=ST.aberto?'Fechar esquadrias':'Abrir esquadrias';$('#bAbrir').classList.toggle('on',ST.aberto);conta();};
$('#bNoite').onclick=()=>{ST.noite=!ST.noite;aplicaNoite();conta();salvar();};
document.querySelectorAll('[data-vista]').forEach(b=>b.onclick=()=>{vista(b.dataset.vista);conta();});
function botoes(){const bz=ST.vista==='bairro';$('#bAndar').hidden=!bz;$('#bAbrir').hidden=bz;$('#bBairro').textContent=bz?'🏠 Obra atual':'🏙 Bairro';
  const q=document.querySelector('[data-vista=quintal]');if(q)q.textContent=bz?'Vista geral':'Quintal';const r=document.querySelector('[data-vista=rua]');if(r)r.textContent=bz?'Na rua':'Rua';}
$('#bBairro').onclick=()=>{if(ST.vista==='bairro')entrarObra(MODELOS[ST.m].k);else irBairro();botoes();};
$('#bAndar').onclick=()=>{AV.on?andarOff():andarOn();};
$('#bEntrar').onclick=e=>{const k=e.currentTarget.dataset.k;if(k){entrarObra(k);botoes();}};
$('#seloOk').onclick=()=>{$('#selo').hidden=true;if(ST.carreira){irBairro();botoes();}};
// toque na esquadria
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let down=null;
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];if(!AV.on)ALVO=null;});
cv.addEventListener('pointerup',e=>{if(!down)return;const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(mv>6)return;
  const r=cv.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pt,cam);
  if(ST.vista==='bairro'){if(AV.on)return;const h=ray.intersectObjects(LOTES.map(l=>l.hit),false)[0];if(h){const k=h.object.userData.lote,m=MODELOS.find(x=>x.k===k);dica(bloqueada(k)?'🔒 '+m.n+': termine a obra anterior.':m.n+' · toque em “Montar” no painel ou chegue no portão passeando.');}return;}
  const objs=[];ESQ.forEach(q=>q.r.root.traverse(o=>{if(o.isMesh&&o.visible)objs.push(o);}));const hit=ray.intersectObjects(objs,false)[0];
  if(hit){ST.sel=hit.object.userData.vi;ST.tab='esq';selVisual();painel();conta();dica('Esquadria selecionada: troque a tipologia ou a medida no painel.');}});
let dT=null;function dica(t){const el=$('#tip');el.textContent=t;el.hidden=false;clearTimeout(dT);dT=setTimeout(()=>{el.hidden=true;},2600);}

/* ================= OPINIÃO ================= */
const KOP='fc_montecasa_opiniao';let NOTA=0,GOST=new Set();
const GOSTOS=['A casa em 3D','Trocar as cores','Ver os perfis','Abrir as esquadrias','Comparar Suprema e Gold','Modo noite'];
function abrirOp(){$('#stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} estrela(s)" class="${n<=NOTA?'on':''}">★</button>`).join('');
  $('#chips').innerHTML=GOSTOS.map(g=>`<button type="button" class="${GOST.has(g)?'on':''}">${g}</button>`).join('');$('#opMsg').hidden=true;$('#md').hidden=false;}
function checaOpiniao(){let ja=false;try{ja=!!localStorage.getItem(KOP);}catch(_){}if(ja||!$('#md').hidden)return;if(INTER>=6&&Date.now()-T0>60000){try{localStorage.setItem(KOP,'perguntado');}catch(_){}abrirOp();}}
setInterval(checaOpiniao,15000);
$('#bOp').onclick=abrirOp;
$('#stars').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;NOTA=+b.dataset.n;document.querySelectorAll('#stars button').forEach(x=>x.classList.toggle('on',+x.dataset.n<=NOTA));});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent;GOST.has(t)?GOST.delete(t):GOST.add(t);b.classList.toggle('on');});
$('#opDepois').onclick=()=>{$('#md').hidden=true;};
$('#opEnviar').onclick=()=>{if(!NOTA){$('#opMsg').hidden=false;$('#opMsg').textContent='Escolha uma nota de 1 a 5 estrelas.';return;}
  const op={tipo:'opiniao_casa3d',nota:NOTA,gostou:[...GOST],texto:$('#opTx').value.trim().slice(0,1000),planta:ST.vista==='bairro'?'bairro':MODELOS[ST.m].k,linha:ST.linha,selos:ST.selos.length,carreira:!!ST.carreira,em:new Date().toISOString()};
  try{localStorage.setItem(KOP,JSON.stringify(op));}catch(_){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({fc:'opiniao',op},'*');}catch(_){}
  $('#opMsg').hidden=false;$('#opMsg').textContent='Obrigado! Sua opinião foi registrada.';setTimeout(()=>{$('#md').hidden=true;},1400);};

/* ================= LOOP ================= */
function tamanho(){const r=stage.getBoundingClientRect();R3.setSize(r.width,r.height,false);cam.aspect=r.width/Math.max(1,r.height);cam.updateProjectionMatrix();}
addEventListener('resize',tamanho);
function loop(){requestAnimationFrame(loop);passoAvatar();if(!AV.on){passoVoo();ctl.update();}passoAnim();animaAbertura();R3.render(SC,cam);}
aplicaCores();tamanho();montar();painel();
if(ST.vista==='bairro'){cam.position.set(-20,46,62);ctl.target.set(-8,0,0);}else{const M=MODELOS[ST.m],[LW,LD]=M.lote;cam.position.set(-LW*.35,4.2,LD/2+9);ctl.target.set(0,1.6,LD*.12);vista('rua');}
botoes();
loop();
window.MC={ST,montar,painel,cam,ctl,AV,entrarObra,irBairro,andarOn,TECLAS,get ALVO(){return ALVO;}};
})();
</script>
</body>
