<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demonstrativo · Catálogo virtual dos clientes · FC</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{--ink:#0e1b22;--tl:#17606b;--or:#f2a024;--paper:#f3f6f7;--tx:#17222a;--tm:#55636c;--ln:#dfe5e8;--f-d:'Barlow Condensed',system-ui,sans-serif;--f-b:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--tx);font:400 15.5px/1.5 var(--f-b)}
button,input,select,textarea{font:inherit}
.demo{position:sticky;top:0;z-index:50;background:#2a1650;color:#fff;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo b{font:800 15px var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:#d8c8ff;margin-right:6px}
.demo button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}
.demo button[aria-pressed=true]{background:#fff;color:#2a1650}
.demo select{border-radius:8px;padding:5px 8px;border:0}
.demo .r{margin-left:auto;font-size:13px;color:#d8c8ff}
.w{max-width:1200px;margin:0 auto;padding:0 18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:#fff;color:var(--tx);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;text-decoration:none;min-height:38px}
.btn.pri{background:var(--tl);color:#fff;border-color:var(--tl)}.btn.or{background:var(--or);border-color:var(--or);color:#1d1400}.btn.sm{padding:4px 9px;min-height:30px;font-size:13.5px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font:800 22px var(--f-d);text-transform:uppercase;letter-spacing:.02em}
.note{color:var(--tm);font-size:13.5px}
.tag{display:inline-block;border-radius:12px;padding:2px 9px;font-size:12.5px;font-weight:700}
.ok{background:#e6f5ec;color:#1f6b3f}.wn{background:#fff3e0;color:#9a5a00}.gr{background:#eef1f3;color:#55636c}
/* paineis */
.ph{background:#1b232a;color:#fff;padding:14px 0}.ph .w{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ph h1{margin:0;font:800 26px var(--f-d)}.ph small{display:block;color:#9fb6c1;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ph .btn{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.3)}.ph .btn.or{background:var(--or);color:#1d1400}
main{padding:18px 0 60px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.cli{border:1px solid var(--ln);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.cli .hd{display:flex;gap:10px;align-items:center}.cli .lg{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;color:#fff;font:800 20px var(--f-d)}
.cli b{font:700 18px var(--f-b)}.cli .lk{font-size:13px;color:#1f5f8b;word-break:break-all}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kv div{background:var(--paper);border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--tm)}.kv b{display:block;font:800 19px var(--f-d);color:var(--tx)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.line i{width:12px;height:12px;border-radius:4px}.line b{min-width:140px}
.drop{border:2px dashed #b9c7cf;border-radius:12px;padding:16px;text-align:center;color:var(--tm);background:#fafcfd}
/* gestor */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tm);font-weight:600}
.cfg input,.cfg select,.cfg textarea{border:1px solid #c9d3d8;border-radius:8px;padding:8px 10px;color:var(--tx);font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1;min-width:200px;border:1.5px solid #c9d3d8;border-radius:10px;padding:8px 12px}
table.pf{width:100%;border-collapse:collapse;font-size:14px}
table.pf th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--tm);padding:6px;border-bottom:1px solid var(--ln);position:sticky;top:44px;background:#fff;z-index:2}
table.pf td{padding:6px;border-bottom:1px solid #edf1f3;vertical-align:middle}
table.pf img{width:64px;height:44px;object-fit:contain;background:#f7f9fa;border-radius:6px}
table.pf input[type=text]{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent}
table.pf input[type=text]:hover,table.pf input[type=text]:focus{border-color:#c9d3d8;background:#fff}
.cores{display:flex;gap:4px;flex-wrap:wrap}.cor{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c9d3d8;cursor:pointer;opacity:.25}.cor.on{opacity:1;box-shadow:0 0 0 2px var(--tl)}
.sw{position:relative;display:inline-block;width:38px;height:22px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:#c9d3d8;border-radius:12px;cursor:pointer;transition:.2s}.sw span:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:#1f8a4c}.sw input:checked+span:before{transform:translateX(16px)}
.sc{display:flex;flex-direction:column;gap:3px}.sc small{font-size:11.5px;color:var(--tm)}
tr.oc td{opacity:.45}
.save{position:fixed;right:18px;bottom:18px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* página do cliente */
.cp{--c:#17606b}
.cph{background:var(--c);color:#fff}.cph .w{display:flex;align-items:center;gap:14px;height:70px}.cph .lg{width:46px;height:46px;border-radius:10px;background:#fff;color:var(--c);display:grid;place-items:center;font:800 22px var(--f-d)}.cph b{font:800 22px var(--f-d);display:block}.cph small{opacity:.85;font-size:12.5px}
.cph .zap{background:#1f9d55;color:#fff;border:0}
.chero{background:linear-gradient(160deg,var(--c),#0d2a33);color:#fff;padding:30px 0 34px}.chero h1{margin:0 0 8px;font:800 clamp(30px,4vw,46px)/1.05 var(--f-d)}.chero p{margin:0;color:#e3f0f2;max-width:720px}
.ctools{position:sticky;top:44px;z-index:5;background:rgba(243,246,247,.97);border-bottom:1px solid var(--ln);padding:10px 0}.ctools .w{display:flex;gap:8px;flex-wrap:wrap}
.ctools button.t{border:1px solid var(--ln);background:#fff;border-radius:20px;padding:7px 14px;font-weight:600;cursor:pointer}.ctools button.t[aria-pressed=true]{background:var(--c);color:#fff;border-color:var(--c)}
.ctools input{flex:1;min-width:200px;border:1.5px solid #c9d3d8;border-radius:10px;padding:8px 12px}
.gh{display:flex;gap:10px;align-items:center;margin:22px 0 10px}.gh i{width:7px;align-self:stretch;border-radius:3px;background:var(--c)}.gh h2{margin:0;font:800 24px var(--f-d);text-transform:uppercase}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.cc{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;position:relative}
.cc .im{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.cc .im img.d3{max-height:96px;max-width:100%;object-fit:contain}.cc .im img.d2{height:26px;border-top:1px dashed #d5dde1;padding-top:3px}
.cc b{font:800 20px var(--f-d);color:var(--c)}.cc span.n{font-size:13.5px;color:var(--tm);line-height:1.3}.cc em{font-style:normal;font-size:12.5px;color:var(--tm)}
.cc .cores{margin-top:4px}.cc .cor{opacity:1;cursor:default;width:16px;height:16px}
.cc .scb{margin-top:8px;align-self:flex-start;border:1px solid #f2c98a;background:#fff7ec;color:#8a4a00;border-radius:16px;padding:4px 11px;font:700 13px var(--f-b);cursor:pointer}
.cc .obs{margin-top:6px;background:#fff7ec;border:1px solid #f2c98a;border-radius:10px;padding:8px 10px;font-size:13px;color:#7a4a08}
.cc .pe{position:absolute;right:10px;top:10px;font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 8px;background:#e6f5ec;color:#1f6b3f}
.cfoot{background:var(--ink);color:#c7d6dd;padding:24px 0;margin-top:30px;font-size:13.5px}
.cvbar{background:#fff7d6;border-bottom:1px solid #f0d77a;padding:8px 0;font-size:13.5px;color:#6b5200}.cvbar .w{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media print{@page{size:A4;margin:10mm}body{background:#fff;font-size:11px}.demo,.ctools,.cvbar,.zap,.scb+.obs,.save,.noprint{display:none!important}
.cph,.chero,.cc .pe,.gh i,.cor{-webkit-print-color-adjust:exact;print-color-adjust:exact}.chero{padding:10px 0}.chero h1{font-size:26px}.w{max-width:none;padding:0}
.cgrid{grid-template-columns:repeat(4,1fr);gap:6px}.cc{break-inside:avoid;padding:6px 8px;border-radius:8px}.cc .im{height:96px}.cc .im img.d3{max-height:62px}.cc .im img.d2{height:18px}.cc b{font-size:15px}.cc span.n{font-size:10.5px}
.cc .scb{border:0;background:none;padding:0;margin-top:3px;font-size:10.5px;color:#8a4a00}.gh{margin:10px 0 6px;break-after:avoid}.gh h2{font-size:17px}.cfoot{background:#fff;color:#55636c;border-top:1px solid #ccc;padding:8px 0}.cfoot b{color:#17222a!important}
.pline{break-before:page}.pline:first-of-type{break-before:auto}}
.ptitle{display:none}@media print{.ptitle{display:block;font:800 22px var(--f-d);margin:14px 0 0;color:var(--c)}}
@media(max-width:700px){.kv{grid-template-columns:repeat(3,1fr)}table.pf .hm{display:none}}
</style>
</head>

function gestor(){const c=cli(),L=linhasDo(c);const lin=L.find(l=>l.id===LI)||L[0];LI=lin.id;const t=nz(Q);
 const rows=lin.p.filter(q=>{const e=ed(c.id,q);if(t&&!nz(e.c+' '+q.c+' '+e.n).includes(t))return false;if(FL==='sc')return e.sc;if(FL==='oc')return e.oc;return true;});
 return `<div class="ph" style="background:${c.cor}"><div class="w"><div><small>Painel do gestor · catálogo virtual</small><h1>${esc(c.nome)}</h1></div><div class="acts"><button class="btn or" data-act="ver" data-c="${c.id}">👁 Ver como o cliente vê</button><button class="btn" data-act="print" data-c="${c.id}">🖨 Imprimir catálogo</button><button class="btn">Sair</button></div></div></div>
 <main><div class="w">
 <div class="card"><h2>Sua marca no catálogo</h2><div class="cfg">
  <label>Nome da empresa<input data-k="nome" value="${esc(c.nome)}"></label><label>Sigla do logo<input data-k="sigla" value="${esc(c.sigla)}" maxlength="3"></label><label>Cor principal<input data-k="cor" type="color" value="${c.cor}"></label><label>WhatsApp de atendimento<input data-k="zap" value="${esc(c.zap)}"></label>
  <label style="grid-column:1/-1">Texto do topo do catálogo<textarea data-k="texto" rows="2">${esc(c.texto)}</textarea></label>
  <label style="grid-column:1/-1">Observação padrão do “Sob consulta”<textarea data-k="obsPad" rows="2">${esc(c.obsPad)}</textarea></label></div></div>
 <div class="card"><h2>Perfis do catálogo</h2>
  <div class="tools">${L.map(l=>`<button class="btn sm ${l.id===LI?'pri':''}" data-li="${l.id}">${esc(l.n)}</button>`).join('')}<input type="search" id="gq" placeholder="Buscar código ou nome" value="${esc(Q)}">
  <select id="gf"><option value="todos">Todos</option><option value="sc" ${FL==='sc'?'selected':''}>Só sob consulta</option><option value="oc" ${FL==='oc'?'selected':''}>Só ocultos</option></select>
  <button class="btn sm" data-act="allsc">Todos “sob consulta”</button><button class="btn sm" data-act="nosc">Tirar “sob consulta” de todos</button></div>
  <p class="note" style="margin:0 0 8px">Clique no código ou no nome para editar. <b>Sob consulta</b> já vem ligado em todos; em cada perfil você escolhe se a observação aparece para o cliente.</p>
  <div style="overflow:auto"><table class="pf"><thead><tr><th>Foto</th><th>Código no seu catálogo</th><th>Nome</th><th class="hm">Cores disponíveis</th><th>Sob consulta</th><th>Mostrar observação</th><th>Visível</th></tr></thead><tbody>
  ${rows.map(q=>{const e=ed(c.id,q),k=esc(q.c);return `<tr class="${e.oc?'oc':''}"><td><img src="${IMG}${q.d3?q.i:'c'+q.i}.webp" alt="" loading="lazy"></td>
   <td><input type="text" data-e="c" data-q="${k}" value="${esc(e.c)}"><div class="note" style="font-size:11.5px;padding-left:6px">mercado: ${k}</div></td>
   <td><input type="text" data-e="n" data-q="${k}" value="${esc(e.n)}"></td>
   <td class="hm"><div class="cores">${CORES.map(([id,nm,hx])=>`<span class="cor ${e.cores.includes(id)?'on':''}" title="${nm}" style="background:${hx}" data-cor="${id}" data-q="${k}"></span>`).join('')}</div></td>
   <td><label class="sw"><input type="checkbox" data-e="sc" data-q="${k}" ${e.sc?'checked':''}><span></span></label></td>
   <td><div class="sc"><label class="sw"><input type="checkbox" data-e="obs" data-q="${k}" ${e.obs?'checked':''} ${e.sc?'':'disabled'}><span></span></label>${e.obs&&e.sc?`<input type="text" data-e="txt" data-q="${k}" value="${esc(e.txt)}" placeholder="usa a observação padrão" style="font-size:12.5px">`:''}</div></td>
   <td><label class="sw"><input type="checkbox" data-e="vis" data-q="${k}" ${e.oc?'':'checked'}><span></span></label></td></tr>`;}).join('')}
  </tbody></table></div><p class="note">${rows.length} perfis listados</p></div>
 </div></main><button class="btn pri save" data-act="salvar">💾 Salvar e publicar</button>`;}
/* ---------- PÁGINA DO CLIENTE ---------- */
function cliente(){const c=cli(),L=linhasDo(c);const lin=L.find(l=>l.id===LI)||L[0];LI=lin.id;const t=nz(Q);
 let html='';(window.__PRINT?L:[lin]).forEach(lin=>{if(window.__PRINT)html+=`<div class="pline"><div class="ptitle">${esc(lin.n)}</div>`;lin.g.forEach(([g,nm,ds])=>{const P=lin.p.filter(q=>q.g===g&&!ed(c.id,q).oc&&(!t||nz(ed(c.id,q).c+' '+ed(c.id,q).n).includes(t)));if(!P.length)return;
  html+=`<div class="gh"><i></i><div><h2>${esc(nm)}</h2><div class="note">${esc(ds)}</div></div></div><div class="cgrid">${P.map(q=>{const e=ed(c.id,q);return `<article class="cc">${e.sc?'':'<span class="pe">pronta entrega</span>'}
   <div class="im">${q.d3?`<img class="d3" src="${IMG}${q.i}.webp" alt="" loading="lazy"><img class="d2" src="${IMG}c${q.i}.webp" alt="" loading="lazy">`:`<img class="d3" src="${IMG}c${q.i}.webp" alt="" loading="lazy">`}</div>
   <b>${esc(e.c)}</b><span class="n">${esc(e.n)}</span><em>${q.p?'Peso: '+esc(q.p)+' kg/m':''}</em>
   <div class="cores">${CORES.filter(x=>e.cores.includes(x[0])).map(([id,nm,hx])=>`<span class="cor on" title="${nm}" style="background:${hx}"></span>`).join('')}</div>
   ${e.sc?`<button class="scb" data-sc="${esc(q.c)}">Sob consulta ${e.obs?'ⓘ':''}</button><div class="obs" hidden>${e.obs?esc(e.txt||c.obsPad)+'<br>':'Consulte prazo e disponibilidade:<br>'}<a class="btn sm" style="margin-top:6px;background:#1f9d55;color:#fff;border:0" href="#" onclick="return false">💬 Consultar no WhatsApp</a></div>`:''}</article>`;}).join('')}</div>`;});if(window.__PRINT)html+='</div>';});
 return `${cvMode?`<div class="cvbar"><div class="w">👁 <b>Visualização:</b> é assim que os clientes da ${esc(c.nome)} veem o catálogo.<button class="btn sm" data-act="voltar" style="margin-left:auto">← Voltar ao painel</button></div></div>`:''}
 <div class="cp" style="--c:${c.cor}"><div class="cph"><div class="w"><div class="lg">${esc(c.sigla)}</div><div><b>${esc(c.nome)}</b><small>Catálogo de perfis de alumínio</small></div><button class="btn noprint" data-act="print" style="margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)">🖨 Imprimir / salvar PDF</button><a class="btn zap" style="margin-left:8px" href="#" onclick="return false">💬 WhatsApp ${esc(c.zap)}</a></div></div>
 <div class="chero"><div class="w"><h1>Catálogo de perfis</h1><p>${esc(c.texto)}</p></div></div>
 <div class="ctools"><div class="w">${L.map(l=>`<button class="t" data-li="${l.id}" aria-pressed="${l.id===LI}">${esc(l.n)}</button>`).join('')}<input type="search" id="cq" placeholder="Buscar pelo código ou nome" value="${esc(Q)}"></div></div>
 <div class="w">${html||'<p class="note" style="padding:20px 0">Nenhum perfil encontrado.</p>'}</div>
 <div class="cfoot"><div class="w"><b style="color:#fff">${esc(c.nome)}</b> · ${esc(c.cidade)} · WhatsApp ${esc(c.zap)}<br><span style="opacity:.75">Imagens ilustrativas. Confirme código, cor e disponibilidade antes de fechar o pedido. Catálogo desenvolvido por FC Consultoria em Esquadria.</span></div></div></div>`;}
function bind(){const A=document.getElementById('app');
 A.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
  if(a==='gestor'){CID=b.dataset.c;V='gestor';draw();}
  if(a==='ver'){CID=b.dataset.c||CID;cvMode=V;V='cliente';draw();}
  if(a==='voltar'){V=cvMode;cvMode=false;draw();}
  if(a==='copiar'){b.textContent='✓ Link copiado';}
  if(a==='print'){if(b.dataset.c){CID=b.dataset.c;}const v0=V;V='cliente';window.__PRINT=1;draw();setTimeout(()=>{window.print();window.__PRINT=0;V=v0;draw();},400);}
  if(a==='novo'){const n=prompt('Nome do cliente:');if(n){const id='c'+Date.now();ST.cli.push({id,nome:n,cidade:'',cor:'#17606b',sigla:n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),zap:'',slug:n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-'),linhas:['sup','gold'],texto:'Catálogo de perfis de alumínio.',obsPad:'Perfil sob consulta: confirme prazo e disponibilidade.'});save();draw();}}
  if(a==='allsc'||a==='nosc'){const c=cli();linhasDo(c).forEach(l=>l.p.forEach(q=>{ed(c.id,q).sc=a==='allsc';}));save();draw();}
  if(a==='salvar'){save();b.textContent='✓ Salvo e publicado';setTimeout(()=>b.textContent='💾 Salvar e publicar',1600);}});
 A.querySelectorAll('[data-li]').forEach(b=>b.onclick=()=>{LI=b.dataset.li;draw();});
 const q=A.querySelector('#gq')||A.querySelector('#cq');if(q)q.oninput=e=>{Q=e.target.value;clearTimeout(window.__t);window.__t=setTimeout(()=>{draw();const n=document.getElementById(q.id);n.focus();n.setSelectionRange(n.value.length,n.value.length);},250);};
 const gf=A.querySelector('#gf');if(gf)gf.onchange=e=>{FL=e.target.value;draw();};
 A.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{cli()[i.dataset.k]=i.value;save();if(i.dataset.k==='cor'||i.dataset.k==='nome'||i.dataset.k==='sigla')draw();});
 const find=k=>{for(const l of BASE){const q=l.p.find(x=>x.c===k);if(q)return q;}};
 A.querySelectorAll('[data-e]').forEach(i=>i.onchange=()=>{const e=ed(CID,find(i.dataset.q)),k=i.dataset.e;
  if(k==='c'||k==='n'||k==='txt')e[k]=i.value;else if(k==='vis')e.oc=!i.checked;else e[k]=i.checked;save();if(k!=='c'&&k!=='n'&&k!=='txt')draw();});
 A.querySelectorAll('[data-cor]').forEach(s=>s.onclick=()=>{const e=ed(CID,find(s.dataset.q)),c=s.dataset.cor;e.cores=e.cores.includes(c)?e.cores.filter(x=>x!==c):e.cores.concat(c);save();s.classList.toggle('on');});
 A.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{const o=b.nextElementSibling;o.hidden=!o.hidden;});}
draw();
</script>
</body>
</html>
