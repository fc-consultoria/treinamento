<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="generator" content="Conversão de códigos · FC Consultoria em Esquadria">
<title>Conversão de códigos · FC Consultoria</title>
<link rel="icon" href="/img/logo-fc-160.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--tl:#0f6b70;--tl2:#13878d;--tlc:#e5f2f2;--or:#f2a51e;--ink:#13232e;--tm:#5a6b75;--ln:#d8e2e6;--bg:#f2f6f7;--ok:#15803d;--okc:#e7f6ec;--md:#b45309;--mdc:#fdf3e2;--bx:#b42318;--bxc:#fdecea;--f-d:'Barlow Condensed',system-ui,sans-serif;--f-b:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b)}
button{font-family:inherit}
.rgate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#e9f0f0;padding:16px;font-family:system-ui,sans-serif}.rgate[hidden]{display:none}
.rgate form{width:min(360px,100%);background:#fff;border:1px solid #d6e1e1;border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.rgate h1{margin:0;font:700 24px system-ui;color:#13262a}.rgate small{color:#5a6e72;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rgate label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}.rgate input{font:15px system-ui;padding:9px 10px;border:1px solid #c4ccd2;border-radius:8px}
.rgate button{background:var(--tl);color:#fff;border:0;border-radius:9px;padding:11px;font:700 15px system-ui;cursor:pointer}
.top{background:var(--tl);color:#fff;box-shadow:0 2px 0 var(--or)}
.top .w{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.top img{width:40px;height:40px;border-radius:9px}.top b{font:800 21px/1 var(--f-d)}.top small{display:block;font:600 11.5px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:#ffd58a}
main{max-width:1240px;margin:0 auto;padding:18px}
.busca{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.busca h1{margin:0;font:800 30px/1.05 var(--f-d);color:#0f4f53}
.busca p{margin:0;color:var(--tm);font-size:15px}
.sb{display:flex;gap:8px}.sb input{flex:1;font:600 22px var(--f-b);padding:12px 14px;border:2px solid var(--tl);border-radius:12px;text-transform:uppercase;min-width:0}
.sb button{border:0;border-radius:12px;background:var(--tl);color:#fff;font:700 16px var(--f-b);padding:0 18px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:6px 12px;font:600 14px var(--f-b);cursor:pointer;color:var(--ink)}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--tm)}
.nv{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font:700 12.5px var(--f-b);white-space:nowrap}
.nv.alta{background:var(--okc);color:var(--ok)}.nv.media{background:var(--mdc);color:var(--md)}.nv.baixa{background:var(--bxc);color:var(--bx)}
.nv::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.det{margin-top:16px;display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:16px;align-items:start}
@media(max-width:860px){.det{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.alc{border:2px solid var(--tl)}
.card .im{background:#fff;border:1px solid #eef2f3;border-radius:10px;height:220px;display:grid;place-items:center;cursor:zoom-in;padding:6px}
.card .im img{max-width:100%;max-height:208px;object-fit:contain}
.card .fn{font:700 12px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--tm)}
.card b.cd{font:800 24px/1 var(--f-d);color:var(--tl);white-space:nowrap}
.kv{display:flex;gap:6px;flex-wrap:wrap}.kv span{background:var(--bg);border-radius:8px;padding:2px 8px;font:600 13px var(--f-b)}
.card .ob{font-size:13.5px;color:#3c4c50;line-height:1.4}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ok{border:1px solid var(--ok);color:var(--ok);background:#fff;border-radius:9px;padding:6px 10px;font:700 13px var(--f-b);cursor:pointer;align-self:flex-start}.ok.on{background:var(--ok);color:#fff}
.tab{margin-top:16px;background:#fff;border:1px solid var(--ln);border-radius:16px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}th,td{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}
th{font:700 12px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--tm);background:#f7fafb;position:sticky;top:0}
tr.lk{cursor:pointer}tr.lk:hover{background:#f4f9f9}td img{width:84px;height:46px;object-fit:contain}
td .c{font:800 17px var(--f-d);color:var(--tl)}td .eq{display:flex;flex-direction:column;gap:3px}
.vazio{padding:30px;text-align:center;color:var(--tm)}
.zm{position:fixed;inset:0;z-index:900;background:rgba(6,20,26,.8);display:grid;place-items:center;padding:16px}.zm[hidden]{display:none}
.zm div{background:#fff;border-radius:16px;padding:14px;max-width:min(1100px,96vw);max-height:92vh;display:flex;flex-direction:column;gap:8px}
.zm img{max-width:100%;max-height:80vh;object-fit:contain}.zm button{align-self:flex-end;border:0;background:var(--ink);color:#fff;border-radius:99px;padding:8px 14px;font:700 14px var(--f-b);cursor:pointer}
.nota{margin-top:16px;font-size:13px;color:var(--tm);line-height:1.5}
#wm{position:fixed;inset:0;pointer-events:none;z-index:800}
#bVolta{margin-left:auto;order:99;border:1px solid rgba(255,255,255,.55);color:#fff;text-decoration:none;border-radius:9px;padding:7px 12px;font:700 14px var(--f-b,system-ui);white-space:nowrap}#bVolta:hover{background:rgba(255,255,255,.12)}
.rgate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#e9f0f0;padding:16px;font-family:system-ui,sans-serif}
.rgate[hidden]{display:none}
.rgate form{width:min(360px,100%);background:#fff;border:1px solid #d6e1e1;border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.rgate h1{margin:0;font:700 24px system-ui;color:#13262a}
.rgate small{color:#5a6e72;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rgate label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
.rgate input{font:15px system-ui;padding:9px 10px;border:1px solid #c4ccd2;border-radius:8px}
.rgate button{background:#0f6b6e;color:#fff;border:0;border-radius:9px;padding:11px;font:700 15px system-ui;cursor:pointer}
.nvb{border:1px dashed currentColor;cursor:pointer}.nvb:hover{filter:brightness(.95);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
</style>
</head>
<body>
<div class="rgate" id="gate" hidden><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>🔁 Conversão de códigos</h1>
<label>Login<input name="login" autocomplete="username" required placeholder="matriz"></label>
<label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>
<header class="top"><div class="w"><img src="/img/logo-fc-160.jpg" alt=""><div><small>FC Consultoria · Setor de compras</small><b>Conversão de códigos · Linha Suprema</b></div></div></header>
<main id="app"><p style="padding:30px">Carregando…</p></main>
<div class="zm" id="zm" hidden><div><button type="button" id="zmX">✕ Fechar</button><img id="zmI" alt=""><b id="zmT"></b></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../auth.js"></script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY=new URLSearchParams(location.search).get('k')||'';
const NV={alta:'Confirmado',media:'Provável',baixa:'Revisar'};
const kg=v=>v==null?'—':v.toFixed(3).replace('.',',')+' kg/m';
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
let D=null,Q='',FIL='todos',OK={},ADM=false;
const FS=()=>Object.keys(D.forn).filter(f=>f!=='alcoa');
function voltaUrl(adm){if(adm)return '/treinamento/painel.html';let u='';try{u=localStorage.getItem('fc_painel_cli')||'';}catch(_){}
 const k=new URLSearchParams(location.search).get('k');if(k)u='/treinamento/consultorias.html?k='+encodeURIComponent(k);return u||'/treinamento/';}
function voltaBtn(adm){if(window.top!==window)return;let b=document.getElementById('bVolta');if(!b){b=document.createElement('a');b.id='bVolta';const h=document.querySelector('header.top .w');if(!h)return;h.appendChild(b);}
 b.href=voltaUrl(adm);b.textContent=adm?'← Painel matriz':'← Painel inicial';b.title=adm?'Voltar para o painel matriz da FC':'Voltar para o painel inicial da empresa';}
function img(f,c){return 'img/'+f+'/'+encodeURIComponent(c)+'.webp?v=2';}
function achar(q){const n=norm(q);if(!n)return null;
 for(const r of D.perfis){if(norm(r.c)===n)return {r};for(const e of r.eq){if(norm(e.c)===n||norm(e.cc)===n)return {r,e};}}
 for(const f of FS())for(const s of (D.semPar[f]||[]))if(norm(s.c)===n||norm(s.cc)===n)return {sp:s,f};
 const m=/^(?:25CL?|SU|ESU|FASU0?)(\d{3})/.exec(n);if(m){const r=D.perfis.find(x=>x.c==='SU-'+m[1]);if(r)return {r};}
 return null;}
function nvTag(e,r,cl){const k=r?r.c+'|'+e.c:'';if(k&&OK[k])return `<span class="nv alta" title="Conferido pela FC">✔ Confirmado</span>`;
 if(cl&&ADM&&e.n!=='alta')return `<button type="button" class="nv ${e.n} nvb" data-ok="${esc(k)}" title="Clique para confirmar que este par está certo">${NV[e.n]} ✓?</button>`;
 return `<span class="nv ${e.n}">${NV[e.n]}</span>`;}
function eqCard(r,e){const F=D.forn[e.f],k=r.c+'|'+e.c,okd=OK[k];
 return `<div class="card"><span class="fn">${esc(F.nome)}${e.t==='leve'?' · versão leve':e.t==='pesada'?' · versão mais pesada':e.t==='variante'?' · variante':''}</span>
 <div class="im" data-zoom="${img(e.f,e.c)}" data-t="${esc(F.nome+' '+e.c)}"><img src="${img(e.f,e.c)}" alt="${esc(e.c)}" loading="lazy"></div>
 <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b class="cd">${esc(e.c)}</b>${nvTag(e,r,true)}</div>
 <div class="kv"><span>${kg(e.p)}</span>${e.d!=null?`<span style="color:${Math.abs(e.d)>10?'var(--bx)':Math.abs(e.d)>3?'var(--md)':'var(--ok)'}">${e.d>0?'+':''}${String(e.d).replace('.',',')}% no peso</span>`:''}${e.cc?`<span>cód. comercial ${esc(e.cc)}</span>`:''}</div>
 <span class="ob">${esc(e.o)} <span style="color:var(--tm)">${esc(F.cat)}, pág. ${e.pg}.</span></span>
 ${okd?`<span class="nv alta">Conferido pela FC</span>`:''}${ADM?`<button type="button" class="ok ${okd?'on':''}" data-ok="${esc(k)}">${okd?'✔ Conferido':'✔ Marcar como conferido'}</button>`:''}</div>`;}
function detalhe(x){
 if(x.sp){const F=D.forn[x.f];return `<div class="det"><div class="card"><span class="fn">${esc(F.nome)}</span><div class="im" data-zoom="${img(x.f,x.sp.c)}" data-t="${esc(x.sp.c)}"><img src="${img(x.f,x.sp.c)}" alt=""></div><b class="cd">${esc(x.sp.c)}</b><div class="kv"><span>${kg(x.sp.p)}</span>${x.sp.cc?`<span>cód. comercial ${esc(x.sp.cc)}</span>`:''}</div></div>
  <div class="card" style="background:var(--bxc);border-color:#f3c3bd"><b style="color:var(--bx);font:800 22px var(--f-d)">Sem equivalente no catálogo Suprema</b><span class="ob">Este código não tem par no catálogo da Alcoa usado na base. Confira o desenho e fale com a FC para cadastrar.</span></div></div>`;}
 const r=x.r;return `<div class="det"><div class="card alc"><span class="fn">Alcoa · ${esc(D.forn.alcoa.cat)}</span>
  <div class="im" data-zoom="${img('alcoa',r.c)}" data-t="${esc('Alcoa '+r.c)}"><img src="${img('alcoa',r.c)}" alt="${esc(r.c)}"></div>
  <b class="cd" style="font-size:34px">${esc(r.c)}</b><span style="font-weight:600">${esc(r.n||'')}</span><div class="kv"><span>${kg(r.p)}</span><span>pág. ${r.pg}</span></div></div>
  <div style="display:flex;flex-direction:column;gap:10px"><b style="font:800 22px var(--f-d);color:#0f4f53">${r.eq.length?'Equivalentes nos fornecedores':'Nenhum fornecedor da base tem este perfil'}</b><div class="eqs">${r.eq.map(e=>eqCard(r,e)).join('')}</div></div></div>`;}
function lista(){let L=D.perfis;
 if(FIL==='baixa')L=L.filter(r=>r.eq.some(e=>e.n==='baixa'&&!OK[r.c+'|'+e.c]));
 if(FIL==='sem')L=L.filter(r=>!r.eq.length);
 const cel=(r,f)=>{const es=r.eq.filter(e=>e.f===f);return es.length?`<div class="eq">${es.map(e=>`<span><b>${esc(e.c)}</b>${e.t==='leve'?' <small>leve</small>':e.t==='pesada'?' <small>pesada</small>':''} ${nvTag(e,r)}</span>`).join('')}</div>`:'<span style="color:var(--tm)">—</span>';};
 let h=`<div class="tab"><table><tr><th>Desenho</th><th>Alcoa</th><th>Peso</th>${FS().map(f=>`<th>${esc(D.forn[f].nome)}</th>`).join('')}</tr>${L.map(r=>`<tr class="lk" data-q="${esc(r.c)}"><td><img src="${img('alcoa',r.c)}" alt="" loading="lazy"></td><td><span class="c">${esc(r.c)}</span><br><small style="color:var(--tm)">${esc(r.n||'')}</small></td><td>${kg(r.p)}</td>${FS().map(f=>`<td>${cel(r,f)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 if(FIL==='sem'||FIL==='todos'){const s=D.semPar;h+=`<div class="tab" style="padding:12px 14px"><b style="font:800 20px var(--f-d);color:#0f4f53">Códigos dos fornecedores sem par no catálogo Suprema</b><p style="margin:4px 0 8px;color:var(--tm);font-size:14px">Toque para ver o desenho.</p><div class="chips">${FS().map(f=>(s[f]||[]).map(x=>`<button type="button" data-q="${esc(x.c)}">${esc(D.forn[f].nome)} · ${esc(x.c)}${x.cc?' ('+esc(x.cc)+')':''}</button>`).join('')).join('')}</div></div>`;}
 return h;}
function tela(){const x=Q?achar(Q):null;
 const cont={alta:0,media:0,baixa:0};D.perfis.forEach(r=>r.eq.forEach(e=>cont[OK[r.c+'|'+e.c]?'alta':e.n]++));
 $('#app').innerHTML=`<section class="busca"><h1>Digite o código do fornecedor ou da Alcoa</h1><p>Exemplos: <b>25C-001</b> (Texa), <b>EX-0747</b> (Selta), <b>FASU-0053</b> (FBK), <b>ESU-039</b> (Ecoalumi), <b>PLS-0130</b> (Perfileve), <b>SU-001</b> (Alcoa). Aparece o desenho 2D de cada um, lado a lado, para conferir.</p>
  <form class="sb" id="fb"><input id="q" value="${esc(Q)}" placeholder="Ex.: 25C-040" autocomplete="off" aria-label="Código do perfil"><button>Converter</button></form>
  <div class="chips"><button type="button" data-f="todos" class="${FIL==='todos'?'on':''}">Todos os perfis (${D.perfis.length})</button><button type="button" data-f="baixa" class="${FIL==='baixa'?'on':''}">Para revisar (${cont.baixa})</button><button type="button" data-f="sem" class="${FIL==='sem'?'on':''}">Sem par</button>${Q?'<button type="button" data-limpa="1">✕ Limpar busca</button>':''}</div>
  <div class="leg"><span><span class="nv alta">Confirmado</span> mesmo código e peso (até 3% de diferença)</span><span><span class="nv media">Provável</span> mesmo código, peso difere de 3 a 10%, versão leve ou variante</span><span><span class="nv baixa">Revisar</span> peso difere mais de 10% ou o desenho parece diferente</span></div></section>
  ${Q?(x?detalhe(x):`<div class="card" style="margin-top:16px"><b style="font:800 22px var(--f-d)">Código não encontrado: ${esc(Q)}</b><span class="ob">Confira se digitou certo. Nesta fase, a base tem só a linha Suprema (Alcoa, Texa e Selta).</span></div>`):lista()}
  <p class="nota">Base: catálogo Suprema da Alcoa; Texa (City 2.5), Selta (19/09/2024), FBK (Construção Civil, linha FASU), Ecoalumi (Catálogo Técnico) e Perfileve (Catálogo Geral). Equivalências montadas pela FC a partir do código, do peso e do desenho de cada catálogo. Confira sempre o desenho antes de fechar a compra. © FC Consultoria em Esquadria.</p>`;
 $('#fb').onsubmit=ev=>{ev.preventDefault();Q=$('#q').value.trim();tela();history.replaceState(null,'','#'+encodeURIComponent(Q));};}
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-q],[data-f],[data-limpa],[data-zoom],[data-ok]');if(!t)return;const d=t.dataset;
 if(d.q!=null){Q=d.q;tela();scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'','#'+encodeURIComponent(Q));}
 else if(d.f){FIL=d.f;Q='';tela();}
 else if(d.limpa){Q='';tela();history.replaceState(null,'',location.pathname+location.search);}
 else if(d.zoom){$('#zmI').src=d.zoom;$('#zmT').textContent=d.t||'';$('#zm').hidden=false;}
 else if(d.ok&&ADM){const k=d.ok,on=!OK[k];OK[k]=on;tela();try{await sb.from('trein_eventos').insert({tipo:'equiv_ok',detalhe:{k,on}});}catch(_){}}});
$('#zmX').onclick=()=>$('#zm').hidden=true;$('#zm').onclick=e=>{if(e.target.id==='zm')$('#zm').hidden=true;};addEventListener('keydown',e=>{if(e.key==='Escape')$('#zm').hidden=true;});
function marca(t){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300"><g transform="rotate(-24 230 150)" font-family="Barlow,Arial,sans-serif" text-anchor="middle" fill="#0f4f53" fill-opacity=".04"><text x="230" y="150" font-size="24" font-weight="800">FC CONSULTORIA EM ESQUADRIA</text><text x="230" y="176" font-size="13">${t}</text></g></svg>`;const w=document.createElement('div');w.id='wm';w.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;document.body.appendChild(w);}
async function iniciar(){D=await fetch('dados.json?v=1',{cache:'no-cache'}).then(r=>r.json());
 if(ADM){try{const r=await sb.from('trein_eventos').select('detalhe,criado_em').eq('tipo','equiv_ok').order('criado_em');(r.data||[]).forEach(x=>{if(x.detalhe&&x.detalhe.k)OK[x.detalhe.k]=!!x.detalhe.on;});}catch(_){}}
 Q=decodeURIComponent(location.hash.slice(1)||'');tela();}
(async()=>{if(KEY){let ok=false;try{const r=await sb.rpc('cons_portal_ver',{p_chave:KEY});ok=!r.error&&!!r.data;}catch(_){}
  if(!ok){$('#app').innerHTML='<p class="vazio">Link inválido ou expirado. Fale com a FC Consultoria.</p>';return;}marca('uso exclusivo do cliente');voltaBtn(false);iniciar();}
 else gateUI(async()=>{try{const r=await sb.rpc('trein_is_admin');ADM=!!r.data;}catch(_){}marca('uso interno');voltaBtn(true);iniciar();});})();
</script>
</body>
</html>
