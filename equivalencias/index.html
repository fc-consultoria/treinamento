function marca(t){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300"><g transform="rotate(-24 230 150)" font-family="Barlow,Arial,sans-serif" text-anchor="middle" fill="#0f4f53" fill-opacity=".04"><text x="230" y="150" font-size="24" font-weight="800">FC CONSULTORIA EM ESQUADRIA</text><text x="230" y="176" font-size="13">${t}</text></g></svg>`;const w=document.createElement('div');w.id='wm';w.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;document.body.appendChild(w);}
/* ===== Catálogo Texa completo (FinderPro Texa) · FC e cliente ===== */
let TX=null,TXL='',TXS='',TXQ='',TXN=120;
async function txCarrega(){if(TX)return TX;try{TX=await fetch('texa.json?v=2',{cache:'no-cache'}).then(r=>r.json());TX.by={};TX.p.forEach(o=>TX.by[norm(o.c)]=o);TX.rf={};TX.alc={};TX.p.forEach(o=>{if(o.r&&!TX.rf[norm(o.r)])TX.rf[norm(o.r)]=o;if(o.a)(TX.alc[norm(o.a)]=TX.alc[norm(o.a)]||[]).push(o);});}catch(_){TX=null;}return TX;}
const tx2d=o=>o.v?TX.cdn+'/'+o.v+'/'+encodeURIComponent(o.c)+'.svg':'';
const tx3d=(o,w)=>o.g?TX.cdn+'/cdn-cgi/image/w='+(w||320)+',h='+(w||320)+',f=auto,fit=contain/'+o.g+'/'+encodeURIComponent(o.c)+'.png':'';
const txImg=(o,w)=>tx2d(o)||tx3d(o,w);
const n1=v=>v==null?'':String(v).replace('.',',');
function txLinhas(o){return [...(o.l||[]).map(x=>TX.menu[x]||x),...(o.s||[]).map(x=>TX.sub[x]||x)].filter((v,i,a)=>a.indexOf(v)===i);}
function txCard(o,grande){const im=txImg(o,grande?600:320),i3=tx3d(o,600);
 return `<div class="card txc${grande?' txg':''}"><span class="fn">Texa · ${esc(txLinhas(o).join(' · ')||'catálogo')}</span>
  <div class="im" data-zoom="${esc(grande?(tx2d(o)||i3):im)}" data-t="${esc('Texa '+o.c)}">${im?`<img src="${esc(im)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'sem desenho',style:'color:var(--tm)'}))">`:'<span style="color:var(--tm)">sem desenho</span>'}</div>
  ${grande&&tx2d(o)&&i3?`<div class="tx3"><img src="${esc(tx3d(o,240))}" alt="" loading="lazy" data-zoom="${esc(i3)}" data-t="${esc('Texa '+o.c+' · 3D')}"><span>vista 3D</span></div>`:''}
  <b class="cd">${esc(o.c)}</b><div class="kv">${o.p!=null?`<span>${kg(o.p)}</span>`:''}${o.M!=null?`<span>${n1(o.M)} × ${n1(o.m)} mm</span>`:''}${o.e!=null?`<span>esp. ${n1(o.e)} mm</span>`:''}<span>${o.tb?'Tubular':'Sólido'}</span></div>
  ${o.a?`<button type="button" class="txa" data-q="${esc(o.a)}" title="Equivalente Alcoa Suprema informado pela Texa">≈ Alcoa <b>${esc(o.a)}</b></button>`:''}${o.r?`<span class="kv"><span title="Referência informada pela Texa">ref. ${esc(o.r)}</span></span>`:''}</div>`;}
function txGrade(){const q=norm(TXQ);let L=TX.p;if(TXL)L=L.filter(o=>(o.l||[]).includes(TXL));if(TXS)L=L.filter(o=>(o.s||[]).includes(TXS));
 if(q)L=L.filter(o=>norm(o.c).includes(q)||norm(o.a).includes(q)||norm(o.r).includes(q));
 return `<p class="txn">${L.length.toLocaleString('pt-BR')} perfis${L.length>TXN?' · mostrando '+TXN:''}</p><div class="txgr">${L.slice(0,TXN).map(o=>`<button type="button" class="txi" data-q="${esc(o.c)}"><span class="ti">${txImg(o)?`<img src="${esc(txImg(o,240))}" alt="" loading="lazy">`:''}</span><b>${esc(o.c)}</b><small>${o.p!=null?kg(o.p):''}${o.M!=null?' · '+n1(o.M)+'×'+n1(o.m):''}</small>${o.a?`<em>≈ ${esc(o.a)}</em>`:''}</button>`).join('')}</div>${L.length>TXN?`<p style="text-align:center"><button type="button" class="txmais" data-txm="1">Mostrar mais</button></p>`:''}`;}
function txTela(){const cnt={};TX.p.forEach(o=>(o.l||[]).forEach(l=>cnt[l]=(cnt[l]||0)+1));
 const subs={};if(TXL)TX.p.filter(o=>(o.l||[]).includes(TXL)).forEach(o=>(o.s||[]).forEach(s=>subs[s]=(subs[s]||0)+1));
 const ord=Object.keys(cnt).sort((a,b)=>(TX.menu[a]||a).localeCompare(TX.menu[b]||b,'pt'));
 return `<section class="txw"><div class="txh"><div><h2>📚 Catálogo Texa completo</h2><p>${TX.p.length.toLocaleString('pt-BR')} perfis de todas as linhas da Texa, com peso, medidas e desenho. Onde a própria Texa informa, aparece o código Alcoa Suprema equivalente (≈) ou a referência antiga do perfil. Fonte: FinderPro Texa, ${esc(TX.gerado.split('-').reverse().join('/'))}.</p></div>
  <input id="txq" value="${esc(TXQ)}" placeholder="Filtrar código" autocomplete="off" aria-label="Filtrar catálogo Texa"></div>
  <div class="chips txl"><button type="button" data-txl="" class="${!TXL?'on':''}">Todas as linhas</button>${ord.map(l=>`<button type="button" data-txl="${esc(l)}" class="${TXL===l?'on':''}">${esc(TX.menu[l]||l)} <small>${cnt[l]}</small></button>`).join('')}</div>
  ${TXL&&Object.keys(subs).length?`<div class="chips txs"><button type="button" data-txs="" class="${!TXS?'on':''}">Tudo de ${esc(TX.menu[TXL]||TXL)}</button>${Object.keys(subs).sort((a,b)=>(TX.sub[a]||a).localeCompare(TX.sub[b]||b,'pt')).map(s=>`<button type="button" data-txs="${esc(s)}" class="${TXS===s?'on':''}">${esc(TX.sub[s]||s)} <small>${subs[s]}</small></button>`).join('')}</div>`:''}
  <div id="txg">${txGrade()}</div></section>`;}
function txAlc(q){const L=TX.alc[norm(q)]||[];return `<div class="card" style="margin-top:16px"><b style="font:800 22px var(--f-d)">${esc(q.toUpperCase())} · Alcoa</b><span class="ob">Perfis da Texa que a própria Texa indica como equivalentes deste código da Alcoa:</span></div><div class="txgr" style="margin-top:12px">${L.map(o=>`<button type="button" class="txi" data-q="${esc(o.c)}"><span class="ti">${txImg(o)?`<img src="${esc(txImg(o,240))}" alt="" loading="lazy">`:''}</span><b>${esc(o.c)}</b><small>${o.p!=null?kg(o.p):''}</small></button>`).join('')}</div>`;}
function txDetalhe(o){const al=o.a&&D.perfis.find(r=>norm(r.c)===norm(o.a));
 return `<div class="det txd">${txCard(o,true)}${o.a?(al?`<div class="card alc"><span class="fn">Alcoa · referência informada pela Texa</span><div class="im" data-zoom="${img('alcoa',al.c)}" data-t="${esc('Alcoa '+al.c)}"><img src="${img('alcoa',al.c)}" alt=""></div><b class="cd">${esc(al.c)}</b><div class="kv"><span>${kg(al.p)}</span>${al.n?`<span>${esc(al.n)}</span>`:''}</div><button type="button" class="txa" data-q="${esc(al.c)}">Ver todos os equivalentes de ${esc(al.c)} →</button></div>`
  :`<div class="card"><span class="fn">Alcoa</span><b style="font:800 26px var(--f-d)">≈ ${esc(o.a)}</b><span class="ob">Referência da Alcoa informada pela própria Texa. Este código ainda não está na base Suprema da FC, então não tem o desenho da Alcoa ao lado: confira pelo catálogo da Alcoa.</span></div>`)
  :`<div class="card" style="background:var(--mdc);border-color:#f3d9a8"><b style="font:800 20px var(--f-d);color:var(--md)">Sem referência Alcoa</b><span class="ob">${o.r?'A Texa informa só a referência '+esc(o.r)+' para este perfil, sem código Alcoa.':'A Texa não informa equivalente da Alcoa para este perfil.'} ${ADM?'Se você souber o par, cadastre pelo botão “＋ Adicionar par”.':'Fale com a FC Consultoria para conferir o equivalente.'}</span></div>`}</div>`;}
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-txl],[data-txs],[data-txm]');if(!t)return;const d=t.dataset;
 if(d.txl!=null){TXL=d.txl;TXS='';TXN=120;}else if(d.txs!=null){TXS=d.txs;TXN=120;}else if(d.txm){TXN+=240;const g=$('#txg');if(g){g.innerHTML=txGrade();return;}}tela();});
document.addEventListener('input',ev=>{if(ev.target.id==='txq'){TXQ=ev.target.value;TXN=120;const g=$('#txg');if(g)g.innerHTML=txGrade();}});

async function iniciar(){D=await fetch(LN().dados,{cache:'no-cache'}).then(r=>r.json());if(LN().med){const h=document.getElementById('hdLin');if(h)h.textContent='Conversão de códigos · '+LN().n;Q=decodeURIComponent(location.hash.slice(1)||'');tela();return;}Object.keys(EDITS).forEach(k=>delete EDITS[k]);const h=document.getElementById('hdLin');if(h)h.textContent='Conversão de códigos · '+(['suprema','gold'].includes(LIN)?'Linha ':'')+LN().n;
 if(ADM){try{const r=await sb.from('trein_eventos').select('detalhe,criado_em').eq('tipo','equiv_ok').order('criado_em');(r.data||[]).forEach(x=>{if(x.detalhe&&x.detalhe.k)OK[x.detalhe.k]=!!x.detalhe.on;});}catch(_){}}
 try{if(ADM){const r=await sb.from('trein_eventos').select('detalhe,criado_em').eq('tipo','equiv_edit').order('criado_em');aplicarEdits((r.data||[]).map(x=>x.detalhe));}
  else{const r=await sb.rpc('equiv_edits_lista',{p_chave:KEY});aplicarEdits(r.data||[]);}}catch(_){}
 if(!ADM){/* cliente: só vê os pares confirmados (automático ou conferido pela FC) */
  try{const r=await sb.rpc('equiv_ok_lista',{p_chave:KEY});(r.data||[]).forEach(k=>OK[k]=true);}catch(_){}
  D.perfis.forEach(r=>{r.eq=r.eq.filter(e=>e.n==='alta'||OK[r.c+'|'+e.c]);r.eq.forEach(e=>{e.n='alta';});});
  Object.keys(D.semPar||{}).forEach(f=>D.semPar[f]=[]);document.body.classList.add('cli');}
 await txCarrega();
 Q=decodeURIComponent(location.hash.slice(1)||'');tela();}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-lin]');if(!t||t.dataset.lin===LIN)return;LIN=t.dataset.lin;try{localStorage.setItem('fc_conv_linha',LIN);}catch(_){}const u=new URL(location.href);u.searchParams.set('l',LIN);u.hash='';history.replaceState(null,'',u);Q='';FIL='todos';$('#app').innerHTML='<p style="padding:30px">Carregando…</p>';iniciar();});
(async()=>{if(KEY){let ok=false;try{const r=await sb.rpc('cons_portal_ver',{p_chave:KEY});ok=!r.error&&!!r.data;}catch(_){}
  if(!ok){$('#app').innerHTML='<p class="vazio">Link inválido ou expirado. Fale com a FC Consultoria.</p>';return;}marca('uso exclusivo do cliente');voltaBtn(false);iniciar();}
 else gateUI(async()=>{try{const r=await sb.rpc('trein_is_admin');ADM=!!r.data;}catch(_){}marca('uso interno');voltaBtn(true);iniciar();});})();
</script>
