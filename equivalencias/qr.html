<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Pedido de compra · FC Consultoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--tl:#0f6b70;--tl2:#0b4f53;--bg:#f2f5f4;--card:#fff;--tx:#14262a;--mu:#5d6b76;--ln:#dfe6e5;--am:#c47f00;--amb:#fff6e0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 Barlow,system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--tl2),var(--tl));color:#fff;padding:18px 16px 16px}
header small{display:block;letter-spacing:.14em;font-weight:700;font-size:11.5px;opacity:.8}
header h1{margin:2px 0 0;font-size:24px;font-weight:800;line-height:1.15}
header .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px;opacity:.95}
header .meta b{font-weight:700}
main{max-width:720px;margin:0 auto;padding:14px 16px 40px}
.aviso{border:1.5px solid var(--am);background:var(--amb);border-radius:10px;padding:9px 12px;font-weight:700;font-size:14.5px;margin-bottom:14px}
.tot{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tot span{background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:14px}
.cor{display:flex;align-items:center;gap:8px;font-weight:700;margin:18px 0 8px;font-size:16px}
.cor i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3);display:inline-block}
.cor small{font-weight:400;color:var(--mu)}
.it{display:flex;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;scroll-margin-top:12px}
.it.hl{outline:3px solid var(--tl);outline-offset:1px}
.im{width:84px;height:84px;flex:none;border:1px solid var(--ln);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;padding:0}
.im img{max-width:100%;max-height:100%;object-fit:contain}
.im em{font-size:11px;color:var(--mu);font-style:normal;padding:4px;text-align:center}
.tx{flex:1;min-width:0}
.tx .n{font-size:12px;color:var(--mu);font-weight:700}
.tx .c{font-size:18px;font-weight:800;line-height:1.15}
.tx .l{font-size:12.5px;color:var(--mu)}
.tx .cl{font-size:14px;margin-top:4px}
.tx .ds{font-size:13px;color:#334}
.q{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.q span{background:var(--bg);border-radius:6px;padding:2px 8px;font-size:13.5px;font-weight:600}
footer{text-align:center;font-size:12.5px;color:var(--mu);margin-top:22px;line-height:1.5}
.vazio{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:22px 16px;text-align:center;margin-top:20px}
.lb{position:fixed;inset:0;background:rgba(8,20,22,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:72vh;background:#fff;border-radius:10px;padding:10px;object-fit:contain}
.lb p{color:#fff;text-align:center;margin:12px 0 0;font-size:15px}
.lb p b{font-size:20px;display:block}
.lb button{position:absolute;top:12px;right:12px;background:#fff;border:0;border-radius:999px;width:42px;height:42px;font-size:22px;font-weight:700;cursor:pointer}
.lb .nv{display:flex;gap:10px;margin-top:12px}
.lb .nv a{color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 14px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header><small>PEDIDO DE COMPRA</small><h1 id="hd">Carregando…</h1><div class="meta" id="mt"></div></header>
<main id="app"></main>
<div class="lb" id="lb" role="dialog" aria-modal="true"><button type="button" aria-label="Fechar" id="lbx">×</button><img id="lbi" alt=""><p id="lbt"></p><div class="nv"><a href="#" id="lbp">‹ Anterior</a><a href="#" id="lbn">Próximo ›</a></div></div>
<script>
const sb=window.supabase.createClient('https://cpkjphodruyxfouirhpd.supabase.co','sb_publishable_d0HEeWsaqOeZIQKGftlF-Q_B8BUOWWg',{auth:{persistSession:false}});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n2=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const safe=u=>/^https:\/\//i.test(u||'')?u:'';
let D=null;
function img(it,cls){const L=(it.img||[]).map(safe).filter(Boolean);if(!L.length)return '<em>sem foto</em>';
  const fb=L.slice(1).join('|');return `<img src="${esc(L[0])}" alt="${esc(it.c)}"${fb?` data-fb="${esc(fb)}"`:''} loading="lazy" onerror="const r=(this.dataset.fb||'').split('|').filter(Boolean);if(r.length){this.dataset.fb=r.slice(1).join('|');this.src=r[0];}else{this.replaceWith(Object.assign(document.createElement('em'),{textContent:'sem foto'}));}">`;}
function tela(){const I=D.itens||[];
  $('#hd').textContent=D.cli||'Pedido';
  $('#mt').innerHTML=`<span>Fornecedor: <b>${esc(D.forn)}</b></span>${D.oc?`<span>OC: <b>${esc(D.oc)}</b></span>`:''}<span>Data: <b>${esc(D.data)}</b></span>`;
  document.title='Pedido · '+(D.forn||'')+' · '+(D.cli||'');
  const cores=[];I.forEach(it=>{if(!cores.includes(it.cor))cores.push(it.cor);});
  const br=I.reduce((a,x)=>a+(+x.b||0),0),kg=I.reduce((a,x)=>a+(+x.kg||0),0);
  $('#app').innerHTML=`<div class="aviso">⚠ Pintar cada item na cor indicada. Barras no tamanho pedido.</div>
   <div class="tot"><span><b>${I.length}</b> ${I.length===1?'item':'itens'}</span><span><b>${br}</b> barras</span><span><b>${n2(kg)}</b> kg</span></div>
   ${cores.map(c=>{const L=I.filter(x=>x.cor===c);const hx=(L[0]&&L[0].hx)||'#ccc';
     return `<div class="cor"><i style="background:${esc(hx)}"></i>Cor: ${esc(c)} <small>· ${L.length} ${L.length===1?'item':'itens'} · ${L.reduce((a,x)=>a+(+x.b||0),0)} barras · ${n2(L.reduce((a,x)=>a+(+x.kg||0),0))} kg</small></div>`+
      L.map(it=>`<div class="it" id="i${it.n}"><button type="button" class="im" data-z="${it.n}" aria-label="Ampliar foto do item ${it.n}">${img(it)}</button><div class="tx"><div class="n">ITEM ${it.n}</div><div class="c">${esc(it.c)}</div>${it.lin?`<div class="l">${esc(it.lin)}</div>`:''}<div class="cl"><b>${esc(it.cli)}</b></div>${it.desc?`<div class="ds">${esc(it.desc)}</div>`:''}<div class="q"><span>${esc(it.cor)}</span><span>${it.b} barras</span><span>${String(it.m).replace('.',',')} m</span><span>${n2(it.kg)} kg</span></div></div></div>`).join('');}).join('')}
   <footer>Imagens ilustrativas — dúvidas, consultar o catálogo do fornecedor.<br>${D.expira?'Link válido até '+new Date(D.expira).toLocaleDateString('pt-BR')+'. ':''}Pedido gerado pelo Onde comprar · FC Consultoria em Esquadria</footer>`;
  hash();}
function zoom(n){const I=D.itens||[];const it=I.find(x=>x.n===n);if(!it)return;const L=(it.img||[]).map(safe).filter(Boolean);
  const im=$('#lbi');im.style.display=L.length?'':'none';if(L.length){im.dataset.fb=L.slice(1).join('|');im.onerror=function(){const r=(this.dataset.fb||'').split('|').filter(Boolean);if(r.length){this.dataset.fb=r.slice(1).join('|');this.src=r[0];}else this.style.display='none';};im.src=L[0];}
  $('#lbt').innerHTML=`<b>${esc(it.c)}</b>Item ${it.n} · ${esc(it.cli)} · ${esc(it.cor)} · ${it.b} barras${it.desc?'<br><small>'+esc(it.desc)+'</small>':''}`;
  const i=I.indexOf(it);$('#lbp').style.visibility=i>0?'':'hidden';$('#lbn').style.visibility=i<I.length-1?'':'hidden';
  $('#lbp').dataset.n=i>0?I[i-1].n:'';$('#lbn').dataset.n=i<I.length-1?I[i+1].n:'';
  $('#lb').classList.add('on');$('#lb').dataset.n=n;}
function fecha(){$('#lb').classList.remove('on');}
function hash(){const m=location.hash.match(/^#i(\d+)$/);if(!m)return;const n=+m[1];const el=document.getElementById('i'+n);
  if(el){el.scrollIntoView({block:'center'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500);}zoom(n);}
document.addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(z){zoom(+z.dataset.z);return;}
  if(e.target.id==='lbx'||e.target.id==='lb'){fecha();return;}
  if(e.target.id==='lbp'||e.target.id==='lbn'){e.preventDefault();const n=+e.target.dataset.n;if(n)zoom(n);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha();});
addEventListener('hashchange',()=>D&&hash());
(async()=>{const id=new URLSearchParams(location.search).get('p')||'';
  const fim=(t,m)=>{$('#hd').textContent=t;$('#app').innerHTML=`<div class="vazio">${m}</div><footer>FC Consultoria em Esquadria</footer>`;};
  if(id.length<32)return fim('Link inválido','Este QR não é de um pedido válido. Peça um novo pedido a quem enviou.');
  let r;try{r=await sb.rpc('compra_qr_ver',{p_id:id});}catch(e){r={error:e};}
  if(r.error)return fim('Sem conexão','Não consegui abrir o pedido agora. Confira a internet e tente de novo.');
  if(!r.data)return fim('Pedido não encontrado','Este link não existe mais. Peça um novo pedido a quem enviou.');
  if(r.data.expirado)return fim('Link vencido','O prazo deste link terminou ou ele foi desativado. Peça um novo pedido a quem enviou.');
  D=r.data;tela();})();
</script>
</body>
</html>
