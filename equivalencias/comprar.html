<body>
<div class="rgate" id="gate" hidden><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>🛒 Onde comprar</h1>
<label>Login<input name="login" autocomplete="username" required placeholder="matriz"></label>
<label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>
<header class="top"><div class="w"><img src="/img/logo-fc-160.jpg" alt=""><div><small>FC Consultoria · Setor de compras</small><b id="hd">Onde comprar</b></div><select id="selEmp" hidden aria-label="Cliente"></select></div></header>
<main id="app"><p class="vazio">Carregando…</p></main>
<div class="zm" id="zm" hidden><div><button type="button" id="zmX">✕ Fechar</button><img id="zmI" alt=""><b id="zmT"></b></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../atualiza.js"></script>
<script src="../auth.js"></script>
<script src="foto-busca.js?v=2"></script>
<script src="importa-lista.js?v=5"></script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY=new URLSearchParams(location.search).get('k')||'';const EMPFIX=new URLSearchParams(location.search).get('emp')||'';
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const BARRA=6;
const FORN=['alcoa','texa','selta','fbk','ecoalumi','perfileve','cda'];
const REFF='alcoa';/* Alcoa = catálogo de referência: confere desenho e peso, não entra na compra */
const FC_=FORN.filter(f=>f!==REFF);
const LIB=()=>Array.isArray(DADOS.lib)&&DADOS.lib.length?DADOS.lib:null;const FL=()=>ADM?FC_:(LIB()?FC_.filter(f=>LIB().includes(f)):FC_);
const CORES=[['natural','Natural (sem acabamento)','#d9dee1'],['branco','Branco','#ffffff'],['preto','Preto','#1c1c1c'],['cerejeira','Cerejeira real','#8a3b26'],['fosco','Anodizado fosco','#9aa3a8'],['brilhante','Brilhante cromado','#e8edf0'],['bronze','Bronze','#6b4a2b']];
const MTS=[3,4,5,6,7,8];/* tamanhos de barra (m) */
const CORN=Object.fromEntries(CORES.map(c=>[c[0],c[1]]));
const PART=['Comercial','Estoque','Produção'];
const n2=v=>v==null||isNaN(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const n3=v=>v==null||isNaN(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const rs=v=>v==null||isNaN(v)?'—':'R$ '+n2(v);
const pc=v=>(v>0?'+':'')+(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const num=s=>{s=String(s??'').trim().replace(/\s/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=+s;return isNaN(v)?NaN:v;};
const dt=s=>s?new Date(s).toLocaleDateString('pt-BR'):'';
const dias=s=>s?Math.floor((Date.now()-new Date(s))/864e5):null;
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(_){return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}if(/^fc_compra_(sim|oc|simf)_/.test(k)&&window.__simAg)window.__simAg();}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function marca(t){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300"><g transform="rotate(-24 230 150)" font-family="Barlow,Arial,sans-serif" text-anchor="middle" fill="#0f4f53" fill-opacity=".04"><text x="230" y="150" font-size="24" font-weight="800">FC CONSULTORIA EM ESQUADRIA</text><text x="230" y="176" font-size="13">${t}</text></g></svg>`;const w=document.createElement('div');w.id='wm';w.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;document.body.appendChild(w);}

/* ===== estado ===== */
let ADM=false,EMP='',EMPS=[],IDX=null,BY={},OK={},DADOS={forn:{},abc:{},meta:null,nome:''},LOCAL=false;
let ABA='busca',Q='',COR='natural',MODO='barra',SEL=null;
const st=ls.get('fc_compra_pref',{});if(st.cor)COR=st.cor;if(st.modo)MODO=st.modo;
const salvaPref=()=>ls.set('fc_compra_pref',{cor:COR,modo:MODO});
const RKEY=()=>'fc_compra_rel_'+(EMP||'x');
let REL=[],SIM=[];const SKEY=()=>'fc_compra_sim_'+(EMP||'x');const OKEY=()=>'fc_compra_oc_'+(EMP||'x');
const nomeQ=()=>{let n=ls.get('cons-nome-v','');if(!n){try{n=localStorage.getItem('cons-nome')||'';}catch(_){}}return n;};

/* ===== índice de todas as linhas ===== */
async function carregaIndice(){
  IDX=await fetch('indice.json?v=5',{cache:'no-cache'}).then(r=>r.json());
  /* edições de pares feitas pela FC na Conversão de códigos */
  let ed=[];
  try{if(ADM){const r=await sb.from('trein_eventos').select('detalhe,criado_em').eq('tipo','equiv_edit').order('criado_em');ed=(r.data||[]).map(x=>x.detalhe);}
      else{const r=await sb.rpc('equiv_edits_lista',{p_chave:KEY});ed=r.data||[];}}catch(_){}
  const last={};ed.forEach(x=>{if(x&&x.f&&x.c)last[(x.l||'suprema')+'|'+x.f+'|'+x.c]=x;});
  Object.values(last).forEach(x=>{const l=x.l||'suprema';
    IDX.g.forEach(g=>{if(g.l===l)g.m=g.m.filter(m=>!(m[0]===x.f&&m[1]===x.c&&m[3]!=='base'));});
    if(!x.a)return;const g=IDX.g.find(y=>y.l===l&&y.k===x.a);const p=x.p!=null&&x.p!==''?+x.p:null;if(g&&p)g.m.push([x.f,x.c,p,x.n||'media',x.img||'',x.pg||'—',1]);});
  if(!ADM){try{const r=await sb.rpc('equiv_ok_lista',{p_chave:KEY});(r.data||[]).forEach(k=>OK[k]=true);}catch(_){}}
  BY={};IDX.g.forEach((g,i)=>{g.i=i;g.m.forEach(m=>{(BY[norm(m[1])]=BY[norm(m[1])]||[]).push(i);});if(g.mc)(BY[norm(g.k)]=BY[norm(g.k)]||[]).push(i);});
}
const visivel=(g,m)=>{if(!ADM&&LIB()&&m[3]!=='base'&&m[0]!==REFF&&!LIB().includes(m[0]))return false;return ADM||m[3]==='base'||m[3]==='alta'||OK[g.k+'|'+m[1]];};
function imgDe(g,m){if(m[4])return m[4];if(g.l==='tc')return '';const L=IDX.linhas[g.l];const pasta=(m[3]==='base'&&!g.sp)?'alcoa':m[0];return L.img+pasta+'/'+encodeURIComponent(m[1])+'.webp?v=3';}
const linhaF=(g,f)=>((IDX.lnf[g.l]||{})[f])||IDX.linhas[g.l].n;
function buscar(q){const k=norm(q);if(!k)return [];
  let ids=[...new Set(BY[k]||[])];
  if(!ids.length){/* medida de tubo/cantoneira/U: 25,4 x 1,58 */
    const ns=(q.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.'));
    if(ns.length>=2)ids=IDX.g.filter(g=>{if(g.l!=='tc')return false;const gn=(g.k.match(/\d+(?:,\d+)?/g)||[]).map(x=>+x.replace(',','.'));
      return ns.length===2?(gn.length===2&&Math.abs(gn[0]-ns[0])<.06&&Math.abs(gn[1]-ns[1])<.06):(gn.length===3&&ns.every((v,i)=>Math.abs(gn[i]-v)<.06));}).map(g=>g.i);}
  return ids.map(i=>IDX.g[i]).filter(g=>g.m.some(m=>visivel(g,m)));}

/* ===== preço ===== */
function preco(f,cor,fb){cor=cor||COR;if(f===REFF)return {sem:'catálogo de referência · não entra na compra',ref:1};if(!ADM&&LIB()&&!LIB().includes(f))return {sem:'fornecedor não liberado'};const P=DADOS.forn[f];if(!P||P.natural==null||!(+P.natural>0))return {sem:'sem preço informado'};
  let v=+P.natural;if(cor!=='natural'){const s=P.cores&&P.cores[cor];if(s==null){if(!fb)return {sem:'sem preço de '+CORN[cor].toLowerCase()+' informado'};return {kg:v,minItem:P.min_item!=null?+P.min_item:null,minPed:P.min_pedido!=null?+P.min_pedido:null,semCor:1};}v+= +s;}
  return {kg:v,minItem:P.min_item!=null?+P.min_item:null,minPed:P.min_pedido!=null?+P.min_pedido:null};}
function calc(g,m,cor,mt,fb){const pr=preco(m[0],cor,fb);const kgb=m[2]*(mt||BARRA);const o={f:m[0],c:m[1],p:m[2],lvl:m[3],kgb,img:imgDe(g,m),lin:linhaF(g,m[0]),pg:m[5]};
  if(pr.sem){o.sem=pr.sem;if(pr.ref)o.rf=1;return o;}
  o.kg=pr.kg;o.vb=kgb*pr.kg;if(pr.semCor)o.semCor=1;o.minPed=pr.minPed;o.minItem=pr.minItem;
  if(pr.minItem){o.bars=Math.ceil(pr.minItem/kgb-1e-9);}else o.bars=1;
  o.kgmin=o.bars*kgb;o.vmin=o.kgmin*pr.kg;return o;}
function classe(g,q){const A=DADOS.abc||{};const k=Object.keys(A).find(c=>norm(c)===norm(q));if(k)return A[k];
  for(const m of g.m){const k2=Object.keys(A).find(c=>norm(c)===norm(m[1]));if(k2)return A[k2];}if(A[g.k])return A[g.k];return null;}
function linhasDe(g,q){
  const L=g.m.filter(m=>visivel(g,m)).map(m=>calc(g,m));
  const qk=norm(q);let ref=L.find(o=>norm(o.c)===qk);
  const com=L.filter(o=>!o.sem),sem=L.filter(o=>o.sem);
  const key=MODO==='min'?'vmin':'vb';com.sort((a,b)=>a[key]-b[key]||a.vb-b.vb);
  if(!ref)ref=com[0]||L[0];
  return {L:[...sem.filter(o=>o.rf),...com,...sem.filter(o=>!o.rf)],com,sem,ref,best:com[0]||null,key};}
function frase(o,r,b){
  if(o.rf)return (o===r?'Código pesquisado · ':'')+'Catálogo Alcoa: é a referência para conferir o desenho e o peso. Não entra na comparação de preço nem na compra.';
  if(o===r&&(!b||o===b||o.sem||r.sem))return o===b?'Código pesquisado: é a base da comparação e já é a melhor opção.':'Código pesquisado: é a base da comparação.';
  const partes=[];
  if(o!==r){const dp=o.p/r.p-1,dk=o.kgb-r.kgb;
    partes.push(Math.abs(dp)<.005?'Tem o mesmo peso':`É ${(Math.abs(dp)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% mais ${dp<0?'leve':'pesado'} (${dk<0?'−':'+'}${n3(Math.abs(dk))} kg por barra)`);}
  if(o.sem)return (partes[0]?partes[0]+'. ':'')+'Falta o preço deste fornecedor para comparar o valor.';
  /* valor: contra o código pesquisado; se ele não tem preço, contra a melhor opção */
  const base=!r.sem?r:b;
  if(!base||base===o)return (partes[0]?partes[0]+'. ':'')+(r.sem?'É a melhor opção entre os fornecedores com preço.':'');
  const mk=MODO==='min'?'vmin':'vb',oq=MODO==='min'?'a compra mínima':'a barra';
  const dpw=o.p/base.p-1,dpr=o.kg-base.kg,dv=o[mk]-base[mk];
  const prc=Math.abs(dpr)<.005?'o mesmo R$/kg':`o R$/kg é ${rs(Math.abs(dpr))} ${dpr>0?'maior':'menor'}`;
  const fim=Math.abs(dv)<.005?oq+' sai pelo mesmo valor':`${oq} sai ${rs(Math.abs(dv))} mais ${dv>0?'cara':'barata'}`+(MODO==='min'&&o.bars!==base.bars?` (${o.bars} barras contra ${base.bars})`:'');
  if(base!==r){const pw=Math.abs(dpw)<.005?'mesmo peso':`${(Math.abs(dpw)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% mais ${dpw<0?'leve':'pesado'}`;
    return (partes[0]?partes[0]+' que o pesquisado. ':'')+`Em relação à melhor opção (${IDX.forn[base.f]} ${base.c}): ${pw}, ${prc}, ${fim}.`;}
  const contra=(dpw<-.005&&dpr>.005)||(dpw>.005&&dpr<-.005);
  return `${partes[0]}${contra?', mas':' e'} ${prc}: ${fim}.`;}

/* ===== telas ===== */
function abas(){const n=REL.length;const A=[['busca','🔎 Pesquisar'],['precos','💲 Preços dos fornecedores'],['sim','🧮 Simular pedido'+(SIM.length?` <span class="ct">${SIM.length}</span>`:'')],['rel','📄 Relatório'+(n?` <span class="ct">${n}</span>`:'')]];
  if(ADM)A.push(['abc','📊 Curva ABC'],['uso','👀 Acompanhamento']);
  return `<nav class="abas noprint">${A.map(([k,t])=>`<button type="button" data-aba="${k}" class="${ABA===k?'on':''}">${t}</button>`).join('')}</nav>`;}
function tela(){const a=$('#app');
  const demo=LOCAL?`<div class="aviso noprint">🧪 <b>Modo demonstração.</b> Os preços ficam guardados só neste aparelho até a FC ativar o banco de dados desta ferramenta.</div>`:'';
  let h='';if(ABA==='busca')h=telaBusca();else if(ABA==='precos')h=telaPrecos();else if(ABA==='rel')h=telaRel();else if(ABA==='sim')h=telaSim();else if(ABA==='abc')h=telaAbc();else if(ABA==='uso')h='<div class="box"><p class="vazio">Carregando o acompanhamento…</p></div>';
  a.innerHTML=abas()+demo+h;if(ABA==='uso')telaUso();if(ABA==='busca'){const i=$('#q');if(i&&!Q)i.focus();}}
function semPrecos(){return !FL().some(f=>DADOS.forn[f]&&+DADOS.forn[f].natural>0);}
let VSIM=null;/* item da simulação aberto na pesquisa (espelho) */
function espelhoSim(){if(VSIM==null||!SIM[VSIM])return '';const x=SIM[VSIM];if(norm(Q)!==norm(x.q))return `<div class="esp noprint"><span>🧮 Você veio da <b>Simular pedido</b>.</span><button type="button" class="bt p" data-voltasim>← Voltar para Simular pedido</button></div>`;
  let ch='';try{const S=simular();const e=S.esc.find(y=>y.t.i===VSIM);if(e&&e.p)ch=`Na simulação: <b>${esc(IDX.forn[e.p.o.f])} · ${esc(e.p.o.c)}</b> · ${n2(e.p.kg)} kg · ${rs(e.p.v)}`;else if(e)ch='Na simulação: sem preço em nenhum fornecedor';else ch='Na simulação: fora desta reposição';}catch(_){}
  return `<div class="esp noprint"><div><small>ESPELHO DA SIMULAÇÃO · PROVA REAL</small><b>${esc(x.orig||x.q)} · ${esc(CORN[sCor(x)])} · ${x.b} barras de ${String(sM(x)).replace('.',',')} m</b><span>${ch}. Abaixo, a pesquisa completa deste perfil em todos os fornecedores (preço natural, barra de 6 m).</span></div><button type="button" class="bt p" data-voltasim>← Voltar para Simular pedido</button></div>`;}
function telaBusca(){
  const r=Q?buscar(Q):[];if(r.length&&(!SEL||!r.includes(SEL)))SEL=r[0];
  return `${espelhoSim()}<section class="box"><h1 class="t">Onde comprar</h1><p class="sub">Digite o código de qualquer fornecedor (Texa, Selta, FBK, Ecoalumi, Perfileve ou CDA), o código de mercado (Alcoa) ou a medida do tubo (ex.: 25,4 x 1,58). A ferramenta junta os equivalentes e mostra onde a barra de 6 m sai mais barata. A Alcoa aparece só como 📘 referência, para conferir o desenho e o peso.</p>
  <form class="sb" id="fb"><input id="q" value="${esc(Q)}" placeholder="Ex.: SU-001, TBX028, VT-0161, PMB-0001" autocomplete="off" aria-label="Código"><button>Comparar</button></form>
  <div class="opc"><div class="g"><span>Acabamento</span><div class="chips">${CORES.map(([k,t,c])=>`<button type="button" data-cor="${k}" class="${COR===k?'on':''}"><span class="dot" style="background:${c}"></span>${t}</button>`).join('')}</div></div>
  <div class="g"><span>Ordenar por</span><div class="chips"><button type="button" data-modo="barra" class="${MODO==='barra'?'on':''}">Melhor preço por barra</button><button type="button" data-modo="min" class="${MODO==='min'?'on':''}">Melhor compra mínima</button></div></div></div>
  ${semPrecos()?`<div class="aviso">Nenhum preço cadastrado ainda. A comparação de peso já funciona; para comparar valores, preencha a aba <button type="button" class="bt" data-aba="precos" style="padding:3px 10px">💲 Preços dos fornecedores</button></div>`:''}
  </section><div id="resBox">${Q?(r.length?resultado(r):sugestoes(Q)):''}</div>`;}
function resultado(r){
  if(!r.length)return `<div class="box" style="margin-top:16px"><p class="vazio">Não achei <b>${esc(Q.toUpperCase())}</b> em nenhuma linha da Conversão de códigos. Confira o código ou fale com a FC para cadastrar.</p></div>`;
  const g=SEL;const R=linhasDe(g,Q);const ref=R.ref;const cl=classe(g,Q);
  const outras=r.length>1?`<div class="box" style="padding:10px 14px"><b style="font-size:14px">Este código aparece em ${r.length} lugares. Escolha:</b><div class="esc chips">${r.map(x=>`<button type="button" data-g="${x.i}" class="${x===g?'on':''}">${esc(IDX.linhas[x.l].n)} · ${esc(x.k)}</button>`).join('')}</div></div>`:'';
  const meta=DADOS.meta&&DADOS.meta.data?`Curva definida em ${dt(DADOS.meta.data+'T12:00')}${DADOS.meta.part&&DADOS.meta.part.length?' com '+DADOS.meta.part.join(', '):''}.`:'';
  const abcB=`<div><div class="abc ${cl||''}" title="${esc(meta)}"><i>${cl||'?'}</i><span>${cl?{A:'Classe A · alto giro',B:'Classe B · médio giro',C:'Classe C · giro baixo'}[cl]:'Curva não definida'}</span></div>
   ${ADM?`<div class="abcset noprint">${['A','B','C'].map(c=>`<button type="button" data-setabc="${c}" class="${cl===c?'on':''}">${c}</button>`).join('')}<button type="button" data-setabc="" title="Tirar a classe">✕</button></div>

/* ===== simulação de pedido ===== */
function simGrupo(x){let g=x.g?IDX.g.find(y=>y.l+'|'+y.k===x.g):null;if(!g){const r=buscar(x.q);g=r[0]||null;}return g;}
function opcao(o,q){/* custo de levar q barras deste código, respeitando a compra mínima por item */
  /* a compra mínima por item vale para o perfil natural (somando as cores): é conferida depois, no pedido inteiro */
  const br=q;return {o,br,kg:br*o.kgb,v:br*o.kgb*o.kg,forc:false};}
const SFKEY=()=>'fc_compra_simf_'+(EMP||'x');const TKEY=()=>'fc_compra_simtir_'+(EMP||'x');
const SFOP=[['todos','Todos os itens',null],['A','Só curva A',['A']],['AB','Curvas A e B',['A','B']],['C','Só curva C',['C']],['-','Sem curva',['-']]];
function simFiltro(){const k=ls.get(SFKEY(),'todos');const o=SFOP.find(x=>x[0]===k);return o?o[2]:null;}
/* 2ª opção do comprador: código e peso informados à mão (vale mesmo fora do nosso banco) */
function altOp(x){const a=x.alt;if(!a||!a.f||!a.c||!(+a.p>0))return null;if(LIB()&&!LIB().includes(a.f))return null;const pr=preco(a.f,'natural');if(pr.sem||!(pr.kg>0))return null;
  const kgb=+a.p*sM(x);return {f:a.f,c:a.c.toUpperCase(),p:+a.p,lvl:'manual',kgb,img:'',lin:'2ª opção do comprador',pg:'',kg:pr.kg,vb:kgb*pr.kg,minPed:pr.minPed,minItem:pr.minItem,alt:1,bars:1,kgmin:kgb,vmin:kgb*pr.kg};}
const IDX_M=()=>{if(IDX&&IDX.linhas&&!IDX.linhas.__m)IDX.linhas.__m={n:'Fora do banco',img:''};};
function simular(){IDX_M();
  const itens=SIM.map((x,i)=>{let g=simGrupo(x);const A=altOp(x);if(!g&&!A)return {x,i,nf:1};
    if(!g)g={l:'__m',k:x.q,n:'fora do banco · 2ª opção do comprador',m:[]};
    const L=g.m.filter(m=>visivel(g,m)).map(m=>calc(g,m,'natural',sM(x))).filter(o=>!o.sem&&o.kg>0&&(!LIB()||LIB().includes(o.f)));if(A)L.push(A);
    return {x,i,g,cl:classe(g,x.q),ops:L.map(o=>opcao(o,x.b)).sort((a,b)=>a.v-b.v)};});
  const FX=simFiltro();itens.forEach(t=>{if(!t.nf&&FX&&!FX.includes(t.cl||'-'))t.fora=1;});
  const val=itens.filter(t=>!t.nf&&!t.fora);
  const fs=[...new Set(val.flatMap(t=>t.ops.map(p=>p.o.f)))];
  const minP=f=>{const P=DADOS.forn[f];return P&&P.min_pedido!=null?+P.min_pedido:0;};
  const resumo=esc=>{const por={};esc.forEach(e=>{if(!e.p)return;const f=e.p.o.f;por[f]=por[f]||{kg:0,v:0,n:0};por[f].kg+=e.p.kg;por[f].v+=e.p.v;por[f].n++;});
    Object.entries(por).forEach(([f,r])=>{r.min=minP(f);r.falta=Math.max(0,r.min-r.kg);});return por;};
  /* 1) um fornecedor só */
  const unicos=fs.map(f=>{const esc=val.map(t=>({t,p:t.ops.filter(p=>p.o.f===f).sort((a,b)=>a.v-b.v)[0]||null}));
    const por=resumo(esc);const r=por[f]||{kg:0,v:0,n:0,min:minP(f),falta:minP(f)};
    return {f,esc,cob:esc.filter(e=>e.p).length,kg:r.kg,v:r.v,min:r.min,falta:r.falta};}).sort((a,b)=>(b.cob-a.cob)||(a.v-b.v));
  /* 2) melhor combinação: cada item no mais barato; quem não fecha o pedido mínimo tenta passar os itens para outro fornecedor já usado */
  let esc=val.map(t=>{const fx=t.x.fx&&t.ops.find(p=>p.o.f===t.x.fx);return fx?{t,p:fx,fix:1}:{t,p:t.ops[0]||null};});
  for(let k=0;k<20;k++){const por=resumo(esc);const ruim=Object.entries(por).filter(([,r])=>r.falta>0).sort((a,b)=>a[1].kg-b[1].kg)[0];if(!ruim)break;
    const f=ruim[0];const ok=Object.keys(por).filter(x=>x!==f);let mudou=false;
    const novo=esc.map(e=>{if(!e.p||e.fix||e.p.o.f!==f)return e;const alt=e.t.ops.find(p=>ok.includes(p.o.f));if(!alt)return e;mudou=true;return {...e,p:alt,mov:f};});

  const mp={};esc.forEach(e=>{if(!e.p||!e.p.o.minItem)return;const k=e.p.o.f+'|'+e.p.o.c;mp[k]=mp[k]||{f:e.p.o.f,c:e.p.o.c,min:e.p.o.minItem,kg:0,kgm:e.p.o.p,cores:[]};mp[k].kg+=e.p.kg;mp[k].cores.push(sCor(e.t.x));});
  const minItem=Object.values(mp).filter(x=>x.kg<x.min-1e-6).map(x=>({...x,falta:x.min-x.kg,barras:Math.ceil((x.min-x.kg)/(x.kgm*BARRA)-1e-9)}));

function minPend(S,soF){if(!S)return {ped:[],item:[],rows:[]};const ped=[],rows=new Set();
  Object.entries(S.porC).forEach(([f,r])=>{if(soF&&f!==soF)return;if(r.min>0&&r.falta>0.005){const I=S.esc.filter(e=>e.p&&e.p.o.f===f);I.forEach(e=>rows.add(e.t.i));ped.push({f,kg:r.kg,min:r.min,falta:r.falta,I});}});
  const item=S.minItem.filter(x=>!soF||x.f===soF);item.forEach(x=>S.esc.forEach(e=>{if(e.p&&e.p.o.f===x.f&&e.p.o.c===x.c)rows.add(e.t.i);}));
  return {ped,item,rows:[...rows]};}

async function altArq(f){const m=$('#altAm'),pv=$('#altPv');
  const dataUrl=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b);});
  if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){if(f.size>1.5*1024*1024){m.textContent='PDF grande demais para guardar (máx. 1,5 MB). Mande um print da página.';return;}

  const im=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=URL.createObjectURL(f);});
  const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const img=c.toDataURL('image/jpeg',.78);window.__altAnexo={img};pv.innerHTML=`<img src="${img}" alt="" class="altimg" data-altver="1">`;
  m.textContent='Lendo o código e o peso do print…';
  try{if(!window.Tesseract)await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);});
    const big=document.createElement('canvas');const k2=Math.min(3,1800/Math.max(im.width,im.height));big.width=Math.round(im.width*k2);big.height=Math.round(im.height*k2);big.getContext('2d').drawImage(im,0,0,big.width,big.height);
    const r=await Tesseract.recognize(big,'por');const T=(r&&r.data&&r.data.text||'').replace(/\r/g,'');
    const pm=T.match(/peso[^\d]{0,12}(\d+[.,]\d+)/i)||T.match(/(\d+[.,]\d{2,3})\s*kg/i);
    const cm0=T.match(/\b([A-Z]{1,5}[ -]?[0-9O]{2,5}[A-Z]?)\b/);const cm=cm0&&/\d/.test(cm0[1])?[cm0[0],cm0[1].replace(/^([A-Z]{1,5}[ -]?)([0-9O]+)/,(q,l,n)=>l+n.replace(/O/g,'0'))]:null;
    let ok=[];if(pm&&!$('#altP').value){$('#altP').value=pm[1].replace('.',',');ok.push('peso '+pm[1]);}

  catch(_){m.textContent='Print anexado. Preencha o código e o peso à mão.';}}
