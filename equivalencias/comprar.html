<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY=new URLSearchParams(location.search).get('k')||'';
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const BARRA=6;
const FORN=['alcoa','texa','selta','fbk','ecoalumi','perfileve','cda'];
const LIB=()=>Array.isArray(DADOS.lib)&&DADOS.lib.length?DADOS.lib:null;const FL=()=>ADM?FORN:(LIB()?FORN.filter(f=>LIB().includes(f)):FORN);
const CORES=[['natural','Sem acabamento','#d9dee1'],['fosco','Fosco','#9aa3a8'],['branco','Branco','#ffffff'],['preto','Preto','#1c1c1c'],['bronze','Bronze','#6b4a2b'],['brilhante','Brilhante','#e8edf0'],['cerejeira','Cerejeira real','#8a3b26']];
const CORN=Object.fromEntries(CORES.map(c=>[c[0],c[1]]));
const PART=['Comercial','Estoque','Produção'];
const n2=v=>v==null||isNaN(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const n3=v=>v==null||isNaN(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3});
const rs=v=>v==null||isNaN(v)?'—':'R$ '+n2(v);
const pc=v=>(v>0?'+':'')+(v*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const num=s=>{s=String(s??'').trim().replace(/\s/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const v=+s;return isNaN(v)?NaN:v;};
const dt=s=>s?new Date(s).toLocaleDateString('pt-BR'):'';
const dias=s=>s?Math.floor((Date.now()-new Date(s))/864e5):null;
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(_){return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function marca(t){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300"><g transform="rotate(-24 230 150)" font-family="Barlow,Arial,sans-serif" text-anchor="middle" fill="#0f4f53" fill-opacity=".04"><text x="230" y="150" font-size="24" font-weight="800">FC CONSULTORIA EM ESQUADRIA</text><text x="230" y="176" font-size="13">${t}</text></g></svg>`;const w=document.createElement('div');w.id='wm';w.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;document.body.appendChild(w);}

/* ===== estado ===== */
let ADM=false,EMP='',EMPS=[],IDX=null,BY={},OK={},DADOS={forn:{},abc:{},meta:null,nome:''},LOCAL=false;
let ABA='busca',Q='',COR='natural',MODO='barra',SEL=null;
const st=ls.get('fc_compra_pref',{});if(st.cor)COR=st.cor;if(st.modo)MODO=st.modo;
const salvaPref=()=>ls.set('fc_compra_pref',{cor:COR,modo:MODO});
const RKEY=()=>'fc_compra_rel_'+(EMP||'x');
let REL=[],SIM=[];const SKEY=()=>'fc_compra_sim_'+(EMP||'x');
const nomeQ=()=>{let n=ls.get('cons-nome-v','');if(!n){try{n=localStorage.getItem('cons-nome')||'';}catch(_){}}return n;};

/* ===== índice de todas as linhas ===== */
async function carregaIndice(){
  IDX=await fetch('indice.json?v=3',{cache:'no-cache'}).then(r=>r.json());
  /* edições de pares feitas pela FC na Conversão de códigos */
  let ed=[];
  try{if(ADM){const r=await sb.from('trein_eventos').select('detalhe,criado_em').eq('tipo','equiv_edit').order('criado_em');ed=(r.data||[]).map(x=>x.detalhe);}
      else{const r=await sb.rpc('equiv_edits_lista',{p_chave:KEY});ed=r.data||[];}}catch(_){}
  const last={};ed.forEach(x=>{if(x&&x.f&&x.c)last[(x.l||'suprema')+'|'+x.f+'|'+x.c]=x;});
  Object.values(last).forEach(x=>{const l=x.l||'suprema';
    IDX.g.forEach(g=>{if(g.l===l)g.m=g.m.filter(m=>!(m[0]===x.f&&m[1]===x.c&&m[3]!=='base'));});
    if(!x.a)return;const g=IDX.g.find(y=>y.l===l&&y.k===x.a);const p=x.p!=null&&x.p!==''?+x.p:null;if(g&&p)g.m.push([x.f,x.c,p,x.n||'media','',x.pg||'—',1]);});
  if(!ADM){try{const r=await sb.rpc('equiv_ok_lista',{p_chave:KEY});(r.data||[]).forEach(k=>OK[k]=true);}catch(_){}}
  BY={};IDX.g.forEach((g,i)=>{g.i=i;g.m.forEach(m=>{(BY[norm(m[1])]=BY[norm(m[1])]||[]).push(i);});if(g.mc)(BY[norm(g.k)]=BY[norm(g.k)]||[]).push(i);});
}
const visivel=(g,m)=>{if(!ADM&&LIB()&&m[3]!=='base'&&!LIB().includes(m[0]))return false;return ADM||m[3]==='base'||m[3]==='alta'||OK[g.k+'|'+m[1]];};
function imgDe(g,m){if(m[4])return m[4];if(g.l==='tc')return '';const L=IDX.linhas[g.l];const pasta=(m[3]==='base'&&!g.sp)?'alcoa':m[0];return L.img+pasta+'/'+encodeURIComponent(m[1])+'.webp?v=2';}
const linhaF=(g,f)=>((IDX.lnf[g.l]||{})[f])||IDX.linhas[g.l].n;
function buscar(q){const k=norm(q);if(!k)return [];
  let ids=[...new Set(BY[k]||[])];
  if(!ids.length){/* medida de tubo/cantoneira/U: 25,4 x 1,58 */
    const ns=(q.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.'));
    if(ns.length>=2)ids=IDX.g.filter(g=>{if(g.l!=='tc')return false;const gn=(g.k.match(/\d+(?:,\d+)?/g)||[]).map(x=>+x.replace(',','.'));
      return ns.length===2?(gn.length===2&&Math.abs(gn[0]-ns[0])<.06&&Math.abs(gn[1]-ns[1])<.06):(gn.length===3&&ns.every((v,i)=>Math.abs(gn[i]-v)<.06));}).map(g=>g.i);}
  return ids.map(i=>IDX.g[i]).filter(g=>g.m.some(m=>visivel(g,m)));}

/* ===== preço ===== */
function preco(f){if(!ADM&&LIB()&&!LIB().includes(f))return {sem:'fornecedor não liberado'};const P=DADOS.forn[f];if(!P||P.natural==null)return {sem:'sem preço informado'};
  let v=+P.natural;if(COR!=='natural'){const s=P.cores&&P.cores[COR];if(s==null)return {sem:'sem preço de '+CORN[COR].toLowerCase()+' informado'};v+= +s;}
  return {kg:v,minItem:P.min_item!=null?+P.min_item:null,minPed:P.min_pedido!=null?+P.min_pedido:null};}
function calc(g,m){const pr=preco(m[0]);const kgb=m[2]*BARRA;const o={f:m[0],c:m[1],p:m[2],lvl:m[3],kgb,img:imgDe(g,m),lin:linhaF(g,m[0]),pg:m[5]};
  if(pr.sem){o.sem=pr.sem;return o;}
  o.kg=pr.kg;o.vb=kgb*pr.kg;o.minPed=pr.minPed;o.minItem=pr.minItem;
  if(pr.minItem){o.bars=Math.ceil(pr.minItem/kgb-1e-9);}else o.bars=1;
  o.kgmin=o.bars*kgb;o.vmin=o.kgmin*pr.kg;return o;}
function classe(g,q){const A=DADOS.abc||{};const k=Object.keys(A).find(c=>norm(c)===norm(q));if(k)return A[k];
  for(const m of g.m){const k2=Object.keys(A).find(c=>norm(c)===norm(m[1]));if(k2)return A[k2];}if(A[g.k])return A[g.k];return null;}
function linhasDe(g,q){
  const L=g.m.filter(m=>visivel(g,m)).map(m=>calc(g,m));
  const qk=norm(q);let ref=L.find(o=>norm(o.c)===qk);
  const com=L.filter(o=>!o.sem),sem=L.filter(o=>o.sem);
  const key=MODO==='min'?'vmin':'vb';com.sort((a,b)=>a[key]-b[key]||a.vb-b.vb);
  if(!ref)ref=com[0]||L[0];
  return {L:[...com,...sem],com,sem,ref,best:com[0]||null,key};}
function frase(o,r,b){
  if(o===r&&(!b||o===b||o.sem||r.sem))return o===b?'Código pesquisado: é a base da comparação e já é a melhor opção.':'Código pesquisado: é a base da comparação.';
  const partes=[];
  if(o!==r){const dp=o.p/r.p-1,dk=o.kgb-r.kgb;
    partes.push(Math.abs(dp)<.005?'Tem o mesmo peso':`É ${(Math.abs(dp)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% mais ${dp<0?'leve':'pesado'} (${dk<0?'−':'+'}${n3(Math.abs(dk))} kg por barra)`);}
  if(o.sem)return (partes[0]?partes[0]+'. ':'')+'Falta o preço deste fornecedor para comparar o valor.';
  /* valor: contra o código pesquisado; se ele não tem preço, contra a melhor opção */
  const base=!r.sem?r:b;
  if(!base||base===o)return (partes[0]?partes[0]+'. ':'')+(r.sem?'É a melhor opção entre os fornecedores com preço.':'');
  const mk=MODO==='min'?'vmin':'vb',oq=MODO==='min'?'a compra mínima':'a barra';
  const dpw=o.p/base.p-1,dpr=o.kg-base.kg,dv=o[mk]-base[mk];
  const prc=Math.abs(dpr)<.005?'o mesmo R$/kg':`o R$/kg é ${rs(Math.abs(dpr))} ${dpr>0?'maior':'menor'}`;
  const fim=Math.abs(dv)<.005?oq+' sai pelo mesmo valor':`${oq} sai ${rs(Math.abs(dv))} mais ${dv>0?'cara':'barata'}`+(MODO==='min'&&o.bars!==base.bars?` (${o.bars} barras contra ${base.bars})`:'');
  if(base!==r){const pw=Math.abs(dpw)<.005?'mesmo peso':`${(Math.abs(dpw)*100).toLocaleString('pt-BR',{maximumFractionDigits:1})}% mais ${dpw<0?'leve':'pesado'}`;
    return (partes[0]?partes[0]+' que o pesquisado. ':'')+`Em relação à melhor opção (${IDX.forn[base.f]} ${base.c}): ${pw}, ${prc}, ${fim}.`;}
  const contra=(dpw<-.005&&dpr>.005)||(dpw>.005&&dpr<-.005);
  return `${partes[0]}${contra?', mas':' e'} ${prc}: ${fim}.`;}

/* ===== simulação de pedido ===== */
function simGrupo(x){let g=x.g?IDX.g.find(y=>y.l+'|'+y.k===x.g):null;if(!g){const r=buscar(x.q);g=r[0]||null;}return g;}
function opcao(o,q){/* custo de levar q barras deste código, respeitando a compra mínima por item */
  const br=Math.max(q,o.bars||1);return {o,br,kg:br*o.kgb,v:br*o.kgb*o.kg,forc:br>q};}
function simular(){
  const itens=SIM.map((x,i)=>{const g=simGrupo(x);if(!g)return {x,i,nf:1};const L=g.m.filter(m=>visivel(g,m)).map(m=>calc(g,m)).filter(o=>!o.sem);
    return {x,i,g,cl:classe(g,x.q),ops:L.map(o=>opcao(o,x.b)).sort((a,b)=>a.v-b.v)};});
  const val=itens.filter(t=>!t.nf);
  const fs=[...new Set(val.flatMap(t=>t.ops.map(p=>p.o.f)))];
  const minP=f=>{const P=DADOS.forn[f];return P&&P.min_pedido!=null?+P.min_pedido:0;};
  const resumo=esc=>{const por={};esc.forEach(e=>{if(!e.p)return;const f=e.p.o.f;por[f]=por[f]||{kg:0,v:0,n:0};por[f].kg+=e.p.kg;por[f].v+=e.p.v;por[f].n++;});
    Object.entries(por).forEach(([f,r])=>{r.min=minP(f);r.falta=Math.max(0,r.min-r.kg);});return por;};
  /* 1) um fornecedor só */
  const unicos=fs.map(f=>{const esc=val.map(t=>({t,p:t.ops.filter(p=>p.o.f===f).sort((a,b)=>a.v-b.v)[0]||null}));
    const por=resumo(esc);const r=por[f]||{kg:0,v:0,n:0,min:minP(f),falta:minP(f)};
    return {f,esc,cob:esc.filter(e=>e.p).length,kg:r.kg,v:r.v,min:r.min,falta:r.falta};}).sort((a,b)=>(b.cob-a.cob)||(a.v-b.v));
  /* 2) melhor combinação: cada item no mais barato; quem não fecha o pedido mínimo tenta passar os itens para outro fornecedor já usado */
  let esc=val.map(t=>({t,p:t.ops[0]||null}));
  for(let k=0;k<20;k++){const por=resumo(esc);const ruim=Object.entries(por).filter(([,r])=>r.falta>0).sort((a,b)=>a[1].kg-b[1].kg)[0];if(!ruim)break;
    const f=ruim[0];const ok=Object.keys(por).filter(x=>x!==f);let mudou=false;
    const novo=esc.map(e=>{if(!e.p||e.p.o.f!==f)return e;const alt=e.t.ops.find(p=>ok.includes(p.o.f));if(!alt)return e;mudou=true;return {...e,p:alt,mov:f};});
    if(!mudou)break;
    /* só aceita a troca se fechar sem faltar mínimo em quem recebeu ou se for mais barato que completar o mínimo */
    const pn=resumo(novo);const custoNovo=Object.values(pn).reduce((a,r)=>a+r.v,0);
    const custoAtual=Object.values(por).reduce((a,r)=>a+r.v,0)+ruim[1].falta*(esc.find(e=>e.p&&e.p.o.f===f).p.o.kg);
    if(custoNovo<=custoAtual)esc=novo;else break;}
  const porC=resumo(esc);
  return {itens,val,unicos,esc,porC,totC:Object.values(porC).reduce((a,r)=>a+r.v,0),kgC:Object.values(porC).reduce((a,r)=>a+r.kg,0)};}

async function salvaAbc(itens){/* itens: [[codigo,classe|null]] */
  if(LOCAL){itens.forEach(([c,k])=>{if(k)DADOS.abc[c]=k;else delete DADOS.abc[c];});ls.set('fc_compra_abc_'+EMP,DADOS.abc);return true;}
  const up=itens.filter(x=>x[1]).map(([c,k])=>({empresa_id:EMP,codigo:c,classe:k,atualizado_em:new Date().toISOString()}));
  const rm=itens.filter(x=>!x[1]).map(x=>x[0]);
  if(up.length){const r=await sb.from('compra_abc').upsert(up);if(r.error){if(/relation|does not exist|schema cache/i.test(r.error.message)){LOCAL=true;return salvaAbc(itens);}toast('Não salvou: '+r.error.message);return false;}}
  if(rm.length){const r=await sb.from('compra_abc').delete().eq('empresa_id',EMP).in('codigo',rm);if(r.error){toast('Não salvou: '+r.error.message);return false;}}
  itens.forEach(([c,k])=>{if(k)DADOS.abc[c]=k;else delete DADOS.abc[c];});return true;}

/* ===== acompanhamento (FC) ===== */
async function telaUso(){const box=$('#app .box:last-child');let L=[],P=[],F=[];
  try{const r=await sb.from('compra_log').select('empresa_id,tipo,nome,detalhe,criado_em').order('criado_em',{ascending:false}).limit(2000);if(r.error)throw r.error;L=r.data||[];}catch(e){box.innerHTML=`<p class="vazio">O acompanhamento começa a registrar quando a FC ativar o banco de dados desta ferramenta.</p>`;return;}
  try{const r=await sb.from('cons_portal').select('empresa_id,ultimo_acesso,acessos,ativo');P=r.data||[];}catch(_){}
  try{const r=await sb.from('compra_forn').select('empresa_id,forn,natural,atualizado_em');F=r.data||[];}catch(_){}
  const d7=Date.now()-7*864e5,d30=Date.now()-30*864e5;
  const html=EMPS.map(e=>{const l=L.filter(x=>x.empresa_id===e.id);const b=l.filter(x=>x.tipo==='busca');const p=P.find(x=>x.empresa_id===e.id);const f=F.filter(x=>x.empresa_id===e.id&&x.natural!=null);
    const top={};b.forEach(x=>{const q=(x.detalhe&&x.detalhe.q||'').toUpperCase();if(q)top[q]=(top[q]||0)+1;});
    const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const ult=l[0]?l[0].criado_em:null;const parado=!ult||dias(ult)>14;
    const vel=f.length?Math.max(...f.map(x=>dias(x.atualizado_em))):null;
    return `<div class="box"><h2 class="t" style="display:flex;justify-content:space-between;gap:8px">${esc(e.nome)} ${p&&p.ativo?'':'<span class="st vz" style="font:700 12px var(--f-b)">sem link ativo</span>'}</h2>
     ${parado?`<div class="aviso bx" style="margin:0 0 8px">${ult?'Sem uso há '+dias(ult)+' dias.':'Ainda não usou a ferramenta.'} Vale cobrar o cliente.</div>`:''}
     <div class="kp"><div><b>${b.filter(x=>+new Date(x.criado_em)>d7).length}</b><span>pesquisas em 7 dias</span></div><div><b>${b.filter(x=>+new Date(x.criado_em)>d30).length}</b><span>pesquisas em 30 dias</span></div><div><b>${l.filter(x=>x.tipo==='relatorio').length}</b><span>relatórios tirados</span></div><div><b>${l.filter(x=>x.tipo==='simulacao').length}</b><span>simulações de pedido</span></div><div><b>${f.length}/6</b><span>fornecedores com preço${vel!=null?' · mais antigo '+vel+' d':''}</span></div></div>
     <b style="font-size:14px">Códigos mais pesquisados</b><div class="chips" style="margin:6px 0 10px">${tp.length?tp.map(([q,n])=>`<button type="button" data-ir="${esc(q)}" data-emp="${esc(e.id)}">${esc(q)} <small>${n}×</small></button>`).join(''):'<small style="color:var(--tm)">nenhum ainda</small>'}</div>
     <b style="font-size:14px">Últimos movimentos</b><div class="lg">${l.slice(0,40).map(x=>`<div><small>${new Date(x.criado_em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</small> · ${esc(x.nome||'—')} · ${x.tipo==='busca'?'pesquisou <b>'+esc((x.detalhe&&x.detalhe.q||'').toUpperCase())+'</b>'+(x.detalhe&&x.detalhe.achou===false?' <small>(não achou)</small>':''):x.tipo==='relatorio'?'tirou relatório ('+((x.detalhe&&x.detalhe.itens)||0)+' itens)':x.tipo==='simulacao'?'simulou pedido ('+((x.detalhe&&x.detalhe.itens)||0)+' itens'+(x.detalhe&&x.detalhe.total?', R$ '+Number(x.detalhe.total).toLocaleString('pt-BR'):'')+')':x.tipo==='precos'?'atualizou preço da <b>'+esc(IDX.forn[x.detalhe&&x.detalhe.forn]||'')+'</b>':esc(x.tipo)}</div>`).join('')||'<small style="color:var(--tm)">nada registrado</small>'}</div>
     ${p?`<p class="sub" style="font-size:13px;margin-top:8px">Portal: ${p.acessos||0} acessos · último ${p.ultimo_acesso?dt(p.ultimo_acesso):'—'}</p>`:''}</div>`;}).join('');
  $('#app').innerHTML=abas()+`<section class="box"><h1 class="t">Acompanhamento</h1><p class="sub">O que cada cliente está pesquisando e se está usando a ferramenta.</p></section><div class="cli2">${html}</div>`;}

/* ===== registro de uso (cliente) ===== */
let regT=null,regU='';
function registrar(tipo,det){if(ADM||!KEY||LOCAL)return;sb.rpc('compra_registrar',{p_chave:KEY,p_tipo:tipo,p_detalhe:det,p_nome:nomeQ()||null}).then(()=>{},()=>{});}
function regBusca(){const q=Q.trim().toUpperCase();if(!q||q===regU)return;clearTimeout(regT);regT=setTimeout(()=>{regU=q;registrar('busca',{q,achou:!!SEL,l:SEL?SEL.l:null,k:SEL?SEL.k:null,cor:COR,modo:MODO});},1500);}

/* ===== eventos ===== */
document.addEventListener('submit',async ev=>{const f=ev.target;
  if(f.id==='fb'){ev.preventDefault();Q=$('#q').value.trim();SEL=null;history.replaceState(null,'','#'+encodeURIComponent(Q));tela();regBusca();}
  else if(f.classList.contains('fc')){ev.preventDefault();salvarForn(f);}
  else if(f.id==='fSim'){ev.preventDefault();const q=f.c.value.trim();if(!q){f.c.focus();return;}if(!buscar(q).length){toast('Não achei '+q.toUpperCase()+'.');return;}if(!simAdd(q,f.b.value||1))return;tela();setTimeout(()=>{const c=$('#fSim [name=c]');if(c)c.focus();},50);}
  else if(f.id==='fSimL'){ev.preventDefault();let n=0,nf=[];f.t.value.split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{const p=l.split(/[;\t]/).map(x=>x.trim());if(!p[0])return;if(!buscar(p[0]).length)nf.push(p[0]);if(simAdd(p[0],p[1]||1))n++;});toast(n+' itens incluídos.'+(nf.length?' Não achei: '+nf.join(', '):''));tela();}
  else if(f.id==='fAbc'){ev.preventDefault();const m=f.querySelector('.msg');const it=[],bad=[];
    f.t.value.split(/\n/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const p=s.split(/[;\t,]/).map(x=>x.trim());const c=(p[0]||'').toUpperCase(),k=(p[1]||'').toUpperCase();if(c&&['A','B','C'].includes(k))it.push([c,k]);else bad.push(s);});
    if(!it.length){m.textContent='Nada para salvar. Use o formato código;classe (A, B ou C).';return;}
    m.textContent='Salvando…';if(await salvaAbc(it)){toast(it.length+' classes salvas.'+(bad.length?' '+bad.length+' linhas ignoradas.':''));tela();}}
  else if(f.id==='fMeta'){ev.preventDefault();const meta={data:f.data.value||null,part:[...f.querySelectorAll('[name=part]:checked')].map(x=>x.value),obs:f.obs.value.trim()||null};
    if(LOCAL){DADOS.meta=meta;ls.set('fc_compra_meta_'+EMP,meta);toast('Reunião salva.');tela();return;}
    const r=await sb.from('compra_abc_meta').upsert({empresa_id:EMP,data_reuniao:meta.data,participantes:meta.part,obs:meta.obs,atualizado_em:new Date().toISOString()});
    if(r.error){if(/relation|does not exist|schema cache/i.test(r.error.message)){LOCAL=true;DADOS.meta=meta;ls.set('fc_compra_meta_'+EMP,meta);toast('Reunião salva (modo demonstração).');tela();return;}toast('Não salvou: '+r.error.message);return;}
    DADOS.meta=meta;toast('Reunião salva.');tela();}});
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-sug],[data-addsim],[data-simrm],[data-simprint],[data-simcsv],[data-simlimpa],[data-aba],[data-cor],[data-modo],[data-g],[data-addrel],[data-rmrel],[data-print],[data-csv],[data-limpa],[data-setabc],[data-abctodos],[data-rmabc],[data-ir],[data-zoom]');if(!t)return;const d=t.dataset;
  if(d.sug){Q=d.sug;SEL=null;tela();regBusca();}
  else if(d.aba){ABA=d.aba;tela();window.scrollTo(0,0);}
  else if(d.cor){COR=d.cor;salvaPref();tela();}
  else if(d.modo){MODO=d.modo;salvaPref();tela();}
  else if(d.g!=null){SEL=IDX.g[+d.g];tela();}
  else if(d.addrel!=null)addRel();
  else if(d.addsim!=null){const v=prompt('Quantas barras de 6 m de '+Q.toUpperCase()+'?','1');if(v==null)return;if(simAdd(Q,v,SEL?SEL.l+'|'+SEL.k:null)){toast('Incluído na simulação.');tela();}}
  else if(d.simrm!=null){SIM.splice(+d.simrm,1);ls.set(SKEY(),SIM);tela();}
  else if(d.simprint!=null){const S=simular();registrar('simulacao',{itens:SIM.length,total:Math.round(S.totC),cor:COR,formato:'pdf'});window.print();}
  else if(d.simcsv!=null)simCsv();
  else if(d.simlimpa!=null){if(confirm('Limpar a simulação?')){SIM=[];ls.set(SKEY(),SIM);tela();}}
  else if(d.rmrel!=null){REL.splice(+d.rmrel,1);ls.set(RKEY(),REL);tela();}
  else if(d.print!=null){registrar('relatorio',{itens:REL.length,cor:COR,modo:MODO,formato:'pdf'});window.print();}
  else if(d.csv!=null)csv();
  else if(d.limpa!=null){if(confirm('Limpar todos os itens do relatório?')){REL=[];ls.set(RKEY(),REL);tela();}}
  else if(d.setabc!=null){const g=SEL;if(!g)return;const c=Q.trim().toUpperCase();if(await salvaAbc([[c,d.setabc||null]])){toast(d.setabc?c+' agora é classe '+d.setabc+'.':'Classe tirada.');tela();}}
  else if(d.abctodos!=null){if(!SEL)return;const c=Q.trim().toUpperCase();const k=d.abctodos;
    if(!confirm(k?`Marcar ${c} como classe ${k} em TODOS os ${EMPS.length} clientes?`:`Tirar a classe de ${c} em TODOS os clientes?`))return;
    if(await salvaAbcTodos(c,k||null)){toast(k?`${c} agora é classe ${k} em todos os clientes.`:`Classe de ${c} tirada de todos os clientes.`);tela();}}
  else if(d.rmabc){if(await salvaAbc([[d.rmabc,null]]))tela();}
  else if(d.ir){if(d.emp&&d.emp!==EMP){$('#selEmp').value=d.emp;await trocaEmp(d.emp);}ABA='busca';Q=d.ir;SEL=null;tela();}
  else if(d.zoom!=null){if(!d.zoom)return;$('#zmI').src=d.zoom;$('#zmT').textContent=d.t||'';$('#zm').hidden=false;}});
$('#zmX').onclick=()=>$('#zm').hidden=true;$('#zm').onclick=e=>{if(e.target.id==='zm')$('#zm').hidden=true;};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#zm').hidden=true;});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.simq!=null){const v=Math.max(1,Math.round(+t.value.replace(',','.')||1));SIM[+t.dataset.simq].b=v;ls.set(SKEY(),SIM);tela();}});

/* ===== início ===== */
async function carregaDados(){
  let r=null;try{r=await sb.rpc('compra_dados',{p_chave:KEY||null,p_emp:ADM?EMP:null});}catch(e){r={error:e};}
  if(r&&r.error&&/function|does not exist|schema cache/i.test(r.error.message||'')){LOCAL=true;
    DADOS={forn:ls.get('fc_compra_local_'+EMP,{}),abc:ls.get('fc_compra_abc_'+EMP,{}),meta:ls.get('fc_compra_meta_'+EMP,null),nome:(EMPS.find(e=>e.id===EMP)||{}).nome||''};return true;}
  if(!r||r.error||!r.data)return false;
  LOCAL=false;DADOS={forn:r.data.forn||{},abc:r.data.abc||{},meta:r.data.meta||null,nome:r.data.nome||'',lib:r.data.lib||null};EMP=r.data.emp;return true;}
async function trocaEmp(id){EMP=id;ls.set('fc_compra_emp',id);REL=ls.get(RKEY(),[]);SIM=ls.get(SKEY(),[]);await carregaDados();$('#hd').textContent='Onde comprar · '+(DADOS.nome||id);}
async function iniciar(){
  await carregaIndice();
  if(ADM){const r=await sb.from('rotina_docs').select('id,data').eq('col','consultoria');EMPS=(r.data||[]).map(x=>({id:x.id,nome:(x.data&&x.data.nome)||x.id})).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
    const s=$('#selEmp');s.hidden=false;s.innerHTML=EMPS.map(e=>`<option value="${esc(e.id)}">${esc(e.nome)}</option>`).join('');
    let e0=ls.get('fc_compra_emp','');if(!EMPS.some(e=>e.id===e0))e0=EMPS[0]&&EMPS[0].id;s.value=e0;s.onchange=async()=>{await trocaEmp(s.value);SEL=null;tela();};
    await trocaEmp(e0);}
  else{const ok=await carregaDados();if(!ok&&!LOCAL){$('#app').innerHTML='<p class="vazio">Link inválido ou expirado. Fale com a FC Consultoria.</p>';return;}
    if(LOCAL){const v=await sb.rpc('cons_portal_ver',{p_chave:KEY}).catch(()=>({}));if(!v||v.error||!v.data){$('#app').innerHTML='<p class="vazio">Link inválido ou expirado. Fale com a FC Consultoria.</p>';return;}EMP=v.data.id;DADOS.nome=v.data.nome||'';DADOS.forn=ls.get('fc_compra_local_'+EMP,{});}
    REL=ls.get(RKEY(),[]);SIM=ls.get(SKEY(),[]);$('#hd').textContent='Onde comprar · '+(DADOS.nome||'');registrar('acesso',{});}
  Q=decodeURIComponent(location.hash.slice(1)||'');tela();if(Q)regBusca();}
(async()=>{if(KEY){marca('uso exclusivo do cliente');iniciar();}
  else gateUI(async()=>{try{const r=await sb.rpc('trein_is_admin');ADM=!!r.data;}catch(_){}
    if(!ADM){$('#app').innerHTML='<p class="vazio">Esta área é da FC Consultoria. O cliente entra pelo link do portal.</p>';return;}
    marca('uso interno');const a=document.createElement('a');a.className='vt';a.href='/treinamento/painel.html';a.textContent='← Painel matriz';if(window.top===window.self)$('header.top .w').appendChild(a);
    if(window.FCFoto)FCFoto.ligar({idx:'foto-ext.json',tem:c=>!!BY[norm(c)],ir:c=>{$('#q').value=c;$('#fb').requestSubmit();},forn:f=>IDX&&IDX.forn[f]});iniciar();});})();
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('#libSalva');if(!b)return;const L=[...document.querySelectorAll('[data-lib]:checked')].map(x=>x.dataset.lib);const m=document.getElementById('libMsg');
  if(!L.length){m.textContent='Marque pelo menos um fornecedor.';return;}b.disabled=true;m.textContent='Salvando…';
  const r=await sb.rpc('compra_forn_lib',{p_emp:EMP,p_lista:L.length===FORN.length?[]:L});b.disabled=false;
  if(r.error||!r.data){m.textContent='Não salvou: '+((r.error&&r.error.message)||'sem acesso');return;}DADOS.lib=L.length===FORN.length?[]:L;m.textContent='✓ Salvo: o cliente vê '+(L.length===FORN.length?'todos os fornecedores':L.map(f=>IDX.forn[f]).join(', '));});
</script>
