<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="generator" content="Compras com distribuidora · FC Consultoria em Esquadria">
<title>Compras com distribuidora · FC Consultoria</title>
<link rel="icon" href="/img/logo-fc-160.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{--tl:#0f6b70;--tlc:#e5f2f2;--or:#f2a51e;--orc:#fff4dc;--ink:#13232e;--tm:#5a6b75;--ln:#d8e2e6;--bg:#f2f6f7;--ok:#15803d;--okc:#e7f6ec;--md:#b45309;--mdc:#fdf3e2;--bx:#b42318;--f-d:'Barlow Condensed',system-ui,sans-serif;--f-b:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b)}button,input{font-family:inherit}
.rgate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#e9f0f0;padding:16px}.rgate[hidden]{display:none}
.rgate form{width:min(360px,100%);background:#fff;border:1px solid #d6e1e1;border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.rgate h1{margin:0;font:800 28px var(--f-d)}.rgate small{color:#5a6e72;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rgate label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}.rgate input{font-size:15px;padding:9px 10px;border:1px solid #c4ccd2;border-radius:8px}
.rgate button{background:var(--tl);color:#fff;border:0;border-radius:9px;padding:11px;font-weight:700;cursor:pointer}
.top{background:#13232e;color:#fff;box-shadow:0 2px 0 var(--or)}
.top .w{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:40px;height:40px;border-radius:9px}.top b{font:800 22px/1 var(--f-d)}.top small{display:block;font:600 11.5px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:#ffd58a}
.top a.vt{margin-left:auto;border:1px solid rgba(255,255,255,.55);color:#fff;text-decoration:none;border-radius:9px;padding:7px 12px;font-weight:700;font-size:14px}
main{max-width:1240px;margin:0 auto;padding:16px 16px 60px}
.box{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:16px 18px}
h1.t{margin:0 0 4px;font:800 30px/1.05 var(--f-d);color:#13232e}.sub{margin:0;color:var(--tm);font-size:15px}
.sb{display:flex;gap:8px;margin-top:12px}.sb input{flex:1;font:600 22px var(--f-b);padding:12px 14px;border:2px solid var(--ink);border-radius:12px;text-transform:uppercase;min-width:0}
.sb button{border:0;border-radius:12px;background:var(--ink);color:#fff;font:700 16px var(--f-b);padding:0 18px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:6px 12px;font:600 14px var(--f-b);cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chips small{opacity:.6;margin-left:3px}
.res{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.cab{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:center}@media(max-width:700px){.cab{grid-template-columns:1fr}}
.im{height:150px;background:#fff;border:1px solid #eef2f3;border-radius:12px;display:grid;place-items:center;padding:6px;cursor:zoom-in;overflow:hidden}
.im img{max-width:100%;max-height:138px;object-fit:contain}.im small{color:var(--tm)}
.cab .cd{font:800 36px/1 var(--f-d)}.cab .nm{font-weight:600}.cab .ln{color:var(--tm);font-size:14px}
.cnt{display:inline-flex;gap:6px;align-items:center;background:var(--tlc);color:var(--tl);border-radius:99px;padding:3px 12px;font:700 14px var(--f-b);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card .fn{font:800 20px/1 var(--f-d)}.card .c{font:800 24px/1 var(--f-d);color:var(--tl)}
.kv{display:flex;gap:6px;flex-wrap:wrap}.kv span{background:var(--bg);border-radius:8px;padding:2px 8px;font:600 13px var(--f-b)}
.kv .up{color:var(--bx)}.kv .dn{color:var(--ok)}
.how{font-size:13px;color:#3c4c50}.how b{color:var(--ok)}.how b.md{color:var(--md)}
h2.t{margin:4px 0 0;font:800 22px var(--f-d)}
.ext{display:flex;gap:6px;flex-wrap:wrap}.ext a{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:5px 10px;font:600 14px var(--f-b);color:var(--ink);text-decoration:none}
.vazio{padding:26px;text-align:center;color:var(--tm)}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.kp div{background:var(--bg);border-radius:12px;padding:10px 12px}.kp b{display:block;font:800 28px/1 var(--f-d)}.kp span{font-size:13px;color:var(--tm)}
.zm{position:fixed;inset:0;z-index:900;background:rgba(6,20,26,.8);display:grid;place-items:center;padding:16px}.zm[hidden]{display:none}
.zm div{background:#fff;border-radius:16px;padding:14px;max-width:min(1000px,96vw);max-height:92vh;display:flex;flex-direction:column;gap:8px}
.zm img{max-width:100%;max-height:78vh;object-fit:contain}.zm button{align-self:flex-end;border:0;background:var(--ink);color:#fff;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer}
.lst{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.lst button{all:unset;cursor:pointer;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px}
.lst button:hover{border-color:#9cc9c9;box-shadow:0 6px 16px rgba(15,40,50,.1)}.lst .ti{height:80px;display:grid;place-items:center;background:#f7fafb;border-radius:8px;overflow:hidden}.lst .ti img{max-width:100%;max-height:76px;object-fit:contain}
.lst b{font:800 16px var(--f-d)}.lst small{color:var(--tm);font-size:12px}
#wm{position:fixed;inset:0;pointer-events:none;z-index:800}
</style>
</head>
<body>
<div class="rgate" id="gate" hidden><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>🏬 Compras com distribuidora</h1>
<label>Login<input name="login" autocomplete="username" required placeholder="matriz"></label>
<label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>
<header class="top"><div class="w"><img src="/img/logo-fc-160.jpg" alt=""><div><small>FC Consultoria · Setor de compras</small><b>Compras com distribuidora</b></div></div></header>
<main id="app"><p class="vazio">Carregando…</p></main>
<div class="zm" id="zm" hidden><div><button type="button" id="zmX">✕ Fechar</button><img id="zmI" alt=""><b id="zmT"></b></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../auth.js"></script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY=new URLSearchParams(location.search).get('k')||'';
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function nk(c){c=norm(c);const m=c.match(/^([A-Z]*)(\d+)([A-Z]?)$/);if(!m)return c;let [,L,D,S]=m;if(L&&D.length<=4)D=String(+D).padStart(3,'0');return L+D+S;}
const kg=v=>v==null?'peso não informado':v.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3})+' kg/m';
function marca(t){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300"><g transform="rotate(-24 230 150)" font-family="Barlow,Arial,sans-serif" text-anchor="middle" fill="#13232e" fill-opacity=".04"><text x="230" y="150" font-size="24" font-weight="800">FC CONSULTORIA EM ESQUADRIA</text><text x="230" y="176" font-size="13">${t}</text></g></svg>`;const w=document.createElement('div');w.id='wm';w.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;document.body.appendChild(w);}
let D=null,IDX=null,BY={},ADM=false,Q='',DF='';
const imgD=(d,c)=>'distribuidoras/img/'+d+'/'+encodeURIComponent(c.replace(/[^A-Z0-9-]/gi,'').toUpperCase())+'.webp?v=2';
function imgA(g){if(!g.alc||!IDX)return '';const L=IDX.linhas[g.l];return L&&L.img?L.img+'alcoa/'+encodeURIComponent(g.alc[0])+'.webp?v=2':'';}
async function carrega(){D=await fetch('distribuidoras/dados.json?v=2',{cache:'no-cache'}).then(r=>r.json());try{IDX=await fetch('indice.json?v=3',{cache:'no-cache'}).then(r=>r.json());}catch(_){}
  D.g.forEach((g,i)=>{g.i=i;const ks=new Set([g.k]);g.m.forEach(m=>{ks.add(nk(m[1]));if(m[6])ks.add(nk(m[6]));});if(g.mk)ks.add(nk(g.mk));ks.forEach(k=>(BY[k]=BY[k]||[]).push(i));});
  /* código de extrusora (Texa, FBK, Ecoalumi…) leva ao grupo de mercado da Conversão de códigos */
  if(IDX)IDX.g.forEach(x=>{const gs=D.g.filter(g=>g.l===x.l&&g.gk===x.k);if(!gs.length)return;x.m.forEach(m=>{const k=nk(m[1]);gs.forEach(g=>{if(!(BY[k]||[]).includes(g.i))(BY[k]=BY[k]||[]).push(g.i);});});});}
function busca(q){return [...new Set(BY[nk(q)]||[])].map(i=>D.g[i]);}
function tela(){const r=Q?busca(Q):[];const tot={};D.g.forEach(g=>g.m.forEach(m=>tot[m[0]]=(tot[m[0]]||0)+1));
  const multi=D.g.filter(g=>new Set(g.m.map(m=>m[0])).size>1).length;
  let h=`<section class="box"><h1 class="t">Compras com distribuidora</h1><p class="sub">Digite o código de qualquer distribuidora, o código de mercado (ex.: SU-001) ou até o código da extrusora. Aparecem todas as distribuidoras que têm o mesmo perfil, com o código de cada uma, o desenho e o peso (quando a distribuidora informa). Barras de 6 m.</p>
  <form class="sb" id="fb"><input id="q" value="${esc(Q)}" placeholder="Ex.: SU-001, CM-151, 25-506, LG-017" autocomplete="off" aria-label="Código"><button>Procurar</button></form>
  <div class="kp"><div><b>${Object.keys(D.dist).length}</b><span>distribuidoras na base</span></div><div><b>${D.g.reduce((a,g)=>a+g.m.length,0).toLocaleString('pt-BR')}</b><span>códigos lidos dos catálogos</span></div><div><b>${multi.toLocaleString('pt-BR')}</b><span>perfis em 2 ou mais distribuidoras</span></div></div>
  <div class="chips">${Object.entries(D.dist).map(([k,n])=>`<button type="button" data-df="${k}" class="${DF===k?'on':''}">${esc(n)}<small>${tot[k]||0}</small></button>`).join('')}</div></section>`;
  h+=`<div id="resBox">${Q?(r.length?resultado(r):sugestoes(Q)):(DF?lista(DF):'')}</div>`;
  $('#app').innerHTML=h;}
function resultado(r){
  if(!r.length)return `<div class="box" style="margin-top:16px"><p class="vazio">Não achei <b>${esc(Q.toUpperCase())}</b> nos catálogos das distribuidoras.</p></div>`;
  return `<div class="res">${r.map(g=>{const ds=new Set(g.m.map(m=>m[0]));const ia=imgA(g);const ref=g.alc?g.alc[1]:null;
    const ext=IDX&&g.gk?(IDX.g.find(x=>x.l===g.l&&x.k===g.gk)||{m:[]}).m.filter(m=>m[0]!=='alcoa'):[];
    return `<div class="box cab"><div class="im" data-zoom="${esc(ia)}" data-t="${esc(g.mk||g.k)}">${ia?`<img src="${esc(ia)}" alt="" onerror="this.replaceWith(document.createTextNode('sem desenho'))">`:'<small>código de mercado</small>'}</div>
     <div><div class="cd">${esc(g.mk||g.m[0][1])}</div><div class="nm">${esc(g.n||'')}</div><div class="ln">${g.mk?'Código de mercado'+(g.alc?' · Alcoa '+esc(g.alc[0])+' · '+kg(g.alc[1]):''):'Código próprio de distribuidora'}${g.l&&IDX?' · '+esc(IDX.linhas[g.l].n):''}</div>
     <span class="cnt">🏬 ${ds.size} ${ds.size===1?'distribuidora':'distribuidoras'} com este perfil</span></div></div>
    <div class="grid">${g.m.map(m=>{const dp=ref&&m[2]?m[2]/ref-1:null;const im=m[4]?imgD(m[0],m[1]):'';
      return `<div class="card"><span class="fn">${esc(D.dist[m[0]]||m[0])}</span><div class="im" data-zoom="${esc(im)}" data-t="${esc((D.dist[m[0]]||m[0])+' '+m[1])}">${im?`<img src="${esc(im)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('sem desenho'))">`:'<small>sem desenho</small>'}</div>
       <span class="c">${esc(m[1])}</span><div class="kv"><span>${kg(m[2])}</span>${m[2]?`<span>${(m[2]*6).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3})} kg na barra</span>`:''}${dp!=null?`<span class="${dp>.03?'up':dp<-.03?'dn':''}">${Math.abs(dp)<.0005?'mesmo peso da Alcoa':(dp>0?'+':'')+(dp*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'% vs Alcoa'}</span>`:''}<span>pág. ${esc(m[3])}</span></div>
       <span class="how">${m[5]==='mesmo código'?'<b>✓ Mesmo código de mercado</b>':'<b class="md">✓ O catálogo informa a referência '+esc(m[6])+'</b>'}</span></div>`;}).join('')}</div>
    ${ext.length?`<div class="box"><h2 class="t">Na extrusora (direto da fábrica)</h2><p class="sub" style="font-size:14px">O mesmo perfil nas extrusoras da Conversão de códigos. Para comparar preço por kg, use o Onde comprar.</p><div class="ext" style="margin-top:8px">${ext.map(m=>`<a href="comprar.html${KEY?'?k='+encodeURIComponent(KEY):''}#${encodeURIComponent(m[1])}">${esc(IDX.forn[m[0]])} · <b>${esc(m[1])}</b></a>`).join('')}</div></div>`:''}`;}).join('')}</div>`;}
function lista(df){const T=D.g.flatMap(g=>g.m.filter(m=>m[0]===df).map(m=>({g,m})));T.sort((a,b)=>new Set(b.g.m.map(x=>x[0])).size-new Set(a.g.m.map(x=>x[0])).size);const L=T.slice(0,600);
  return `<section class="box" style="margin-top:14px"><h2 class="t">${esc(D.dist[df])} · ${T.length} códigos${T.length>L.length?' <small style="font:600 14px var(--f-b);color:var(--tm)">(mostrando os '+L.length+' que mais aparecem em outras distribuidoras; use a busca para os demais)</small>':''}</h2><p class="sub" style="font-size:14px">Clique num código para ver as outras distribuidoras com o mesmo perfil.</p>
  <div class="lst">${L.map(({g,m})=>{const n=new Set(g.m.map(x=>x[0])).size;return `<button type="button" data-q="${esc(m[1])}"><span class="ti">${m[4]?`<img src="${esc(imgD(m[0],m[1]))}" alt="" loading="lazy">`:''}</span><b>${esc(m[1])}</b><small>${g.mk&&nk(g.mk)!==nk(m[1])?'= '+esc(g.mk)+' · ':''}${n>1?n+' distribuidoras':'só nesta'}</small></button>`;}).join('')}</div></section>`;}
let SUG=null;
function sugIdx(){if(SUG)return SUG;const m=new Map();D.g.forEach(g=>{g.m.forEach(x=>{const k=norm(x[1]);if(!m.has(k))m.set(k,{c:x[1],d:x[0]});});if(g.mk){const k=norm(g.mk);if(!m.has(k))m.set(k,{c:g.mk,d:''});}});
  if(IDX)IDX.g.forEach(g=>g.m.forEach(x=>{const k=norm(x[1]);if(!m.has(k)&&BY[nk(x[1])])m.set(k,{c:x[1],d:'',f:x[0]});}));SUG=[...m.entries()];return SUG;}
function sugestoes(q){const k=norm(q);if(k.length<2)return '';
  const L=sugIdx().filter(([c])=>c.startsWith(k)).slice(0,30).concat(sugIdx().filter(([c])=>!c.startsWith(k)&&c.includes(k)).slice(0,10)).slice(0,30);
  if(!L.length)return resultado([]);
  return `<div class="box" style="margin-top:16px"><b style="font-size:15px">Códigos que começam com ${esc(q.toUpperCase())}:</b><div class="chips">${L.map(([,o])=>`<button type="button" data-q="${esc(o.c)}">${esc(o.c)} <small>${o.d?esc(D.dist[o.d]):o.f&&IDX?esc(IDX.forn[o.f])+' (extrusora)':'mercado'}</small></button>`).join('')}</div></div>`;}
let digT=null;
document.addEventListener('input',e=>{if(e.target.id!=='q')return;clearTimeout(digT);const v=e.target.value;digT=setTimeout(()=>{Q=v.trim();history.replaceState(null,'','#'+encodeURIComponent(Q));const r=Q?busca(Q):[];const b=$('#resBox');if(b)b.innerHTML=Q?(r.length?resultado(r):sugestoes(Q)):(DF?lista(DF):'');},250);});
document.addEventListener('submit',e=>{if(e.target.id==='fb'){e.preventDefault();Q=$('#q').value.trim();history.replaceState(null,'','#'+encodeURIComponent(Q));tela();}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-df],[data-q],[data-zoom]');if(!t)return;const d=t.dataset;
  if(d.df){DF=DF===d.df?'':d.df;Q='';tela();}else if(d.q){Q=d.q;tela();window.scrollTo(0,0);}else if(d.zoom){$('#zmI').src=d.zoom;$('#zmT').textContent=d.t||'';$('#zm').hidden=false;}});
$('#zmX').onclick=()=>$('#zm').hidden=true;$('#zm').onclick=e=>{if(e.target.id==='zm')$('#zm').hidden=true;};
async function iniciar(){await carrega();Q=decodeURIComponent(location.hash.slice(1)||'');tela();}
(async()=>{if(KEY){let ok=false;try{const r=await sb.rpc('cons_portal_ver',{p_chave:KEY});ok=!r.error&&!!r.data;}catch(_){}
  if(!ok){$('#app').innerHTML='<p class="vazio">Link inválido ou expirado. Fale com a FC Consultoria.</p>';return;}marca('uso exclusivo do cliente');iniciar();}
 else gateUI(async()=>{try{const r=await sb.rpc('trein_is_admin');ADM=!!r.data;}catch(_){}
  if(!ADM){$('#app').innerHTML='<p class="vazio">Esta área é da FC Consultoria. O cliente entra pelo link do portal.</p>';return;}
  marca('uso interno');const a=document.createElement('a');a.className='vt';a.href='/treinamento/painel.html';a.textContent='← Painel matriz';if(window.top===window.self)$('header.top .w').appendChild(a);iniciar();});})();
</script>
</body>
</html>
