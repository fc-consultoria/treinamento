<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Apresentação 3D da obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Link de Apresentação 3D: o mesmo modelo da proposta, sem preço. © FC Consultoria em Esquadria */
:root{--bg:#e9eef0;--fg:#14232a;--muted:#5d6e73;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1020px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.dica{color:var(--muted);font-size:13px;margin:0}
.btn{font:600 13px "Inter",system-ui,sans-serif;border:1px solid #c9d4d6;background:#fff;color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn:focus-visible{outline:3px solid #c9831a;outline-offset:2px}
.msg{background:#fff;border-radius:16px;padding:32px 22px;text-align:center;color:var(--muted)}.msg b{display:block;color:var(--fg);font:700 18px "Space Grotesk",system-ui,sans-serif;margin-bottom:6px}
@media print{.bar{display:none!important}.wrap{padding:0;max-width:none}body{background:#fff}}
</style>
</head>
<body>
<main class="wrap"><div class="bar"><p class="dica">Toque em <b>Ver em 3D</b> em qualquer item para girar a tipologia.</p><button class="btn" type="button" id="b-print" hidden>🖨 Imprimir / Salvar PDF</button></div>
<div id="main"><div class="msg">Carregando a apresentação…</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="tip3d.js?v=20261105j"></script>
<script src="proposta.js?v=20261105f"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const erro=(t,d)=>{$("main").innerHTML=`<div class="msg"><b>${t}</b>${d}</div>`};
const tok=new URLSearchParams(location.search).get("t")||"";
/* aberto pela Plataforma FC 3D (avaliar o projeto): comando de voltar para o painel; o link copiado para o cliente não tem isto */
if(new URLSearchParams(location.search).get("de")==="fc3d"){const bar=document.querySelector(".bar");if(bar)bar.insertAdjacentHTML("afterbegin",'<a class="btn" href="https://fc-consultoria.github.io/fc3d/clientes/#apr" style="text-decoration:none;background:#0d5c63;color:#fff;border-color:#0d5c63">← Voltar para o painel</a>')}
if(tok.length<20){erro("Link incompleto","Confira se o link foi copiado inteiro ou peça um novo a quem enviou.");return}
let D=null;/* pode ser trocado pela proposta protegida */
try{const sb=window.supabase.createClient("https://cpkjphodruyxfouirhpd.supabase.co","sb_publishable_d0HEeWsaqOeZIQKGftlF-Q_B8BUOWWg",{auth:{persistSession:false}});
 const r=await sb.rpc("orcobra_link_ver",{tok});if(r.error)throw r.error;D=r.data}catch(e){erro("Não foi possível carregar","Verifique a internet e abra o link de novo.");return}
if(!D){erro("Este link não está mais disponível","Peça um link atualizado a quem enviou a apresentação.");return}
/* 04/11/2026 · proposta on-line protegida (Simulador de Obra 3D): só abre com código de acesso de uso único */
const sbp=window.supabase.createClient("https://cpkjphodruyxfouirhpd.supabase.co","sb_publishable_d0HEeWsaqOeZIQKGftlF-Q_B8BUOWWg",{auth:{persistSession:false}});
const QS=new URLSearchParams(location.search),KAP="o3ap_"+tok,lsg=k=>{try{return localStorage.getItem(k)}catch(_){return null}},lss=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}};
let ACESSO=null,EMPRESA=false;
if(D.protegido){
 const marca=D.marca||"",cor=D.marcaCor||"#0d5c63";
 const tentar=async()=>{
  if(QS.get("e")){const r=await sbp.rpc("obra3d_proposta_empresa",{link:tok,tok:QS.get("e")});if(!r.error&&r.data){EMPRESA=true;return r.data}}
  const ap=lsg(KAP);if(!ap)return null;
  const r=await sbp.rpc("obra3d_proposta_ver",{link:tok,aparelho:ap});
  if(r.error){const m=String(r.error.message||"");if(/bloqueado|vencido/.test(m)){lss(KAP,null);return {erro:/bloqueado/.test(m)?"Este acesso foi bloqueado por quem enviou a proposta.":"O seu acesso a esta proposta venceu."}}lss(KAP,null);return null}
  return r.data};
 let R;try{R=await tentar()}catch(e){erro("Não foi possível carregar","Verifique a internet e abra o link de novo.");return}
 if(!R||R.erro){
  document.title="Proposta · código de acesso";
  $("main").innerHTML=`<div style="max-width:420px;margin:40px auto;background:#fff;border-radius:16px;padding:26px 22px;box-shadow:0 12px 40px rgba(10,30,35,.12);text-align:center">
   ${D.logo?`<img src="${esc(D.logo)}" alt="" style="max-height:56px;max-width:200px;object-fit:contain;margin-bottom:10px">`:""}
   <div style="font:700 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:${esc(cor)}">${esc(marca||"Proposta da obra")}</div>
   <h1 style="font:700 22px/1.2 'Space Grotesk',Inter,sans-serif;margin:8px 0 6px">Proposta protegida</h1>
   <p style="margin:0 0 16px;color:#5d6e73;font-size:14px">${R&&R.erro?esc(R.erro)+" Peça um novo código a quem enviou.":"Digite o código de acesso de 6 números que você recebeu junto com o link."}</p>
   <input id="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Código de acesso" style="width:100%;font:700 28px/1 ui-monospace,monospace;letter-spacing:.3em;text-align:center;padding:12px;border:2px solid #c9d4d6;border-radius:12px">
   <button id="lib" class="btn" type="button" style="width:100%;margin-top:12px;background:${esc(cor)};color:#fff;border-color:${esc(cor)};min-height:48px;font-size:15px">Liberar a proposta</button>
   <p id="cerr" role="alert" style="color:#a3262b;font-size:13px;min-height:1.2em;margin:10px 0 0"></p>
   <p style="margin:14px 0 0;color:#7a8a8e;font-size:12px">O código é pessoal e libera só este aparelho.</p></div>`;
  const ci=$("cod");ci.focus();ci.oninput=()=>{ci.value=ci.value.replace(/\D/g,"").slice(0,6)};
  const ir=async()=>{const c=ci.value;if(c.length!==6){$("cerr").textContent="O código tem 6 números.";return}$("lib").disabled=true;$("cerr").textContent="";
   const r=await sbp.rpc("obra3d_acesso_entrar",{link:tok,codigo:c});$("lib").disabled=false;
   if(r.error){const m=String(r.error.message||"");$("cerr").textContent=/muitas_tentativas/.test(m)?"Muitas tentativas. Aguarde 15 minutos.":/codigo_usado/.test(m)?"Este código já foi usado em outro aparelho. Peça um novo a quem enviou.":/codigo_expirado/.test(m)?"Este código expirou. Peça um novo a quem enviou.":"Código não confere. Confira os números.";return}
   lss(KAP,r.data.aparelho);location.reload()};
  $("lib").onclick=ir;ci.onkeydown=e=>{if(e.key==="Enter")ir()};
  return}
 D=R;ACESSO=R.acesso||null;
}
document.title=(D.obra||"Obra")+" · Apresentação 3D";
/* 05/11/2026 · troca de cor só para a vidraçaria: aberto pelo painel dela (vid = link de envio dono deste projeto). O link do cliente/arquiteto nunca mostra. */
let VIDRA=false;const vid=QS.get("vid")||"";if(vid.length>=20){try{const r=await sbp.rpc("obra3d_link_vidraceiro",{link:tok,vid});VIDRA=!r.error&&r.data===true}catch(_){}}
/* 05/11/2026 · Link de teste da vidraçaria (projetos teste da Obra em 3D): vt = token do teste + código de 6 números, sem entrar na plataforma */
const vt=QS.get("vt")||"";let VCOD="";
if(!VIDRA&&vt.length>=20){
 const KVT="o3vt_"+tok,ok=async c=>{try{const r=await sbp.rpc("obra3d_teste_entrar",{link:tok,vt,cod:c});return !r.error&&r.data===true}catch(_){return false}};
 const salvo=lsg(KVT);if(salvo&&await ok(salvo))VCOD=salvo;else{lss(KVT,null);
  const cor=D.marcaCor||"#0d5c63";
  VCOD=await new Promise(res=>{$("main").innerHTML=`<div class="msg" style="max-width:420px;margin:40px auto;text-align:left">
   <div style="font:700 13px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:${esc(cor)}">Teste da vidraçaria</div>
   <h2 style="margin:6px 0 8px;font:700 22px 'Space Grotesk',sans-serif">${esc(D.obra||"Obra em 3D")}</h2>
   <p style="margin:0 0 14px;color:#5d6e73;font-size:14px">Digite o código de 6 números que a FC enviou junto com este link.</p>
   <input id="vc" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="width:100%;box-sizing:border-box;font:600 22px Inter,sans-serif;letter-spacing:.3em;text-align:center;padding:12px;border:1px solid #c9d6d8;border-radius:10px">
   <button id="vb" class="btn" type="button" style="width:100%;margin-top:12px;background:${esc(cor)};color:#fff;border-color:${esc(cor)};min-height:48px;font-size:15px">Entrar no teste</button>
   <p id="ve" role="status" style="color:#b3261e;font-size:13px;margin:10px 0 0"></p>
   <p style="color:#5d6e73;font-size:12px;margin:14px 0 0">Sem o código, abra o link do cliente normalmente (sem troca de cor).</p></div>`;
   const go=async()=>{const c=$("vc").value.replace(/\D/g,"");if(c.length!==6){$("ve").textContent="O código tem 6 números.";return}
    $("vb").disabled=true;$("ve").textContent="";if(await ok(c)){lss(KVT,c);res(c)}else{$("vb").disabled=false;$("ve").textContent="Código não confere ou o teste foi encerrado. Confira com a FC."}};
   $("vb").onclick=go;$("vc").onkeydown=e=>{if(e.key==="Enter")go()};$("vc").focus()});
  $("main").innerHTML=""}
 VIDRA=true}
/* 05/11/2026 · "Abrir" pelo painel da FC (fc=1): apresentação completa, com troca de cor para demonstrar.
   Só vale para quem está logado no painel e enxerga este link; o link enviado ao cliente continua sem troca de cor. */
let FCMODO=false;
if(!VIDRA&&QS.get("fc")==="1"){try{const sbf=window.supabase.createClient("https://cpkjphodruyxfouirhpd.supabase.co","sb_publishable_d0HEeWsaqOeZIQKGftlF-Q_B8BUOWWg",{auth:{persistSession:true,storageKey:"trein-fc-auth",autoRefreshToken:false,detectSessionInUrl:false}});
 const se=await sbf.auth.getSession();if(se.data&&se.data.session){const r=await sbf.from("orcobra_links").select("token").eq("token",tok).maybeSingle();FCMODO=!r.error&&!!r.data}}catch(_){}}
async function salvarCor(cores){if(!confirm("Salvar estas cores? O link do cliente passa a mostrar a obra nessas cores (os valores não mudam)."))return false;
 const r=VCOD?await sbp.rpc("obra3d_teste_cor_salvar",{link:tok,vt,cod:VCOD,cores}):await sbp.rpc("obra3d_cor_salvar",{link:tok,vid,cores});if(r.error){alert("Não foi possível salvar. Tente de novo.");return false}return true}
if(FCMODO){const dc=document.querySelector(".bar .dica");if(dc)dc.innerHTML="<b>Apresentação completa (FC)</b> · a troca de cor aparece só aqui, para demonstrar. O link enviado ao cliente não tem esta opção."}
if(VIDRA){const dc=document.querySelector(".bar .dica");if(dc)dc.innerHTML="<b>Modo vidraçaria</b> · a troca de cor aparece só para você. O link que você envia ao cliente não tem esta opção."}
if(!window.PROPOSTA){erro("Não foi possível carregar","Verifique a internet e abra o link de novo.");return}
/* link aberto (antigo): sem preço. Proposta protegida: com preço, só para quem tem o código (ou a própria empresa) */
if(Array.isArray(D.precos)&&D.precos.some(v=>+v>0)){
 PROPOSTA.render($("main"),D,{precos:D.precos,total:D.precos.reduce((a,b)=>a+(+b||0),0),rotulo:"Proposta comercial",simular:VIDRA||FCMODO,onSalvar:VIDRA?salvarCor:null});
 const quem=ACESSO?ACESSO.nome:EMPRESA?"Visualização da empresa":"";
 if(quem){const w=document.createElement("div");w.setAttribute("aria-hidden","true");const txt=(ACESSO?"Proposta exclusiva para ":"")+quem+" · "+new Date().toLocaleDateString("pt-BR");
  w.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.09;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact";
  w.innerHTML=`<div style="position:absolute;inset:-50%;transform:rotate(-24deg);display:flex;flex-wrap:wrap;gap:60px 80px;align-content:center;justify-content:center;font:700 22px Inter,sans-serif;color:#0d1f24">${(`<span>${esc(txt)}</span>`).repeat(80)}</div>`;document.body.appendChild(w);
  if(ACESSO)document.querySelector(".bar .dica").insertAdjacentHTML("beforeend",` · Acesso de <b>${esc(ACESSO.nome)}</b> até ${new Date(ACESSO.valido_ate).toLocaleDateString("pt-BR")}`)}
}else PROPOSTA.render($("main"),D,{simular:VIDRA||FCMODO,onSalvar:VIDRA?salvarCor:null});
const b=$("b-print");b.hidden=false;b.onclick=()=>{PROPOSTA.preencher($("main"),D,true);setTimeout(()=>print(),80)};
})();
</script>
</body>
</html>
