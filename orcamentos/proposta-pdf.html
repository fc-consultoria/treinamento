<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Proposta comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* PDF da proposta com preço, aberto pelo link de envio da vidraçaria. © FC Consultoria em Esquadria */
:root{--bg:#e9eef0;--fg:#14232a;--muted:#5d6e73;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1020px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.dica{color:var(--muted);font-size:13px;margin:0}
.btn{font:600 13px "Inter",system-ui,sans-serif;border:1px solid #c9d4d6;background:#fff;color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn:focus-visible{outline:3px solid #c9831a;outline-offset:2px}
.msg{background:#fff;border-radius:16px;padding:32px 22px;text-align:center;color:var(--muted)}.msg b{display:block;color:var(--fg);font:700 18px "Space Grotesk",system-ui,sans-serif;margin-bottom:6px}
@media print{.bar{display:none!important}.wrap{padding:0;max-width:none}body{background:#fff}}
</style>
</head>
<body>
<main class="wrap"><div class="bar"><p class="dica">Proposta com os valores do orçamento. Para guardar, escolha <b>Salvar como PDF</b> na impressão.</p><button class="btn" type="button" id="b-print" hidden>🖨 Imprimir / Salvar PDF</button></div>
<div id="main"><div class="msg">Carregando a proposta…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="tip3d.js?v=20261105c"></script>
<script src="proposta.js?v=20261105c"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
"use strict";
const $=id=>document.getElementById(id);
const erro=(t,d)=>{$("main").innerHTML=`<div class="msg"><b>${t}</b>${d}</div>`};
const q=new URLSearchParams(location.search),tok=q.get("t")||"",pid=q.get("p")||"";
if(tok.length<20||!pid){erro("Link incompleto","Abra a proposta pelo seu link de envio.");return}
let P;try{const sb=window.supabase.createClient("https://cpkjphodruyxfouirhpd.supabase.co","sb_publishable_d0HEeWsaqOeZIQKGftlF-Q_B8BUOWWg",{auth:{persistSession:false}});
 const r=await sb.rpc("obra3d_envio_proj",{tok,pid});if(r.error)throw r.error;P=r.data}catch(e){erro("Não foi possível abrir","Verifique a internet e tente de novo.");return}
if(!P||!Array.isArray(P.itens)){erro("Proposta não encontrada","Este orçamento não está mais disponível neste link.");return}
if(!window.PROPOSTA){erro("O modelo da proposta não carregou","Verifique a internet e atualize a página.");return}
/* mesmos dados e preços do "Imprimir com preço" do painel */
const t3=it=>{const o={item:it.item,tipo:it.tipo,loc:it.loc,kind:it.kind,f:it.f,enc:it.enc,L:it.L,H:it.H,q:it.q,linha:it.linha,desc:(it.vidro||"")+(it.obs?" · "+it.obs:"")};if(it.cortes)o.cortes=it.cortes;return o};
const D={marca:P.empresa,marcaCor:P.cor,numero:P.numero,obra:P.obra,cliente:P.cliente,cor:P.corPerfil,emitida:P.emitida||P.criado,itens:P.itens.map(t3)};
if(P.logo)D.logo=P.logo;if(P.editavel&&typeof P.rodape==="string")D.rodape=P.rodape;
const fat=1+(+P.margem||0)/100,pr=P.itens.map(t=>Math.round((+t.pv||0)*fat*100)/100),tot=pr.reduce((a,b)=>a+b,0);
document.title="Proposta "+(P.numero||"")+" · "+(P.obra||"");
if(tot>0)PROPOSTA.render($("main"),D,{precos:pr,total:tot,rotulo:"Proposta comercial"});else PROPOSTA.render($("main"),D,{});
const b=$("b-print");b.hidden=false;const imp=()=>{PROPOSTA.preencher($("main"),D,true);setTimeout(()=>print(),80)};b.onclick=imp;
if(q.get("imprimir")==="1")setTimeout(imp,600);
})();
</script>
</body>
</html>
