<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Obra em 3D</title>
<meta name="theme-color" content="#0d4a48"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Obra em 3D · serviço por projeto da FC: a vidraçaria manda o PDF do orçamento, a FC confere, gera o 3D
   e entrega o link sem preço com a marca da vidraçaria. Só a Matriz. © FC Consultoria em Esquadria */
:root{
 --bg:#f3f6f6;--surface:#fff;--surface2:#e8eeee;--line:#d3dddd;--fg:#16262a;--muted:#5b6d70;
 --teal:#0d5c63;--teal-ink:#fff;--teal-soft:#d6ebec;--amber:#c9831a;--amber-soft:#fbefd9;--ok:#1f7a4a;--warn:#a45a00;--bad:#b3261e;
 --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1719;--surface:#162226;--surface2:#1d2c30;--line:#2c3f44;--fg:#e3eced;--muted:#93a6a9;--teal:#2a8b93;--teal-soft:#183a3e;
 --amber:#e7a33e;--amber-soft:#3a2c14;--ok:#52b783;--warn:#e3a14a;--bad:#ef7a72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1719;--surface:#162226;--surface2:#1d2c30;--line:#2c3f44;--fg:#e3eced;--muted:#93a6a9;--teal:#2a8b93;--teal-soft:#183a3e;
 --amber:#e7a33e;--amber-soft:#3a2c14;--ok:#52b783;--warn:#e3a14a;--bad:#ef7a72;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--teal);color:var(--teal-ink);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:16px 14px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
header.top h1{font-size:24px}
.meta{font-size:13px;opacity:.88;max-width:620px}
.tomatriz{display:inline-block;font:600 13px var(--body);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 10px;text-decoration:none;margin-bottom:8px;cursor:pointer}
main{padding:18px 0 40px}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:40px;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.amb{background:var(--amber);border-color:var(--amber);color:#1d1405}
.btn.dan{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.hint{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* início */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px}.kpi span{display:block;font-size:12px;color:var(--muted)}.kpi b{font:700 22px var(--display)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.sec{padding:14px 16px}.sec h2{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;cursor:pointer;background:var(--surface);margin-bottom:14px}
.drop.on{border-color:var(--teal);background:var(--teal-soft)}
.drop b{font:700 17px var(--display);display:block;margin-bottom:4px}
.lst{display:flex;flex-direction:column;gap:8px}
.pj{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.pj:hover{border-color:var(--teal)}
.pjw{display:flex;gap:8px;align-items:stretch}.pjw .pj{flex:1;min-width:0}.pjdel{flex:none;color:var(--bad);white-space:nowrap}
.pj i{width:8px;align-self:stretch;border-radius:4px}
.pj b{font:600 14.5px var(--display);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj small{color:var(--muted);font-size:12.5px}
.pj .r{text-align:right;font-size:13px;white-space:nowrap}
.st{display:inline-block;font:600 11.5px var(--body);border-radius:999px;padding:2px 9px;border:1px solid currentColor}
table.cli{width:100%;border-collapse:collapse;font-size:13px}
table.cli th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
table.cli td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.cli td.n,table.cli th.n{text-align:right}
/* projeto */
.ptop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;padding:14px 16px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{font:500 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
.f .lk{font:500 14px var(--body);color:var(--fg);padding:8px 0;min-height:38px;display:flex;gap:6px;align-items:center}
.sws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.sws input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{font:600 14px var(--body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.prog{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;flex:1;min-width:120px}.prog i{display:block;height:100%;background:var(--ok)}
.aviso{background:var(--amber-soft);border:1px solid #e9c27a;color:var(--fg);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
/* conferência */
.it{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(220px,280px);gap:14px;padding:12px;margin-bottom:10px}
.it.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.thumb{position:relative;border-radius:10px;background:linear-gradient(180deg,#e4eaec,#cbd5d8);display:grid;place-items:center;height:132px;overflow:hidden;border:0;padding:6px;cursor:pointer;width:100%}
.thumb img{max-width:100%;max-height:120px;display:block}
.thumb .ld{font-size:12px;color:#5b6d70}
.thumb .v3{position:absolute;left:6px;bottom:6px;font:600 11px var(--body);background:#fff;color:#16262a;border-radius:999px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.orig h3{font-size:15px;line-height:1.3;margin:2px 0 8px}
.orig .badge{font:600 11.5px var(--body);color:var(--muted)}
.dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;font-size:13px}
.dl div span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.dl div.w2{grid-column:span 2}
.lock{font-size:11px;color:var(--muted);margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 11.5px var(--body);border-radius:999px;padding:3px 9px;background:var(--amber-soft);color:var(--warn);border:1px solid #e9c27a}
.des{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line);padding-left:14px}
.des h4{margin:0;font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.des .alt{font:600 11.5px var(--body);color:var(--amber)}
.ckb{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;cursor:pointer;margin-top:auto;padding-top:4px}
.ckb input{width:20px;height:20px;accent-color:var(--ok)}
.lnk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;margin-bottom:14px}
.lnk input{flex:1;min-width:220px;font:500 13px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg)}
.ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px;padding:16px}
.ctl .w3{grid-column:1/-1}
.tag{font:600 11px var(--body);border-radius:999px;padding:2px 8px;background:var(--teal-soft);color:var(--teal);margin-left:6px;vertical-align:middle}
.ed{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px}
.ed .w2{grid-column:span 2}.ed .w3{grid-column:span 3}.ed .w6{grid-column:1/-1}
.ed .f input{min-height:36px;padding:7px 9px;font-size:13.5px}
.pre{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:flex-end;padding:12px 14px;margin-bottom:14px}
.pre .tt{flex-basis:100%;font:700 14px var(--display)}
.pre .vl{font-size:12px;color:var(--muted);font-weight:600}.pre .vl b{display:block;font:700 18px var(--display);color:var(--fg)}
.pre .f input{width:110px}
.logo{display:flex;gap:8px;align-items:center}.logo img{max-height:38px;max-width:120px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px}
.msg{background:var(--surface);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.wm-app{text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:18px 0 4px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16262a;color:#fff;font:600 13px var(--body);padding:9px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9000;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:900px){.ed{grid-template-columns:repeat(2,minmax(0,1fr))}.ed .w2,.ed .w3{grid-column:1/-1}.cols{grid-template-columns:1fr}.ptop{grid-template-columns:repeat(2,minmax(0,1fr))}.it{grid-template-columns:120px minmax(0,1fr)}.des{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}.ctl{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ptop{grid-template-columns:1fr}.it{grid-template-columns:1fr}.thumb{height:160px}.thumb img{max-height:148px}.dl{grid-template-columns:repeat(2,minmax(0,1fr))}.ctl{grid-template-columns:1fr}.pj{grid-template-columns:8px minmax(0,1fr)}.pj .r{grid-column:2;text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.soimp{display:none}.barra-ed{position:sticky;top:0;z-index:4;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding:12px 14px;margin-bottom:14px;border-left:4px solid var(--teal,#0d5c63)}.barra-ed .vl{font-size:12px;color:var(--muted);font-weight:600}.barra-ed .vl b{display:block;font:700 17px var(--display);color:var(--fg)}.barra-ed .bt{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
@media print{.soimp{display:block!important}header.top,.tabs,.ptop,.lnk,.noprint,.wm-app,#toast{display:none!important}body{background:#fff}main{padding:0}.wrap{max-width:none;padding:0}}
</style>
<style>.rgate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#e9f0f0;padding:16px;font-family:system-ui,sans-serif}.rgate[hidden]{display:none}.rgate form{width:min(360px,100%);background:#fff;border:1px solid #d6e1e1;border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}.rgate h1{margin:0;font:700 24px system-ui;color:#13262a}.rgate small{color:#5a6e72;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.rgate label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px;color:#13262a}.rgate input{font:15px system-ui;padding:9px 10px;border:1px solid #c4ccd2;border-radius:8px}.rgate button{background:#0d5c63;color:#fff;border:0;border-radius:9px;padding:11px;font:700 15px system-ui;cursor:pointer}.rgate p{margin:0;color:#b42318;font-size:14px}</style>
</head>
<body>
<div class="rgate" id="gate" hidden><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>Obra em 3D</h1>

<label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>
<header class="top"><div class="wrap" id="hdr"></div></header>
<main><div class="wrap" id="main"><div class="msg">Carregando…</div></div>
<div class="wm-app">FC Consultoria em Esquadria · uso exclusivo · © FC Consultoria em Esquadria</div></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
/* ======================= Obra em 3D ======================= */
function iniciarObra3D(BD){(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dt=v=>v?new Date(v).toLocaleDateString("pt-BR"):"—";
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)};
const STATUS=[["recebido","Recebido","#a3620b"],["conferencia","Em conferência","#1f6fb2"],["entregue","Link entregue","#0d6b68"],["pago","Pago","#1f7a4a"]];
let AVAL={},AVAL_OK=false;/* avaliação da empresa contratante (Plataforma FC 3D · Simulado de Obra 3D) */
document.addEventListener("click",async e=>{const b=e.target.closest&&e.target.closest("#av-ok");if(!b||!P||!BD.liberarAval)return;b.disabled=true;b.textContent="Liberando…";
 const r=await BD.liberarAval(P.id);if(r&&r.error){b.disabled=false;b.textContent="Ajuste feito · liberar nova avaliação";toast("Não foi possível liberar");return}
 delete AVAL[P.id];toast("Liberado de novo para a empresa avaliar");abrir(P.id)});
const stOf=k=>STATUS.find(s=>s[0]===k)||STATUS[0];
const KINDS=[["giro","Porta de giro"],["correr","Correr"],["correr4","Correr 4 folhas (2 fixas + 2 móveis)"],["seq","Correr sequencial (todas recolhem para um lado)"],["atlanta","Fachada pele de vidro (Atlanta)"],["max","Maxim-ar"],["maxp","Maxim-ar com peitoril fixo"],["fixo","Fixo (vidro com vidro)"],["painel","Painel fixo temperado com perfil"],["piv","Pivotante com fixo"],["gen","Outro"]];
const ENCS=[["vidro","Vidro"],["lambri","Lambri"],["vidlam","Vidro em cima + lambri embaixo"],["veneziana","Veneziana"]];
const CORES=["#1d5fa8","#0d5c63","#1f7a4a","#b3261e","#c9831a","#6d4bd8","#13232e","#8a4b2a"];
/* 05/11/2026 · modo Orçamentos de obra (Simulador de Obra 3D): só os projetos criados ali, com os dois PDFs, sem cobrança nem links de envio */
const ORC=!!BD.orc;
let LIST=ORC?BD.projetos.filter(p=>p&&p.origem==="orc"):BD.projetos.slice(),P=null,TAB="conf",VISTAS={},LINKS=null;

/* ---------- salvar (debounce; o Supabase é a fonte) ---------- */
let pend=new Set(),tm=null;
function touch(p){p.atualizado=new Date().toISOString();pend.add(p.id);clearTimeout(tm);tm=setTimeout(enviar,800)}
async function enviar(){const ids=[...pend];pend.clear();if(!ids.length)return true;
 const rows=ids.map(id=>LIST.find(p=>p.id===id)).filter(Boolean).map(p=>({id:p.id,dados:p,atualizado:p.atualizado}));
 const r=await BD.salvar(rows);if(r&&r.error){ids.forEach(i=>pend.add(i));toast("Não salvou · tentando de novo");clearTimeout(tm);tm=setTimeout(enviar,6000);return false}return true}
addEventListener("beforeunload",e=>{if(pend.size){e.preventDefault();e.returnValue=""}});

/* ---------- dados para a apresentação (nunca leva preço) ---------- */
function t3(it){const o={item:it.item,tipo:it.tipo,loc:it.loc,kind:it.kind,f:it.f,enc:it.enc,per:it.per||"",lado:it.lado||"",fy:it.fy||"",L:it.L,H:it.H,q:it.q,linha:it.linha,desc:it.vidro+(it.obs?" · "+it.obs:"")};if(it.cortes)o.cortes=it.cortes;if(it.corPerfil)o.corPerfil=it.corPerfil;if(it.vidroCor)o.vidroCor=it.vidroCor;return o}
function doc(p){const d={marca:p.empresa,marcaCor:p.cor,numero:p.numero,obra:p.obra,cliente:p.cliente,cor:p.corPerfil,emitida:p.emitida||p.criado,itens:p.itens.map(t3)};
 if(p.logo)d.logo=p.logo;if(p.editavel&&typeof p.rodape==="string")d.rodape=p.rodape;if(p.corAlterada)d.corAlterada=true;return d}
/* preços: só para o PDF impresso (valor do item no PDF + margem em lote); o link nunca recebe isto */
const fat=p=>1+(+p.margem||0)/100;
const precos=p=>p.itens.map(t=>Math.round((+t.pv||0)*fat(p)*100)/100);
const somaPdf=p=>p.itens.reduce((s,t)=>s+(+t.pv||0),0);
const novoId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- cabeçalho ---------- */
function hdr(sub){$("hdr").innerHTML=`<div>${P?`<button class="tomatriz" type="button" id="h-back">← Projetos</button>`:ORC?`<a class="tomatriz" href="index.html">← Orçamentos de obra</a>`:`<a class="tomatriz" href="../painel.html">← Painel da Matriz</a>`}
 <div class="eyebrow">FC Consultoria em Esquadria · ${ORC?"Orçamentos de obra · Simulador de Obra 3D":"serviço por projeto"}</div><h1>${P?esc(P.obra||"Projeto"):ORC?"Simulador de Obra 3D":"Obra em 3D"}</h1>
 <div class="meta">${sub}</div></div>`;if($("h-back"))$("h-back").onclick=()=>{location.hash="";}}

/* ======================= INÍCIO ======================= */
function home(){P=null;if(ORC)return homeOrc();if(BD.avaliacoes&&!AVAL_OK){AVAL_OK=true;BD.avaliacoes().then(r=>{if(r){AVAL={};r.forEach(a=>AVAL[a.pid]=a);if(!P)home()}})}hdr("A vidraçaria manda o PDF do orçamento; a FC confere, monta a obra em 3D e entrega um link sem preço com a marca dela.");
 const tot={n:LIST.length,ent:0,fat:0,rec:0};const cli={};
 LIST.forEach(p=>{const v=+p.valor||0,e=p.status==="entregue"||p.status==="pago";if(e)tot.ent++;if(p.status==="pago")tot.fat+=v;else tot.rec+=v;
  const c=cli[p.empresa||"—"]||(cli[p.empresa||"—"]={n:0,ent:0,fat:0,rec:0,cor:p.cor});c.n++;if(e)c.ent++;if(p.status==="pago")c.fat+=v;else c.rec+=v});
 const ord=LIST.slice().sort((a,b)=>String(b.criado).localeCompare(String(a.criado)));
 $("main").innerHTML=`

 $("c-not").oninput=e=>{P.notas=e.target.value;touch(P)};
 $("c-del").onclick=async()=>{if(!confirm(`Excluir o projeto "${P.obra}"? O link do cliente também será desativado.`))return;
  if(P.link&&P.link.ativo!==false&&BD.linkOff)await BD.linkOff(P.link.tok);const r=await BD.excluir(P.id);if(r&&r.error){toast("Não foi possível excluir");return}
  LIST=LIST.filter(p=>p!==P);pend.delete(P.id);location.hash=""};
}

/* ---------- navegação ---------- */
function rota(){const h=location.hash.replace("#","");if(h.startsWith("p-")){if(!P||P.id!==h.slice(2))TAB="conf";abrir(h.slice(2))}else home();scrollTo(0,0)}
addEventListener("hashchange",rota);rota();
})();}
</script>

<script>
gateUI(async rr=>{
/* 05/11/2026 · biblioteca de perfis (Obra em 3D): desenho conferido vem do banco; perfil novo entra sozinho */
window.O3DBIB={buscar:async c=>{const r=await sb.rpc("obra3d_perfis_buscar",{cods:[...new Set(c.filter(Boolean).map(x=>String(x).toUpperCase().trim()))]});return r.error?[]:r.data},salvar:async L=>{await sb.rpc("obra3d_perfis_novos",{tok:"",itens:L})}};
 const ORC=new URLSearchParams(location.search).get("de")==="orc"||(rr&&rr.perfil&&rr.perfil.papel==="orcamentista");
 const r=await sb.from("obra3d_projetos").select("dados");
 if(r.error){document.getElementById("main").innerHTML='<div class="msg"><b>Não foi possível carregar os projetos.</b><br>Confira a internet e atualize a página (F5).</div>';return}
 iniciarObra3D({orc:ORC,
  projetos:(r.data||[]).map(x=>x.dados),
  salvar:rows=>sb.from("obra3d_projetos").upsert(rows),
  excluir:id=>sb.from("obra3d_projetos").delete().eq("id",id),
  link:(token,obra_id,dados)=>sb.from("orcobra_links").upsert({token,obra_id,dados,ativo:true,atualizado:new Date().toISOString()}),
  linkOff:token=>sb.from("orcobra_links").update({ativo:false}).eq("token",token),
  links:async()=>{const q=await sb.from("obra3d_envio_links").select("token,empresa,cor,ativo,pausado,envios,ultimo,criado,plano,limite,validade").order("criado",{ascending:false});return q.error?null:q.data},
  criarLink:row=>sb.from("obra3d_envio_links").insert(row),
  avaliacoes:async()=>{const q=await sb.from("obra3d_avaliacoes").select("pid,ok,nota,em");return q.error?null:q.data},
  liberarAval:pid=>sb.from("obra3d_avaliacoes").delete().eq("pid",pid),
  ajustarLink:(token,campos)=>sb.from("obra3d_envio_links").update(campos).eq("token",token),
  linkEnvioOff:token=>sb.from("obra3d_envio_links").update({ativo:false}).eq("token",token),
  linkEnvioDel:token=>sb.from("obra3d_envio_links").delete().eq("token",token).eq("envios",0),
  recarregar:async()=>{const q=await sb.from("obra3d_projetos").select("dados");return q.error?null:q.data.map(x=>x.dados)},
  cobLista:async()=>{const q=await sb.rpc("obra3d_cob_lista",{chave:""});return q.error?null:q.data},
  cobComp:async id=>{const q=await sb.rpc("obra3d_cob_comprovante",{chave:"",id});return q.error?null:q.data},
  cobConf:(id,ok,nota)=>sb.rpc("obra3d_cob_conferir",{chave:"",id,ok,nota}),
  cadLib:tok=>sb.rpc("obra3d_cad_liberar",{chave:"",tok}),
  vistas:async toks=>{const q=await sb.from("orcobra_links").select("token,vistas,ultima_vista").in("token",toks);return q.error?null:q.data}
 });
},{soMatriz:true,permitir:['orcamentista']});
</script>
