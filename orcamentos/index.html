<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Orçamentos de Obra · Painel da Matriz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: tela inicial com cards de obra + card "Novo orçamento"; dentro da obra, abas com tabela à esquerda e formação de preço à direita */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --surface2:#e8eeee; --line:#d3dddd;
  --fg:#16262a; --muted:#5b6d70; --teal:#0d5c63; --teal-ink:#ffffff; --teal-soft:#d6ebec;
  --amber:#c9831a; --amber-soft:#fbefd9; --ok:#1f7a4a; --warn:#a45a00; --bad:#b3261e;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162226; --surface2:#1d2c30; --line:#2c3f44;
  --fg:#e3eced; --muted:#93a6a9; --teal:#2a8b93; --teal-ink:#ffffff; --teal-soft:#183a3e;
  --amber:#e7a33e; --amber-soft:#3a2c14; --ok:#52b783; --warn:#e3a14a; --bad:#ef7a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162226; --surface2:#1d2c30; --line:#2c3f44;
  --fg:#e3eced; --muted:#93a6a9; --teal:#2a8b93; --teal-ink:#ffffff; --teal-soft:#183a3e;
  --amber:#e7a33e; --amber-soft:#3a2c14; --ok:#52b783; --warn:#e3a14a; --bad:#ef7a72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--teal);color:var(--teal-ink)}
header.top .wrap{padding-block:18px 14px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
header.top h1{font-size:24px;font-weight:700}
.meta{font-size:13px;opacity:.88}
.back{font:600 13px var(--body);color:var(--teal-ink);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 10px;cursor:pointer;margin-bottom:8px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 14px;min-width:150px}
.kpi b{display:block;font-family:var(--display);font-size:19px}
.kpi.sale{background:var(--amber);border-color:var(--amber);color:#1b1205}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{font:600 14px var(--body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--amber)}
nav.tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
main .wrap{padding-block:20px 40px}
.panel-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:900px){.panel-grid{grid-template-columns:minmax(0,1fr)}}
.panel-grid>*,.stack>*{min-width:0}
#comp-body td:nth-child(4){min-width:280px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px}
.card-b{padding:14px 16px}
.hint{color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.group td{background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:12px;letter-spacing:.03em}
:root:not([data-theme="light"]) tr.group td{color:var(--fg)}
tr.off td{opacity:.55}tr.off td.code{text-decoration:line-through}
input.chk{width:18px;height:18px;accent-color:var(--teal);cursor:pointer}
tr.nop td.price input{border-color:var(--amber);background:var(--amber-soft)}
td.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:nowrap}
input.in,select.in,textarea.in{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
input.money{width:110px;text-align:right}
input.pct{width:80px;text-align:right}
input.big{width:100%;font-size:16px;text-align:right;padding:9px 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{font:500 13px var(--body);background:var(--surface);color:var(--muted);border:0;padding:6px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.btn{font:600 13px var(--body);border:1px solid var(--teal);background:var(--teal);color:var(--teal-ink);border-radius:7px;padding:8px 13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.seg button:focus-visible,.back:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.price-panel{position:sticky;top:64px}
.pp-h{background:var(--teal);color:var(--teal-ink);border-radius:10px 10px 0 0;padding:12px 16px}
.pp-h h3{font-size:15px}
.pp-b{padding:14px 16px;display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row label{color:var(--muted);font-size:13px}
.cost{font-family:var(--display);font-size:20px;font-weight:600}
.formula{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:6px;padding:8px 10px}
.sale-box{background:var(--amber-soft);border:1px solid var(--amber);border-radius:8px;padding:12px}
.sale-box .v{font-family:var(--display);font-size:24px;font-weight:700;color:var(--fg)}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted)}
.chip.warn{background:var(--amber-soft);color:var(--warn)}
.chip.ok{background:var(--teal-soft);color:var(--teal)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface2);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.stack{display:grid;gap:20px}
.sum-table td,.sum-table th{padding:10px 12px}
.sum-table tfoot td{font-weight:700;font-family:var(--display);font-size:15px;background:var(--surface2)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fields label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
/* tela inicial */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.ocard .n{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--teal);font-weight:600}
.ocard h3{font-size:17px;line-height:1.25}
.ocard .cl{font-size:12.5px;color:var(--muted)}
.ocard .chips{display:flex;flex-wrap:wrap;gap:6px}
.ocard .vals{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.ocard .vals span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ocard .vals b{font-family:var(--display);font-size:16px}
.ocard .vals .sale b{color:var(--amber)}
.ocard .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.newcard{border:2px dashed var(--teal);background:var(--teal-soft);border-radius:12px;padding:18px;cursor:pointer;display:grid;gap:8px;align-content:center;justify-items:start;min-height:200px;text-align:left;font:inherit;color:var(--fg)}
.newcard .plus{font-family:var(--display);font-size:34px;line-height:1;color:var(--teal);font-weight:700}
.newcard h3{font-size:18px;color:var(--teal)}
.newcard:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer;background:var(--surface2)}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px}
.slot b{font-family:var(--display)}
.slot.done{border-color:var(--teal);background:var(--teal-soft)}
.slot .st{font-size:12.5px;color:var(--muted)}
/* banco e fotos */
.thumb{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--surface2) center/contain no-repeat;display:inline-grid;place-items:center;cursor:pointer;font-size:10px;color:var(--muted);padding:0;vertical-align:middle}
.thumb.big{width:64px;height:64px}
.thumb:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hseg{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.hseg button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 16px;cursor:pointer}
.hseg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,22,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border-radius:12px;width:min(980px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal .mb{overflow:auto;padding:14px 16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pitem{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff;text-align:left;padding:0;font:inherit;color:#16262a}
.pitem img{display:block;width:100%;height:130px;object-fit:contain;background:#fff}
.pitem div{padding:6px 8px;font-size:12px;border-top:1px solid #e3e9e9}
.pitem.sel{outline:3px solid var(--amber)}
/* apresentação */
.pres{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:960px;margin:0 auto;overflow:hidden}
.pres-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;padding:22px 24px;border-bottom:3px solid var(--amber)}
.brand{font-family:var(--display);font-weight:700;color:var(--teal);font-size:20px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.pres-h .doc{text-align:right}
.pres-h .doc h2{font-size:22px}
.pres-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 20px;padding:14px 24px;background:var(--surface2);font-size:13px}
.pres-info span{color:var(--muted)}
.loc{padding:14px 24px 4px;font-family:var(--display);font-weight:600;color:var(--teal);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.tip{display:grid;grid-template-columns:170px minmax(0,1fr) 170px;gap:16px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line)}
.tip svg{width:100%;height:auto;max-height:120px}
.tip .t-name{font-family:var(--display);font-weight:600;font-size:15px}
.tip .t-desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.tip .t-dims{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin-top:6px}
.tip .t-price{text-align:right}
.tip .t-price .u{font-size:12px;color:var(--muted)}
.tip .t-price .tot{font-family:var(--display);font-weight:700;font-size:17px}
@media (max-width:640px){.tip{grid-template-columns:110px minmax(0,1fr)}.tip .t-price{grid-column:1/-1;text-align:left;display:flex;gap:14px;align-items:baseline}}
.pres-total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:20px 24px;background:var(--teal);color:var(--teal-ink)}
.pres-total b{font-family:var(--display);font-size:26px}
.pres-foot{padding:16px 24px 22px;display:grid;gap:8px;font-size:12.5px;color:var(--muted)}
.pres-foot .wm{font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding-top:10px;border-top:1px solid var(--line)}
svg .fr{fill:none;stroke:var(--fg);stroke-width:1.6}
svg .pn{fill:var(--teal-soft);stroke:var(--fg);stroke-width:1}
svg .sym{fill:none;stroke:var(--muted);stroke-width:.9}
svg text{fill:var(--muted);font:600 8px var(--body)}
.wm-app{text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:18px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>.rgate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#e9f0f0;padding:16px;font-family:system-ui,sans-serif}.rgate[hidden]{display:none}.rgate form{width:min(360px,100%);background:#fff;border:1px solid #d6e1e1;border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}.rgate h1{margin:0;font:700 24px system-ui;color:#13262a}.rgate small{color:#5a6e72;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.rgate label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px;color:#13262a}.rgate input{font:15px system-ui;padding:9px 10px;border:1px solid #c4ccd2;border-radius:8px}.rgate button{background:#0d5c63;color:#fff;border:0;border-radius:9px;padding:11px;font:700 15px system-ui;cursor:pointer}.rgate p{margin:0;color:#b42318;font-size:14px}
.tomatriz{display:inline-block;font:600 13px var(--body);color:var(--teal-ink);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:4px 10px;text-decoration:none;margin-bottom:8px}</style>

<body>
<div class="rgate" id="gate"><form id="gateForm"><small>FC Consultoria · Matriz</small><h1>Orçamentos de obra</h1>
<label>Login<input name="login" autocomplete="username" required placeholder="matriz"></label>
<label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
<button type="submit">Entrar</button><p id="gateMsg" role="alert"></p></form></div>
<header class="top"><div class="wrap" id="hdr"></div></header>
<nav class="tabs" id="tabs" aria-label="Painéis do orçamento" hidden>
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="comp" aria-selected="true">Componentes</button>
    <button role="tab" data-tab="alu" aria-selected="false">Alumínio</button>
    <button role="tab" data-tab="vid" aria-selected="false">Vidros</button>

  </div>
</nav>
<main><div class="wrap">
  <section id="view-home"></section>
  <section id="view-obra" hidden></section>
  <div class="wm-app">FC Consultoria em Esquadria · uso exclusivo · © FC Consultoria em Esquadria</div>
</div></main>

<script>
function iniciarOrcamentos(){(function(){
// ===== PARSER SmartCEM (texto do pdf.js) =====
function pRows(page){
 const its=page.filter(i=>i.s&&i.s.trim()).map(i=>({x:i.x,y:i.y,s:i.s.trim()})).sort((a,b)=>b.y-a.y||a.x-b.x);
 const rows=[];its.forEach(it=>{const r=rows.find(r=>Math.abs(r.y-it.y)<=2.6);if(r)r.it.push(it);else rows.push({y:it.y,it:[it]})});
 rows.forEach(r=>r.it.sort((a,b)=>a.x-b.x));rows.sort((a,b)=>b.y-a.y);return rows;
}
const pNum=s=>{const x=parseFloat(String(s).replace(/\./g,"").replace(",","."));return isFinite(x)?x:0};
const FOOT=/TEXA ALUMINIO|SmartCEM|^Aten[cç][aã]o|^\d+\s*\/\s*\d+$|Alumisoft/i;
function pDetect(pages){const t=pages[0].map(i=>i.s).join(" ");
 if(/Componentes da Obra/i.test(t))return "comp";
 if(/Rela[cç][aã]o de Materiais/i.test(t))return "perfis";
 if(/Proposta/i.test(t)&&/Item:/i.test(pages.map(p=>p.map(i=>i.s).join(" ")).join(" ")))return "croqui";
 return null}
function pHeader(pages){
 const rows=pRows(pages[0]);const h={numero:"",obra:"",cliente:"",cor:"",data:""};
 const all=pages[0].map(i=>i.s).join(" ");
 const m=all.match(/\b[A-Z0-9]{1,6}_\d{2}\/\d{2}_\d{2,4}_\d{2}\b/);if(m)h.numero=m[0];
 rows.forEach(r=>r.it.forEach((it,k)=>{const nx=r.it[k+1]?r.it[k+1].s:"";
  if(/^Obra:?$/i.test(it.s)&&!h.obra)h.obra=nx.replace(/^:\s*/,"");
  if(/^Cliente:?$/i.test(it.s)&&!h.cliente)h.cliente=nx;
  if(/Cor predominante:?$/i.test(it.s)&&!h.cor)h.cor=/Perf/i.test(nx)?(r.it[k+2]?r.it[k+2].s:""):nx;
  if(/^Data do c[aá]lculo:?$/i.test(it.s)&&!h.data)h.data=nx;
  if(/^Emitido por/i.test(it.s)&&!h.emit)h.emit=it.s;
 }));
 return h;
}
function pPerfis(pages){
 let cols=null;const out=[];let total=0,last=null;
 pages.forEach(pg=>{pRows(pg).forEach(r=>{
  const txt=r.it.map(i=>i.s).join(" ");
  if(/C[oó]digo/.test(txt)&&/Peso/.test(txt)){const f=w=>{const it=r.it.find(i=>new RegExp(w,"i").test(i.s));return it?it.x:null};
   cols={code:f("^C[oó]digo"),desc:f("^Descri"),trat:f("^Tratamento"),barra:f("^Barra"),qtd:f("^Qtde"),peso:f("^Peso")};last=null;return}
  if(!cols)return;
  if(/^Total:?/i.test(r.it[0].s)){total=pNum((r.it.find(i=>/\d/.test(i.s))||{s:"0"}).s.replace(/Total:?/i,""));return}
  if(r.it.some(i=>FOOT.test(i.s))||/^Obra/i.test(r.it[0].s)){last=null;return}
  const col=x=>{if(x<cols.desc-10)return "code";if(x<cols.trat-10)return "desc";if(x<cols.barra-15)return "trat";if(x<cols.qtd-5)return "barra";if(x<cols.peso-5)return "qtd";return "peso"};
  const rec={code:"",desc:"",trat:"",barra:"",qtd:"",peso:""};
  r.it.forEach(i=>{const c=col(i.x);rec[c]=(rec[c]?rec[c]+" ":"")+i.s});
  if(rec.code&&rec.peso){last={code:rec.code,desc:rec.desc,trat:rec.trat,barra:pNum(rec.barra),q:pNum(rec.qtd),peso:pNum(rec.peso)};out.push(last)}
  else if(last&&!rec.code){if(rec.desc)last.desc=(last.desc+" "+rec.desc).trim();if(rec.trat)last.trat=(last.trat+" "+rec.trat).trim()}
 })});
 return {rows:out,total};
}
function pComp(pages){
 let cols=null,ap="",rf="",last=null;const out=[];
 pages.forEach(pg=>{pRows(pg).forEach(r=>{
  const txt=r.it.map(i=>i.s).join(" ");

function codeCalc(O,code){
 let tq=0;O.comps.forEach((r,i)=>{if(r.code===code&&!isHid(O,i))tq+=r.q});
 const e=embOf(O,code),qe=embQ(e),price=n(O.st.comp[code]);
 const ne=e.t==="UN"?tq:Math.ceil(tq/qe-1e-9);
 return {tq,e,qe,ne,price,cost:ne*price};
}
const compCost=O=>[...new Set(O.comps.map(r=>r.code))].reduce((s,c)=>s+codeCalc(O,c).cost,0);
const aluCost=O=>n(O.st.aluPeso)*(n(O.st.aluKg)+n(O.st.aluAdd));
const itemM2=t=>t.L*t.H*t.q/1e6;

const gKeys=O=>[...new Set(O.tips.map(t=>t.vid))];

const vidCostOf=(O,k)=>m2Of(O,k)*n(O.st.vidPrice[k]);
const vidCost=O=>gKeys(O).reduce((s,k)=>s+vidCostOf(O,k),0);
const outCost=O=>O.st.outros.reduce((s,o)=>s+n(o.v),0);

let pdfReady=null;
function loadPdfJs(){if(pdfReady)return pdfReady;
 const add=src=>new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)});
 const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
 pdfReady=add(base+"pdf.worker.min.js").then(()=>add(base+"pdf.min.js")).then(()=>window.pdfjsLib);
 pdfReady.catch(()=>{pdfReady=null});return pdfReady}
async function readPdf(file){
 const lib=await loadPdfJs();const buf=new Uint8Array(await file.arrayBuffer());
 const d=await lib.getDocument({data:buf}).promise;const P=[];
 for(let p=1;p<=d.numPages;p++){const tc=await (await d.getPage(p)).getTextContent();P.push(tc.items.map(i=>({x:i.transform[4],y:i.transform[5],s:i.str})))}
 return P;
}
async function addFiles(list){
 for(const f of list){
  if(!/\.pdf$/i.test(f.name)&&f.type!=="application/pdf"){NEW.msg=`"${f.name}" não é PDF.`;continue}
  NEW.msg=`Lendo ${f.name}…`;renderNew();
  try{const P=await readPdf(f);const t=pDetect(P);
   if(!t){NEW.msg=`Não reconheci "${f.name}". Use os relatórios Proposta (croqui), Relação de Materiais (perfis) ou Componentes da Obra.`;continue}
   const h=pHeader(P);let data;
   if(t==="croqui")data=pCroqui(P);else if(t==="perfis")data=pPerfis(P);else data=pComp(P);
   NEW.files[t]={name:f.name,h,data};
   ["numero","obra","cliente","cor"].forEach(k=>{if(!NEW.h[k]&&h[k])NEW.h[k]=h[k]});
   if(t==="croqui"&&!NEW.h.obra&&h.cliente)NEW.h.obra=h.cliente;
   NEW.msg="";
  }catch(e){NEW.msg=String(e&&e.message)==="load"?"Não consegui carregar o leitor de PDF. Verifique a internet e tente de novo.":`Erro ao ler "${f.name}".`}
 }
 renderNew();
}

 const pi=F.perfis?`${F.perfis.data.rows.length} códigos · ${num(F.perfis.data.rows.reduce((s,p)=>s+p.peso,0))} kg`+(F.perfis.data.total?(Math.abs(F.perfis.data.total-F.perfis.data.rows.reduce((s,p)=>s+p.peso,0))<0.01?" · confere com o total do PDF":` · <span class="err">PDF diz ${num(F.perfis.data.total)} kg</span>`):""):"";

 const b=bEnsure(code);PICK={code,q:(b.ref||"")||""};
 let m=$("modal");if(!m){m=document.createElement("div");m.id="modal";m.className="modal";document.body.appendChild(m)}
 m.hidden=false;

  <div class="toolbar"><input class="in" id="pk-q" type="search" placeholder="Procurar no catálogo (nome ou código)" value="${esc(PICK.q)}" style="min-width:220px"><label class="btn ghost" for="pk-up">Enviar foto</label><input type="file" id="pk-up" accept="image/*" hidden>${b.foto?'<button class="btn ghost" id="pk-rm">Remover foto</button>':''}<button class="btn" id="pk-x">Fechar</button></div></div>
  <div class="mb"><div class="hint" id="pk-info" style="margin-bottom:10px"></div><div class="pgrid" id="pk-grid"></div></div></div>`;
 const close=()=>{m.hidden=true;PICK=null};
 $("pk-x").onclick=close;m.onclick=e=>{if(e.target===m)close()};
 if($("pk-rm"))$("pk-rm").onclick=()=>{delete b.foto;save();close();afterFoto()};
 $("pk-up").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const W=360,sc=Math.min(1,W/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
   b.foto={data:cv.toDataURL("image/jpeg",.8)};save();if(saveErr){delete b.foto;save();$("pk-info").innerHTML='<span class="err">Sem espaço no navegador para guardar a foto. Use uma foto do catálogo.</span>';return}close();afterFoto()};im.src=rd.result};rd.readAsDataURL(f)};
 const paint=()=>{const q=$("pk-q").value.trim().toUpperCase();const all=[];Object.keys(CATIDX).forEach(k=>(CATIDX[k]||[]).forEach(it=>all.push(Object.assign({k},it))));
  const words=q.split(/\s+/).filter(Boolean);

  $("pk-grid").innerHTML=res.map((it,j)=>`<button class="pitem ${b.foto&&b.foto.img===it.img?"sel":""}" data-j="${j}"><img loading="lazy" src="${CATS[it.k].base+it.img}" alt=""><div><b>${esc(it.tit)}</b> ${esc(it.sub)}<br><span style="color:#5b6d70">${esc(it.serie)} · pág. ${it.pag} · ${esc(it.codes.slice(0,3).join(", "))}${it.codes.length>3?"…":""}</span></div></button>`).join("");
  $("pk-grid").onclick=e=>{const x=e.target.closest(".pitem");if(!x)return;const it=res[+x.dataset.j];b.foto={cat:it.k,img:it.img,tit:it.tit+(it.sub?" "+it.sub:"")};save();close();afterFoto()};};
 $("pk-q").oninput=paint;loadCats().then(paint);

function buildCot(){
 const box=$("cot-card");
 const rows=COTACOES.map((c,j)=>{const nm=c.itens.filter(it=>O.comps.some(r=>r.code===it[0])).length;if(!nm)return "";
  const ap=st.cotAplic&&st.cotAplic[c.doc];
  return `<div class="row" style="flex-wrap:wrap"><div><b>${esc(c.forn)} · ${esc(c.doc)}</b><div class="hint">${esc(c.data)} · ${nm} itens desta obra · ${brl(c.total)} com impostos · ${esc(c.cond)}</div></div>
  <div class="toolbar">${ap?'<span class="chip ok">Preços aplicados</span>':''}<button class="btn ${ap?"ghost":""}" data-cot="${j}">${ap?"Aplicar de novo":"Aplicar preços nesta obra"}</button></div></div>`}).filter(Boolean);
 const nb=O.comps.filter(r=>{const b=DB.banco[r.code];return b&&n(b.preco)>0&&(b.preco!==st.comp[r.code]||JSON.stringify(b.emb)!==JSON.stringify(embOf(O,r.code)))}).length;
 box.innerHTML=`<div class="card-h"><div><h2>Preços desta obra</h2><div class="hint">Preço por embalagem já com IPI e ST rateado. Itens fora da cotação ficam em branco para você completar. Tudo o que você digita aqui vai também para o Banco de componentes.</div></div>
  <button class="btn ghost" id="b-frombanco" ${nb?"":"disabled"}>Puxar do banco${nb?" ("+nb+")":""}</button></div><div class="card-b stack" style="gap:12px">${rows.join("")||'<span class="hint">Nenhuma cotação cadastrada para os itens desta obra.</span>'}</div>`;
 box.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cot!==undefined){aplicarCot(COTACOES[+b.dataset.cot]);return}
  if(b.id==="b-frombanco"){O.comps.forEach(r=>{const x=DB.banco[r.code];if(x&&n(x.preco)>0){st.comp[r.code]=x.preco;if(!st.emb)st.emb={};st.emb[r.code]=Object.assign({},x.emb)}});touch();buildCot();buildComp();refresh()}};
}
function aplicarCot(c){
 if(!st.emb)st.emb={};if(!st.cotAplic)st.cotAplic={};
 c.itens.forEach(it=>{if(!O.comps.some(r=>r.code===it[0]))return;const p=cotPreco(it);
  st.emb[it[0]]={t:it[3],q:it[4]};st.comp[it[0]]=num(p,2);
  const b=bEnsure(it[0]);bSetPreco(it[0],st.comp[it[0]],st.emb[it[0]]);Object.assign(b,{forn:c.forn,ref:it[1],descForn:it[2],base:it[6],ipi:it[7],stl:it[8],qcot:it[5],doc:c.doc,data:c.data});
  if(!b.foto){const m=catByCode(it[1]);if(m)b.foto={cat:m.cat,img:m.img,tit:m.tit,auto:1}}});
 st.cotAplic[c.doc]=new Date().toISOString();touch();buildCot();buildComp();refresh();
}
function buildForn(){
 const cnt={};O.comps.forEach((r,i)=>{if(isHid(O,i))return;const k=cotOf(r.code);const f=k?k.c.forn:"Sem cotação";cnt[f]=(cnt[f]||0)+1});
 const ks=Object.keys(cnt).sort((a,b)=>a==="Sem cotação"?1:b==="Sem cotação"?-1:a.localeCompare(b));
 $("comp-forn").innerHTML=ks.map(f=>`<button aria-pressed="${compFilter==="forn:"+f}" data-f="forn:${esc(f)}">${esc(f)} (${cnt[f]})</button>`).join("");
 $("comp-forn").hidden=!COTACOES.some(c=>c.itens.some(it=>O.comps.some(r=>r.code===it[0])));
}
function buildComp(){
 const q=$("comp-search").value.trim().toUpperCase();let html="",la="",lr="";
 const dup={};O.comps.forEach((r,i)=>{if(!isHid(O,i))dup[r.code]=(dup[r.code]||0)+1});
 O.comps.forEach((r,i)=>{
  const cc=codeCalc(O,r.code),price=cc.price,hid=isHid(O,i),k=cotOf(r.code);
  if(compFilter==="hid"){if(!hid)return}else{if(hid)return;
   if(compFilter==="nop"&&price>0)return;
   if(compFilter.startsWith("forn:")){const f=compFilter.slice(5);if((k?k.c.forn:"Sem cotação")!==f)return}
   else if(compFilter!=="all"&&compFilter!=="nop"&&r.ap!==compFilter)return}
  if(q&&!(r.code.toUpperCase().includes(q)||r.desc.toUpperCase().includes(q)||(k&&(k.it[1]+" "+k.it[2]).toUpperCase().includes(q))))return;
  if(r.ap!==la||r.rf!==lr){html+=`<tr class="group"><td colspan="11">${esc(r.ap)} · ${esc(r.rf)}</td></tr>`;la=r.ap;lr=r.rf}
  const e=cc.e,share=cc.tq?cc.cost*r.q/cc.tq:0;
  const falta=k&&!hid&&e.t===k.it[3]&&cc.ne>k.it[5];
  const cotTxt=k?`<div class="hint" title="${esc(k.it[2])}">${esc(k.c.forn)} ${esc(k.it[1])} · cotado ${k.it[5]} ${k.it[3]==="UN"?"un":k.it[3].toLowerCase()} · R$ ${num(k.it[6],2)} + IPI ${num(k.it[7],2)}%${k.it[8]?" + ST":""}</div>`:"";
  html+=`<tr class="${hid?"off":price>0?"":"nop"}"><td><input type="checkbox" class="chk" data-idx="${i}" id="ch-${i}" ${hid?"":"checked"} aria-label="Cotar ${esc(r.code)}"></td><td>${thumbBtn(r.code,1)}</td><td class="code">${esc(r.code)}</td><td>${esc(r.desc)}${cotTxt}</td><td>${esc(r.cor)}</td><td class="r num">${num(r.q,r.un==="MT"?3:0)}</td><td>${esc(r.un)}</td>
  <td style="white-space:nowrap"><select class="in" data-embt="${esc(r.code)}" id="et-${i}" aria-label="Embalagem ${esc(r.code)}">${["UN","PCT","ROLO","CX"].map(t=>`<option ${e.t===t?"selected":""}>${t}</option>`).join("")}</select>
   <input class="in num" style="width:62px;text-align:right" data-embq="${esc(r.code)}" id="eq-${i}" inputmode="decimal" value="${e.t==="UN"?"":esc(e.q)}" ${e.t==="UN"?"hidden":""} placeholder="qtd" aria-label="Quantidade por embalagem ${esc(r.code)}"><span class="hint" ${e.t==="UN"?"hidden":""}> ${r.un==="MT"?"m":"pç"}</span></td>
  <td class="r num">${hid?"—":(e.t==="UN"?num(cc.ne,r.un==="MT"?3:0):cc.ne+" "+e.t.toLowerCase())}${!hid&&dup[r.code]>1?'<div class="hint">total do código</div>':''}${falta?`<div class="err">cotado ${k.it[5]}</div>`:""}</td>
  <td class="r price"><input class="in money num" data-code="${esc(r.code)}" id="cp-${i}" inputmode="decimal" placeholder="0,00" value="${esc(st.comp[r.code]||"")}" aria-label="Preço da embalagem ${esc(r.code)}"></td>
  <td class="r num" id="ct-${i}">${hid?"fora":price>0?brl(share):"—"}</td></tr>`;
 });
 const nh=O.comps.filter((r,i)=>isHid(O,i)).length;
 $("comp-body").innerHTML=html||`<tr><td colspan="11" class="hint">${!O.comps.length?"Esta obra não tem lista de componentes.":compFilter==="hid"?"Nenhum item oculto.":"Nenhum componente encontrado."}</td></tr>`;
 $("f-hid").textContent=`Ocultos (${nh})`;
 const sp=O.comps.filter((r,i)=>!isHid(O,i)&&!(n(st.comp[r.code])>0)).length;
 $("comp-count").textContent=`${O.comps.length-nh} itens na cotação`+(nh?` · ${nh} oculto${nh>1?"s":""}`:"")+(sp?` · ${sp} sem preço`:" · todos com preço");
 $("comp-showall").hidden=!nh;
 buildForn();
}
function wireComp(){
 $("comp-body").addEventListener("change",e=>{const el=e.target;
  if(el.dataset.idx!==undefined){if(!st.hide)st.hide={};if(el.checked)delete st.hide[el.dataset.idx];else st.hide[el.dataset.idx]=true;touch();buildComp();refresh();return}
  if(el.dataset.embt){const c=el.dataset.embt;if(!st.emb)st.emb={};const old=embOf(O,c);st.emb[c]={t:el.value,q:el.value==="UN"?1:(old.t==="UN"?(el.value==="ROLO"?50:10):old.q)};
   bSetPreco(c,undefined,st.emb[c]);touch();buildComp();refresh();return}
  if(el.dataset.embq){const c=el.dataset.embq;if(!st.emb)st.emb={};st.emb[c]=Object.assign({},embOf(O,c),{q:el.value});bSetPreco(c,undefined,st.emb[c]);touch();buildComp();refresh();return}
 });
 $("comp-showall").onclick=()=>{st.hide={};touch();buildComp();refresh()};
 $("comp-body").addEventListener("input",e=>{const el=e.target;if(!el.dataset.code)return;
  st.comp[el.dataset.code]=el.value;bSetPreco(el.dataset.code,el.value,embOf(O,el.dataset.code));touch();
  const cc=codeCalc(O,el.dataset.code);
  O.comps.forEach((r,i)=>{if(r.code!==el.dataset.code)return;const hid=isHid(O,i);const td=$("ct-"+i),inp=$("cp-"+i);
   if(td)td.textContent=hid?"fora":cc.price>0?brl(cc.tq?cc.cost*r.q/cc.tq:0):"—";if(inp&&inp!==el)inp.value=el.value;if(inp)inp.closest("tr").className=hid?"off":cc.price>0?"":"nop"});
  refresh()});
 const segClick=e=>{const b=e.target.closest("button");if(!b)return;compFilter=b.dataset.f;document.querySelectorAll("#comp-filter button,#comp-forn button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f===compFilter));buildComp()};
 $("comp-filter").onclick=segClick;$("comp-forn").onclick=segClick;
 $("comp-search").oninput=buildComp;
}

// ---------- ALUMÍNIO ----------
function buildAlu(){
 const ls=O.perfis.reduce((s,p)=>s+p.peso,0);
 $("alu-body").innerHTML=O.perfis.map((p,i)=>`<tr><td class="code">${esc(p.code)}</td><td>${esc(p.desc)}</td><td>${esc(p.trat||"—")}</td><td class="r num">${p.barra||""}</td><td class="r num">${p.q}</td><td class="r num">${num(p.peso)}</td><td class="r num" id="ac-${i}">—</td></tr>`).join("")||`<tr><td colspan="7" class="hint">Esta obra não tem lista de perfis. Digite o peso bruto acima.</td></tr>`;
 $("alu-listsum").textContent=num(ls);
 const map={peso:"aluPeso",kg:"aluKg",add:"aluAdd"};
 Object.keys(map).forEach(f=>{const el=$("alu-"+f);el.value=st[map[f]]||"";el.oninput=()=>{st[map[f]]=el.value;if(f!=="peso")DB.lib[map[f]]=el.value;touch();refresh()}});
}
function paintAlu(){
 const kg=n(st.aluKg)+n(st.aluAdd),ls=O.perfis.reduce((s,p)=>s+p.peso,0);
 O.perfis.forEach((p,i)=>$("ac-"+i).textContent=kg>0?brl(p.peso*kg):"—");
 $("alu-listcost").textContent=kg>0?brl(ls*kg):"—";
 const diff=n(st.aluPeso)-ls;
 $("alu-hint").innerHTML=`Custo/kg aplicado: <b class="num">${brl(kg)}</b> · Peso da lista: <b class="num">${num(ls)} kg</b>`+(!O.perfis.length?"":Math.abs(diff)>0.0005?` · <span class="chip warn">Peso digitado difere da lista em ${num(diff)} kg</span>`:` · <span class="chip ok">Peso confere com a lista</span>`);
}

// ---------- VIDROS ----------
function buildVid(){
 const ks=gKeys(O);
 $("vid-body").innerHTML=ks.map((k,j)=>`<tr><td>${esc(glassName(k))}</td><td class="r num">${O.tips.filter(t=>t.vid===k).reduce((s,t)=>s+t.q,0)}</td><td class="r num">${num(autoM2(O,k))}</td>
  <td class="r"><input class="in money num" id="vm-${j}" inputmode="decimal" placeholder="—" value="${esc(st.vidM2[k]||"")}" aria-label="m² ajustado ${esc(glassName(k))}"></td>
  <td class="r"><input class="in money num" id="vp-${j}" inputmode="decimal" placeholder="0,00" value="${esc(st.vidPrice[k]||"")}" aria-label="Custo por m² ${esc(glassName(k))}"></td><td class="r num" id="vc-${j}">—</td></tr>`).join("")||`<tr><td colspan="6" class="hint">Esta obra não tem croqui.</td></tr>`;
 ks.forEach((k,j)=>{$("vm-"+j).oninput=e=>{st.vidM2[k]=e.target.value;touch();refresh()};$("vp-"+j).oninput=e=>{st.vidPrice[k]=e.target.value;DB.lib.vid[k]=e.target.value;touch();refresh()}});
 $("vid-items").innerHTML=O.tips.map(t=>`<tr><td class="num">${esc(t.item)}</td><td><b>${esc(t.tipo)}</b></td><td>${esc(glassName(t.vid))}</td><td class="r num">${t.L} × ${t.H}</td><td class="r num">${t.q}</td><td class="r num">${num(itemM2(t))}</td></tr>`).join("");
}
function paintVid(){let m=0;gKeys(O).forEach((k,j)=>{m+=m2Of(O,k);const c=vidCostOf(O,k);$("vc-"+j).textContent=c>0?brl(c):"—"});$("vid-m2").textContent=num(m)+" m²";$("vid-cost").textContent=brl(vidCost(O))}

// ---------- OUTROS / CAMPOS ----------
function buildOut(){
 $("out-body").innerHTML=st.outros.map((o,i)=>`<tr><td><input class="in" style="width:100%" id="od-${i}" value="${esc(o.d)}" placeholder="Descrição" aria-label="Descrição do custo ${i+1}"></td><td class="r"><input class="in money num" id="ov-${i}" inputmode="decimal" placeholder="0,00" value="${esc(o.v)}" aria-label="Valor do custo ${i+1}"></td></tr>`).join("");
 st.outros.forEach((o,i)=>{$("od-"+i).oninput=e=>{st.outros[i].d=e.target.value;touch()};$("ov-"+i).oninput=e=>{st.outros[i].v=e.target.value;touch();refresh()}});
}
function wireFields(){
 [["f-numero","numero",O],["f-obra","obra",O],["f-cliente","cliente",O],["f-cor","cor",O]].forEach(([id,k,obj])=>{const el=$(id);el.value=obj[k]||"";el.oninput=()=>{obj[k]=el.value;touch();paintApr(groups(O))}});
 [["f-rateio","rateio"],["f-validade","validade"],["f-cond","cond"],["f-prazo","prazo"],["f-obs","obs"]].forEach(([id,k])=>{const el=$(id);el.value=st[k]||(k==="rateio"?"area":"");el[el.tagName==="SELECT"?"onchange":"oninput"]=()=>{st[k]=el.value;touch();refresh()}});
}

// ---------- RESUMO ----------
function paintRes(gs){
 const totV=gs.reduce((s,g)=>s+(g.p.ok?g.p.v:0),0),totC=gs.reduce((s,g)=>s+g.cost,0);
 $("res-body").innerHTML=gs.map(g=>{const m=st.mg[g.k];return `<tr><td><b>${g.name}</b></td><td class="r num">${brl(g.cost)}</td><td class="r num">${pct(n(m.imp))}</td><td class="r num">${pct(n(m.desp))}</td><td class="r num">${pct(n(m.mg))}</td>
  <td class="r num">${g.p.ok?brl(g.p.v):'<span class="err">verificar %</span>'}</td><td class="r num">${g.p.ok?brl(g.p.v*n(m.mg)/100):"—"}</td><td class="r num">${totV>0&&g.p.ok?pct(g.p.v/totV*100):"—"}</td></tr>`}).join("");
 const lucro=gs.reduce((s,g)=>s+(g.p.ok?g.p.v*n(st.mg[g.k].mg)/100:0),0);
 $("res-c").textContent=brl(totC);$("res-v").textContent=brl(totV);$("res-l").textContent=brl(lucro);
 $("k-cost").textContent=brl(totC);$("k-sale").textContent=brl(totV);
}

// ---------- APRESENTAÇÃO ----------
function sketch(t){
 const W=150,maxH=110;let w=W,h=t.L?W*t.H/t.L:80;if(h>maxH){h=maxH;w=t.H?h*t.L/t.H:W}if(h<34)h=34;if(!isFinite(w)||w<20)w=60;
 const x0=5,y0=5;let s=`<svg viewBox="0 0 ${w+10} ${h+10}" role="img" aria-label="Croqui ${esc(t.tipo)}"><rect class="fr" x="${x0}" y="${y0}" width="${w}" height="${h}"/>`;
 const panel=(x,y,pw,ph,label,sym)=>{let r=`<rect class="pn" x="${x+2}" y="${y+2}" width="${Math.max(pw-4,1)}" height="${Math.max(ph-4,1)}"/>`;
  if(sym==="max")r+=`<polyline class="sym" points="${x+3},${y+3} ${x+pw/2},${y+ph-3} ${x+pw-3},${y+3}"/>`;
  if(sym==="giro")r+=`<polyline class="sym" points="${x+pw-3},${y+3} ${x+3},${y+ph/2} ${x+pw-3},${y+ph-3}"/>`;
  if(label)r+=`<text x="${x+pw/2}" y="${y+ph/2+3}" text-anchor="middle">${label}</text>`;return r};
 const f=Math.max(1,Math.min(t.f||1,12));
 if(t.kind==="fixo"){const pw=w/f;for(let i=0;i<f;i++)s+=panel(x0+i*pw,y0,pw,h,"F")}
 else if(t.kind==="maxp"||t.kind==="max"){const top=t.kind==="maxp"?h*0.7:h,pw=w/f;for(let i=0;i<f;i++){s+=panel(x0+i*pw,y0,pw,top,"","max");if(t.kind==="maxp")s+=panel(x0+i*pw,y0+top,pw,h-top,"F")}}
 else if(t.kind==="giro"){if(f>=2){s+=panel(x0,y0,w/2,h,"","giro");s+=`<g transform="translate(${2*x0+w},0) scale(-1,1)">${panel(x0,y0,w/2,h,"","giro")}</g>`}else s+=panel(x0,y0,w,h,"","giro")}
 else if(t.kind==="piv"){const a=w*0.45;s+=panel(x0,y0,a,h,"F");s+=panel(x0+a,y0,w-a,h,"","giro")}
 else if(t.kind==="correr"){const pw=w/Math.max(f,2);for(let i=0;i<Math.max(f,2);i++)s+=panel(x0+i*pw,y0,pw,h,"");s+=`<path class="sym" d="M${x0+8} ${y0+h/2}h${pw-18}m-6 -4l6 4l-6 4"/>`}
 else s+=panel(x0,y0,w,h,"");
 return s+"</svg>";
}
function paintApr(gs){
 const g=Object.fromEntries(gs.map(x=>[x.k,x]));const sale=k=>g[k].p.ok?g[k].p.v:0;
 const shared=sale("comp")+sale("alu")+sale("out");
 const w=t=>st.rateio==="per"?itemPer(t):itemM2(t);const wTot=O.tips.reduce((s,t)=>s+w(t),0);
 const vS=sale("vid"),vC=vidCost(O);
 const vidItem=t=>{const c=vidCostOf(O,t.vid),a=autoM2(O,t.vid);if(!c||!vC||!a)return 0;return vS*(c/vC)*(itemM2(t)/a)};
 let html="",ll="",total=0,pecas=0;
 O.tips.forEach(t=>{const v=(wTot?shared*w(t)/wTot:0)+vidItem(t);total+=v;pecas+=t.q;
  if(t.loc!==ll){html+=`<div class="loc">${esc(t.loc)}</div>`;ll=t.loc}
  html+=`<div class="tip"><div>${sketch(t)}</div><div><div class="t-name">Item ${esc(t.item)} · ${esc(t.tipo)}</div><div class="t-desc">${esc(t.desc)}</div>
   <div class="t-dims num"><span>Linha: <b>${esc(t.linha)}</b></span><span>L × H: <b>${t.L} × ${t.H} mm</b></span><span>Qtde: <b>${t.q}</b></span></div></div>
   <div class="t-price"><div class="u num">${t.q>1&&v>0?"Unit. "+brl(v/t.q):"&nbsp;"}</div><div class="tot num">${v>0?brl(v):"—"}</div></div></div>`});
 if(!O.tips.length)html=`<div class="card-b hint">Esta obra não tem croqui. O total abaixo soma os grupos do resumo.</div>`,total=gs.reduce((s,x)=>s+(x.p.ok?x.p.v:0),0);
 $("p-list").innerHTML=html;$("p-total").textContent=brl(total);$("p-pecas").textContent=pecas;
 $("p-num").textContent=O.numero||"—";$("p-cli").textContent=O.cliente||"—";$("p-obra").textContent=O.obra||"—";$("p-cor").textContent=O.cor||"—";
 $("p-date").textContent="Emitida em "+new Date().toLocaleDateString("pt-BR");
 const f=[];if(st.validade)f.push(`<div><b>Validade da proposta:</b> ${esc(st.validade)}</div>`);if(st.cond)f.push(`<div><b>Condições de pagamento:</b> ${esc(st.cond)}</div>`);
 if(st.prazo)f.push(`<div><b>Prazo de entrega:</b> ${esc(st.prazo)}</div>`);if(st.obs)f.push(`<div><b>Observações:</b> ${esc(st.obs)}</div>`);
 f.push(`<div>Medidas e quantidades conforme croqui. Valores sujeitos a conferência de medidas na obra.</div>`);
 f.push(`<div class="wm">FC Consultoria em Esquadria · uso exclusivo · © FC Consultoria em Esquadria</div>`);
 $("p-foot").innerHTML=f.join("");
}

function refresh(){const gs=groups(O);gs.forEach(paintPanel);paintAlu();paintVid();paintRes(gs);paintApr(gs)}

// ---------- INÍCIO ----------
loadCats().then(()=>{if(autoFotos()){if(O&&!$("view-obra").hidden)buildComp();else if(HOMETAB==="banco"&&!$("view-home").hidden)renderBanco()}});
const h=location.hash.replace("#","");
if(h.startsWith("obra-")&&DB.obras.some(o=>"obra-"+o.id===h))openObra(h.slice(5));else showHome();
window.addEventListener("hashchange",()=>{const k=location.hash.replace("#","");if(!k&&O&&!$("view-obra").hidden){O=null;showHome()}});
})();}
